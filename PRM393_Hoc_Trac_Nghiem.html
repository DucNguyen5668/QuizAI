<style>
:root{

}

}
:root[data-theme=light]{--bg:#f4f6fb;--card:#fff;--ink:#1a2233;--muted:#5a6a85;--line:#e2e8f2;--brand:#2f6fed;--exam:#b8541f;--ok:#1a9c5b;--okbg:#e6f7ee;--bad:#d63b4a;--badbg:#fdeaec;--chip:#eef2fb;--shadow:0 1px 3px rgba(20,30,60,.08),0 6px 18px rgba(20,30,60,.06);}
:root[data-theme=dark]{--bg:#0f1420;--card:#171e2e;--ink:#e8edf7;--muted:#9aa8c2;--line:#28324a;--brand:#4d86ff;--exam:#f0913f;--ok:#37c07f;--okbg:#123123;--bad:#ff6b78;--badbg:#3a1c22;--chip:#1e2740;--shadow:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
code{background:var(--chip);padding:.08em .38em;border-radius:5px;font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:.86em}
pre{background:var(--chip);padding:10px 12px;border-radius:9px;overflow-x:auto;font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:.82em;line-height:1.5;margin:8px 0}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 0;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.12rem;letter-spacing:.2px}
.brand span{color:var(--brand)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:.86rem;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}
.mods{display:flex;gap:7px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:thin}

.mod.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mod.exam{border-color:var(--exam);color:var(--exam)}
.mod.exam.active{background:var(--exam);color:#fff}
.mod .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.sep{flex:0 0 auto;width:1px;background:var(--line);margin:2px 4px}
.progress{height:7px;background:var(--chip);border-radius:6px;overflow:hidden;margin:2px 0 0}
.progress>i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
main{max-width:900px;margin:0 auto;padding:18px 16px 80px}
.mtitle{font-size:1.34rem;font-weight:800;margin:6px 0 2px}
.mmeta{color:var(--muted);font-size:.9rem;margin-bottom:16px;display:flex;gap:14px;flex-wrap:wrap}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 6px;margin:0 0 14px;box-shadow:var(--shadow)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.qn{flex:0 0 auto;background:var(--chip);color:var(--muted);font-weight:800;font-size:.78rem;border-radius:7px;padding:3px 8px;margin-top:2px}
.qn.bs{background:var(--brand);color:#fff}
.stem{font-weight:600;min-width:0;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;transition:.12s}
.opt:hover:not(.locked){border-color:var(--brand);background:var(--chip)}
.opt .lt{flex:0 0 auto;font-weight:800;color:var(--muted);width:1.4em}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .lt{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .lt{color:var(--bad)}
.opt.locked{cursor:default}
.exp{border-left:3px solid var(--ok);background:var(--okbg);border-radius:0 8px 8px 0;padding:10px 12px;margin:0 0 12px;font-size:.94rem;display:none}
.exp.show{display:block}
.exp b{color:var(--ok)}
.exp.warn{border-left-color:var(--bad);background:var(--badbg)}
.exp.warn b{color:var(--bad)}
.qf{display:flex;gap:12px;align-items:center;padding:0 0 10px;font-size:.85rem}
.reveal{background:none;border:none;color:var(--brand);cursor:pointer;font-weight:700;font-size:.85rem;padding:0}
.tag{font-size:.76rem;color:var(--muted)}
.foot{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.frow{max-width:900px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px;font-size:.88rem}
.score{font-weight:800}
@media(max-width:520px){.brand{font-size:1rem}.mtitle{font-size:1.15rem}}
</style>

<script>
const DATA = {"sections": [{"id": "M1", "kind": "mod", "chip": "M1", "title": "Module 1 — Flutter Overview & Tooling", "questions": [{"id": "M1-1", "n": 1, "bs": false, "stem": "How does Flutter render its user interface?", "opts": {"A": "It maps Flutter widgets to native platform widgets at runtime", "B": "It draws every pixel itself using its own graphics engine (Skia/Impeller)", "C": "It renders HTML/CSS inside an embedded WebView", "D": "It uses the platform's OpenGL widgets directly"}, "ans": "B", "why": "Flutter tự vẽ từng pixel bằng engine đồ họa riêng (Skia/Impeller) nên UI đồng nhất trên mọi nền tảng, không phụ thuộc widget gốc của OS. ≠ A vì Flutter KHÔNG ánh xạ sang native widget (đó là cách của React Native)."}, {"id": "M1-2", "n": 2, "bs": false, "stem": "Which language is used to write Flutter applications?", "opts": {"A": "Kotlin", "B": "JavaScript", "C": "Dart", "D": "Swift"}, "ans": "C", "why": "Flutter dùng ngôn ngữ Dart (do Google phát triển), có thể biên dịch AOT ra mã máy native. Kotlin/Swift là ngôn ngữ native của Android/iOS."}, {"id": "M1-3", "n": 3, "bs": false, "stem": "Which layer of Flutter's architecture is written in C/C++?", "opts": {"A": "Framework", "B": "Engine", "C": "Embedder", "D": "Material library"}, "ans": "B", "why": "Layer Engine viết bằng C/C++ (chứa Skia/Impeller, Dart runtime). Framework viết bằng Dart, còn Embedder là lớp mã theo từng nền tảng."}, {"id": "M1-4", "n": 4, "bs": false, "stem": "What is the entry point of a Flutter application?", "opts": {"A": "`lib/app.dart`", "B": "`android/MainActivity.java`", "C": "`lib/main.dart` with `void main()`", "D": "`pubspec.yaml`"}, "ans": "C", "why": "Điểm khởi đầu là file lib/main.dart với hàm void main() — nơi gọi runApp() để bật UI."}, {"id": "M1-5", "n": 5, "bs": false, "stem": "Which file declares dependencies, assets and fonts?", "opts": {"A": "`pubspec.lock`", "B": "`pubspec.yaml`", "C": "`analysis_options.yaml`", "D": "`build.gradle`"}, "ans": "B", "why": "pubspec.yaml là nơi khai báo dependencies, assets và fonts. ≠ pubspec.lock chỉ ghi lại phiên bản đã khóa."}, {"id": "M1-6", "n": 6, "bs": false, "stem": "What does the caret syntax `^1.2.0` mean in pubspec.yaml?", "opts": {"A": "Exactly version 1.2.0", "B": "Any version >= 1.2.0 and < 2.0.0", "C": "Any version >= 1.2.0", "D": "The latest version always"}, "ans": "B", "why": "^1.2.0 (caret) nghĩa là >=1.2.0 và <2.0.0 — cho cập nhật minor/patch nhưng giữ nguyên major theo semver để tránh breaking change."}, {"id": "M1-7", "n": 7, "bs": false, "stem": "What is the purpose of `pubspec.lock`?", "opts": {"A": "To list development-only dependencies", "B": "To record the exact resolved versions of all dependencies", "C": "To lock the app so it cannot be edited", "D": "To store API keys"}, "ans": "B", "why": "pubspec.lock ghi lại chính xác phiên bản đã resolve của mọi dependency, đảm bảo build tái lập được giống nhau ở mọi máy."}, {"id": "M1-8", "n": 8, "bs": false, "stem": "Where should packages needed only during development (e.g. testing tools) be declared?", "opts": {"A": "`dependencies`", "B": "`dev_dependencies`", "C": "`dependency_overrides`", "D": "`flutter:`"}, "ans": "B", "why": "Gói chỉ dùng khi phát triển (test, lint, code-gen) khai báo trong dev_dependencies để không bị đóng gói vào bản release."}, {"id": "M1-9", "n": 9, "bs": false, "stem": "Which statement about Hot Reload is TRUE?", "opts": {"A": "It restarts the app from `main()`", "B": "It preserves the current application state", "C": "It recompiles native Android/iOS code", "D": "It works in release mode"}, "ans": "B", "why": "Hot Reload nạp lại code UI nhưng GIỮ NGUYÊN state hiện tại của app. ≠ A vì đó là Hot Restart (khởi động lại từ main, mất state)."}, {"id": "M1-10", "n": 10, "bs": false, "stem": "A developer changes the value of a global `static const` variable. Why doesn't Hot Reload show the change?", "opts": {"A": "Static variables are stored in native memory", "B": "Hot Reload does not re-run initializers of global/static variables", "C": "Hot Reload only reloads widget files", "D": "Static variables require a full rebuild of the APK"}, "ans": "B", "why": "Hot Reload không chạy lại initializer của biến global/static, nên giá trị mới không được áp dụng; phải hot restart mới thấy thay đổi."}, {"id": "M1-11", "n": 11, "bs": false, "stem": "Which action requires a full rebuild (not just hot restart)?", "opts": {"A": "Changing a widget's colour", "B": "Adding a new widget", "C": "Adding a new native plugin dependency", "D": "Renaming a Dart variable"}, "ans": "C", "why": "Thêm plugin native mới làm thay đổi mã nền tảng (Android/iOS), nên phải build lại toàn bộ; hot reload/restart không đủ."}, {"id": "M1-12", "n": 12, "bs": false, "stem": "After adding a new image to `assets/` and declaring it in pubspec.yaml, the image still doesn't appear after Hot Reload. Why?", "opts": {"A": "Assets are bundled at build time; the app must be restarted/rebuilt", "B": "Images must be in `lib/` not `assets/`", "C": "Flutter caches images for 24 hours", "D": "`Image.asset` does not support PNG"}, "ans": "A", "why": "Assets được đóng gói (bundle) tại thời điểm build, nên thêm ảnh mới cần restart/rebuild để gói lại bundle rồi ảnh mới xuất hiện."}, {"id": "M1-13", "n": 13, "bs": false, "stem": "Which compilation mode does Dart use in debug builds?", "opts": {"A": "AOT", "B": "JIT", "C": "Interpreted only", "D": "Transpiled to JavaScript"}, "ans": "B", "why": "Bản debug dùng JIT (biên dịch lúc chạy) để hỗ trợ tính năng hot reload nạp code nhanh."}, {"id": "M1-14", "n": 14, "bs": false, "stem": "Which compilation mode is used in release builds, and why?", "opts": {"A": "JIT, to allow hot reload", "B": "AOT, for faster startup and better runtime performance", "C": "JIT, because Dart cannot be compiled ahead of time", "D": "AOT, to enable the debugger"}, "ans": "B", "why": "Bản release dùng AOT (biên dịch trước ra mã máy native) cho khởi động nhanh và hiệu năng runtime tốt hơn."}, {"id": "M1-15", "n": 15, "bs": false, "stem": "In which build mode are `assert()` statements executed?", "opts": {"A": "Debug only", "B": "Release only", "C": "Profile only", "D": "All modes"}, "ans": "A", "why": "Lệnh assert() chỉ được thực thi ở chế độ Debug; profile và release đều loại bỏ để không ảnh hưởng hiệu năng."}, {"id": "M1-16", "n": 16, "bs": false, "stem": "Which build mode should be used to measure real-world performance on a physical device?", "opts": {"A": "Debug", "B": "Profile", "C": "Release", "D": "Test"}, "ans": "B", "why": "Đo hiệu năng thực tế phải dùng Profile mode: đã biên dịch AOT gần giống release nhưng vẫn giữ công cụ profiling. ≠ Debug (JIT chậm, sai lệch), ≠ Release (thiếu công cụ đo)."}, {"id": "M1-17", "n": 17, "bs": false, "stem": "Which command checks whether the Flutter development environment is correctly configured?", "opts": {"A": "`flutter check`", "B": "`flutter doctor`", "C": "`flutter verify`", "D": "`flutter env`"}, "ans": "B", "why": "flutter doctor kiểm tra môi trường phát triển (SDK, Android toolchain, thiết bị...) đã cấu hình đúng chưa."}, {"id": "M1-18", "n": 18, "bs": false, "stem": "Which command downloads the dependencies listed in pubspec.yaml?", "opts": {"A": "`flutter install`", "B": "`flutter pub get`", "C": "`flutter fetch`", "D": "`dart restore`"}, "ans": "B", "why": "flutter pub get tải về các dependencies được liệt kê trong pubspec.yaml."}, {"id": "M1-19", "n": 19, "bs": false, "stem": "Which command produces the file format required for publishing to Google Play?", "opts": {"A": "`flutter build apk`", "B": "`flutter build appbundle`", "C": "`flutter build ipa`", "D": "`flutter build bundle`"}, "ans": "B", "why": "flutter build appbundle tạo file .aab — định dạng bắt buộc để publish lên Google Play. ≠ apk (dùng để cài trực tiếp/test)."}, {"id": "M1-20", "n": 20, "bs": false, "stem": "What does `flutter clean` do?", "opts": {"A": "Deletes the source code", "B": "Removes build artefacts and caches", "C": "Uninstalls the app from the device", "D": "Formats all Dart files"}, "ans": "B", "why": "flutter clean xóa các artefact build và cache (thư mục build/, .dart_tool) để build lại sạch."}, {"id": "M1-21", "n": 21, "bs": false, "stem": "Which tool provides a Widget Inspector, timeline and memory profiler?", "opts": {"A": "Android Studio Logcat", "B": "Flutter DevTools", "C": "Dart Analyzer", "D": "Gradle"}, "ans": "B", "why": "Flutter DevTools cung cấp Widget Inspector, timeline và memory profiler để phân tích UI và hiệu năng."}, {"id": "M1-22", "n": 22, "bs": false, "stem": "What is the main advantage of Flutter's own rendering engine over a bridge-based approach?", "opts": {"A": "Smaller app size", "B": "Consistent UI across platforms and no bridge overhead for UI updates", "C": "It allows writing code in Java", "D": "It removes the need for a build step"}, "ans": "B", "why": "Vì tự render, Flutter cho UI đồng nhất trên mọi nền tảng và không tốn overhead của 'bridge' mỗi lần cập nhật UI như kiến trúc cầu nối."}, {"id": "M1-23", "n": 23, "bs": false, "stem": "Which folder contains `AndroidManifest.xml` in a Flutter project?", "opts": {"A": "`lib/`", "B": "`android/app/src/main/`", "C": "`assets/`", "D": "`build/`"}, "ans": "B", "why": "AndroidManifest.xml nằm trong thư mục android/app/src/main/ của dự án Flutter."}, {"id": "M1-24", "n": 24, "bs": false, "stem": "Which file is the iOS equivalent used for permissions and URL schemes?", "opts": {"A": "`Podfile`", "B": "`Info.plist`", "C": "`AppDelegate.swift`", "D": "`Runner.xcodeproj`"}, "ans": "B", "why": "Info.plist là file phía iOS dùng khai báo quyền (permissions) và URL schemes, tương đương vai trò manifest."}, {"id": "M1-25", "n": 25, "bs": false, "stem": "What is `flutter run --release` used for?", "opts": {"A": "Publishing to the store", "B": "Running the app with AOT compilation and no debugging tools", "C": "Running unit tests", "D": "Generating documentation"}, "ans": "B", "why": "flutter run --release chạy app với biên dịch AOT và không kèm công cụ debug, để trải nghiệm gần với bản phát hành."}, {"id": "M1-26", "n": 26, "bs": false, "stem": "Which command formats Dart source files according to style rules?", "opts": {"A": "`dart format .`", "B": "`flutter lint`", "C": "`dart tidy`", "D": "`flutter style`"}, "ans": "A", "why": "dart format . định dạng lại mã nguồn Dart theo quy tắc style chuẩn của ngôn ngữ."}, {"id": "M1-27", "n": 27, "bs": false, "stem": "A YAML file fails to parse. Which is the most likely cause?", "opts": {"A": "Using tabs for indentation instead of spaces", "B": "Using lowercase keys", "C": "Missing semicolons", "D": "Comments starting with `#`"}, "ans": "A", "why": "YAML không cho dùng dấu tab để thụt lề — chỉ chấp nhận dấu cách; dùng tab sẽ gây lỗi parse."}, {"id": "M1-28", "n": 28, "bs": false, "stem": "What does `--split-per-abi` do when building an APK?", "opts": {"A": "Splits the app into multiple screens", "B": "Generates separate APKs for each CPU architecture, reducing size", "C": "Splits Dart code into libraries", "D": "Enables multidex"}, "ans": "B", "why": "--split-per-abi tạo các APK riêng cho từng kiến trúc CPU (arm64, armeabi...), giúp giảm dung lượng mỗi APK vì mỗi máy chỉ tải phần phù hợp."}, {"id": "M1-BS-1", "n": 1, "bs": true, "stem": "How does a Flutter app communicate with platform-specific native code (e.g. to read the battery level)?", "opts": {"A": "Through a REST API", "B": "Through Platform Channels (MethodChannel)", "C": "Through a JavaScript bridge", "D": "Native code cannot be called from Flutter"}, "ans": "B", "why": "App Flutter giao tiếp với mã native qua Platform Channels (MethodChannel), truyền message qua lại giữa Dart và Kotlin/Swift."}, {"id": "M1-BS-2", "n": 2, "bs": true, "stem": "Which of these features typically REQUIRES native integration in a Flutter app?", "opts": {"A": "Displaying a list of text", "B": "Bluetooth / NFC / a payment SDK", "C": "Navigating between screens", "D": "Changing a widget's colour"}, "ans": "B", "why": "Các tính năng như Bluetooth/NFC/SDK thanh toán cần tích hợp native vì phải truy cập API phần cứng hoặc dịch vụ riêng của nền tảng."}, {"id": "M1-BS-3", "n": 3, "bs": true, "stem": "For which scenario is Flutter usually the BEST choice?", "opts": {"A": "A graphically intensive real-time 3D game", "B": "An app needing very deep, low-level OS customization", "C": "A cross-platform business app (booking/e-commerce) with a shared UI and fast time-to-market", "D": "A driver that accesses hardware at the kernel level"}, "ans": "C", "why": "Flutter tối ưu nhất cho app đa nền tảng dùng chung một UI, cần ra mắt nhanh (như booking/e-commerce), tiết kiệm chi phí và thời gian."}, {"id": "M1-BS-4", "n": 4, "bs": true, "stem": "When is native (Kotlin/Swift) development preferable to Flutter?", "opts": {"A": "When you want a single codebase", "B": "When building an MVP quickly", "C": "When the app needs high-performance graphics or deep OS-level access", "D": "When the team has no native developers"}, "ans": "C", "why": "Native (Kotlin/Swift) tốt hơn khi app cần đồ họa hiệu năng cao hoặc truy cập sâu ở mức OS mà lớp đa nền tảng khó đáp ứng."}, {"id": "M1-BS-5", "n": 5, "bs": true, "stem": "What is the key rendering difference between Flutter and React Native?", "opts": {"A": "Flutter draws every pixel with its own engine; React Native bridges to native OS widgets", "B": "React Native compiles to ARM; Flutter runs in a WebView", "C": "They both use the same rendering engine", "D": "Flutter uses HTML/CSS; React Native uses Skia"}, "ans": "A", "why": "Khác biệt cốt lõi: Flutter tự vẽ mọi pixel bằng engine riêng, còn React Native bắc cầu (bridge) sang widget native của OS."}, {"id": "M1-BS-6", "n": 6, "bs": true, "stem": "A Flutter release build is compiled to:", "opts": {"A": "JavaScript", "B": "Interpreted bytecode running in a VM", "C": "Native ARM machine code (AOT)", "D": "HTML rendered in a WebView"}, "ans": "C", "why": "Bản release được biên dịch AOT ra mã máy native ARM, không chạy qua JS hay WebView."}, {"id": "M1-BS-7", "n": 7, "bs": true, "stem": "What is the correct order of Flutter's rendering pipeline?", "opts": {"A": "Render Tree → Widget Tree → GPU → Composited Scene", "B": "Widget Tree → Render Tree → Composited Scene → GPU Rendering", "C": "GPU → Widget Tree → Render Tree → Scene", "D": "Composited Scene → Widget Tree → GPU → Render Tree"}, "ans": "B", "why": "Thứ tự pipeline render đúng là: Widget Tree → Render Tree → Composited Scene → GPU Rendering."}, {"id": "M1-BS-8", "n": 8, "bs": true, "stem": "Which environment lets you run Flutter code instantly in a browser with no installation?", "opts": {"A": "Android Studio", "B": "VS Code", "C": "DartPad", "D": "Xcode"}, "ans": "C", "why": "DartPad cho phép chạy code Flutter/Dart ngay trong trình duyệt mà không cần cài đặt gì."}, {"id": "M1-BS-9", "n": 9, "bs": true, "stem": "In Android Studio, what must be installed to develop Flutter apps?", "opts": {"A": "Only the Dart plugin", "B": "The Flutter plugin (the Dart plugin is installed automatically with it)", "C": "A separate Flutter IDE", "D": "Nothing extra"}, "ans": "B", "why": "Trong Android Studio chỉ cần cài Flutter plugin; Dart plugin sẽ được cài kèm tự động."}, {"id": "M1-BS-10", "n": 10, "bs": true, "stem": "Which minimum Android API level is recommended when creating an emulator in the slides?", "opts": {"A": "API 21", "B": "API 26", "C": "API 33+ (Android 13)", "D": "API 19"}, "ans": "C", "why": "Theo slide, khi tạo emulator nên chọn tối thiểu API 33+ (Android 13)."}, {"id": "M1-BS-11", "n": 11, "bs": true, "stem": "What is the standard entry-point call that starts a Flutter UI?", "opts": {"A": "`main()` returns a Widget", "B": "`runApp(Widget)`", "C": "`Flutter.start()`", "D": "`MaterialApp.run()`"}, "ans": "B", "why": "runApp(Widget) là lời gọi chuẩn để khởi động UI Flutter, đặt widget gốc lên màn hình. ≠ A vì main() không trả về Widget mà gọi runApp."}, {"id": "M1-BS-12", "n": 12, "bs": true, "stem": "What is the \"Cupertino\" widget set in Flutter?", "opts": {"A": "Android Material-style widgets", "B": "iOS-style widgets", "C": "Web-only widgets", "D": "A state management library"}, "ans": "B", "why": "Cupertino là bộ widget mang phong cách giao diện iOS. ≠ Material (phong cách Android)."}]}, {"id": "M2", "kind": "mod", "chip": "M2", "title": "Module 2 — Dart Essentials", "questions": [{"id": "M2-1", "n": 1, "bs": false, "stem": "Which statement causes a compile-time error?", "opts": {"A": "`final now = DateTime.now();`", "B": "`const pi = 3.14;`", "C": "`const now = DateTime.now();`", "D": "`var x = 10;`"}, "ans": "C", "why": "const cần giá trị biết được lúc biên dịch, nhưng DateTime.now() chỉ có lúc chạy, nên 'const now = DateTime.now()' gây lỗi compile-time. ≠ A vì final chấp nhận giá trị tính lúc runtime."}, {"id": "M2-2", "n": 2, "bs": false, "stem": "What is the key difference between `final` and `const`?", "opts": {"A": "`final` is for numbers, `const` for strings", "B": "`final` is set once at runtime; `const` must be known at compile time", "C": "`const` variables can be reassigned", "D": "There is no difference"}, "ans": "B", "why": "final gán đúng một lần và giá trị có thể xác định lúc runtime; const là hằng thật sự, phải biết giá trị ngay tại compile-time."}, {"id": "M2-3", "n": 3, "bs": false, "stem": "Given `final list = [1, 2, 3];`, which operation is allowed?", "opts": {"A": "`list = [4, 5];`", "B": "`list.add(4);`", "C": "Both", "D": "Neither"}, "ans": "B", "why": "final chỉ khóa việc gán lại tham chiếu, không khóa nội dung; nên list.add(4) hợp lệ, còn gán lại list = [4,5] thì bị cấm."}, {"id": "M2-4", "n": 4, "bs": false, "stem": "What does the `late` keyword indicate?", "opts": {"A": "The variable is nullable", "B": "The variable will be initialised before it is first used", "C": "The variable is initialised on a background thread", "D": "The variable is deprecated"}, "ans": "B", "why": "late báo rằng biến sẽ được khởi tạo trước khi dùng lần đầu (khởi tạo trễ), giúp khai báo non-nullable mà chưa gán giá trị ngay."}, {"id": "M2-5", "n": 5, "bs": false, "stem": "Which operator safely accesses a member only if the object is not null?", "opts": {"A": "`!`", "B": "`??`", "C": "`?.`", "D": "`??=`"}, "ans": "C", "why": "Toán tử ?. truy cập member một cách an toàn: trả về null nếu đối tượng là null thay vì ném lỗi."}, {"id": "M2-6", "n": 6, "bs": false, "stem": "What does `a ?? b` return?", "opts": {"A": "`a` if `a` is not null, otherwise `b`", "B": "`b` always", "C": "`true` if both are null", "D": "`a` if `a` is true"}, "ans": "A", "why": "a ?? b (null-coalescing) trả về a nếu a khác null, ngược lại trả về b."}, {"id": "M2-7", "n": 7, "bs": false, "stem": "What does the `!` (bang) operator do?", "opts": {"A": "Logical NOT on a nullable value", "B": "Asserts a nullable expression is non-null, throwing at runtime if it is null", "C": "Converts a value to boolean", "D": "Marks a variable as required"}, "ans": "B", "why": "! (null assertion / bang) khẳng định biểu thức nullable là non-null, ném lỗi lúc chạy nếu nó thực sự null. ≠ A vì NOT logic là toán tử trên bool."}, {"id": "M2-8", "n": 8, "bs": false, "stem": "Which type is the parent of both `int` and `double`?", "opts": {"A": "`Object`", "B": "`num`", "C": "`Number`", "D": "`dynamic`"}, "ans": "B", "why": "num là lớp cha chung của cả int và double trong Dart."}, {"id": "M2-9", "n": 9, "bs": false, "stem": "What is the difference between `dynamic` and `Object`?", "opts": {"A": "`dynamic` disables static type checking; `Object` keeps it", "B": "`Object` can hold null, `dynamic` cannot", "C": "They are identical", "D": "`dynamic` is faster at runtime"}, "ans": "A", "why": "dynamic tắt kiểm tra kiểu tĩnh (cho gọi bất kỳ member, dời lỗi sang runtime); còn Object vẫn giữ kiểm tra kiểu lúc biên dịch."}, {"id": "M2-10", "n": 10, "bs": false, "stem": "In Dart, which of the following is NOT an object?", "opts": {"A": "`int`", "B": "`bool`", "C": "A function", "D": "All of them are objects"}, "ans": "D", "why": "Trong Dart mọi thứ đều là object — kể cả int, bool và function đều là object — nên đáp án đúng là 'tất cả đều là object'."}, {"id": "M2-11", "n": 11, "bs": false, "stem": "Which parameter type is optional by default?", "opts": {"A": "Positional parameters", "B": "Named parameters", "C": "Both", "D": "Neither"}, "ans": "B", "why": "Tham số named là optional theo mặc định (trừ khi thêm required); còn positional thì bắt buộc trừ khi được bọc trong dấu ngoặc vuông."}, {"id": "M2-12", "n": 12, "bs": false, "stem": "How do you make a named parameter mandatory?", "opts": {"A": "Prefix it with `final`", "B": "Add the `required` keyword", "C": "Give it no default value", "D": "Wrap it in square brackets"}, "ans": "B", "why": "Thêm từ khóa required trước tham số named để bắt buộc bên gọi phải truyền giá trị."}, {"id": "M2-13", "n": 13, "bs": false, "stem": "What does `nums.map((n) => n * 2)` return?", "opts": {"A": "A `List<int>`", "B": "A lazy `Iterable<int>`", "C": "A `Set<int>`", "D": "`void`"}, "ans": "B", "why": "map() trả về một Iterable lười (lazy) — chỉ tính toán khi được duyệt, chưa tạo List ngay; muốn ra List phải gọi .toList()."}, {"id": "M2-14", "n": 14, "bs": false, "stem": "Which method filters elements matching a condition?", "opts": {"A": "`map()`", "B": "`where()`", "C": "`fold()`", "D": "`expand()`"}, "ans": "B", "why": "where() lọc và giữ lại các phần tử thỏa điều kiện. ≠ map() (biến đổi từng phần tử chứ không lọc)."}, {"id": "M2-15", "n": 15, "bs": false, "stem": "What is the difference between `reduce()` and `fold()`?", "opts": {"A": "`fold()` takes an initial value; `reduce()` does not", "B": "`reduce()` works only on numbers", "C": "`fold()` returns void", "D": "They are identical"}, "ans": "A", "why": "fold() nhận một giá trị khởi tạo và cho phép kết quả có kiểu khác; reduce() không có giá trị khởi tạo và trả về cùng kiểu phần tử."}, {"id": "M2-16", "n": 16, "bs": false, "stem": "What does the cascade operator `..` return?", "opts": {"A": "The result of the last method call", "B": "The original object", "C": "`void`", "D": "A copy of the object"}, "ans": "B", "why": "Cascade (..) trả về chính đối tượng gốc (không phải kết quả lời gọi), nên tiện để thực hiện chuỗi thao tác trên cùng một object."}, {"id": "M2-17", "n": 17, "bs": false, "stem": "Which is a valid named constructor?", "opts": {"A": "`Person.guest() : name = 'Guest';`", "B": "`named Person.guest();`", "C": "`constructor guest();`", "D": "`Person::guest();`"}, "ans": "A", "why": "Named constructor hợp lệ có dạng ClassName.tên với initializer list: Person.guest() : name = 'Guest';"}, {"id": "M2-18", "n": 18, "bs": false, "stem": "What is a `factory` constructor used for?", "opts": {"A": "To always create a brand-new instance", "B": "To return an existing instance, a cached object, or a subtype", "C": "To create static methods", "D": "To define abstract classes"}, "ans": "B", "why": "factory không bắt buộc tạo instance mới: có thể trả về instance đã cache, một singleton, hoặc một đối tượng thuộc subtype."}, {"id": "M2-19", "n": 19, "bs": false, "stem": "Which keyword allows a class to reuse code from multiple classes?", "opts": {"A": "`extends`", "B": "`implements`", "C": "`with` (mixin)", "D": "`import`"}, "ans": "C", "why": "with (mixin) cho phép một lớp tái sử dụng code từ nhiều lớp/mixin. ≠ extends (chỉ kế thừa được đúng một lớp)."}, {"id": "M2-20", "n": 20, "bs": false, "stem": "What must a class do when it uses `implements`?", "opts": {"A": "Nothing extra", "B": "Implement all members of the interface", "C": "Call `super()` in its constructor", "D": "Be abstract"}, "ans": "B", "why": "Khi dùng implements, lớp phải tự hiện thực toàn bộ member của interface đó (không kế thừa phần thân sẵn có)."}, {"id": "M2-21", "n": 21, "bs": false, "stem": "How many classes can a Dart class `extends`?", "opts": {"A": "Exactly one", "B": "Up to two", "C": "Unlimited", "D": "None"}, "ans": "A", "why": "Dart chỉ cho extends đúng một lớp (đơn kế thừa); muốn dùng nhiều lớp thì dùng mixin (with)."}, {"id": "M2-22", "n": 22, "bs": false, "stem": "Which is TRUE about abstract classes?", "opts": {"A": "They can be instantiated directly", "B": "They may contain methods without implementations", "C": "They cannot have constructors", "D": "They cannot be extended"}, "ans": "B", "why": "Lớp abstract có thể chứa method chưa có phần thân (chỉ khai báo) và không thể khởi tạo trực tiếp bằng new."}, {"id": "M2-23", "n": 23, "bs": false, "stem": "What does `Person(this.name, this.age);` do?", "opts": {"A": "Declares two fields", "B": "Assigns constructor parameters directly to instance fields", "C": "Creates a factory", "D": "Overrides toString()"}, "ans": "B", "why": "Person(this.name, this.age); là cú pháp rút gọn, gán trực tiếp tham số của constructor vào field cùng tên."}, {"id": "M2-24", "n": 24, "bs": false, "stem": "Which annotation marks a method that replaces a parent method?", "opts": {"A": "`@required`", "B": "`@override`", "C": "`@deprecated`", "D": "`@immutable`"}, "ans": "B", "why": "@override đánh dấu một method đang ghi đè (thay thế) method cùng tên của lớp cha."}, {"id": "M2-25", "n": 25, "bs": false, "stem": "What does this print? ```dart var l = [1, 2, 3]; print([0, ...l, 4]); ```", "opts": {"A": "`[0, [1,2,3], 4]`", "B": "`[0, 1, 2, 3, 4]`", "C": "Compile error", "D": "`[0, 4]`"}, "ans": "B", "why": "Toán tử spread (...) trải các phần tử của l vào bên trong literal, nên kết quả là [0, 1, 2, 3, 4] chứ không phải list lồng nhau."}, {"id": "M2-26", "n": 26, "bs": false, "stem": "Which is the correct syntax for a collection-if?", "opts": {"A": "`[if (x) 1, 2]`", "B": "`[x ? 1 : null, 2]`", "C": "`[if x then 1, 2]`", "D": "`[when (x) 1, 2]`"}, "ans": "A", "why": "Collection-if hợp lệ có dạng [if (x) 1, 2] — chèn phần tử vào literal một cách có điều kiện."}, {"id": "M2-27", "n": 27, "bs": false, "stem": "What does `int.tryParse(\"abc\")` return?", "opts": {"A": "`0`", "B": "`null`", "C": "Throws `FormatException`", "D": "`-1`"}, "ans": "B", "why": "int.tryParse('abc') trả về null khi không parse được (an toàn). ≠ int.parse (ném FormatException khi lỗi)."}, {"id": "M2-28", "n": 28, "bs": false, "stem": "What is the result of `identical(a, b)` compared with `a == b`?", "opts": {"A": "`identical` checks reference equality; `==` checks value equality (if overridden)", "B": "They are the same", "C": "`identical` is for strings only", "D": "`==` checks reference equality only"}, "ans": "A", "why": "identical(a, b) so sánh tham chiếu (có phải cùng một object không); còn == so sánh giá trị nếu lớp có override toán tử ==."}, {"id": "M2-29", "n": 29, "bs": false, "stem": "Which is a valid getter declaration?", "opts": {"A": "`int get age => _age;`", "B": "`get int age { return _age; }`", "C": "`int age get() => _age;`", "D": "`getter age => _age;`"}, "ans": "A", "why": "Getter hợp lệ có dạng: int get age => _age; (kiểu trả về, từ khóa get, tên, rồi thân)."}, {"id": "M2-30", "n": 30, "bs": false, "stem": "Which loop syntax is valid in Dart for iterating a List?", "opts": {"A": "`for (var item in list) {}`", "B": "`foreach (item in list) {}`", "C": "`for item in list:`", "D": "`loop (list) {}`"}, "ans": "A", "why": "Vòng lặp for-in hợp lệ trong Dart: for (var item in list) {}."}, {"id": "M2-31", "n": 31, "bs": false, "stem": "What is a `Set` in Dart?", "opts": {"A": "An ordered collection allowing duplicates", "B": "An unordered collection of unique items", "C": "A key-value collection", "D": "An immutable list"}, "ans": "B", "why": "Set là tập hợp không có thứ tự và chứa các phần tử duy nhất (không trùng lặp)."}, {"id": "M2-32", "n": 32, "bs": false, "stem": "What is the output? ```dart String? s; print(s?.length ?? -1); ```", "opts": {"A": "`null`", "B": "`0`", "C": "`-1`", "D": "Runtime error"}, "ans": "C", "why": "s là null nên s?.length trả về null, rồi ?? -1 thay null bằng -1, nên in ra -1."}, {"id": "M2-33", "n": 33, "bs": false, "stem": "Which statement about `String` in Dart is TRUE?", "opts": {"A": "Strings are mutable", "B": "Strings are immutable; operations return new strings", "C": "Strings must use double quotes only", "D": "String interpolation is not supported"}, "ans": "B", "why": "String trong Dart là bất biến (immutable); mọi thao tác biến đổi đều trả về một chuỗi mới chứ không sửa chuỗi gốc."}, {"id": "M2-34", "n": 34, "bs": false, "stem": "What does `'Hello $name, you are ${age + 1}'` demonstrate?", "opts": {"A": "Concatenation", "B": "String interpolation", "C": "Raw strings", "D": "Templates"}, "ans": "B", "why": "Cú pháp '... $name ... ${age + 1}' minh họa string interpolation (nội suy chuỗi): chèn biến bằng $ và biểu thức bằng ${ }."}, {"id": "M2-35", "n": 35, "bs": false, "stem": "What is the purpose of the `r` prefix in `r'\\d{10}'`?", "opts": {"A": "Marks the string as a regular expression", "B": "Makes it a raw string so backslashes are not treated as escapes", "C": "Makes the string read-only", "D": "Reverses the string"}, "ans": "B", "why": "Tiền tố r tạo raw string, khiến ký tự gạch chéo ngược không bị coi là ký tự escape — rất tiện khi viết regex."}, {"id": "M2-BS-1", "n": 1, "bs": true, "stem": "In a Dart `switch` statement, what happens if a non-empty `case` has no `break`?", "opts": {"A": "It is a compile-time error (Dart forbids implicit fall-through)", "B": "It silently falls through to the next case", "C": "It loops forever", "D": "It jumps to `default`"}, "ans": "A", "why": "Dart cấm fall-through ngầm: một case không rỗng mà thiếu break sẽ bị báo lỗi biên dịch (khác C/Java)."}, {"id": "M2-BS-2", "n": 2, "bs": true, "stem": "How do you make several `case` values share the same branch in Dart?", "opts": {"A": "Separate them with commas inside one case", "B": "Use `fallthrough` keyword", "C": "Stack empty `case` labels on top of the branch", "D": "It is not possible"}, "ans": "C", "why": "Để nhiều case dùng chung một branch, ta xếp chồng các nhãn case rỗng ngay trên branch đó. ≠ A vì dấu phẩy không phải cú pháp hợp lệ của switch cổ điển trong Dart."}, {"id": "M2-BS-3", "n": 3, "bs": true, "stem": "What is the result of `7 ~/ 2` in Dart?", "opts": {"A": "`3.5`", "B": "`4`", "C": "`3.0`", "D": "`3` (an int)"}, "ans": "D", "why": "~/ là phép chia lấy phần nguyên, nên 7 ~/ 2 = 3 và kết quả có kiểu int. ≠ 4 vì không làm tròn lên; ≠ 3.0 vì không phải double."}, {"id": "M2-BS-4", "n": 4, "bs": true, "stem": "Which operator tests whether an object is of a given type?", "opts": {"A": "`as`", "B": "`==`", "C": "`is`", "D": "`??`"}, "ans": "C", "why": "Toán tử is kiểm tra một đối tượng có thuộc kiểu cho trước hay không. ≠ as (ép kiểu, không phải kiểm tra)."}, {"id": "M2-BS-5", "n": 5, "bs": true, "stem": "In `try / on / catch / finally`, which block always executes?", "opts": {"A": "`finally`", "B": "`on`", "C": "`catch`", "D": "`try`"}, "ans": "A", "why": "Trong try/on/catch/finally, khối finally luôn được thực thi dù có hay không có exception (dùng để dọn dẹp tài nguyên)."}, {"id": "M2-BS-6", "n": 6, "bs": true, "stem": "What does `catch (e, s)` capture?", "opts": {"A": "Two separate exceptions", "B": "An error and a success value", "C": "The exception and the current widget", "D": "The error object `e` and its stack trace `s`"}, "ans": "D", "why": "catch (e, s) bắt được hai thứ: đối tượng lỗi e và stack trace s của lỗi đó."}, {"id": "M2-BS-7", "n": 7, "bs": true, "stem": "What does `rethrow` do inside a catch block?", "opts": {"A": "Swallows the exception", "B": "Converts the exception to null", "C": "Re-throws the current exception (preserving its stack trace) to an outer handler", "D": "Restarts the try block"}, "ans": "C", "why": "rethrow ném lại đúng exception hiện tại và giữ nguyên stack trace, để một handler ở lớp ngoài xử lý tiếp. ≠ throw e mới (làm mất stack trace gốc)."}, {"id": "M2-BS-8", "n": 8, "bs": true, "stem": "How do you catch only a specific exception type in Dart?", "opts": {"A": "`on FormatException catch (e)`", "B": "`catch (FormatException e)`", "C": "`except FormatException`", "D": "`catch<FormatException>(e)`"}, "ans": "A", "why": "Để bắt riêng một kiểu exception cụ thể, dùng cú pháp: on FormatException catch (e)."}, {"id": "M2-BS-9", "n": 9, "bs": true, "stem": "Which construct cannot use `break` or `continue`?", "opts": {"A": "`for` loop", "B": "`.forEach()`", "C": "`for-in` loop", "D": "`while` loop"}, "ans": "B", "why": ".forEach() nhận vào một callback nên không thể dùng break/continue để thoát/nhảy vòng như các vòng lặp thật (for, for-in, while)."}, {"id": "M2-BS-10", "n": 10, "bs": true, "stem": "What does the `Never` type indicate for a function's return?", "opts": {"A": "It returns null", "B": "It returns void", "C": "It never returns normally (always throws or loops forever)", "D": "It returns any type"}, "ans": "C", "why": "Kiểu Never báo rằng hàm không bao giờ trả về bình thường — nó luôn ném lỗi hoặc lặp vô tận."}, {"id": "M2-BS-11", "n": 11, "bs": true, "stem": "Which is a valid redirecting constructor?", "opts": {"A": "`Point.copy(Point o) => Point(o.x, o.y);`", "B": "`Point.copy(Point o) { this = Point(o.x, o.y); }`", "C": "`redirect Point.copy(Point o);`", "D": "`Point.copy(Point o) : this(o.x, o.y);`"}, "ans": "D", "why": "Redirecting constructor hợp lệ dùng : this(...) để chuyển hướng sang constructor khác: Point.copy(Point o) : this(o.x, o.y);"}, {"id": "M2-BS-12", "n": 12, "bs": true, "stem": "What is the purpose of a constructor initializer list (`: x = 0, y = 0`)?", "opts": {"A": "To initialise `final` fields before the constructor body runs", "B": "To run code after the constructor body", "C": "To declare optional parameters", "D": "To override a parent method"}, "ans": "A", "why": "Initializer list (: x = 0, y = 0) dùng để khởi tạo các field final trước khi thân constructor chạy (vì final không thể gán trong thân)."}]}, {"id": "M3", "kind": "mod", "chip": "M3", "title": "Module 3 — Advanced Dart (Async + OOP + Generics)", "questions": [{"id": "M3-1", "n": 1, "bs": false, "stem": "How many threads does a Dart isolate use to execute Dart code?", "opts": {"A": "One", "B": "Two", "C": "One per CPU core", "D": "Unlimited"}, "ans": "A", "why": "Mỗi isolate chỉ có **1 thread duy nhất** chạy code Dart → không có race condition, không cần lock/mutex. Muốn chạy song song thật thì phải tạo isolate mới. Đây là lý do code nặng làm đơ UI: nó chiếm luôn thread duy nhất của isolate chính."}, {"id": "M3-2", "n": 2, "bs": false, "stem": "Which queue has higher priority in Dart's event loop?", "opts": {"A": "Event queue", "B": "Microtask queue", "C": "They are equal", "D": "Timer queue"}, "ans": "B", "why": "Event loop luôn **vét sạch microtask queue trước**, rồi mới lấy 1 event từ event queue. `scheduleMicrotask`/`Future.microtask` vào microtask queue; `Future()`, `Future.delayed`, I/O, timer vào event queue. Không có 'timer queue' riêng trong mô hình này."}, {"id": "M3-3", "n": 3, "bs": false, "stem": "What is the output? ```dart print('A'); Future(() => print('B')); Future.microtask(() => print('C')); print('D'); ```", "opts": {"A": "A B C D", "B": "A D C B", "C": "A D B C", "D": "A B D C"}, "ans": "B", "why": "Code đồng bộ chạy trước: in `A`, rồi `D`. Sau đó event loop ưu tiên microtask → `C`. Cuối cùng mới tới event queue → `B`. Vậy thứ tự là **A D C B**. Bẫy ở đây: `Future(() => ...)` KHÔNG chạy ngay mà xếp vào event queue."}, {"id": "M3-4", "n": 4, "bs": false, "stem": "What is the output? ```dart void main() {   print(1);   Future.value(2).then(print);   scheduleMicrotask(() => print(3));   Future.delayed(Duration.zero, () => print(4));   print(5); } ```", "opts": {"A": "1 5 2 3 4", "B": "1 2 3 4 5", "C": "1 5 3 2 4", "D": "1 5 4 2 3"}, "ans": "C", "why": "Đồng bộ trước: `1`, `5`. Rồi microtask queue: `scheduleMicrotask(3)` và `Future.value(2).then(...)` — cả hai đều là microtask, nhưng `.then` của `Future.value` được đăng ký SAU khi `scheduleMicrotask` chạy? Không — thứ tự đăng ký là `.then(print)` trước, `scheduleMicrotask` sau, nhưng `Future.value(2)` phải hoàn tất qua 1 microtask rồi mới lên lịch `.then` → nên `3` in trước `2`. Cuối cùng `Future.delayed(Duration.zero)` ở event queue → `4`. Kết quả **1 5 3 2 4**."}, {"id": "M3-5", "n": 5, "bs": false, "stem": "How do you achieve true parallelism in Dart?", "opts": {"A": "Use `async`/`await`", "B": "Use `Isolate.spawn()` or `compute()`", "C": "Use `Future.wait()`", "D": "Use `Stream.broadcast()`"}, "ans": "B", "why": "`async`/`await` chỉ là **bất đồng bộ trên 1 thread** (không song song). Muốn song song thật (dùng nhiều CPU core) phải dùng `Isolate.spawn()` hoặc helper `compute()`. `Future.wait` chỉ chờ nhiều future cùng lúc chứ vẫn 1 thread."}, {"id": "M3-6", "n": 6, "bs": false, "stem": "How do isolates communicate?", "opts": {"A": "Shared memory", "B": "Message passing via SendPort/ReceivePort", "C": "Global variables", "D": "SharedPreferences"}, "ans": "B", "why": "Isolate **không chia sẻ bộ nhớ** — mỗi isolate có heap riêng. Chúng chỉ trao đổi qua **message passing** bằng `SendPort`/`ReceivePort` (dữ liệu được copy). Chính vì không share memory nên Dart không cần lock."}, {"id": "M3-7", "n": 7, "bs": false, "stem": "A `Future` represents:", "opts": {"A": "Multiple values delivered over time", "B": "A single value available at some point in the future", "C": "A background thread", "D": "A callback queue"}, "ans": "B", "why": "`Future` = **một giá trị duy nhất** sẽ có trong tương lai (hoặc lỗi). Nhiều giá trị theo thời gian là `Stream`. Future không phải thread — nó chỉ là 'phiếu hẹn' kết quả."}, {"id": "M3-8", "n": 8, "bs": false, "stem": "What does a function marked `async` always return?", "opts": {"A": "`void`", "B": "The declared type directly", "C": "A `Future` of the declared type", "D": "A `Stream`"}, "ans": "C", "why": "Hàm `async` **luôn trả về `Future<T>`**, kể cả khi bạn `return 1` thì kiểu thực tế là `Future<int>`. Nếu khai báo `void` thì thành `Future<void>`. Đây là lý do quên `await` sẽ in ra `Instance of 'Future<int>'`."}, {"id": "M3-9", "n": 9, "bs": false, "stem": "Where can `await` be used?", "opts": {"A": "Anywhere", "B": "Only inside a function marked `async`", "C": "Only in `main()`", "D": "Only inside `then()`"}, "ans": "B", "why": "`await` chỉ hợp lệ **bên trong hàm đánh dấu `async`** (hoặc `async*`). Dùng ở nơi khác là lỗi biên dịch. Từ Dart 2.x, top-level `main()` cũng phải khai báo `async` mới await được."}, {"id": "M3-10", "n": 10, "bs": false, "stem": "What is wrong with this code? ```dart void loadData() {   final data = await fetchData(); } ```", "opts": {"A": "`fetchData` must be a Stream", "B": "`loadData` must be marked `async`", "C": "`final` should be `var`", "D": "Nothing is wrong"}, "ans": "B", "why": "Có `await` mà hàm `loadData()` không khai báo `async` → **lỗi biên dịch**. Sửa: `void loadData() async { ... }`. Đây là lỗi hay gặp nhất khi mới học async."}, {"id": "M3-11", "n": 11, "bs": false, "stem": "Which runs the two futures in parallel?", "opts": {"A": "`await f1(); await f2();`", "B": "`await Future.wait([f1(), f2()]);`", "C": "`f1().then((_) => f2());`", "D": "`await f1().then(f2);`"}, "ans": "B", "why": "`await f1(); await f2();` là **tuần tự** (tổng thời gian = t1 + t2). `Future.wait([f1(), f2()])` khởi động cả hai rồi mới chờ → **song song về mặt chờ đợi** (tổng ≈ max(t1,t2)). Đây là mẹo tối ưu tốc độ tải dữ liệu nhiều API."}, {"id": "M3-12", "n": 12, "bs": false, "stem": "What does `Future.any([f1, f2])` do?", "opts": {"A": "Waits for all futures", "B": "Completes with the result of the first future to complete", "C": "Cancels all futures", "D": "Runs them sequentially"}, "ans": "B", "why": "`Future.any` hoàn tất với **kết quả của future ĐẦU TIÊN xong** (race). Còn `Future.wait` mới là chờ tất cả. `Future.any` hay dùng cho pattern 'lấy nguồn nào phản hồi nhanh nhất' hoặc kết hợp timeout."}, {"id": "M3-13", "n": 13, "bs": false, "stem": "Which method handles errors when using the `then()` style?", "opts": {"A": "`finally()`", "B": "`catchError()`", "C": "`rescue()`", "D": "`onError:` only"}, "ans": "B", "why": "Kiểu `.then()` bắt lỗi bằng **`.catchError()`**. Dart không có `.finally()` hay `.rescue()`. (`onError:` là tham số phụ của `then`, không phải phương thức đứng riêng nên không phải đáp án đủ.)"}, {"id": "M3-14", "n": 14, "bs": false, "stem": "Which block always runs regardless of success or failure?", "opts": {"A": "`catch`", "B": "`finally`", "C": "`then`", "D": "`onDone`"}, "ans": "B", "why": "`finally` **luôn chạy** dù thành công hay ném lỗi — dùng để dọn dẹp (đóng file, tắt loading spinner). `catch` chỉ chạy khi có lỗi; `then` chỉ chạy khi thành công."}, {"id": "M3-15", "n": 15, "bs": false, "stem": "What is the equivalent of `finally` in the `then()` chain?", "opts": {"A": "`always()`", "B": "`whenComplete()`", "C": "`onDone()`", "D": "`cleanup()`"}, "ans": "B", "why": "Trong chuỗi `.then()`, tương đương `finally` là **`.whenComplete()`** — luôn chạy dù future thành công hay lỗi. `onDone` là của `Stream`, không phải `Future`."}, {"id": "M3-16", "n": 16, "bs": false, "stem": "A `Stream` differs from a `Future` because it:", "opts": {"A": "Runs on another thread", "B": "Can emit zero or many values over time", "C": "Cannot fail", "D": "Is synchronous"}, "ans": "B", "why": "Điểm khác cốt lõi: `Future` = **1 giá trị**, `Stream` = **0, 1 hoặc nhiều giá trị theo thời gian**. Stream vẫn chạy trên cùng thread và vẫn có thể lỗi (`onError`)."}, {"id": "M3-17", "n": 17, "bs": false, "stem": "Which keywords declare an asynchronous generator?", "opts": {"A": "`async` + `return`", "B": "`async*` + `yield`", "C": "`sync*` + `await`", "D": "`stream` + `emit`"}, "ans": "B", "why": "Async generator dùng **`async*` + `yield`** (trả `Stream`). Đối chiếu: `sync*` + `yield` trả `Iterable`; `async` + `return` trả `Future`. Nhớ cặp: async* ↔ Stream, sync* ↔ Iterable."}, {"id": "M3-18", "n": 18, "bs": false, "stem": "How many listeners can a default (single-subscription) Stream have?", "opts": {"A": "Unlimited", "B": "Exactly one", "C": "Two", "D": "Zero"}, "ans": "B", "why": "Stream mặc định là **single-subscription** → chỉ **đúng 1 listener**. Muốn nhiều listener phải dùng `.broadcast()`. Đây là nguồn gốc lỗi 'Stream has already been listened to'."}, {"id": "M3-19", "n": 19, "bs": false, "stem": "What happens if you listen to a single-subscription Stream twice?", "opts": {"A": "Both listeners receive data", "B": "A `StateError` is thrown", "C": "The first listener is cancelled", "D": "Data is duplicated"}, "ans": "B", "why": "Listen lần thứ hai vào single-subscription stream sẽ ném **`StateError`** ('Stream has already been listened to'). Fix: dùng `StreamController.broadcast()` hoặc `stream.asBroadcastStream()`."}, {"id": "M3-20", "n": 20, "bs": false, "stem": "What happens to events added to a broadcast StreamController when there are no listeners?", "opts": {"A": "They are buffered until a listener appears", "B": "They are lost", "C": "An exception is thrown", "D": "They are stored in memory permanently"}, "ans": "B", "why": "Broadcast stream **không buffer** — event phát ra khi chưa có listener nào thì **mất luôn**. Ngược lại single-subscription stream có buffer chờ listener đầu tiên. Đây là bẫy hay gặp khi add data trước khi widget kịp listen."}, {"id": "M3-21", "n": 21, "bs": false, "stem": "How do you create a stream that supports multiple listeners?", "opts": {"A": "`StreamController()`", "B": "`StreamController.broadcast()`", "C": "`Stream.multi()`", "D": "`Stream.shared()`"}, "ans": "B", "why": "Dùng **`StreamController.broadcast()`**. `StreamController()` thường chỉ cho 1 listener. `Stream.multi()`/`Stream.shared()` không phải API đúng ở đây."}, {"id": "M3-22", "n": 22, "bs": false, "stem": "Which must be called in `dispose()` to avoid a memory leak?", "opts": {"A": "`stream.close()` only", "B": "`subscription.cancel()` and `controller.close()`", "C": "`setState()`", "D": "`Future.wait()`"}, "ans": "B", "why": "Trong `dispose()` phải **`subscription.cancel()` VÀ `controller.close()`**. Quên cancel → listener vẫn giữ tham chiếu tới State đã bị hủy → memory leak + lỗi `setState() called after dispose()`."}, {"id": "M3-23", "n": 23, "bs": false, "stem": "What does `await for` do?", "opts": {"A": "Waits for a Future", "B": "Iterates over the values of a Stream asynchronously", "C": "Creates a loop of Futures", "D": "Blocks the UI thread"}, "ans": "B", "why": "`await for (final x in stream)` **lặp qua từng giá trị của Stream một cách bất đồng bộ**, tạm dừng tại mỗi vòng lặp cho tới khi có event kế tiếp. Nó KHÔNG block UI vì đang ở trong hàm async."}, {"id": "M3-24", "n": 24, "bs": false, "stem": "Which Stream method transforms each event asynchronously?", "opts": {"A": "`map()`", "B": "`asyncMap()`", "C": "`expand()`", "D": "`where()`"}, "ans": "B", "why": "`map()` biến đổi **đồng bộ**; **`asyncMap()`** cho phép callback trả về `Future` và chờ nó xong trước khi phát event kế tiếp — dùng khi mỗi item cần gọi API."}, {"id": "M3-25", "n": 25, "bs": false, "stem": "What does `distinct()` do on a Stream?", "opts": {"A": "Removes all duplicates in the whole stream", "B": "Skips events equal to the previous event", "C": "Sorts events", "D": "Emits only the first event"}, "ans": "B", "why": "`distinct()` chỉ **bỏ qua event bằng với event LIỀN TRƯỚC** (so sánh với phần tử trước đó), không phải khử trùng toàn bộ stream. Chuỗi 1,1,2,1 → 1,2,1."}, {"id": "M3-26", "n": 26, "bs": false, "stem": "What is a `Completer` used for?", "opts": {"A": "Completing a widget build", "B": "Manually creating and completing a Future", "C": "Closing a Stream", "D": "Handling errors"}, "ans": "B", "why": "`Completer` cho phép **tự tay tạo một Future và quyết định khi nào nó hoàn tất** (`complete()` / `completeError()`). Dùng khi bắc cầu callback-based API sang Future, hoặc xây semaphore."}, {"id": "M3-27", "n": 27, "bs": false, "stem": "Which correctly limits concurrent API calls to a maximum of 3?", "opts": {"A": "`Future.wait(futures, maxConcurrency: 3)`", "B": "Use the `pool` package or a custom semaphore built with Completers", "C": "`http.Client(maxConnections: 3)`", "D": "`Isolate.run(concurrencyLimit: 3)`"}, "ans": "B", "why": "`Future.wait` không có tham số `maxConcurrency`. Muốn giới hạn số request đồng thời phải dùng **package `pool`** hoặc tự viết semaphore bằng `Completer`. Các lựa chọn còn lại là API không tồn tại."}, {"id": "M3-28", "n": 28, "bs": false, "stem": "What does `.timeout(Duration(seconds: 5))` do to a Future?", "opts": {"A": "Delays it by 5 seconds", "B": "Throws `TimeoutException` if it does not complete within 5 seconds", "C": "Retries it after 5 seconds", "D": "Cancels the HTTP socket"}, "ans": "B", "why": "`.timeout(d)` ném **`TimeoutException`** nếu Future chưa xong trong khoảng thời gian đó. Lưu ý: nó KHÔNG thực sự hủy công việc bên dưới (socket vẫn có thể chạy tiếp), chỉ là future kết thúc bằng lỗi."}, {"id": "M3-29", "n": 29, "bs": false, "stem": "In `Future.delayed(Duration(seconds: 2), () => 'x')`, when does the callback run?", "opts": {"A": "Immediately", "B": "After the delay, via the event queue", "C": "On a separate thread", "D": "Only when awaited"}, "ans": "B", "why": "Callback của `Future.delayed` được đưa vào **event queue sau khi hết delay**, rồi event loop mới gọi. Nên nó không chạy ngay, cũng không chạy trên thread khác. Với `Duration.zero` thì vẫn xếp sau toàn bộ microtask."}, {"id": "M3-30", "n": 30, "bs": false, "stem": "What problem does the Repository Pattern solve?", "opts": {"A": "It speeds up rendering", "B": "It separates data sources from the UI, making code testable and swappable", "C": "It replaces state management", "D": "It handles navigation"}, "ans": "B", "why": "Repository Pattern **tách nguồn dữ liệu khỏi UI**: UI gọi `repository.getUsers()` mà không biết dữ liệu đến từ API, cache hay DB. Nhờ đó dễ đổi nguồn và dễ mock khi viết unit test."}, {"id": "M3-31", "n": 31, "bs": false, "stem": "Why is calling `http.get()` directly inside a widget considered bad practice?", "opts": {"A": "It is slower", "B": "It couples UI to the data source and makes unit testing/mocking difficult", "C": "It causes compile errors", "D": "It is not allowed by Flutter"}, "ans": "B", "why": "Gọi `http.get()` thẳng trong widget khiến **UI dính chặt vào tầng dữ liệu**: không thể mock để test, không tái sử dụng, khó đổi nguồn. Nó vẫn chạy được (không lỗi biên dịch) — chỉ là kiến trúc tồi."}, {"id": "M3-32", "n": 32, "bs": false, "stem": "What does this print? ```dart Future<int> f() async => 1; void main() async {   print(f());   print(await f()); } ```", "opts": {"A": "`1` then `1`", "B": "`Instance of 'Future<int>'` then `1`", "C": "`1` then `Instance of 'Future<int>'`", "D": "Compile error"}, "ans": "B", "why": "`print(f())` in **`Instance of 'Future<int>'`** vì chưa await (giá trị chưa có). `print(await f())` mới in `1`. Đây chính là triệu chứng kinh điển của việc quên `await`."}, {"id": "M3-33", "n": 33, "bs": false, "stem": "Which is TRUE about `async`/`await` versus `then()`?", "opts": {"A": "`await` blocks the UI thread; `then()` does not", "B": "They are functionally equivalent; `await` is syntactic sugar that improves readability", "C": "`then()` cannot handle errors", "D": "`await` runs code on another isolate"}, "ans": "B", "why": "`await` **không block UI thread** — nó nhả quyền điều khiển về event loop. `async/await` và `.then()` tương đương về chức năng; `await` chỉ là **cú pháp đường (syntactic sugar)** giúp code dễ đọc, chạy tuần tự trực quan."}, {"id": "M3-34", "n": 34, "bs": false, "stem": "What happens to an unhandled error inside a Future?", "opts": {"A": "It is silently ignored", "B": "It becomes an unhandled asynchronous exception and may crash/log", "C": "It is converted to null", "D": "The Future never completes"}, "ans": "B", "why": "Lỗi không bắt trong Future trở thành **unhandled asynchronous exception** — bị log ra console, có thể crash app (đặc biệt trong zone/isolate). Nó KHÔNG bị bỏ qua âm thầm và cũng không thành null."}, {"id": "M3-35", "n": 35, "bs": false, "stem": "Which is the correct way to run heavy computation without freezing the UI?", "opts": {"A": "Wrap it in `async`", "B": "Use `compute()` or `Isolate.spawn()`", "C": "Use `Future.delayed()`", "D": "Use `setState()`"}, "ans": "B", "why": "Tính toán nặng phải chuyển sang isolate khác bằng **`compute()`** (helper đơn giản) hoặc **`Isolate.spawn()`**. Bọc `async` vô ích vì vẫn chạy trên isolate chính; `Future.delayed` chỉ trì hoãn chứ vẫn làm đơ UI."}, {"id": "M3-BS-1", "n": 1, "bs": true, "stem": "Which statement about an abstract class is TRUE?", "opts": {"A": "It can be instantiated directly with `new`", "B": "It cannot have any concrete methods", "C": "It may declare methods with no body that subclasses must implement", "D": "It cannot have a constructor"}, "ans": "C", "why": "Abstract class **không thể khởi tạo trực tiếp**, nhưng CÓ THỂ có method cụ thể (có body), CÓ THỂ có constructor. Đặc trưng của nó là **khai báo được method không có body** buộc lớp con phải override."}, {"id": "M3-BS-2", "n": 2, "bs": true, "stem": "In Flutter, `State<T>` is an example of:", "opts": {"A": "A mixin", "B": "A factory constructor", "C": "A generic function", "D": "An abstract class whose methods (build, initState) are overridden"}, "ans": "D", "why": "`State<T>` là **abstract class** — bạn kế thừa nó và override `build()`, `initState()`, `dispose()`. Nó cũng dùng generic `<T extends StatefulWidget>` nhưng bản chất phân loại là abstract class."}, {"id": "M3-BS-3", "n": 3, "bs": true, "stem": "When a class uses `implements SomeClass`, it must:", "opts": {"A": "Re-implement all members of that class's interface (no bodies are inherited)", "B": "Call `super()` in every constructor", "C": "Be abstract", "D": "Only override one method"}, "ans": "A", "why": "`implements` chỉ lấy **signature (interface ngầm)**, KHÔNG kế thừa body → phải **cài đặt lại toàn bộ** thành viên. Trong Dart mọi class đều tự động có một implicit interface, nên implements được bất kỳ class nào."}, {"id": "M3-BS-4", "n": 4, "bs": true, "stem": "What is the difference between `extends` and `implements`?", "opts": {"A": "They are identical", "B": "`extends` inherits behaviour; `implements` only takes the signature and forces full re-implementation", "C": "`implements` allows multiple inheritance of behaviour", "D": "`extends` cannot override methods"}, "ans": "B", "why": "`extends` = **kế thừa hành vi** (dùng lại code cha, chỉ override khi cần) và chỉ được 1 lớp cha. `implements` = **chỉ lấy hợp đồng**, phải viết lại hết, nhưng implements được nhiều interface cùng lúc."}, {"id": "M3-BS-5", "n": 5, "bs": true, "stem": "What does a `mixin` provide?", "opts": {"A": "Multiple inheritance of state via constructors", "B": "A way to make a class abstract", "C": "Asynchronous execution", "D": "Reusable behaviour mixed into a class with `with`, without a subclass relationship"}, "ans": "D", "why": "`mixin` cung cấp **hành vi tái sử dụng** trộn vào class bằng `with`, **không tạo quan hệ cha–con**. Mixin không có constructor nên không mang state khởi tạo theo kiểu kế thừa."}, {"id": "M3-BS-6", "n": 6, "bs": true, "stem": "What does `mixin CanBark on Pet` mean?", "opts": {"A": "`CanBark` can only be applied to classes that are (subclasses of) `Pet`", "B": "`CanBark` extends `Pet`", "C": "`Pet` uses the `CanBark` mixin", "D": "`CanBark` is abstract"}, "ans": "A", "why": "`on Pet` là **ràng buộc mixin**: `CanBark` chỉ được `with` vào class là `Pet` hoặc lớp con của `Pet`. Nhờ vậy bên trong mixin có thể truy cập thành viên của `Pet` (ví dụ `name`) một cách an toàn. Đây KHÔNG phải kế thừa."}, {"id": "M3-BS-7", "n": 7, "bs": true, "stem": "What is the main purpose of a `factory` constructor?", "opts": {"A": "It always returns a brand-new instance", "B": "It can only be used inside abstract classes", "C": "It controls instance creation — can return a cached object, a subtype, or parse JSON", "D": "It runs asynchronously by default"}, "ans": "C", "why": "`factory` constructor **kiểm soát việc tạo instance**: có thể trả về object đã cache (singleton), trả về một subtype khác, hoặc dựng object từ JSON. Điểm khác constructor thường: nó **không bắt buộc tạo instance mới**."}, {"id": "M3-BS-8", "n": 8, "bs": true, "stem": "Which is a typical use case for a factory constructor?", "opts": {"A": "Declaring a private field", "B": "Defining a mixin", "C": "Overriding `toString()`", "D": "`User.fromJson(map)` parsing JSON into an object"}, "ans": "D", "why": "`User.fromJson(map)` là ca dùng factory kinh điển — cần xử lý/validate map rồi mới quyết định tạo object. Các lựa chọn còn lại (private field, mixin, toString) không liên quan tới cơ chế tạo instance."}, {"id": "M3-BS-9", "n": 9, "bs": true, "stem": "Why are generics (e.g. `Box<T>`) useful?", "opts": {"A": "They give compile-time type safety and reuse for many types, avoiding `dynamic` misuse", "B": "They make code run on another thread", "C": "They replace inheritance", "D": "They are only for collections"}, "ans": "A", "why": "Generics cho **an toàn kiểu ở compile-time** và tái sử dụng cho nhiều kiểu, thay vì dùng `dynamic` (mất kiểm tra kiểu, lỗi chỉ lộ khi chạy). Generics dùng được cho cả class/hàm chứ không riêng collection."}, {"id": "M3-BS-10", "n": 10, "bs": true, "stem": "In `class Box<T extends Animal>`, what does the constraint guarantee?", "opts": {"A": "`T` must be exactly `Animal`", "B": "`Box` inherits from `Animal`", "C": "`T` must be a subtype of `Animal`, so members of `Animal` can be called on a `T` value", "D": "`T` can be any type"}, "ans": "C", "why": "`<T extends Animal>` nghĩa là **T phải là Animal hoặc lớp con của Animal**. Nhờ ràng buộc này, trong class có thể gọi trực tiếp các thành viên của `Animal` trên giá trị kiểu `T` mà không cần ép kiểu. `Box` KHÔNG kế thừa `Animal`."}, {"id": "M3-BS-11", "n": 11, "bs": true, "stem": "Which correctly declares a custom exception in Dart?", "opts": {"A": "`class LoginException throws Exception {}`", "B": "`class LoginException implements Exception { final String msg; LoginException(this.msg); }`", "C": "`exception LoginException {}`", "D": "`class LoginException = Exception;`"}, "ans": "B", "why": "Cách đúng: **`class LoginException implements Exception`** kèm field message. Dart không có từ khóa `throws`/`exception`. Nên override `toString()` để thông báo lỗi dễ đọc."}, {"id": "M3-BS-12", "n": 12, "bs": true, "stem": "Which pair of Flutter examples correctly matches the keyword?", "opts": {"A": "`StatefulWidget implements Widget`, `AnimationController extends Listenable`", "B": "Both use `with`", "C": "Both use `extends`", "D": "`StatefulWidget extends Widget`, `AnimationController implements Listenable`"}, "ans": "D", "why": "Cặp ví dụ chuẩn trong Flutter: **`StatefulWidget extends Widget`** (kế thừa hành vi) và **`AnimationController implements Listenable`** (chỉ cam kết hợp đồng thông báo thay đổi). Nhớ cặp này để phân biệt extends vs implements."}]}, {"id": "M4", "kind": "mod", "chip": "M4", "title": "Module 4 — UI Fundamentals & Widget Lifecycle", "questions": [{"id": "M4-1", "n": 1, "bs": false, "stem": "In Flutter, a Widget is best described as:", "opts": {"A": "A mutable object that is repainted directly", "B": "An immutable description of part of the user interface", "C": "A native platform view", "D": "A rendering canvas"}, "ans": "B", "why": "Widget là **mô tả bất biến (immutable)** của một phần UI — như bản thiết kế, không phải thứ được vẽ trực tiếp. Việc vẽ do RenderObject đảm nhiệm. Chính vì immutable nên Flutter tạo lại widget rất rẻ."}, {"id": "M4-2", "n": 2, "bs": false, "stem": "Which three trees does Flutter maintain?", "opts": {"A": "Widget, Element, RenderObject", "B": "Widget, State, Layout", "C": "View, Controller, Model", "D": "Widget, Layer, Canvas"}, "ans": "A", "why": "Flutter duy trì **3 cây: Widget → Element → RenderObject**. Widget = cấu hình, Element = cầu nối giữ state & vị trí trong cây, RenderObject = layout + vẽ thật."}, {"id": "M4-3", "n": 3, "bs": false, "stem": "Which tree actually holds the State objects and persists across rebuilds?", "opts": {"A": "Widget tree", "B": "Element tree", "C": "RenderObject tree", "D": "Layer tree"}, "ans": "B", "why": "**Element tree** mới là nơi giữ `State` và tồn tại xuyên suốt các lần rebuild. Widget bị vứt đi/tạo mới liên tục; Element được tái sử dụng nếu `runtimeType` và `key` khớp — nhờ đó state không mất."}, {"id": "M4-4", "n": 4, "bs": false, "stem": "Why is rebuilding widgets considered cheap in Flutter?", "opts": {"A": "Widgets are cached on disk", "B": "Widgets are lightweight configuration objects; Flutter only updates the Elements/RenderObjects that actually changed", "C": "Rebuilds happen on a background isolate", "D": "Flutter skips the build phase in release mode"}, "ans": "B", "why": "Widget là **object cấu hình siêu nhẹ**; khi rebuild, Flutter so sánh widget mới với cũ và **chỉ cập nhật Element/RenderObject thực sự thay đổi**. Rebuild ≠ repaint toàn màn hình."}, {"id": "M4-5", "n": 5, "bs": false, "stem": "When should you use a StatelessWidget?", "opts": {"A": "When the widget needs to change its own data over time", "B": "When the widget's appearance depends only on its configuration", "C": "When you need `initState()`", "D": "Never; StatefulWidget is always better"}, "ans": "B", "why": "Dùng `StatelessWidget` khi giao diện **chỉ phụ thuộc vào cấu hình truyền vào** và không tự thay đổi theo thời gian. Cần dữ liệu thay đổi nội bộ hoặc `initState()` thì mới cần StatefulWidget."}, {"id": "M4-6", "n": 6, "bs": false, "stem": "Which method must a StatefulWidget implement?", "opts": {"A": "`build()`", "B": "`createState()`", "C": "`initState()`", "D": "`setState()`"}, "ans": "B", "why": "`StatefulWidget` bắt buộc implement **`createState()`** — trả về đối tượng `State`. `build()`, `initState()`, `setState()` nằm trong class `State`, không nằm trong widget."}, {"id": "M4-7", "n": 7, "bs": false, "stem": "What is the correct order of the State lifecycle?", "opts": {"A": "`initState` → `createState` → `build` → `dispose`", "B": "`createState` → `initState` → `didChangeDependencies` → `build` → `dispose`", "C": "`build` → `initState` → `dispose`", "D": "`createState` → `build` → `initState` → `dispose`"}, "ans": "B", "why": "Vòng đời đúng: **`createState` → `initState` → `didChangeDependencies` → `build` → (`didUpdateWidget`/`setState` → build...) → `dispose`**. `createState` luôn đứng đầu, `dispose` luôn cuối."}, {"id": "M4-8", "n": 8, "bs": false, "stem": "How many times is `initState()` called during a State's lifetime?", "opts": {"A": "Once", "B": "On every rebuild", "C": "Once per frame", "D": "Whenever setState is called"}, "ans": "A", "why": "`initState()` chỉ chạy **đúng 1 lần** trong suốt vòng đời của State (khi State được chèn vào cây). Nơi chạy nhiều lần là `build()`. Vì vậy đặt khởi tạo controller/subscription ở đây."}, {"id": "M4-9", "n": 9, "bs": false, "stem": "Which method is called when an InheritedWidget the State depends on changes?", "opts": {"A": "`initState()`", "B": "`didChangeDependencies()`", "C": "`didUpdateWidget()`", "D": "`deactivate()`"}, "ans": "B", "why": "**`didChangeDependencies()`** được gọi khi InheritedWidget mà State phụ thuộc (ví dụ `Theme`, `MediaQuery`, `Provider`) thay đổi. Nó cũng chạy 1 lần ngay sau `initState()`."}, {"id": "M4-10", "n": 10, "bs": false, "stem": "Which method is called when the parent rebuilds this widget with new configuration?", "opts": {"A": "`didUpdateWidget(oldWidget)`", "B": "`initState()`", "C": "`reassemble()`", "D": "`didChangeDependencies()`"}, "ans": "A", "why": "**`didUpdateWidget(oldWidget)`** chạy khi widget cha rebuild và truyền cấu hình mới xuống cùng vị trí. Đây là nơi so sánh `oldWidget` với `widget` để cập nhật controller/subscription theo tham số mới."}, {"id": "M4-11", "n": 11, "bs": false, "stem": "Why should you NOT call `Theme.of(context)` inside `initState()`?", "opts": {"A": "`context` does not exist yet", "B": "The widget is not yet registered as a dependent of the InheritedWidget; use `didChangeDependencies()`", "C": "It causes a memory leak", "D": "It is allowed and preferred"}, "ans": "B", "why": "Trong `initState()` `context` đã tồn tại, nhưng widget **chưa đăng ký là 'dependent' của InheritedWidget** → truy cập `Theme.of(context)` sẽ lỗi/không nhận cập nhật. Đúng chỗ là **`didChangeDependencies()`** (hoặc trong `build`)."}, {"id": "M4-12", "n": 12, "bs": false, "stem": "What must be released in `dispose()`?", "opts": {"A": "TextEditingController, AnimationController, StreamSubscription, Timer", "B": "All widgets in the subtree", "C": "The BuildContext", "D": "Nothing; Dart's GC handles everything"}, "ans": "A", "why": "`dispose()` phải giải phóng các tài nguyên có vòng đời riêng: **TextEditingController, AnimationController, StreamSubscription, Timer**, focus node... GC của Dart KHÔNG tự dọn được vì chúng vẫn bị listener tham chiếu."}, {"id": "M4-13", "n": 13, "bs": false, "stem": "Calling `setState()` after the widget has been disposed causes an error. How do you guard against it?", "opts": {"A": "`if (mounted) setState(() {});`", "B": "`try { setState(...) } catch (_) {}`", "C": "`if (context != null)`", "D": "Use `WidgetsBinding.instance.addPostFrameCallback` always"}, "ans": "A", "why": "Cách chuẩn là kiểm tra cờ **`if (mounted) setState(...)`** — `mounted` cho biết State còn nằm trong cây hay không. Bọc try/catch chỉ giấu lỗi chứ không xử lý đúng nguyên nhân."}, {"id": "M4-14", "n": 14, "bs": false, "stem": "What happens if you call `setState()` inside `build()`?", "opts": {"A": "Nothing", "B": "An infinite rebuild loop / framework error", "C": "The build is skipped", "D": "State is reset"}, "ans": "B", "why": "Gọi `setState()` trong `build()` tạo **vòng lặp rebuild vô hạn** (build → dirty → build...) và Flutter sẽ báo lỗi framework. `build()` phải là hàm thuần, không gây side-effect."}, {"id": "M4-15", "n": 15, "bs": false, "stem": "What does `setState()` actually do?", "opts": {"A": "Directly repaints the screen", "B": "Marks the element as dirty so it is rebuilt on the next frame", "C": "Restarts the app", "D": "Updates the RenderObject immediately"}, "ans": "B", "why": "`setState()` **không vẽ lại ngay** — nó chỉ **đánh dấu element là 'dirty'** để Flutter rebuild ở frame kế tiếp. Đây là lý do đọc giá trị ngay sau setState vẫn có thể thấy UI cũ."}, {"id": "M4-16", "n": 16, "bs": false, "stem": "What is the primary role of `MaterialApp`?", "opts": {"A": "Database initialisation", "B": "Providing Material Design structure and app-level configuration (theme, routes, localisation)", "C": "State management for the whole app", "D": "Replacing Scaffold"}, "ans": "B", "why": "`MaterialApp` cung cấp **khung Material Design và cấu hình cấp ứng dụng**: theme, routes/navigator, localization, title. Nó không quản lý state hay database, và không thay thế Scaffold (Scaffold là khung 1 màn hình)."}, {"id": "M4-17", "n": 17, "bs": false, "stem": "Which widgets are implicitly provided inside `MaterialApp`?", "opts": {"A": "Navigator, Theme, MediaQuery, Localizations", "B": "Scaffold and AppBar", "C": "Provider and Bloc", "D": "ListView and GridView"}, "ans": "A", "why": "Bên trong `MaterialApp` đã có sẵn **Navigator, Theme, MediaQuery, Localizations** (và Directionality). Nhờ vậy con cháu gọi được `Navigator.of`, `Theme.of`, `MediaQuery.of`. Scaffold/AppBar thì bạn phải tự thêm."}, {"id": "M4-18", "n": 18, "bs": false, "stem": "Calling `Navigator.of(context)` in the same widget that builds `MaterialApp` throws an error. Why?", "opts": {"A": "Navigator requires a Scaffold", "B": "That context is above MaterialApp in the tree, so no Navigator is found; use a child widget or `Builder`", "C": "Navigator only works in StatefulWidgets", "D": "MaterialApp disables Navigator"}, "ans": "B", "why": "`Navigator.of(context)` tìm Navigator bằng cách đi **lên trên** cây từ context đó. Context tại nơi build `MaterialApp` nằm **phía trên** Navigator nên không tìm thấy. Fix: bọc bằng **`Builder`** hoặc tách ra widget con."}, {"id": "M4-19", "n": 19, "bs": false, "stem": "Which property of Scaffold controls where the FloatingActionButton appears?", "opts": {"A": "`fabAlignment`", "B": "`floatingActionButtonLocation`", "C": "`buttonPosition`", "D": "`alignment`"}, "ans": "B", "why": "Thuộc tính đúng là **`floatingActionButtonLocation`** (ví dụ `FloatingActionButtonLocation.centerDocked`). Các tên còn lại không tồn tại trong Scaffold."}, {"id": "M4-20", "n": 20, "bs": false, "stem": "Which Scaffold property pushes content up when the keyboard appears?", "opts": {"A": "`extendBody`", "B": "`resizeToAvoidBottomInset`", "C": "`keyboardPadding`", "D": "`bottomInset`"}, "ans": "B", "why": "**`resizeToAvoidBottomInset`** (mặc định `true`) khiến Scaffold co lại/đẩy nội dung lên khi bàn phím hiện ra, tránh che ô nhập. Đặt `false` khi muốn nội dung nằm yên (ví dụ có ảnh nền)."}, {"id": "M4-21", "n": 21, "bs": false, "stem": "How do you show a SnackBar in modern Flutter?", "opts": {"A": "`Scaffold.of(context).showSnackBar(...)`", "B": "`ScaffoldMessenger.of(context).showSnackBar(...)`", "C": "`SnackBar.show(context)`", "D": "`showDialog(...)`"}, "ans": "B", "why": "Cách hiện đại là **`ScaffoldMessenger.of(context).showSnackBar(...)`**. `Scaffold.of(context).showSnackBar` đã **deprecated** — nó hay lỗi vì context nằm sai vị trí; ScaffoldMessenger còn giữ được SnackBar khi chuyển màn hình."}, {"id": "M4-22", "n": 22, "bs": false, "stem": "What does `onPressed: null` do to a button?", "opts": {"A": "Nothing happens on tap but the button looks enabled", "B": "The button is rendered in a disabled state", "C": "It throws an error", "D": "It hides the button"}, "ans": "B", "why": "Đặt `onPressed: null` khiến button **chuyển sang trạng thái disabled** (mờ đi, không nhận tap). Đây là cách chuẩn để tắt nút — không cần thuộc tính `enabled` riêng."}, {"id": "M4-23", "n": 23, "bs": false, "stem": "Which is the correct choice for a long or infinite list?", "opts": {"A": "`ListView(children: [...])`", "B": "`ListView.builder(itemCount:, itemBuilder:)`", "C": "`Column(children: [...])`", "D": "`Wrap`"}, "ans": "B", "why": "Danh sách dài/vô hạn phải dùng **`ListView.builder`** với `itemCount` + `itemBuilder` để dựng lazy. `ListView(children: [...])` và `Column` dựng toàn bộ item ngay lập tức → tốn RAM, giật."}, {"id": "M4-24", "n": 24, "bs": false, "stem": "Why is `ListView.builder` more efficient?", "opts": {"A": "It caches all items in memory", "B": "It lazily builds only the items currently visible (and a small cache extent)", "C": "It uses native views", "D": "It compresses the list"}, "ans": "B", "why": "`ListView.builder` **chỉ dựng những item đang hiển thị** (cộng một ít cache extent) và hủy item đã cuộn khỏi màn hình. Nó không cache tất cả cũng không dùng native view."}, {"id": "M4-25", "n": 25, "bs": false, "stem": "Which widget adds dividers between list items automatically?", "opts": {"A": "`ListView.builder`", "B": "`ListView.separated`", "C": "`ListView.custom`", "D": "`Divider.list`"}, "ans": "B", "why": "**`ListView.separated`** nhận thêm `separatorBuilder` để chèn widget ngăn cách (thường là `Divider`) giữa các item. `ListView.builder` thì phải tự thêm Divider trong item."}, {"id": "M4-26", "n": 26, "bs": false, "stem": "Which widget provides a card-like surface with elevation and rounded corners?", "opts": {"A": "`Container`", "B": "`Card`", "C": "`Material`", "D": "`Surface`"}, "ans": "B", "why": "**`Card`** cho sẵn nền Material, bo góc và đổ bóng (`elevation`). `Container` phải tự cấu hình `BoxDecoration`; `Material` là lớp nền tổng quát hơn, không mặc định bo góc/elevation kiểu card."}, {"id": "M4-27", "n": 27, "bs": false, "stem": "In `ListTile`, which property places a widget at the end of the row?", "opts": {"A": "`leading`", "B": "`trailing`", "C": "`subtitle`", "D": "`suffix`"}, "ans": "B", "why": "`ListTile` có `leading` (đầu hàng), **`trailing` (cuối hàng)**, `title`, `subtitle`. Không có thuộc tính `suffix`. Trailing hay dùng cho icon mũi tên, checkbox, switch."}, {"id": "M4-28", "n": 28, "bs": false, "stem": "A Checkbox does not change when tapped. What is the most likely cause?", "opts": {"A": "`onChanged` is null", "B": "The new value is not stored via `setState()`", "C": "The Checkbox is disabled by default", "D": "Either A or B"}, "ans": "D", "why": "Checkbox là stateless về mặt hiển thị: nó vẽ theo `value` bạn truyền. Nếu **`onChanged` null** thì nó bị disable; nếu có `onChanged` nhưng **không lưu giá trị mới bằng `setState`** thì UI cũng không đổi. Vì vậy đáp án là **cả A và B**."}, {"id": "M4-29", "n": 29, "bs": false, "stem": "What is \"ephemeral state\"?", "opts": {"A": "State shared across the whole app", "B": "Local state contained in a single widget, managed with `setState`", "C": "State persisted to disk", "D": "State stored on the server"}, "ans": "B", "why": "Ephemeral state (UI state) = **state cục bộ của một widget**, quản lý bằng `setState` — ví dụ tab đang chọn, trạng thái animation. Ngược lại app state cần Provider/Bloc và có thể lưu xuống đĩa/server."}, {"id": "M4-30", "n": 30, "bs": false, "stem": "`showDatePicker()` returns:", "opts": {"A": "A `DateTime`", "B": "A `Future<DateTime?>`", "C": "`void`", "D": "A `Stream<DateTime>`"}, "ans": "B", "why": "`showDatePicker()` trả về **`Future<DateTime?>`** — bất đồng bộ (chờ người dùng chọn) và **nullable** (người dùng có thể bấm Cancel). Vì vậy phải `await` và kiểm tra null."}, {"id": "M4-31", "n": 31, "bs": false, "stem": "Why must you null-check the result of `showTimePicker()`?", "opts": {"A": "It always returns null on Android", "B": "The user may cancel the dialog", "C": "It returns null if the app is in the background", "D": "Null-safety requires it for all Futures"}, "ans": "B", "why": "Kết quả có thể là **null khi người dùng hủy dialog** (bấm Cancel hoặc bấm ra ngoài). Không null-check sẽ crash khi gọi thuộc tính trên giá trị null."}, {"id": "M4-32", "n": 32, "bs": false, "stem": "How do you read the primary colour defined in the app theme?", "opts": {"A": "`Colors.primary`", "B": "`Theme.of(context).colorScheme.primary`", "C": "`MaterialApp.theme.primary`", "D": "`context.primaryColor`"}, "ans": "B", "why": "Đọc theo theme hiện tại: **`Theme.of(context).colorScheme.primary`**. `Colors.primary` không tồn tại; truy cập trực tiếp `MaterialApp.theme` sẽ bỏ qua việc kế thừa/override theme cục bộ."}, {"id": "M4-33", "n": 33, "bs": false, "stem": "`Theme.of(context)` works because Theme is:", "opts": {"A": "A global variable", "B": "An InheritedWidget", "C": "A singleton service", "D": "A static class"}, "ans": "B", "why": "`Theme.of(context)` hoạt động vì `Theme` là một **InheritedWidget** — nó truyền dữ liệu xuống cây và tự động rebuild những widget đã 'đăng ký' phụ thuộc khi theme đổi. Đây cũng là cơ chế của `MediaQuery`, `Provider`."}, {"id": "M4-34", "n": 34, "bs": false, "stem": "Which property enables Material 3 styling?", "opts": {"A": "`material3: true`", "B": "`useMaterial3: true`", "C": "`version: 3`", "D": "`theme: Material3()`"}, "ans": "B", "why": "Bật Material 3 bằng **`ThemeData(useMaterial3: true)`**. Các tên khác không tồn tại. (Ở Flutter mới, Material 3 đã là mặc định.)"}, {"id": "M4-35", "n": 35, "bs": false, "stem": "What does `ColorScheme.fromSeed(seedColor: Colors.blue)` do?", "opts": {"A": "Sets only the primary colour", "B": "Generates a full harmonised colour scheme from one seed colour", "C": "Applies a gradient", "D": "Sets the background colour"}, "ans": "B", "why": "`ColorScheme.fromSeed(seedColor: ...)` **sinh ra toàn bộ bảng màu hài hòa** (primary, secondary, surface, error, cùng các biến thể on*) từ **một màu hạt giống** theo thuật toán Material 3 — không chỉ đặt mỗi màu chính."}, {"id": "M4-36", "n": 36, "bs": false, "stem": "Which widget forces its child to a specific size?", "opts": {"A": "`Center`", "B": "`SizedBox`", "C": "`Align`", "D": "`Spacer`"}, "ans": "B", "why": "**`SizedBox(width:, height:, child:)`** ép con về kích t
