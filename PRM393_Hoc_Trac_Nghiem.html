, ngược lại trả vế phải. Ví dụ `name ?? 'Guest'`. A, C, D mô tả sai chức năng toán tử này.", "bs": false}, {"id": "P-32", "n": 32, "stem": "Given:\nString? name;\nprint(name ?? \"Guest\");\nname = \"Minh\";\nprint(name!.length);\nWhat is printed, in order?", "opts": {"A": "null, 4", "B": "Guest, 4", "C": "Guest, 5", "D": "Compile error because `!` cannot be used with a String? variable"}, "ans": "B", "why": "Ban đầu `name` là null → `name ?? \"Guest\"` in **Guest**. Sau khi gán `\"Minh\"` (4 ký tự M-i-n-h) → `name!.length` = **4**. Kết quả: `Guest, 4`. A sai giá trị đầu; C sai độ dài (phải là 4); D sai vì `!` hợp lệ khi tại điểm đó biến chắc chắn khác null.", "bs": false}, {"id": "P-33", "n": 33, "stem": "In the following code, what is printed to the console?\nvoid main() {\ntry {\nint result = 10 ~/ 0;\nprint(result);\n} catch (e) {\nprint(\"Error: $e\");\n} finally {\nprint(\"Done\");\n}\n}", "opts": {"A": "Error: ... then Done (integer division by zero throws IntegerDivisionByZeroException)", "B": "10, without printing Done", "C": "Infinity, Done", "D": "The program crashes completely with no output"}, "ans": "A", "why": "Chia nguyên cho 0 bằng `~/` **ném exception**, bị `catch` bắt → in `Error: ...`, sau đó **`finally` luôn chạy** → in `Done`. B, C sai vì có exception xảy ra; D sai vì catch đã xử lý nên chương trình không crash.", "bs": false}, {"id": "P-34", "n": 34, "stem": "What is the difference between `for-in` and `forEach` when iterating a List in Dart?", "opts": {"A": "`for-in` cannot be used with a List", "B": "`forEach` is the classic index-based loop syntax, while `for-in` is a higher-order function", "C": "`for-in` is syntax for iterating each element of a collection, while `forEach` calls a callback function in a functional programming style for each element", "D": "The two syntaxes are entirely identical in performance and syntax, with no difference"}, "ans": "C", "why": "**`for-in` là câu lệnh lặp** duyệt từng phần tử (dùng được `break`/`continue`); **`forEach` là hàm bậc cao nhận callback** theo phong cách hàm (không break được). A sai vì for-in dùng với List bình thường; B đảo mô tả; D sai vì hai cách này có khác biệt thật.", "bs": false}, {"id": "P-35", "n": 35, "stem": "Given this function:\nvoid greet({String name = \"Guest\", int age = 18}) {\nprint(\"$name is $age\");\n}\nWhat does calling `greet(name: \"Lan\");` print?", "opts": {"A": "Error due to missing age parameter", "B": "Lan is 18", "C": "Guest is 18", "D": "Lan is null"}, "ans": "B", "why": "`greet(name: \"Lan\")` chỉ truyền `name`, còn `age` **dùng giá trị mặc định 18** → in `Lan is 18`. A sai vì age có mặc định; C sai vì name đã được truyền; D sai vì age rõ ràng có giá trị mặc định.", "bs": false}, {"id": "P-36", "n": 36, "stem": "Consider this OOP code:\nclass Animal {\nString sound() => \"Some sound\";\n}\nclass Dog extends Animal {\n@override\nString sound() => \"Woof\";\n}\nvoid main() {\nAnimal a = Dog();\nprint(a.sound());\n}\nWhat is printed, and which OOP concept does it illustrate?", "opts": {"A": "\"Some sound\" — illustrates Encapsulation", "B": "\"Woof\" — illustrates Polymorphism via method override", "C": "Compile error because Dog cannot be assigned to an Animal-typed variable", "D": "\"Woof Some sound\" — both functions are called"}, "ans": "B", "why": "Đây là **đa hình (Polymorphism)**: biến khai báo kiểu `Animal` nhưng giữ đối tượng `Dog`, lúc chạy gọi đúng method đã override của `Dog` → in `Woof`. A gọi sai tên khái niệm; C sai vì upcasting hợp lệ; D sai vì chỉ một method được gọi.", "bs": false}, {"id": "P-37", "n": 37, "stem": "Given `Map<String, int> scores = {\"Anna\": 95};`, what happens when accessing `scores[\"Ben\"]` (a nonexistent key)?", "opts": {"A": "Throws an exception immediately", "B": "Returns 0", "C": "Returns null", "D": "Returns an empty string \"\""}, "ans": "C", "why": "Truy cập `Map` bằng **key không tồn tại trả về `null`** trong Dart (không ném exception). Vì vậy với null-safety nên dùng `map['k'] ?? giá_trị_mặc_định`. A, B, D không đúng hành vi mặc định của Map.", "bs": false}, {"id": "P-38", "n": 38, "stem": "Consider this code illustrating Dart's Event Loop:\nimport 'dart:async';\nvoid main() {\nprint(\"A\");\nscheduleMicrotask(() => print(\"micro\"));\nFuture(() => print(\"future\"));\nprint(\"B\");\n}\nWhat is the correct output order?", "opts": {"A": "A, B, micro, future", "B": "A, micro, future, B", "C": "A, B, future, micro", "D": "micro, A, B, future"}, "ans": "A", "why": "Code đồng bộ chạy hết trước → in `A`, `B`. Sau đó event loop **ưu tiên microtask** → `micro`. Cuối cùng mới tới event queue → `future`. Thứ tự: **A, B, micro, future**.", "bs": false}, {"id": "P-39", "n": 39, "stem": "Given this Stream code:\nStream<int> countUp() async {\nfor (int i = 1; i <= 3; i++) {\nyield i;\n}\n}\nvoid main() async {\nawait for (var value in countUp()) {\nprint(value);\n}\n}\nWhat is printed?", "opts": {"A": "1", "B": "1 2 3 (each number on its own line)", "C": "3 2 1", "D": "Error because `async` is not allowed for a function returning a Stream"}, "ans": "B", "why": "Hàm `async*` với `yield` sinh ra lần lượt 1, 2, 3; `await for` duyệt từng giá trị và in mỗi số một dòng. A chỉ liệt kê một giá trị; C đảo thứ tự; D sai vì Dart hỗ trợ đầy đủ `async`.", "bs": false}, {"id": "P-40", "n": 40, "stem": "In Dart's try/catch, what does the `catch (e, s)` syntax allow a developer to do?", "opts": {"A": "Catch two different exception types at once", "B": "Catch the error object and its corresponding stack trace", "C": "Catch errors on two different threads", "D": "Only applicable to String-type errors"}, "ans": "B", "why": "**`catch (e, s)` bắt được cả đối tượng lỗi `e` LẪN stack trace `s`** — rất cần khi log lỗi để biết lỗi phát sinh từ đâu. A, C, D mô tả sai cú pháp này.", "bs": false}, {"id": "P-41", "n": 41, "stem": "Which statement is correct about the differences between `List`, `Set`, and `Map` in Dart?", "opts": {"A": "List is unordered and disallows duplicates, Set is ordered, Map stores key-value pairs", "B": "List is an ordered collection, Set is a collection of unique (unordered) elements, Map stores key-value pairs", "C": "All three are the same data type, just different names", "D": "Set is ordered and allows duplicates, List does not"}, "ans": "B", "why": "**List có thứ tự** (cho phép trùng, truy cập theo index); **Set là tập phần tử duy nhất, không đảm bảo thứ tự**; **Map lưu cặp key-value**. A, C, D đều mô tả sai đặc điểm cơ bản.", "bs": false}, {"id": "P-42", "n": 42, "stem": "Given this string interpolation code:\nString name = \"FPT University\";\nprint(\"Hello $name\");\nprint(\"Length: ${name.length}\");\nprint(\"Upper: ${name.toUpperCase()[0]}\");\nWhat character does the third line print?", "opts": {"A": "f", "B": "F", "C": "FPT", "D": "Error because you cannot index directly into a function result inside string interpolation"}, "ans": "B", "why": "`\"FPT University\".toUpperCase()` = `FPT UNIVERSITY`, lấy `[0]` = ký tự `F`. A sai kiểu chữ hoa/thường; C không phải một ký tự đơn; D sai vì Dart cho phép lấy index ngay trên kết quả hàm bên trong `${}`.", "bs": false}, {"id": "P-43", "n": 43, "stem": "In Dart, what is the `Never` type used for?", "opts": {"A": "A variable that is never assigned a value", "B": "A function that never returns normally (always throws an exception or loops infinitely)", "C": "A data type equivalent to `void`", "D": "A type used for asynchronous functions"}, "ans": "B", "why": "**`Never` dùng cho hàm không bao giờ trả về bình thường** — luôn `throw` hoặc lặp vô hạn. Trình biên dịch dựa vào đó để biết code sau lời gọi là không thể chạy tới. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-44", "n": 44, "stem": "In Dart, what is the role of the `main()` function?", "opts": {"A": "It's a callback called last when the app closes", "B": "It's the entry point of execution for every Dart program", "C": "Only used in Flutter, not in pure Dart", "D": "A function used to define classes"}, "ans": "B", "why": "**`main()` là điểm bắt đầu thực thi** của mọi chương trình Dart; trong Flutter nó gọi `runApp()`. A, C, D mô tả sai vai trò hàm main.", "bs": false}, {"id": "P-45", "n": 45, "stem": "What is the difference between an arrow function (`=>`) and a function block (`{ return ...; }`) in Dart?", "opts": {"A": "Arrow functions can only be used for async functions", "B": "An arrow function is shorthand for a function with a single return expression, while a function block allows multiple statements", "C": "The two syntaxes have completely different meanings regarding return type", "D": "Arrow functions are not allowed to take parameters"}, "ans": "B", "why": "**Arrow `=>` là cách viết tắt cho hàm chỉ có MỘT biểu thức trả về**; **block `{ return ...; }` cho phép nhiều câu lệnh**. Về bản chất `=> expr` tương đương `{ return expr; }`. A, C, D không đúng đặc điểm cú pháp này.", "bs": false}, {"id": "P-46", "n": 46, "stem": "Consider this code, predict the result:\nFuture<String> fetchData() async {\nawait Future.delayed(Duration(seconds: 1));\nreturn \"Data loaded\";\n}\nvoid main() {\nprint(\"Start\");\nfetchData().then((value) => print(value));\nprint(\"End\");\n}\nWhat order is printed to console?", "opts": {"A": "Start, Data loaded, End", "B": "Start, End, Data loaded", "C": "Data loaded, Start, End", "D": "Start, End (never prints \"Data loaded\")"}, "ans": "B", "why": "Vì `fetchData()` **không được `await` trong `main()`**, nó không chặn code phía sau; `.then()` cũng là bất đồng bộ → in `Start`, `End` trước, sau 1 giây mới in `Data loaded`. A, C sai thứ tự; D sai vì `Data loaded` cuối cùng vẫn được in.", "bs": false}, {"id": "P-47", "n": 47, "stem": "In Dart's switch-case, why is `break` (or `return`) usually needed after each case?", "opts": {"A": "Because Dart auto falls-through like C if there's no break, which can accidentally execute the next case", "B": "Because Dart requires this syntax to compile, unrelated to behavior", "C": "Because break is used to exit the main function", "D": "Dart doesn't support switch-case"}, "ans": "A", "why": "⚠️ Theo đáp án của đề: thiếu `break` có thể khiến chương trình **chạy lọt sang case kế tiếp (fall-through)** ngoài ý muốn — đó là lý do phải có `break`/`return` sau mỗi case. (Lưu ý thực tế: Dart **nghiêm hơn C** — với case không rỗng mà thiếu `break`, Dart báo **lỗi biên dịch** chứ không âm thầm fall-through.) B, C, D mô tả sai vai trò của `break`.", "bs": false}, {"id": "P-48", "n": 48, "stem": "In `List<int> nums = [1,2,3]; for(var x in nums) print(x);`, what is the main purpose of using `var` instead of `int` for variable `x`?", "opts": {"A": "`var` must be used because `int` would cause an error", "B": "Type inference — Dart automatically infers the data type (int) based on the List's elements, keeping code concise while still being strongly typed", "C": "`var` makes variable x fully dynamic with no type checking at all", "D": "No difference at all, it's just a coding habit"}, "ans": "B", "why": "**`var` để Dart tự suy ra kiểu (ở đây là `int`)** từ phần tử của List — code ngắn gọn mà vẫn giữ kiểu chặt. A sai vì viết `int` cũng đúng; C sai vì `var` khác `dynamic` (var có kiểu cố định sau khi suy luận); D sai vì có khác biệt ở cơ chế suy luận kiểu.", "bs": false}, {"id": "P-49", "n": 49, "stem": "According to the lecture, what common pitfall is emphasized for students new to Dart?", "opts": {"A": "Forgetting to close a class's curly braces", "B": "Ignoring null-safety warnings and improperly mixing synchronous/asynchronous code", "C": "Using too many async functions causing incorrect parallel execution", "D": "Being unable to create a String-type variable"}, "ans": "B", "why": "Hai cái bẫy được nhấn mạnh cho người mới: **bỏ qua cảnh báo null-safety** và **trộn lẫn code đồng bộ/bất đồng bộ không đúng cách** (quên `await`, quên `async`). A, C, D không phải nội dung được nhấn mạnh.", "bs": false}, {"id": "P-50", "n": 50, "stem": "Consider the Student class and mini-lab:\nclass Student {\nString name;\nStudent(this.name);\n}\nvoid main() async {\nvar list = [Student(\"An\"), Student(\"Binh\")];\nawait Future.delayed(Duration(seconds: 1));\nlist.forEach((s) => print(s.name));\n}\nIf the `await` keyword before `Future.delayed(...)` is removed, what happens?", "opts": {"A": "The program will show a compile error due to missing await", "B": "`forEach` still prints student names in the correct order but may run before the 1-second delay finishes (since it no longer waits for the Future to complete), because `Future.delayed` without await is merely \"started\" without blocking execution", "C": "The program will crash because the Future is unhandled", "D": "The student list order will be reversed"}, "ans": "B", "why": "Không `await` `Future.delayed` khiến `main()` **chạy tiếp ngay các câu lệnh sau mà không chờ đủ 1 giây** — `forEach` vẫn in tên đúng thứ tự nhưng có thể chạy trước khi 'delay' kết thúc (ở đây vô hại vì không có gì phụ thuộc vào delay). A sai vì không phải lỗi biên dịch; C sai vì không crash; D sai vì thứ tự tên vẫn giữ nguyên.", "bs": false}]}, {"id": "P2", "kind": "exam", "chip": "Đề 2", "title": "Đề 2 — 50 câu (câu 51–102)", "questions": [{"id": "P-51", "n": 51, "stem": "What characterizes an abstract class in Dart?", "opts": {"A": "It cannot have any methods with a body", "B": "It defines structure without full behavior, forcing subclasses to implement the bodiless methods", "C": "Only usable inside the Flutter Framework, not in pure Dart", "D": "Can be instantiated directly with the `new` keyword"}, "ans": "B", "why": "**Abstract class định nghĩa cấu trúc mà không cài đặt đầy đủ hành vi**, buộc lớp con phải implement. A sai vì abstract class **vẫn có thể có method có body**; C sai vì nó là tính năng của Dart thuần; D sai vì abstract class **không thể** khởi tạo trực tiếp.", "bs": false}, {"id": "P-52", "n": 52, "stem": "In Flutter, `State<T>` is a textbook example of which concept from Module 3?", "opts": {"A": "Mixin", "B": "Abstract class — forcing StatefulWidgets to override methods to define behavior", "C": "Generic Constraint", "D": "Factory Constructor"}, "ans": "B", "why": "**`State<T>` là abstract class** — bạn kế thừa nó và override `build()`, `initState()`, `dispose()` để định nghĩa hành vi cho StatefulWidget. A, C, D không mô tả đúng bản chất của `State<T>`.", "bs": false}, {"id": "P-53", "n": 53, "stem": "Given the comparison table of `extends`, `implements`, `with`, which best describes `implements`?", "opts": {"A": "Inherits all available behavior from the parent class", "B": "Only inherits the \"signature\" of the class/interface, forcing you to rewrite all custom behavior — used to define a contract", "C": "Used to share reusable code blocks without an inheritance relationship", "D": "Not supported by Dart, only exists in Java"}, "ans": "B", "why": "**`implements` chỉ lấy signature (interface)**, buộc bạn **tự viết lại toàn bộ hành vi** — dùng như một bản hợp đồng. A mô tả `extends`; C mô tả `mixin`; D sai vì Dart hỗ trợ đầy đủ `implements`.", "bs": false}, {"id": "P-54", "n": 54, "stem": "Given this code, predict the result of calling `Eagle().fly()`:\nclass Bird {\nvoid fly() => print(\"Bird flying\");\n}\nclass Eagle implements Bird {\n@override\nvoid fly() => print(\"Eagle gliding\");\n}", "opts": {"A": "\"Bird flying\" because implements also inherits the method body", "B": "\"Eagle gliding\" — because implements only takes the interface (signature), Eagle must redefine fly() entirely itself", "C": "Compile error because Eagle has not defined a constructor", "D": "Both \"Bird flying\" and \"Eagle gliding\" are printed"}, "ans": "B", "why": "Vì `implements` **không kế thừa phần thân method**, `Eagle` phải định nghĩa lại `fly()` hoàn toàn → in `Eagle gliding`. A sai vì implements không thừa hưởng body; C sai vì ở đây không cần constructor; D sai vì chỉ một method được gọi.", "bs": false}, {"id": "P-55", "n": 55, "stem": "What is a mixin used for in Dart?", "opts": {"A": "Fully replaces constructors", "B": "Sharing behavior across multiple classes without a traditional inheritance chain", "C": "Used exclusively for JSON handling", "D": "A special kind of variable in Dart"}, "ans": "B", "why": "**Mixin dùng để chia sẻ hành vi cho nhiều class mà không cần chuỗi kế thừa** — trộn vào bằng `with`. Nhờ đó một class có thể gom nhiều nhóm hành vi từ nhiều mixin. A, C, D mô tả sai mục đích của mixin.", "bs": false}, {"id": "P-56", "n": 56, "stem": "Consider this constrained mixin code:\nclass Pet {\nString name;\nPet(this.name);\n}\nmixin CanBark on Pet {\nvoid bark() => print(\"$name says woof!\");\n}\nclass Dog extends Pet with CanBark {\nDog() : super(\"Buddy\");\n}\nclass Fish {\n// want to apply \"with CanBark\" here\n}\nIf class `Fish` (not extending `Pet`) tries to declare `class Fish with CanBark {}`, what happens?", "opts": {"A": "Compiles successfully, Fish will have a working bark() method", "B": "Compile error, because mixin `CanBark` is constrained `on Pet`, only classes extending Pet can apply this mixin", "C": "Compiles but throws a runtime error when calling bark()", "D": "Dart will automatically make Fish implicitly extend Pet"}, "ans": "B", "why": "**`mixin CanBark on Pet` giới hạn mixin chỉ được trộn vào class kế thừa `Pet`**; `Fish` không kế thừa `Pet` nên **lỗi biên dịch**. Ràng buộc `on` tồn tại để mixin truy cập an toàn thành viên của `Pet` (ví dụ `name`). A, C, D không đúng cách hoạt động của ràng buộc mixin.", "bs": false}, {"id": "P-57", "n": 57, "stem": "How does a factory constructor differ from a regular constructor in Dart?", "opts": {"A": "A factory constructor always creates a completely new object, with no exceptions", "B": "A factory constructor allows control over instance creation — it can return an existing instance (cache/singleton) or parse data (JSON) instead of always returning a new object", "C": "A factory constructor cannot be named", "D": "A factory constructor can only be used with an abstract class"}, "ans": "B", "why": "**Factory constructor kiểm soát việc tạo instance** — có thể trả về object đã có sẵn (cache/singleton), trả về subtype, hoặc dựng object từ dữ liệu — thay vì luôn tạo mới như constructor thường. A sai vì đây chính là điểm khác biệt; C, D sai về cú pháp/phạm vi.", "bs": false}, {"id": "P-58", "n": 58, "stem": "Given:\nclass User {\nfinal String name;\nfactory User.fromJson(Map j) => User._(j['name']);\nUser._(this.name);\n}\nWhy is the `User._` constructor made private (with `_`)?", "opts": {"A": "Because Dart requires every factory constructor to have an accompanying private constructor", "B": "To prevent code outside the class from directly calling the regular constructor, forcing usage through `User.fromJson` — controlling how objects are created", "C": "Because `_` is a required naming convention for JSON parsing", "D": "No particular reason, just a coding style choice"}, "ans": "B", "why": "Đặt constructor **private (`User._`) để chặn gọi trực tiếp từ bên ngoài**, buộc mọi nơi phải đi qua `User.fromJson` — nhờ đó kiểm soát được cách object được tạo và validate dữ liệu tập trung một chỗ. A, C, D không phải lý do chính xác trong mẫu factory này.", "bs": false}, {"id": "P-59", "n": 59, "stem": "What is the main benefit that generics (`List<T>`, `Future<T>`, `Map<K,V>`) bring in Dart?", "opts": {"A": "Makes the program run faster on the CPU", "B": "Ensures compile-time type safety, avoiding errors from misusing the dynamic type", "C": "Allows completely skipping data type declarations", "D": "Only works with primitive types (int, double)"}, "ans": "B", "why": "**Generics đảm bảo an toàn kiểu ở thời điểm biên dịch**, tránh lỗi do lạm dụng `dynamic` (lỗi chỉ lộ lúc chạy) mà vẫn tái sử dụng được cho nhiều kiểu. A, C, D mô tả sai lợi ích cốt lõi.", "bs": false}, {"id": "P-60", "n": 60, "stem": "Given this generic class code:\nclass Box<T> {\nT value;\nBox(this.value);\nvoid show() => print(\"Value = $value\");\n}\nvoid main() => Box<int>(10).show();\nIf `Box<int>(10)` is replaced with `Box<String>(10)`, what happens?", "opts": {"A": "Runs normally, prints \"Value = 10\"", "B": "Compile error because 10 is not a String, violating the generic type constraint", "C": "Dart automatically converts 10 to \"10\"", "D": "The program throws a runtime exception but still compiles"}, "ans": "B", "why": "**`Box<String>(10)` lỗi biên dịch** vì `10` là `int`, không khớp kiểu `String` đã khai báo — Dart kiểm tra generic rất chặt. A, C, D không khớp với cơ chế kiểm tra kiểu generic của Dart.", "bs": false}, {"id": "P-61", "n": 61, "stem": "Given this generic constraint:\nabstract class Animal { String sound(); }\nclass Cat extends Animal { sound() => \"Meow\"; }\nclass Box<T extends Animal> {\nT pet;\nBox(this.pet);\nvoid play() => print(pet.sound());\n}\nWhat does the `<T extends Animal>` syntax mean?", "opts": {"A": "Box can only hold the exact Animal type, no subclasses accepted", "B": "Restricts the generic type T to be Animal or a subclass of Animal, guaranteeing T always has a sound() method", "C": "This is invalid syntax, Dart doesn't support generic constraints", "D": "`extends` here means Box inherits from Animal"}, "ans": "B", "why": "**`<T extends Animal>` giới hạn T phải là `Animal` hoặc lớp con của nó**, nhờ vậy trình biên dịch chắc chắn `T` có method `sound()` và gọi được mà không cần ép kiểu. A sai vì lớp con vẫn được chấp nhận; C sai vì đây là cú pháp hợp lệ; D nhầm giữa **ràng buộc generic** với **kế thừa class**.", "bs": false}, {"id": "P-62", "n": 62, "stem": "What does collection-if / collection-for syntax allow in Dart?", "opts": {"A": "Only usable in a regular for loop, not in a List declaration", "B": "Flexibly building a List/Set/Map by inserting conditional elements (`if`) or generating elements from a loop (`for`) directly inside the collection declaration", "C": "Fully replaces the `var` keyword", "D": "Only applies to Map, not to List"}, "ans": "B", "why": "**Collection-if / collection-for** cho phép **chèn phần tử có điều kiện hoặc sinh phần tử bằng vòng lặp ngay bên trong khai báo collection** — thay vì phải viết code build danh sách riêng bên ngoài. A, C, D mô tả sai phạm vi áp dụng.", "bs": false}, {"id": "P-63", "n": 63, "stem": "Given:\nvar base = [1, 2, 3];\nvar list = [\n...base,\nif (true) 99,\nfor (var x in base) x * 10\n];\nprint(list);\nWhat is printed?", "opts": {"A": "[1, 2, 3, 99, 10, 20, 30]", "B": "[1, 2, 3, 10, 20, 30, 99]", "C": "[99, 1, 2, 3, 10, 20, 30]", "D": "Compile error because you cannot mix spread, if, and for in the same List"}, "ans": "A", "why": "`[...base, if(true) 99, for(x in base) x*10]` → trải `base` ra `1,2,3`, thêm `99` vì điều kiện đúng, rồi sinh `10,20,30` → **`[1, 2, 3, 99, 10, 20, 30]`**. B, C sai thứ tự; D sai vì Dart cho phép trộn các cú pháp này với nhau.", "bs": false}, {"id": "P-64", "n": 64, "stem": "What benefit does a Custom Exception in Dart (e.g. `class LoginException implements Exception`) offer over throwing an ordinary error string?", "opts": {"A": "No benefit, it just adds code complexity", "B": "Provides specific business-domain error context, making it easier to debug and handle logic at the UI/Repository layer", "C": "Custom Exceptions run faster than plain Strings", "D": "Custom Exceptions can only be used with external APIs, not internally"}, "ans": "B", "why": "**Custom Exception mang ngữ cảnh lỗi cụ thể theo nghiệp vụ** (ví dụ `LoginException` khác `NetworkException`), giúp `on ... catch` bắt đúng loại và tầng UI/Repository xử lý riêng từng trường hợp — dễ debug hơn nhiều so với ném `Exception` chung chung. A, C, D không đúng lợi ích thực tế.", "bs": false}, {"id": "P-65", "n": 65, "stem": "In Dart, which queue has HIGHER priority between the Microtask queue and the Event queue?", "opts": {"A": "The Event queue has higher priority, always running before the Microtask queue", "B": "The Microtask queue has higher priority — all microtasks run before Dart continues processing the Event queue (Futures, timers, UI events)", "C": "Both run in parallel, with no priority order", "D": "Priority depends on the declaration order in the code, not fixed"}, "ans": "B", "why": "**Microtask queue có độ ưu tiên CAO HƠN** — event loop luôn vét sạch toàn bộ microtask rồi mới lấy một item từ Event queue. A đảo ngược; C, D không đúng cơ chế event loop của Dart.", "bs": false}, {"id": "P-66", "n": 66, "stem": "Given this Future chaining code:\nFuture(() => 1)\n.then((v) => v + 1)\n.then((v) => print(v));\nWhat value is printed?", "opts": {"A": "1", "B": "2", "C": "0", "D": "Nothing is printed because await is missing"}, "ans": "B", "why": "`Future(() => 1).then((v) => v + 1).then((v) => print(v))` → giá trị 1 đi qua `.then` đầu thành `2`, `.then` thứ hai in ra → **in `2`**. A, C sai giá trị; D sai vì code vẫn chạy dù `main` không `await`.", "bs": false}, {"id": "P-67", "n": 67, "stem": "Comparing Future chaining (`.then()`) with `async/await`, which statement is most accurate?", "opts": {"A": "`.then()` and `async/await` are entirely incompatible, cannot be used together in a project", "B": "`.then()` suits simple async chains without needing intermediate variables; `async/await` makes async code read linearly, easier to follow when there are multiple dependent steps", "C": "`async/await` runs fully synchronously, no longer asynchronous", "D": "`.then()` is always faster than `async/await` in terms of performance"}, "ans": "B", "why": "**`.then()` hợp với chuỗi đơn giản; `async/await` giúp code đọc tuần tự, dễ hiểu khi các bước phụ thuộc nhau.** A sai vì hai cách hoàn toàn dùng chung được; C sai vì `async/await` vẫn là bất đồng bộ (không block thread); D không có căn cứ về hiệu năng tuyệt đối.", "bs": false}, {"id": "P-68", "n": 68, "stem": "How does `StreamController.broadcast()` differ from the default single-subscription Stream?", "opts": {"A": "Broadcast only allows exactly one listener", "B": "Broadcast allows multiple listeners to listen simultaneously and receive shared events, while single-subscription only allows one listener, consuming sequentially", "C": "No real difference, just a different name", "D": "Broadcast only works with String data types"}, "ans": "B", "why": "**`broadcast()` cho phép NHIỀU listener cùng nhận event**; stream mặc định (single-subscription) chỉ cho **một** listener. A đảo ngược; C, D không đúng đặc điểm của hai loại Stream.", "bs": false}, {"id": "P-69", "n": 69, "stem": "Given this StreamController.broadcast() code:\nvar c = StreamController<int>.broadcast();\nc.stream.listen((v) => print(\"A:$v\"));\nc.stream.listen((v) => print(\"B:$v\"));\nc..add(1)..add(2);\nWhat is printed, in order?", "opts": {"A": "A:1, A:2, B:1, B:2", "B": "A:1, B:1, A:2, B:2", "C": "Only A:1, A:2 are printed because listener B doesn't work", "D": "Error because StreamController.broadcast() doesn't support multiple listeners"}, "ans": "B", "why": "Với `c..add(1)..add(2)`, **mỗi lần `add` sẽ bắn tới cả hai listener trước khi sang lần add kế tiếp** → `A:1, B:1, A:2, B:2`. A sai thứ tự nhóm; C sai vì cả hai listener đều hoạt động; D sai vì broadcast hỗ trợ đầy đủ nhiều listener.", "bs": false}, {"id": "P-70", "n": 70, "stem": "What is the main purpose behind introducing the Repository Pattern in Module 3?", "opts": {"A": "Fully replaces Widgets in Flutter", "B": "Separates data-fetching logic from the presentation/UI layer, making code easier to test and maintain, and forming the foundation for Bloc/Provider/Riverpod", "C": "Only used for apps with no UI", "D": "A replacement for SQLite"}, "ans": "B", "why": "**Repository Pattern tách việc lấy dữ liệu ra khỏi UI**, giúp dễ test và dễ bảo trì — đồng thời là nền móng để dùng Bloc/Provider/Riverpod về sau. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-71", "n": 71, "stem": "Given this repository code using a Stream:\nStream<int> counter() async {\nfor (int i = 1; i <= 3; i++) {\nawait Future.delayed(Duration(milliseconds: 300));\nyield i;\n}\n}\nWhen this Stream is bound to `StreamBuilder(stream: repo.counter(), ...)`, how will the UI behave?", "opts": {"A": "The UI only builds once, after the entire loop finishes", "B": "The UI automatically rebuilds each time a new value is `yield`-ed, creating a real-time update effect", "C": "StreamBuilder doesn't support Streams generated from `async`", "D": "The app will freeze (block the UI thread) for a full 900ms"}, "ans": "B", "why": "**Mỗi lần `yield` một giá trị mới, `StreamBuilder` rebuild lại UI** → tạo hiệu ứng cập nhật thời gian thực. A sai vì StreamBuilder rebuild theo từng event; C sai vì StreamBuilder hỗ trợ đầy đủ `async*`; D sai vì `await` không block cả UI thread nhờ cơ chế bất đồng bộ.", "bs": false}, {"id": "P-72", "n": 72, "stem": "According to the \"Performance Best Practices\" section of Module 3, which practice is NOT recommended?", "opts": {"A": "Using const widgets to reduce rebuild cost", "B": "Running a heavy loop directly on the main isolate while building the UI", "C": "Using async functions for I/O operations", "D": "Using Isolates for heavy CPU tasks"}, "ans": "B", "why": "Điều **KHÔNG nên làm**: **chạy vòng lặp nặng ngay trên isolate chính trong lúc build UI** — sẽ làm rớt khung hình, app đơ. Việc nặng phải đẩy sang `compute()`/`Isolate.spawn()`. A, C, D đều là thực hành được khuyến nghị.", "bs": false}, {"id": "P-73", "n": 73, "stem": "In Dart, what is the core difference between an `abstract class` and an `implicit interface` (every class automatically has an interface)?", "opts": {"A": "No difference, the two concepts are the same", "B": "An abstract class can contain both bodied and bodiless methods and cannot be instantiated directly; while any regular class automatically defines an implicit interface that other classes can `implements`", "C": "Interfaces only exist in Java, Dart has no such concept", "D": "Abstract classes are always faster than interfaces at runtime"}, "ans": "B", "why": "**Abstract class có thể trộn method có body và không body, và không khởi tạo trực tiếp được**; còn **mọi class thường đều tự động có một implicit interface** để class khác `implements`. A sai vì hai khái niệm khác nhau rõ ràng; C sai vì Dart có khái niệm này qua implicit interface; D không có căn cứ về hiệu năng runtime.", "bs": false}, {"id": "P-74", "n": 74, "stem": "In the example `AnimationController implements Listenable` mentioned in the lecture, what does using `implements` instead of `extends` demonstrate?", "opts": {"A": "AnimationController copies all of Listenable's existing code", "B": "AnimationController only follows Listenable's contract and implements its own behavior, without inheriting existing implementation", "C": "AnimationController and Listenable are unrelated to each other", "D": "This is a syntax error, `extends` must be used"}, "ans": "B", "why": "Dùng `implements` nghĩa là **`AnimationController` chỉ cam kết tuân theo hợp đồng của `Listenable` và tự viết phần cài đặt của mình**, không thừa hưởng code sẵn có. A sai vì implements không sao chép code; C sai vì vẫn có quan hệ rõ ràng qua implements; D sai vì đây là cú pháp Dart hợp lệ.", "bs": false}, {"id": "P-75", "n": 75, "stem": "A student writes this Repository:\nclass Repo {\nFuture<String> getUser() async {\nawait Future.delayed(Duration(milliseconds: 300));\nreturn \"Anna\";\n}\n}\nand calls `var name = repo.getUser();` (without using `await`). What type and value will variable `name` have at the moment of assignment?", "opts": {"A": "Type String, value \"Anna\" immediately", "B": "Type Future<String>, a Future object still \"pending\" completion, not yet the actual String value", "C": "Type dynamic, value null", "D": "Compile error due to missing await"}, "ans": "B", "why": "Không có `await`, biến `name` mang kiểu **`Future<String>`** — là 'phiếu hẹn' chưa hoàn tất, chứ chưa phải chuỗi thật. In ra sẽ thấy `Instance of 'Future<String>'`. A, C, D không đúng hành vi của Future trong Dart.", "bs": false}, {"id": "P-76", "n": 76, "stem": "In Flutter, which widget acts as the \"backbone\" of a Material screen, providing AppBar, body, and FloatingActionButton?", "opts": {"A": "Container", "B": "Scaffold", "C": "MaterialApp", "D": "Column"}, "ans": "B", "why": "**`Scaffold` là khung xương của một màn hình Material**, cung cấp sẵn `appBar`, `body`, `floatingActionButton`, `drawer`, `bottomNavigationBar`. A, C, D không mô tả đúng vai trò cấu trúc này.", "bs": false}, {"id": "P-77", "n": 77, "stem": "A student places a `ListView` directly inside a `Column` without wrapping it in `Expanded` or `Flexible`. What common error occurs?", "opts": {"A": "The app runs completely normally, no issues", "B": "A \"RenderFlex overflow\" error or unbounded height constraint error, because both Column and ListView try to claim unlimited space along the main axis", "C": "The ListView automatically shrinks to exactly 1 item", "D": "The Column is completely hidden from the screen"}, "ans": "B", "why": "Đặt `ListView` thẳng trong `Column` mà không bọc `Expanded`/`Flexible` gây **lỗi chiều cao vô hạn (unbounded height) → overflow**. Lý do: Column cho con chiều cao không giới hạn, còn ListView lại muốn chiếm hết chiều cao có thể. A sai vì đây đúng là lỗi kinh điển; C, D không đúng hành vi thực tế của Flutter.", "bs": false}, {"id": "P-78", "n": 78, "stem": "In RadioListTile, what is the role of the `groupValue` property?", "opts": {"A": "Determines that particular radio button's own value", "B": "Holds the currently selected value for the entire group of RadioListTiles, used to compare against each item's `value` to determine selected state", "C": "Has no effect, purely decorative", "D": "Used to set the background color of RadioListTile"}, "ans": "B", "why": "**`groupValue` giữ giá trị đang được chọn của cả nhóm radio**, đem so với `value` của từng item — item nào khớp thì hiện là đã chọn. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-80", "n": 80, "stem": "What is the difference between `Slider` and `Switch` in Flutter?", "opts": {"A": "Slider selects a continuous value within a range, Switch only toggles a boolean value", "B": "Both are used for boolean values", "C": "Switch is for real numbers, Slider is for boolean", "D": "No functional difference"}, "ans": "A", "why": "**`Slider` chọn một giá trị liên tục trong một khoảng; `Switch` chỉ bật/tắt một giá trị boolean.** B, C, D mô tả sai hoặc đảo ngược chức năng hai widget.", "bs": false}, {"id": "P-81", "n": 81, "stem": "What does `ThemeMode.system` mean in `MaterialApp`?", "opts": {"A": "Forces the app to always use the light theme", "B": "Forces the app to always use the dark theme", "C": "The app automatically follows the device's OS-level light/dark appearance setting", "D": "Has no effect if darkTheme isn't declared"}, "ans": "C", "why": "**`ThemeMode.system` khiến app tự động theo cài đặt sáng/tối của hệ điều hành.** A, B là cố định một chế độ nên mâu thuẫn với chữ 'system'; D sai vì `themeMode` vẫn có tác dụng, chỉ là muốn hiệu quả đầy đủ thì phải khai báo cả `darkTheme`.", "bs": false}, {"id": "P-82", "n": 82, "stem": "Given:\nreturn MaterialApp(\ntheme: ThemeData.light(useMaterial3: true),\ndarkTheme: ThemeData.dark(useMaterial3: true),\nthemeMode: ThemeMode.dark,\nhome: const DemoTheme(),\n);\nInside a child widget, what is the correct syntax to access the current theme's style (e.g. `titleLarge`)?", "opts": {"A": "`ThemeData.of(context).textTheme.titleLarge`", "B": "`Theme.of(context).textTheme.titleLarge`", "C": "`context.theme.titleLarge`", "D": "`MaterialApp.theme(context).titleLarge`"}, "ans": "B", "why": "Cú pháp đúng để đọc theme hiện tại là **`Theme.of(context).textTheme.titleLarge`**. A, C, D không phải API hợp lệ của Flutter.", "bs": false}, {"id": "P-83", "n": 83, "stem": "How does `ListView.separated` differ from `ListView.builder`?", "opts": {"A": "`ListView.separated` doesn't support itemBuilder", "B": "`ListView.separated` allows inserting a separator widget between items via `separatorBuilder`, which `ListView.builder` lacks", "C": "`ListView.builder` only displays up to 10 items", "D": "The two are entirely identical in API"}, "ans": "B", "why": "**`ListView.separated` có thêm `separatorBuilder`** để chèn widget ngăn cách (thường là `Divider`) giữa các item. A sai vì nó vẫn có `itemBuilder`; C sai vì không có giới hạn 10 item; D sai vì hai API thực sự khác nhau.", "bs": false}, {"id": "P-84", "n": 84, "stem": "In the ListTile + CircleAvatar example:\nListTile(\nleading: CircleAvatar(child: Text(m['title']![0])),\ntitle: Text(m['title']!),\nsubtitle: Text(m['year']!),\ntrailing: const Icon(Icons.chevron_right),\nonTap: () => debugPrint('Selected ${m['title']}'),\n);\nWhat does the `!` after `m['title']` mean in the context of Dart's null-safety?", "opts": {"A": "Logical negation (NOT) operator", "B": "The \"null assertion\" operator — asserting to the compiler that the value is definitely non-null; if wrong, it throws a runtime error", "C": "This operator is purely decorative, no effect on logic", "D": "Converts a String type to int"}, "ans": "B", "why": "**`!` là toán tử null assertion** — bạn khẳng định với trình biên dịch rằng giá trị chắc chắn khác null; **nếu khẳng định sai thì ném lỗi lúc chạy**. A, C, D mô tả sai ý nghĩa của toán tử này trong null-safety.", "bs": false}, {"id": "P-85", "n": 85, "stem": "In the `showDatePicker` example, what are the `firstDate` and `lastDate` parameters used for?", "opts": {"A": "Determine the default current date", "B": "Restrict the valid date range the user can select on the calendar", "C": "No real effect, purely a required syntax parameter", "D": "Determine the date display format (dd/mm/yyyy or mm/dd/yyyy)"}, "ans": "B", "why": "**`firstDate` / `lastDate` giới hạn khoảng ngày hợp lệ** mà người dùng được chọn trên lịch (ngoài khoảng sẽ bị làm mờ). A, C, D mô tả sai chức năng hai tham số này.", "bs": false}, {"id": "P-86", "n": 86, "stem": "This code is used to pick a date:\nFuture<void> pickDate() async {\nfinal date = await showDatePicker(\ncontext: context,\ninitialDate: DateTime.now(),\nfirstDate: DateTime(2000),\nlastDate: DateTime(2100),\n);\nif (date != null) setState(() => selectedDate = date);\n}\nWhy is checking `if (date != null)` needed before calling `setState`?", "opts": {"A": "Because `showDatePicker` always returns null when working correctly", "B": "Because the user might cancel/dismiss the date-picker dialog, in which case the Future returns null, and you shouldn't setState with an unwanted null value", "C": "Because this is required Dart syntax for every async function", "D": "Because DateTime is never allowed to be null in Flutter"}, "ans": "B", "why": "Phải kiểm tra null vì **người dùng có thể bấm Cancel**, khi đó Future trả về `null` — và ta không nên `setState` với một giá trị null ngoài ý muốn. A, C, D không phải lý do thực sự.", "bs": false}, {"id": "P-87", "n": 87, "stem": "How does the `Wrap` widget differ from `Row`, and why does it suit a genre chip list?", "opts": {"A": "Wrap is identical to Row, no difference", "B": "Wrap automatically wraps child elements to a new line when there isn't enough horizontal space, avoiding the overflow error Row would encounter with too many elements", "C": "Wrap only allows a maximum of 2 child elements", "D": "Row auto-wraps but Wrap doesn't"}, "ans": "B", "why": "**`Wrap` tự xuống dòng khi hết chỗ theo chiều ngang**, còn `Row` thì tràn (overflow) — vì vậy danh sách chip thể loại (số lượng thay đổi) nên dùng `Wrap`. A, C, D mô tả sai hoặc đảo ngược đặc điểm hai widget.", "bs": false}, {"id": "P-88", "n": 88, "stem": "The lecture has this snippet:\nWidget tile(String t, String s) => Card(\nmargin: const EdgeInsets.symmetric(vertical: 6),\nchild: ListTile(title: Text(t), subtitle: Text(s)),\n);\nWhat is the main benefit of extracting repeated UI into a separate function/widget like `tile()`, in the spirit of \"Everything is a Widget\"?", "opts": {"A": "Makes Flutter run faster in absolute CPU terms", "B": "Reuse and organize UI into blocks (LEGO blocks), making code more readable, maintainable, and consistent in spacing", "C": "It's mandatory or Flutter will throw an error", "D": "No real benefit, just a coding style"}, "ans": "B", "why": "**Tách khối UI lặp lại thành một hàm/widget riêng** giúp tái sử dụng, code gọn, dễ đọc, dễ bảo trì và **khoảng cách/định dạng nhất quán** giữa các item. A, C, D không đúng lợi ích được nêu.", "bs": false}, {"id": "P-89", "n": 89, "stem": "According to general recommendations, `BottomNavigationBar` best fits apps with how many main navigation tabs?", "opts": {"A": "1 tab", "B": "2-5 tabs", "C": "10-15 tabs", "D": "No limit on the number"}, "ans": "B", "why": "`BottomNavigationBar` phù hợp nhất với **2–5 tab chính**. Nhiều hơn thì nên chuyển sang `Drawer` hoặc `TabBar` vì tab quá nhỏ, khó bấm. A, C, D không khớp con số khuyến nghị.", "bs": false}, {"id": "P-91", "n": 91, "stem": "What is the difference between `Image.network` and `Image.asset`?", "opts": {"A": "`Image.network` loads an image from an internet URL, `Image.asset` loads an image bundled within the project (declared in pubspec.yaml)", "B": "Both only load images from local storage", "C": "`Image.asset` only works on Web", "D": "`Image.network` doesn't support BoxFit"}, "ans": "A", "why": "**`Image.network` tải ảnh từ URL; `Image.asset` lấy ảnh đóng gói sẵn trong project** (đã khai báo trong `pubspec.yaml`). B, C, D mô tả sai chức năng hai widget ảnh.", "bs": false}, {"id": "P-92", "n": 92, "stem": "In Module 4's \"Common Errors & Fixes\" list, what is the common cause of the UI \"not updating\" after data changes?", "opts": {"A": "Network error", "B": "Forgetting to call `setState()` after changing a variable's value in a StatefulWidget", "C": "Missing Scaffold", "D": "Incorrect import syntax"}, "ans": "B", "why": "Nguyên nhân phổ biến nhất khiến UI 'không cập nhật' sau khi dữ liệu đổi là **quên gọi `setState()`** — đúng theo checklist 'Common Errors & Fixes'. A, C, D không phải nguyên nhân được nêu trong bài.", "bs": false}, {"id": "P-93", "n": 93, "stem": "In the Sectioned Home Screen code:\nbody: ListView(\npadding: const EdgeInsets.all(12),\nchildren: [\nsection('Now Playing'), const Placeholder(fallbackHeight: 120),\nsection('Trending'), const Placeholder(fallbackHeight: 120),\n],\n),\nWhy use `ListView` (instead of `Column`) as the root widget for an entire screen containing multiple sections?", "opts": {"A": "Because ListView is mandatory inside every Scaffold", "B": "Because ListView automatically allows scrolling when content exceeds screen height, while Column by default cannot scroll and easily causes overflow", "C": "Because Column doesn't support padding", "D": "No technical reason, it's a random choice"}, "ans": "B", "why": "Dùng **`ListView` để nội dung cuộn được khi vượt quá chiều cao màn hình**; `Column` mặc định không cuộn nên rất dễ overflow. A, C, D không đúng lý do kỹ thuật.", "bs": false}, {"id": "P-94", "n": 94, "stem": "According to the lecture, what are Material Icons in Flutter commonly used for?", "opts": {"A": "Purely decorative, no function", "B": "Navigation buttons, action buttons (add, delete), and status indicators", "C": "Only used as a Scaffold background", "D": "Completely replaces the Text widget"}, "ans": "B", "why": "**Material Icons dùng cho nút điều hướng, nút hành động và biểu tượng trạng thái** — bộ icon dựng sẵn theo chuẩn Material. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-95", "n": 95, "stem": "Comparing `TimePicker` (`showTimePicker`) and `DatePicker` (`showDatePicker`) in the context of building a booking flow combining both date and time: what is the correct approach per the lecture?", "opts": {"A": "Only call one of the two, Flutter will automatically infer the other value", "B": "Call two separate async functions sequentially (`pickDate()` and `pickTime()`), store the results in two separate State variables (`DateTime? d`, `TimeOfDay? t`), then display them combined in the UI", "C": "Use a single built-in `DateTimePicker` widget in the Flutter SDK", "D": "It's impossible to combine DatePicker and TimePicker on the same screen"}, "ans": "B", "why": "Cách làm đúng: **gọi `pickDate()` rồi `pickTime()` lần lượt, lưu kết quả vào hai biến State riêng, sau đó ghép lại để hiển thị** — đúng như demo Booking. A, C, D không phản ánh cách triển khai đã dạy.", "bs": false}, {"id": "P-96", "n": 96, "stem": "In VS Code, what does the \"Wrap with Widget\" feature support for a Flutter developer?", "opts": {"A": "Automatically deploy the app to a store", "B": "Quickly wrap a selected widget with another widget like Padding, Center, Expanded to refactor layout", "C": "Automatically fix all syntax errors in the file", "D": "Convert Dart to Kotlin"}, "ans": "B", "why": "**'Wrap with Widget' bọc nhanh widget đang chọn bằng `Padding`/`Center`/`Expanded`…** để refactor bố cục mà không phải gõ tay và canh dấu ngoặc. A, C, D không đúng chức năng tính năng này.", "bs": false}, {"id": "P-97", "n": 97, "stem": "In a basic Scaffold example, where is `floatingActionButton` typically placed and what is it used for?", "opts": {"A": "In the middle of the screen, as a background for the whole body", "B": "Usually floats in the bottom-right corner of the screen, used for a prominent primary action (e.g. add new)", "C": "Only displayed inside the AppBar", "D": "No fixed position, always centered in the AppBar"}, "ans": "B", "why": "**`floatingActionButton` thường nổi ở góc dưới bên phải, dùng cho hành động chính nổi bật** của màn hình (ví dụ 'Thêm mới'). A, C, D mô tả sai vị trí/vai trò.", "bs": false}, {"id": "P-98", "n": 98, "stem": "A student writes:\nclass DemoTheme extends StatelessWidget {\n@override\nWidget build(BuildContext context) {\nreturn Scaffold(\nbody: Center(child: Text('Current theme', style: Theme.of(context).textTheme.titleLarge)),\n);\n}\n}\nWhat role does `BuildContext context` in the `build` function play when calling `Theme.of(context)`?", "opts": {"A": "A parameter with no real effect, purely formal", "B": "Represents the widget's position in the widget tree, allowing it to look up the nearest InheritedWidget data (like Theme) above it in the tree", "C": "A global variable storing app state", "D": "Only used to pass API data"}, "ans": "B", "why": "**`BuildContext` đại diện cho vị trí của widget trong cây**, nhờ đó tìm được `InheritedWidget` gần nhất phía trên (như `Theme`, `MediaQuery`). A, C, D mô tả sai vai trò của BuildContext.", "bs": false}, {"id": "P-99", "n": 99, "stem": "According to Module 4, when should `SingleChildScrollView` or `Flexible` be used to fix overflow on small screens?", "opts": {"A": "Never needed, Flutter automatically handles overflow", "B": "When UI content exceeds the available screen size (especially on small screens), you need scrolling or flexible resizing to avoid layout overflow", "C": "Only used for apps running on Desktop", "D": "Only applicable to the Text widget"}, "ans": "B", "why": "Dùng `SingleChildScrollView` hoặc `Flexible` **khi nội dung vượt quá kích thước màn hình khả dụng** — để cho cuộn hoặc co giãn linh hoạt, tránh overflow. A sai vì Flutter không tự xử lý mọi trường hợp tràn; C, D giới hạn sai phạm vi sử dụng.", "bs": false}, {"id": "P-100", "n": 100, "stem": "Consider Module 4's \"Practice Task\": build a movie list using `ListView.builder` + `ListTile`, where `onTap` needs to show `SnackBar(title)`. What is the correct way to call a SnackBar in Flutter?", "opts": {"A": "`Text(title).showSnackBar()`", "B": "`ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(title)))`", "C": "`Navigator.of(context).showSnackBar(title)`", "D": "`SnackBar.show(context, title)`"}, "ans": "B", "why": "Cách gọi đúng là **`ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(title)))`**. A, C, D không phải API hợp lệ của Flutter.", "bs": false}, {"id": "P-101", "n": 101, "stem": "In Flutter, what does `Navigator.push()` do?", "opts": {"A": "Clears the entire navigation stack", "B": "Adds (pushes) a new route/screen onto the top of the navigation stack", "C": "Goes back to the previous screen", "D": "Closes the app"}, "ans": "B", "why": "**`Navigator.push()` đẩy một route mới lên đỉnh ngăn xếp điều hướng** — màn hình mới che màn hình cũ, và Back sẽ quay lại màn hình cũ. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-102", "n": 102, "stem": "What does the `Navigator.pop(context)` method do?", "opts": {"A": "Pushes another new screen onto the stack", "B": "Removes (pops) the screen currently at the top of the stack, revealing the screen below it", "C": "Replaces the entire stack with a new route", "D": "Restarts the app from scratch"}, "ans": "B", "why": "**`Navigator.pop(context)` gỡ màn hình trên cùng khỏi stack**, để lộ màn hình bên dưới; có thể kèm giá trị trả về cho màn hình trước. A, C, D mô tả sai hành vi này.", "bs": false}]}, {"id": "P3", "kind": "exam", "chip": "Đề 3", "title": "Đề 3 — 50 câu (câu 103–152)", "questions": [{"id": "P-103", "n": 103, "stem": "Given:\nElevatedButton(\nonPressed: () {\nNavigator.push(\ncontext,\nMaterialPageRoute(builder: (_) => SecondPage()),\n);\n},\nchild: Text('Go to Second Page'),\n)\nAccording to the lecture's explanation of why this original code doesn't run directly on DartPad, what is the main cause?", "opts": {"A": "DartPad doesn't support ElevatedButton", "B": "Missing a complete program structure: DartPad requires `main()`, `runApp()`, and a root `MaterialApp`; providing only a lone widget like this without a valid Navigator context (e.g. SecondPage undefined, or missing the surrounding MaterialApp) causes an error", "C": "Navigator.push only works on real devices, not on DartPad", "D": "MaterialPageRoute is an API that has been removed from Flutter"}, "ans": "B", "why": "DartPad cần **cấu trúc đầy đủ (`main`, `runApp`, `MaterialApp`)**; thiếu chúng — hoặc tham chiếu class chưa định nghĩa như `SecondPage` — sẽ báo lỗi. A, C, D không khớp với giải thích trong bài.", "bs": false}, {"id": "P-104", "n": 104, "stem": "What is the difference between `Navigator.push()` and `Navigator.pushReplacement()`?", "opts": {"A": "No difference", "B": "`push()` adds a new route on top of the current one (the old route stays in the stack), while `pushReplacement()` replaces the current route with a new one (the old route is removed from the stack)", "C": "`pushReplacement()` can only be used with named routes", "D": "`push()` doesn't allow going back with the back button"}, "ans": "B", "why": "**`push()` GIỮ màn hình cũ trong stack** (Back quay lại được); **`pushReplacement()` XÓA màn hình cũ** khi thêm màn hình mới. A sai vì có khác biệt rõ ràng; C, D không đúng đặc điểm kỹ thuật.", "bs": false}, {"id": "P-105", "n": 105, "stem": "In a login flow, a developer uses `Navigator.pushReplacementNamed(context, '/home')` instead of `Navigator.pushNamed(context, '/home')` after a successful login. What is the most reasonable reason for this choice?", "opts": {"A": "`pushReplacementNamed` runs faster in terms of performance", "B": "It prevents the user from pressing Back to return to the Login screen after successfully logging in, since the Login route has been removed from the stack", "C": "`pushNamed` doesn't support passing parameters", "D": "There's no real difference between the two calls"}, "ans": "B", "why": "Dùng `pushReplacementNamed` để **người dùng không bấm Back quay lại màn hình Login** — vì route Login đã bị gỡ khỏi stack. Đây là chuẩn mực cho luồng đăng nhập. A, C, D không phải lý do đúng.", "bs": false}, {"id": "P-106", "n": 106, "stem": "What benefit do Named Routes in Flutter bring over calling `MaterialPageRoute` directly everywhere?", "opts": {"A": "Named Routes run faster at runtime", "B": "They increase readability and scalability in large apps, especially when parameters need to be passed or many screens need centralized management", "C": "Named Routes are the only way Flutter supports navigation", "D": "Named Routes only work with Navigator 2.0"}, "ans": "B", "why": "**Named Routes giúp code dễ đọc và dễ mở rộng trong app lớn** — khai báo tập trung một chỗ, truyền tham số qua `arguments`, không phải rải `MaterialPageRoute` khắp nơi. A, C, D không đúng lợi ích thực tế.", "bs": false}, {"id": "P-107", "n": 107, "stem": "What is the core difference between Navigator 1.0 and Navigator 2.0?", "opts": {"A": "Navigator 1.0 uses a declarative model, Navigator 2.0 uses an imperative model", "B": "Navigator 1.0 is imperative — manually calling push()/pop(); Navigator 2.0 is declarative — describing the desired stack state and letting the framework sync automatically", "C": "Both are entirely identical, just different names across Flutter versions", "D": "Navigator 2.0 doesn't support deep linking, only Navigator 1.0 does"}, "ans": "B", "why": "**Navigator 1.0 là mệnh lệnh (imperative)** — bạn tự gọi `push`/`pop`; **Navigator 2.0 là khai báo (declarative)** — bạn mô tả stack mong muốn, framework tự đồng bộ. A đảo ngược; C, D không đúng đặc điểm hai phiên bản.", "bs": false}, {"id": "P-108", "n": 108, "stem": "What are the three main components in Navigator 2.0's architecture, as mentioned in the lecture?", "opts": {"A": "Router, Controller, View", "B": "RouterDelegate, RouteInformationParser, BackButtonDispatcher", "C": "Navigator, Route, Stack", "D": "Provider, Consumer, ChangeNotifier"}, "ans": "B", "why": "Ba thành phần chính của Navigator 2.0: **`RouterDelegate`, `RouteInformationParser`, `BackButtonDispatcher`** — đúng như slide. A, C, D không phải tên đúng của các thành phần này.", "bs": false}, {"id": "P-109", "n": 109, "stem": "What does deep linking in Flutter allow?", "opts": {"A": "Increases app build speed", "B": "Lets the user open a specific screen in the app directly via a URL or external source (e.g. a web link or notification)", "C": "Only applicable to apps running on Web", "D": "A feature that fully replaces SharedPreferences"}, "ans": "B", "why": "**Deep linking cho phép mở thẳng một màn hình cụ thể trong app từ một URL/nguồn bên ngoài** (thông báo, tin nhắn, trình duyệt). A, C, D mô tả sai mục đích của deep linking.", "bs": false}, {"id": "P-110", "n": 110, "stem": "In an Android deep link configuration, where does the following XML snippet belong and what does it mean?\n<intent-filter>\n<action android:name=\"android.intent.action.VIEW\" />\n<category android:name=\"android.intent.category.DEFAULT\" />\n<category android:name=\"android.intent.category.BROWSABLE\" />\n<data android:scheme=\"movieapps\" android:host=\"movies\" />\n</intent-filter>", "opts": {"A": "In `pubspec.yaml`, used to declare a dependency", "B": "In `AndroidManifest.xml`, declaring an intent-filter so the Android OS recognizes and routes links like `movieapps://movies` to the correct app", "C": "In `main.dart`, used to define a Flutter route", "D": "In `Info.plist`, only applicable to iOS"}, "ans": "B", "why": "Đoạn XML này đặt trong **`AndroidManifest.xml`**, khai báo `intent-filter` để Android biết chuyển các link khớp mẫu về cho app này xử lý. A, C, D là vị trí file sai.", "bs": false}, {"id": "P-111", "n": 111, "stem": "On iOS, to support a custom URL scheme (e.g. `movieapps://`), where does the configuration need to be added?", "opts": {"A": "AndroidManifest.xml", "B": "build.gradle", "C": "Info.plist (add URL Types → URL Schemes)", "D": "pubspec.yaml"}, "ans": "C", "why": "Trên iOS, cấu hình custom URL scheme (ví dụ `movieapps://`) đặt trong **`Info.plist`** (mục URL Types → URL Schemes). A, B, D không phải nơi chứa cấu hình này.", "bs": false}, {"id": "P-112", "n": 112, "stem": "What is the basic difference between `StatelessWidget` and `StatefulWidget`?", "opts": {"A": "StatelessWidget can change its UI more flexibly than StatefulWidget", "B": "StatelessWidget holds no mutable internal state and doesn't rebuild when internal data changes; StatefulWidget holds state (a State object) and can rebuild via `setState()`", "C": "Only StatelessWidget has a `build()` method", "D": "StatefulWidget is not allowed to contain child widgets"}, "ans": "B", "why": "**`StatelessWidget` không có state thay đổi được và không tự rebuild**; **`StatefulWidget` giữ một object `State` và rebuild qua `setState()`**. A, C, D mô tả sai đặc điểm cơ bản của hai loại widget.", "bs": false}, {"id": "P-113", "n": 113, "stem": "Given this CounterPage code using `setState`:\nclass _CounterPageState extends State<CounterPage> {\nint count = 0;\nvoid increment() {\nsetState(() { count++; });\n}\n...\n}\nIf replaced with just `count++;` WITHOUT calling `setState()`, what happens?", "opts": {"A": "`count`'s value still correctly increases in memory, but Flutter won't know to rebuild the widget, so the UI's displayed count doesn't change", "B": "The app throws an immediate compile error", "C": "The UI still automatically updates because Flutter always tracks every variable in State", "D": "The count value resets to 0 every time it rebuilds"}, "ans": "A", "why": "Không gọi `setState`, biến `count` **vẫn tăng trong bộ nhớ nhưng Flutter không biết để rebuild** → màn hình vẫn hiện số cũ. B sai vì không có lỗi biên dịch; C sai vì Flutter không tự theo dõi mọi biến; D sai vì `count` không bị reset.", "bs": false}, {"id": "P-114", "n": 114, "stem": "What does \"Lifting State Up\" mean in Flutter?", "opts": {"A": "Removing all state from the app", "B": "Moving shared state up to a common ancestor widget so child widgets can access and sync data, reducing duplicated logic", "C": "Moving all UI logic to the server side", "D": "Only applicable when using Provider"}, "ans": "B", "why": "**'Lifting State Up' = đưa state dùng chung lên widget tổ tiên chung** của các widget cần nó, để giảm trùng lặp logic và luồng dữ liệu rõ ràng hơn (dữ liệu đi xuống, sự kiện đi lên). A, C, D mô tả sai khái niệm này.", "bs": false}, {"id": "P-115", "n": 115, "stem": "Given this `InheritedWidget` code:\nclass AppData extends InheritedWidget {\nfinal String theme;\nconst AppData({required this.theme, required Widget child, Key? key})\n: super(key: key, child: child);\nstatic AppData of(BuildContext context) =>\ncontext.dependOnInheritedWidgetOfExactType<AppData>()!;\n}\nWhat is the main purpose of `InheritedWidget` in this example?", "opts": {"A": "Only used to define navigation routes", "B": "Efficiently passing data down to all child widgets in the widget tree without manually passing parameters through every intermediate constructor", "C": "Fully replaces Scaffold", "D": "Only used for storing offline data"}, "ans": "B", "why": "**`InheritedWidget` truyền dữ liệu xuống cây widget một cách hiệu quả mà không phải chuyền tay qua từng constructor** — con cháu lấy bằng `context.dependOnInheritedWidgetOfExactType()`. Đây là nền tảng của `Theme`, `MediaQuery`, `Provider`. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-116", "n": 116, "stem": "What foundation does `Provider` (ChangeNotifierProvider + Consumer) build on in Flutter, and what benefit does it bring over plain InheritedWidget?", "opts": {"A": "Built on SQLite, helps store offline data", "B": "Built on top of InheritedWidget but reduces boilerplate code, making state sharing and listening much easier", "C": "Unrelated to InheritedWidget at all", "D": "Provider only works with the String data type"}, "ans": "B", "why": "**`Provider` xây TRÊN `InheritedWidget`** nhưng **giảm rất nhiều boilerplate** khi chia sẻ và lắng nghe state (không phải tự viết `updateShouldNotify`, `of(context)`…). A, C, D không đúng nền tảng kỹ thuật thật của Provider.", "bs": false}, {"id": "P-117", "n": 117, "stem": "Given this Provider code:\nclass CounterModel with ChangeNotifier {\nint count = 0;\nvoid increment() { count++; notifyListeners(); }\n}\nIf the `notifyListeners();` line is removed from `increment()`, what happens?", "opts": {"A": "The program shows a compile error", "B": "`count` still increases in memory, but `Consumer<CounterModel>` widgets won't be notified to rebuild, so the UI doesn't show the new value", "C": "`notifyListeners()` has no effect on the UI, it's just an internal log", "D": "The app automatically calls notifyListeners() silently every second"}, "ans": "B", "why": "Không gọi `notifyListeners()`, `count` **vẫn tăng trong bộ nhớ nhưng các `Consumer` không được báo để rebuild** → UI không đổi. Đây là lỗi kinh điển khi dùng `ChangeNotifier`. A, C, D mô tả sai hành vi này.", "bs": false}, {"id": "P-118", "n": 118, "stem": "In this code combining Navigation and State:\nif (appState.loggedIn)\nNavigator.pushNamed(context, '/dashboard');\nelse\nNavigator.pushNamed(context, '/login');\nWhat principle does this code illustrate?", "opts": {"A": "State is completely separate and unrelated to navigation", "B": "App state determines the navigation flow — combining state management logic with the decision of which route to display", "C": "This is incorrect code because if/else cannot be used with Navigator", "D": "Only works when using Navigator 2.0"}, "ans": "B", "why": "Đoạn code minh họa việc **state quyết định luồng điều hướng** — kết hợp logic trạng thái với quyết định chọn route (đã đăng nhập thì vào dashboard, chưa thì vào login). A, C, D mô tả sai ý nghĩa/tính hợp lệ của đoạn code.", "bs": false}, {"id": "P-119", "n": 119, "stem": "In the Stateless/Stateful comparison table, which usage example fits StatelessWidget?", "opts": {"A": "An input form with validation", "B": "A counter that increases/decreases with user interaction", "C": "A static logo, unchanging text", "D": "A list where items can be added/removed"}, "ans": "C", "why": "**Logo tĩnh / đoạn chữ không đổi** hợp với `StatelessWidget` vì không cần rebuild. A, B, D đều có trạng thái thay đổi nên phải dùng `StatefulWidget`.", "bs": false}, {"id": "P-120", "n": 120, "stem": "In Navigator 2.0, which component's role does the following code illustrate?\nclass AppRouterDelegate extends RouterDelegate<AppRoute>\nwith ChangeNotifier, PopNavigatorRouterDelegateMixin<AppRoute> {\n@override\nWidget build(BuildContext context) {\nreturn Navigator(\npages: [MaterialPage(child: HomePage())],\nonPopPage: (route, result) => route.didPop(result),\n);\n}\n}", "opts": {"A": "RouteInformationParser — responsible for parsing the URL", "B": "RouterDelegate — responsible for building the current page stack (`pages`) and handling pop events, reflecting the desired navigation state", "C": "BackButtonDispatcher — only handles the Android physical back button", "D": "This is just a regular StatelessWidget unrelated to navigation"}, "ans": "B", "why": "Đoạn code minh họa **`RouterDelegate`** — nó dựng ngăn xếp trang hiện tại và xử lý sự kiện pop. A, C, D gán nhầm vai trò cho thành phần khác của Navigator 2.0.", "bs": false}, {"id": "P-121", "n": 121, "stem": "In the MovieDetailPage Hero Banner example:\nStack(\nchildren: [\nImage.network(movie.posterUrl, fit: BoxFit.cover),\nPositioned(bottom: 0, child: Container(height: 80, decoration: gradient)),\n],\n)\nWhy is `Stack` used instead of `Column` here?", "opts": {"A": "Because Stack runs faster than Column", "B": "Because Stack allows child widgets to overlap at the same position, needed to place a gradient layer over the poster image", "C": "Because Column doesn't support Image.network", "D": "No difference, the two widgets are entirely equivalent"}, "ans": "B", "why": "Dùng **`Stack` vì nó cho phép các con chồng lên nhau** — cần thiết để phủ lớp gradient (và chữ) lên trên ảnh poster. A, C, D không đúng lý do kỹ thuật của lựa chọn này.", "bs": false}, {"id": "P-122", "n": 122, "stem": "In the deep link handling flow via `onGenerateRoute`, what is the main purpose of this callback in `MaterialApp`?", "opts": {"A": "Only handles network errors", "B": "Allows the app to parse the route name (and parameters) coming from an external link, then dynamically return the corresponding route/screen, commonly used to handle deep links", "C": "Fully replaces Scaffold", "D": "Only works when the app is offline"}, "ans": "B", "why": "**`onGenerateRoute` phân tích tên route và tham số từ link bên ngoài rồi trả về màn hình tương ứng một cách động** — thường dùng cho deep link và route có tham số. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-123", "n": 123, "stem": "What does the `Route` class in Flutter represent?", "opts": {"A": "An API endpoint from a server", "B": "A screen/page in the app, usually implemented via `MaterialPageRoute`", "C": "A type of animation", "D": "A JSON data structure"}, "ans": "B", "why": "**`Route` đại diện cho một màn hình/trang trong app**, thường được hiện thực qua `MaterialPageRoute` (kèm hiệu ứng chuyển cảnh theo nền tảng). A, C, D mô tả sai khái niệm Route.", "bs": false}, {"id": "P-124", "n": 124, "stem": "In the \"Managing App State\" section with `ChangeNotifier`:\nclass AppState extends ChangeNotifier {\nbool loggedIn = false;\nvoid login() { loggedIn = true; notifyListeners(); }\n}\nWhy is separating state (login/logout) into its own class away from the UI considered good practice (per the instructor's note)?", "opts": {"A": "Because Flutter requires this to compile", "B": "Because separation increases testability and clarifies the app's architecture; the UI only needs to listen for changes instead of managing business logic itself", "C": "Because doing so makes the app run twice as fast", "D": "No specific reason, just the instructor's personal preference"}, "ans": "B", "why": "**Tách state ra riêng giúp dễ test và kiến trúc rõ ràng hơn** — UI chỉ việc lắng nghe và hiển thị, không ôm logic nghiệp vụ. A, C, D không phải lý do đúng/hợp lệ.", "bs": false}, {"id": "P-125", "n": 125, "stem": "According to Module 5's Summary, which state management techniques are covered, in order from basic to more advanced?", "opts": {"A": "Provider → InheritedWidget → setState", "B": "setState → InheritedWidget → Provider", "C": "Only setState is covered, no other technique is mentioned", "D": "BLoC → Riverpod → GetX"}, "ans": "B", "why": "Theo phần Summary, thứ tự từ cơ bản tới nâng cao là: **`setState` → `InheritedWidget` → `Provider`**. A đảo ngược thứ tự; C thiếu bước; D không phải trọng tâm của Module 5 (chỉ được nhắc qua như phần chuẩn bị ở Module 3).", "bs": false}, {"id": "P-126", "n": 126, "stem": "What is the core difference between \"Responsive UI\" and \"Adaptive UI\" per the lecture?", "opts": {"A": "Responsive UI changes based on device type, Adaptive UI changes based on available space", "B": "Responsive UI changes layout based on available space (e.g. Column → Row), while Adaptive UI changes based on device type (e.g. Bottom Nav → NavigationRail on tablet)", "C": "The two concepts are identical, no real difference", "D": "Adaptive UI only applies to Web apps"}, "ans": "B", "why": "**Responsive UI phản ứng theo KHÔNG GIAN có sẵn** (chiều rộng còn lại); **Adaptive UI phản ứng theo LOẠI THIẾT BỊ** (phone/tablet/desktop, Material vs Cupertino). A đảo ngược hai định nghĩa; C, D không khớp nội dung bài.", "bs": false}, {"id": "P-127", "n": 127, "stem": "What information does `MediaQuery.of(context).size.width` retrieve?", "opts": {"A": "The width of the current widget itself", "B": "The full width of the current device's screen", "C": "The width of the virtual keyboard", "D": "The number of child widgets in the tree"}, "ans": "B", "why": "**`MediaQuery.of(context).size.width` lấy chiều rộng TOÀN MÀN HÌNH của thiết bị**, không phải chiều rộng widget cha. A, C, D mô tả sai phạm vi giá trị trả về.", "bs": false}, {"id": "P-128", "n": 128, "stem": "Given:\nWidget build(BuildContext context) {\nfinal w = MediaQuery.of(context).size.width;\nreturn Scaffold(\nbody: Center(\nchild: Text(w < 600 ? \"Mobile Layout\" : \"Tablet Layout\"),\n),\n);\n}\nWhen the device is rotated from portrait to landscape, making the width exceed 600px, what happens to the displayed text?", "opts": {"A": "Nothing changes because MediaQuery only reads the value once at app startup", "B": "Flutter automatically rebuilds the widget when the screen size changes (e.g. due to rotation), so the text switches from \"Mobile Layout\" to \"Tablet Layout\"", "C": "The app crashes because MediaQuery doesn't support screen rotation", "D": "Only the Text is completely hidden until the app restarts"}, "ans": "B", "why": "**Flutter tự rebuild khi kích thước màn hình đổi** (xoay ngang/dọc, đổi cửa sổ) nên `MediaQuery` phản ánh giá trị mới theo thời gian thực. A, C, D không đúng hành vi thực tế của MediaQuery/Flutter.", "bs": false}, {"id": "P-129", "n": 129, "stem": "What is the core difference between `LayoutBuilder` and `MediaQuery`?", "opts": {"A": "LayoutBuilder provides information about the direct parent widget's constraints, while MediaQuery provides the entire device screen's info", "B": "Both are entirely identical in function", "C": "LayoutBuilder only works on Web", "D": "MediaQuery only provides the parent widget's constraints, not the full screen"}, "ans": "A", "why": "**`LayoutBuilder` cho biết ràng buộc (constraints) của widget CHA TRỰC TIẾP**; **`MediaQuery` cho thông tin TOÀN MÀN HÌNH**. Vì vậy trong một khung nhỏ lồng sâu, chỉ `LayoutBuilder` mới cho số liệu đúng. B, C, D đảo ngược/nói sai đặc điểm hai công cụ.", "bs": false}, {"id": "P-130", "n": 130, "stem": "Given:\nLayoutBuilder(\nbuilder: (context, c) {\nreturn c.maxWidth > 500 ? WideCard() : NarrowCard();\n},\n);\nIf this `LayoutBuilder` is placed inside a `Container` with a fixed width of 300px (while the device screen is 800px wide), which widget is displayed?", "opts": {"A": "WideCard(), because the device screen is wider than 500px", "B": "NarrowCard(), because `c.maxWidth` reflects the constraint from the direct parent widget (300px), not the full device screen", "C": "Both widgets will be displayed at the same time", "D": "This will cause an error because LayoutBuilder cannot be placed inside a fixed-size Container"}, "ans": "B", "why": "**`c.maxWidth` phản ánh ràng buộc của cha trực tiếp (300px)**, không phải chiều rộng màn hình → điều kiện `> 500` sai → hiện `NarrowCard()`. A bỏ qua vai trò của ràng buộc cục bộ; C, D không đúng cách LayoutBuilder hoạt động.", "bs": false}, {"id": "P-131", "n": 131, "stem": "What is `OrientationBuilder` used for?", "opts": {"A": "Detecting device rotation (portrait/landscape) and changing the UI accordingly", "B": "Only used to change the app's background color", "C": "Checking the device's network connection", "D": "Fully replaces MediaQuery in every case"}, "ans": "A", "why": "**`OrientationBuilder` phát hiện thiết bị đang dọc hay ngang** và cho phép đổi bố cục tương ứng (ví dụ GridView 2 cột khi dọc, 4 cột khi ngang). B, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-132", "n": 132, "stem": "In the \"Responsive Widgets Overview\" list, which widget helps avoid overflow by letting a child take up the remaining space in a Row/Column?", "opts": {"A": "Wrap", "B": "Expanded", "C": "AspectRatio", "D": "FractionallySizedBox"}, "ans": "B", "why": "**`Expanded` cho một con chiếm hết phần không gian còn lại** trong `Row`/`Column` → tránh tràn (overflow) khi nội dung dài. A, C, D phục vụ mục đích khác.", "bs": false}, {"id": "P-133", "n": 133, "stem": "Given this GridView code:\nGridView.count(\ncrossAxisCount: width < 600 ? 2 : 4,\n);\nIf the `width` variable is read ONCE in `initState()` instead of in `build()` (from MediaQuery), what problem could arise when the user rotates the screen afterward?", "opts": {"A": "No problem at all because Flutter automatically syncs initState with build", "B": "`crossAxisCount` won't be updated when the screen size changes (due to rotation), because initState only runs once when the widget is created, causing the layout to no longer reflect the current size", "C": "GridView will automatically hide completely", "D": "The app will show a compile error"}, "ans": "B", "why": "Đọc `width` **chỉ một lần trong `initState()`** khiến `crossAxisCount` **không cập nhật khi xoay màn hình**, vì `initState` chỉ chạy đúng một lần lúc tạo widget. Muốn phản ứng theo kích thước phải đọc trong `build()` hoặc dùng `LayoutBuilder`. A, C, D không đúng hệ quả kỹ thuật.", "bs": false}, {"id": "P-134", "n": 134, "stem": "What problem does `SafeArea` in Flutter solve on modern devices?", "opts": {"A": "Increases the app's rendering speed", "B": "Avoids UI content being obscured by unusable areas like notches, Dynamic Island, or curved screens", "C": "Encrypts user data", "D": "Automatically translates the UI language"}, "ans": "B", "why": "**`SafeArea` tránh cho nội dung bị che bởi notch / Dynamic Island / màn hình bo cong / thanh trạng thái** — nó tự thêm padding đúng bằng vùng bị lấn. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-135", "n": 135, "stem": "A student forgets to wrap a search bar in `SafeArea` on a device with a notch. What is the most likely real-world consequence?", "opts": {"A": "The app automatically crashes right at startup", "B": "Part of the search bar's top area may be obscured or clipped by the notch/status bar, harming the user experience", "C": "GridView automatically switches its layout to 2 columns", "D": "No effect at all, SafeArea is purely cosmetic and unnecessary"}, "ans": "B", "why": "Thiếu `SafeArea` khiến **phần trên của thanh tìm kiếm bị notch/status bar che hoặc cắt mất**, người dùng khó bấm — lỗi UX thực tế rất hay gặp. A, C, D không phản ánh đúng hệ quả thực tế.", "bs": false}, {"id": "P-136", "n": 136, "stem": "According to \"Using Breakpoints\" in the lecture, what layout-splitting rule based on width is proposed?", "opts": {"A": "< 400px: Small, 400-800px: Medium, > 800px: Large", "B": "< 100px: Small, 100-300px: Medium, > 300px: Large", "C": "Only 2 levels: Mobile and Desktop, no intermediate level", "D": "Breakpoint is always fixed at 1024px in every case"}, "ans": "A", "why": "Quy tắc breakpoint được đề xuất: **< 400px = Small, 400–800px = Medium, > 800px = Large** — đúng như slide. B, C, D không khớp các con số được nêu.", "bs": false}, {"id": "P-137", "n": 137, "stem": "In the Genre Chips example (Wrap-based chip list), the lecture emphasizes: \"This behavior is achieved automatically by using Wrap, without conditional logic.\" What does this mean technically?", "opts": {"A": "You need many `if` statements to check screen size then decide chips per row", "B": "The `Wrap` widget automatically calculates and wraps elements to a new line based on available space, without the developer writing manual conditional logic for responsiveness", "C": "Wrap only works correctly when combined with LayoutBuilder", "D": "This description is wrong, Wrap always needs accompanying conditional logic"}, "ans": "B", "why": "**`Wrap` tự tính toán và tự xuống dòng theo không gian còn lại**, không cần bạn viết logic điều kiện thủ công — đó chính là ý của câu trích dẫn. A, C, D không đúng ý câu nói.", "bs": false}, {"id": "P-138", "n": 138, "stem": "In the Responsive Movie Card example:\nLayoutBuilder(\nbuilder: (context, c) {\nfinal isWide = c.maxWidth > 600;\nreturn Row(children: [\nImage.network(poster, width: isWide ? 150 : 100),\nSizedBox(width: 16),\nExpanded(child: Text(title))\n]);\n},\n)\nWhat is the role of `Expanded` wrapping `Text(title)` in this Row?", "opts": {"A": "Makes the Text automatically bold", "B": "Lets the Text take up all remaining horizontal space after the image, while avoiding horizontal overflow when the title is long", "C": "Expanded is purely cosmetic, unrelated to layout", "D": "Expanded causes the image to shrink to match the Text's size"}, "ans": "B", "why": "**`Expanded` cho `Text` chiếm hết chiều ngang còn lại**, nhờ đó tiêu đề dài không gây tràn ngang trong `Row`. A, C, D mô tả sai vai trò kỹ thuật của Expanded ở đây.", "bs": false}, {"id": "P-139", "n": 139, "stem": "What is the difference between `Flexible` and `Expanded` in a Row/Column?", "opts": {"A": "No difference, the two widgets are entirely equivalent", "B": "`Expanded` forces a child to occupy the entire allocated space by flex ratio, while `Flexible` allows a child to be smaller than the allocated space if it doesn't need it all (depending on `fit: FlexFit.loose`)", "C": "Flexible can only be used inside GridView, not in Row/Column", "D": "Expanded only works with the Text widget"}, "ans": "B", "why": "**`Expanded` BUỘC lấp đầy toàn bộ phần flex được chia** (FlexFit.tight); **`Flexible` cho phép nhỏ hơn nếu không cần hết** (FlexFit.loose). Thực chất `Expanded` = `Flexible(fit: FlexFit.tight)`. A, C, D không đúng hành vi thật.", "bs": false}, {"id": "P-140", "n": 140, "stem": "In Lab 6.3 (Tablet Layout Enhancement), the requirement for screens > 800px is to add a sidebar filter and switch to a 2-column movie list. What technique is recommended to implement this at the screen's root level?", "opts": {"A": "Use `Wrap` alone, no other tool needed", "B": "Use `LayoutBuilder` at the root level to detect the width constraint, deciding whether to show the tablet layout (sidebar + 2 columns) or the mobile layout", "C": "Use `OrientationBuilder` instead of checking width", "D": "It's impossible to build a distinct tablet layout in Flutter"}, "ans": "B", "why": "Kỹ thuật được khuyến nghị là **dùng `LayoutBuilder` ở cấp gốc** để bắt ràng buộc chiều rộng rồi quyết định bố cục (thêm sidebar, chuyển GridView 2 cột). A, C, D không khớp kỹ thuật được khuyến nghị.", "bs": false}, {"id": "P-141", "n": 141, "stem": "What problem does the `AspectRatio` widget in the \"Responsive Widgets Overview\" list help solve?", "opts": {"A": "Helps images avoid being stretched/distorted when the container size changes, by maintaining a fixed aspect ratio", "B": "Speeds up loading images from the network", "C": "Only usable for video, not for images", "D": "Fully replaces BoxFit"}, "ans": "A", "why": "**`AspectRatio` giữ đúng tỉ lệ khung hình cố định** (ví dụ 16:9) nên ảnh không bị kéo méo khi kích thước container thay đổi. B, C, D không đúng phạm vi/chức năng.", "bs": false}, {"id": "P-142", "n": 142, "stem": "Consider: a sort Dropdown is placed inside a `Row` with `mainAxisSize: MainAxisSize.max` alongside other large fixed-size widgets, causing the total width to exceed a small screen. In the spirit of Module 6, what is the most reasonable solution?", "opts": {"A": "Completely remove the Dropdown from small screens", "B": "Wrap the flexible element (like the Dropdown or long text) with `Flexible`/`Expanded`, or use `Wrap` to auto-wrap to a new line when there isn't enough space", "C": "Always give every element in the Row an absolute fixed size", "D": "Convert the entire Row into a Stack"}, "ans": "B", "why": "Giải pháp đúng: **bọc phần tử co giãn bằng `Flexible`/`Expanded`, hoặc dùng `Wrap` để tự xuống dòng**. A, C, D không khớp nguyên tắc responsive đã dạy.", "bs": false}, {"id": "P-143", "n": 143, "stem": "Per Module 6's \"Best Practices,\" when should `Wrap` be prioritized over `Row`?", "opts": {"A": "When displaying a long chip list that could overflow horizontal space", "B": "When there's only exactly 1 child element", "C": "When you need a fixed widget that never changes size", "D": "`Wrap` should never be prioritized over Row"}, "ans": "A", "why": "Nên ưu tiên **`Wrap` cho danh sách chip dài có thể tràn theo chiều ngang** — vì nó tự xuống dòng thay vì báo overflow như `Row`. B, C, D không khớp best practice được nêu.", "bs": false}, {"id": "P-144", "n": 144, "stem": "Comparing using `MediaQuery.of(context).size.width` at the full-screen level versus `LayoutBuilder` at a deeply nested child widget level (e.g. inside a narrow Card within a 3-column Row). Which statement is most accurate?", "opts": {"A": "Both approaches always give identical results in every case", "B": "`MediaQuery` returns the device's full screen width even though the child widget is much more constrained by its parent, while `LayoutBuilder` accurately reflects the real space (constraint) the child widget actually has — so use LayoutBuilder when you need to respond to local space", "C": "LayoutBuilder cannot be used nested inside a Row", "D": "MediaQuery only works
