 inside a StatelessWidget"}, "ans": "B", "why": "**`MediaQuery` luôn trả chiều rộng TOÀN MÀN HÌNH bất kể ràng buộc cục bộ**; **`LayoutBuilder` phản ánh đúng không gian thực tế tại chỗ đó** — nên với widget lồng sâu phải dùng `LayoutBuilder`. A, C, D không đúng đặc điểm kỹ thuật đã phân tích.", "bs": false}, {"id": "P-145", "n": 145, "stem": "According to the lecture, which tool in Flutter Inspector helps debug responsive layout?", "opts": {"A": "Layout Explorer", "B": "Network Inspector", "C": "Memory Profiler", "D": "CPU Profiler"}, "ans": "A", "why": "**'Layout Explorer' trong Flutter Inspector** giúp debug bố cục responsive — xem trực quan constraints, flex, kích thước từng widget. B, C, D không phải công cụ dùng cho mục đích này.", "bs": false}, {"id": "P-146", "n": 146, "stem": "For an app running on small phones, large phones, tablets, and desktop, why does the lecture recommend \"Avoid fixed values\"?", "opts": {"A": "Because Flutter doesn't support fixed numbers in code", "B": "Because fixed values (e.g. absolute pixel width/height) don't adapt to diverse screen sizes, easily causing overflow or wasted space on other devices", "C": "Because fixed values increase the APK file size", "D": "No specific technical reason"}, "ans": "B", "why": "Khuyến nghị 'tránh giá trị cố định' vì **số pixel cứng không thích ứng được với muôn vàn kích thước màn hình** — dễ tràn ở máy nhỏ và thừa chỗ trống ở máy lớn. Nên dùng tỉ lệ, `Expanded`, `MediaQuery`. A, C, D không đúng lý do kỹ thuật.", "bs": false}, {"id": "P-147", "n": 147, "stem": "In the context of the responsive search bar:\nContainer(\npadding: EdgeInsets.symmetric(horizontal: 16),\nchild: TextField(...),\n)\nThe lecture notes \"Students often forget SafeArea here.\" If this is the first element in the Scaffold's `body` and has no SafeArea, what specific risk is most likely on a device with a notch?", "opts": {"A": "The TextField will be automatically disabled", "B": "The top of the search bar may be overlapped by the status bar/notch, making it hard for the user to tap the TextField accurately", "C": "The virtual keyboard will never appear", "D": "The app won't compile"}, "ans": "B", "why": "Thiếu `SafeArea` khiến **phần trên của thanh tìm kiếm bị status bar/notch đè lên**, người dùng bấm vào `TextField` không chính xác. A, C, D không phản ánh đúng rủi ro thực tế.", "bs": false}, {"id": "P-148", "n": 148, "stem": "What is `FractionallySizedBox` in the responsive widget list used for?", "opts": {"A": "Sizing a widget as a percentage relative to its parent widget, instead of a fixed pixel value", "B": "Only used for animations", "C": "Cropping rounded corners on a widget", "D": "Has no real function, purely illustrative in the slide"}, "ans": "A", "why": "**`FractionallySizedBox` đặt kích thước theo PHẦN TRĂM của widget cha** (ví dụ `widthFactor: 0.8` = 80% chiều rộng cha) thay vì số pixel cố định. B, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-149", "n": 149, "stem": "Why does the lecture encourage testing responsive UI across multiple device sizes (e.g. Pixel 2 → Pixel 7 → iPad) instead of just one single emulator?", "opts": {"A": "Because Flutter requires testing on at least 3 devices to submit an assignment", "B": "Because layout behavior (especially breakpoints, Wrap, GridView) can vary significantly across screen sizes, and overflow/misalignment bugs often only appear at specific sizes", "C": "Because each device runs a different version of Dart", "D": "No real reason, it's just an optional suggestion"}, "ans": "B", "why": "Cần test trên nhiều kích thước vì **bố cục có thể hành xử rất khác nhau giữa các cỡ màn hình, và bug thường chỉ lộ ra ở một cỡ cụ thể** (ví dụ chỉ tràn trên Pixel 2 nhỏ). A, C, D không đúng lý do kỹ thuật.", "bs": false}, {"id": "P-150", "n": 150, "stem": "Given:\nif (width < 600) return MobileView();\nreturn TabletView();\nIf this breakpoint logic is placed in the `build()` function of a deeply nested child widget inside multiple constrained `Padding`/`Container` layers, but `width` is taken from `MediaQuery.of(context).size.width` (full screen width) instead of `LayoutBuilder`, what is the potential consequence?", "opts": {"A": "No consequence at all because Flutter automatically syncs", "B": "The responsive decision could be wrong: the widget might incorrectly choose `TabletView` even though the actual local space it has is very narrow (because parent widgets have constrained the space), leading to overflow or an unsuitable layout", "C": "The app will always correctly show MobileView regardless of screen size", "D": "This is the only recommended way to write this in every case"}, "ans": "B", "why": "Dùng **chiều rộng toàn màn hình từ `MediaQuery` thay vì ràng buộc cục bộ từ `LayoutBuilder`** có thể dẫn tới **quyết định responsive sai** → tràn hoặc bố cục không phù hợp khi widget nằm trong khung hẹp lồng sâu. A, C, D không đúng hệ quả thực tế.", "bs": false}, {"id": "P-151", "n": 151, "stem": "When should you use `TextFormField` instead of a plain `TextField`?", "opts": {"A": "When you don't need any special functionality", "B": "When the input needs to be inside a `Form` and needs validation functionality", "C": "`TextFormField` can only be used for Web", "D": "There's no difference between the two widgets"}, "ans": "B", "why": "Dùng **`TextFormField` khi ô nhập nằm trong một `Form` và cần validate** — nó có thêm `validator`, `onSaved`, và tự đăng ký với `FormState`. `TextField` thường không có những thứ đó. A, C, D mô tả sai thời điểm sử dụng.", "bs": false}, {"id": "P-152", "n": 152, "stem": "What is `GlobalKey<FormState>` used for in a `Form`?", "opts": {"A": "Only used to set the form's color", "B": "Allows accessing and controlling the Form's state from outside, e.g. calling `validate()`, `save()`, `reset()` on all fields in the form", "C": "Syntactically required but has no real effect", "D": "Used to encrypt the entered data"}, "ans": "B", "why": "**`GlobalKey<FormState>` cho phép truy cập và điều khiển state của Form từ bên ngoài** — gọi `validate()`, `save()`, `reset()` qua `_formKey.currentState!`. A, C, D mô tả sai vai trò.", "bs": false}]}, {"id": "P4", "kind": "exam", "chip": "Đề 4", "title": "Đề 4 — 50 câu (câu 153–205)", "questions": [{"id": "P-153", "n": 153, "stem": "Given:\nvoid _submit() {\nfinal isValid = _formKey.currentState!.validate();\nif (!isValid) return;\n_formKey.currentState!.save();\nScaffoldMessenger.of(context).showSnackBar(\nSnackBar(content: Text('Signed up as $_name ($_email)')),\n);\n}\nIf the order is swapped, calling `_formKey.currentState!.save();` BEFORE calling `validate()`, what could happen?", "opts": {"A": "No difference, the call order doesn't matter", "B": "Invalid data could still be saved into state variables (`_name`, `_email`...) via `onSaved`, because save() doesn't itself check validity before saving — validate() must be called first to ensure only checked data gets saved", "C": "The app will show a compile error", "D": "save() will automatically call validate() implicitly before saving"}, "ans": "B", "why": "Gọi **`save()` TRƯỚC `validate()` có nguy cơ lưu dữ liệu chưa được kiểm tra** qua `onSaved`, vì bản thân `save()` không hề kiểm tra tính hợp lệ. Đúng thứ tự: validate → nếu hợp lệ mới save. A sai vì thứ tự có quan trọng; C sai vì không phải lỗi biên dịch; D sai vì `save()` không tự gọi `validate()`.", "bs": false}, {"id": "P-154", "n": 154, "stem": "What is the standard signature of a validator function in `TextFormField`?", "opts": {"A": "`void Function(String value)`", "B": "`String? Function(String? value)`", "C": "`bool Function(String value)`", "D": "`Future<String> Function(String? value)`"}, "ans": "B", "why": "Chữ ký chuẩn của validator là **`String? Function(String? value)`** — trả `null` nếu hợp lệ, trả chuỗi thông báo nếu lỗi. A, C, D không phải chữ ký chuẩn của Flutter Form.", "bs": false}, {"id": "P-155", "n": 155, "stem": "If a validator function returns `null`, what does that mean?", "opts": {"A": "The field is invalid, showing the error \"null\"", "B": "The field is valid, no error shown", "C": "The field has not been filled in by the user yet", "D": "The Form will automatically reset to its initial value"}, "ans": "B", "why": "**Validator trả về `null` nghĩa là ô nhập HỢP LỆ**, không hiện thông báo lỗi. Trả về một `String` mới là báo lỗi. A, C, D hiểu sai ý nghĩa giá trị trả về null.", "bs": false}, {"id": "P-156", "n": 156, "stem": "Given this password validator:\nString? _validatePassword(String? value) {\nfinal text = value ?? '';\nif (text.isEmpty) return \"Password is required\";\nif (text.length < 8) return \"Use at least 8 characters\";\nif (!text.contains(RegExp(r\"[0-9]\"))) return \"Include a number\";\nreturn null;\n}\nWith input `\"abcdefgh\"` (8 letters, no digits), what does the validator return?", "opts": {"A": "null (valid)", "B": "\"Password is required\"", "C": "\"Use at least 8 characters\"", "D": "\"Include a number\""}, "ans": "D", "why": "Với chuỗi 8 ký tự **toàn chữ cái**: qua được điều kiện 1 (không rỗng) và điều kiện 2 (đủ 8 ký tự), nhưng **thiếu chữ số** → trả về `\"Include a number\"`. A sai vì chuỗi không hợp lệ; B, C sai vì hai điều kiện đó đã thỏa.", "bs": false}, {"id": "P-157", "n": 157, "stem": "In this confirm-password code:\nString? _validateConfirmPassword(String? value) {\nif (value == null || value.isEmpty) return \"Please confirm password\";\nif (value != _password) return \"Passwords do not match\";\nreturn null;\n}\nThe lecture (per the instructor's note) recommends comparing confirm password against which variable, instead of comparing directly against another controller?", "opts": {"A": "Compare against the state variable `_password` already stored in State (instead of directly comparing two TextEditingControllers) to keep the code clean", "B": "Compare against the default value \"123456\"", "C": "No comparison needed at all, just check the length", "D": "Compare against the entered email"}, "ans": "A", "why": "Bài giảng khuyến nghị **so sánh với biến state `_password`** thay vì so trực tiếp giữa hai controller — code sạch hơn và tránh phụ thuộc vào vòng đời controller. B, C, D không khớp khuyến nghị.", "bs": false}, {"id": "P-158", "n": 158, "stem": "`AutovalidateMode` has three modes: `disabled`, `always`, and `onUserInteraction`. According to the lecture, which mode is recommended and why?", "opts": {"A": "`always` — because showing errors right away helps users be more careful", "B": "`disabled` — because never showing errors keeps the UI always clean", "C": "`onUserInteraction` — because it avoids showing red errors right from the start (annoying) while still responding promptly once the user starts interacting with that field, balancing \"too early\" and \"too late\"", "D": "No mode is recommended, it's arbitrary"}, "ans": "C", "why": "**`onUserInteraction` được khuyến nghị** vì nó cân bằng: không báo lỗi quá sớm (khó chịu khi user vừa bắt đầu gõ) và không quá muộn (khó hiểu vì lỗi chỉ hiện lúc bấm Submit). A, B, D không đúng chế độ/lý do được khuyến nghị.", "bs": false}, {"id": "P-159", "n": 159, "stem": "Per the \"Error Messages & UX\" section, which of the following error messages is a GOOD UX example?", "opts": {"A": "\"ERROR_400_INVALID_FIELD\"", "B": "\"Enter a valid email\"", "C": "\"Invalid!!!\"", "D": "\"Something went wrong somewhere\""}, "ans": "B", "why": "**'Enter a valid email'** là ví dụ UX tốt: ngắn, rõ, cụ thể, nói cho người dùng biết phải làm gì. A, C, D là ví dụ xấu (mã lỗi kỹ thuật, mơ hồ, không chỉ ra vấn đề).", "bs": false}, {"id": "P-160", "n": 160, "stem": "What is `FocusNode` combined with `textInputAction: TextInputAction.next` and `onFieldSubmitted` used for?", "opts": {"A": "Encrypting data entered into the field", "B": "Controlling the shift of focus to the next input field when the user presses \"Next\" on the keyboard, improving the mobile input experience", "C": "Completely hiding the keyboard when starting to type", "D": "Automatically filling in data from an API"}, "ans": "B", "why": "Bộ ba `FocusNode` + **`textInputAction: TextInputAction.next`** + `onFieldSubmitted` dùng để **chuyển focus sang ô kế tiếp khi người dùng bấm Next trên bàn phím** — trải nghiệm nhập liệu mượt hơn nhiều trên mobile. A, C, D mô tả sai mục đích.", "bs": false}, {"id": "P-161", "n": 161, "stem": "Consider the requirement: \"Tap outside the form → keyboard hides.\" What is the common implementation approach mentioned in the lecture?", "opts": {"A": "Call `Navigator.pop(context)` when the user taps outside", "B": "Wrap the form in a `GestureDetector` with `onTap` calling `FocusScope.of(context).unfocus()` (hiding the keyboard when tapping outside the input fields)", "C": "This cannot be done in Flutter", "D": "The keyboard can only be hidden with the physical Back button"}, "ans": "B", "why": "Cách làm phổ biến: **bọc form bằng `GestureDetector` và gọi `FocusScope.of(context).unfocus()` khi chạm ra ngoài** → bàn phím tự ẩn. A, C, D không khớp cách chuẩn đã dạy.", "bs": false}, {"id": "P-162", "n": 162, "stem": "Why should a long form be wrapped in `ListView` or `SingleChildScrollView`?", "opts": {"A": "To increase the app's loading speed", "B": "To avoid layout overflow errors when the virtual keyboard appears and covers part of the form on a small screen, while allowing scrolling to view all fields", "C": "Because Form is syntactically required to be inside a ListView", "D": "No specific reason"}, "ans": "B", "why": "Bọc form dài trong `ListView`/`SingleChildScrollView` để **tránh tràn khi bàn phím che mất một phần form trên màn hình nhỏ**, đồng thời cho phép cuộn tới ô đang nhập. A, C, D không đúng lý do thực tế.", "bs": false}, {"id": "P-164", "n": 164, "stem": "In the example above, if the user enters the email `\"taken123@test.com\"`, what message does the app show after 2 seconds?", "opts": {"A": "\"Account created for taken123@test.com\"", "B": "\"This email is already taken\"", "C": "No message is shown", "D": "The app will throw an exception because the email is invalid"}, "ans": "B", "why": "Logic `_email.toLowerCase().startsWith(\"taken\")` đúng với `\"taken123@test.com\"` → sau 2 giây hiện **\"This email is already taken\"**. A, C, D không khớp logic của đoạn code.", "bs": false}, {"id": "P-165", "n": 165, "stem": "In the \"From Form to Backend\" flow, what is the correct order of the data-processing process?", "opts": {"A": "Server response → Validation → POST Request → UI Update", "B": "UI Form → Local Validation → POST Request → Server processes → Response → UI Update", "C": "POST Request → UI Form → Validation → Response", "D": "UI Update → Validation → POST Request → UI Form"}, "ans": "B", "why": "Thứ tự đúng: **UI Form → Validate cục bộ → gửi POST → Server xử lý → Response → cập nhật UI**. Validate ở client trước để đỡ tốn request rác, nhưng server vẫn phải validate lại. A, C, D đảo sai trình tự.", "bs": false}, {"id": "P-166", "n": 166, "stem": "Why is checking `value == null || value.trim().isEmpty` (instead of just `value.isEmpty`) important in a required-field validator?", "opts": {"A": "Because `value` in a validator is always type `String` and can't be null, so a null check isn't needed", "B": "Because `value` has type `String?` (nullable) and the user could enter only whitespace; checking both null and the trimmed empty string prevents treating a whitespace-only string as valid", "C": "Because `trim()` automatically fixes spelling errors", "D": "There's no real difference at all"}, "ans": "B", "why": "Kiểm tra `value == null || value.trim().isEmpty` là cần thiết vì **`value` có kiểu nullable (`String?`)** và **người dùng có thể gõ toàn dấu cách** — nếu chỉ dùng `isEmpty` thì chuỗi `\"   \"` vẫn bị coi là hợp lệ. A sai vì `value` có thể null; C, D mô tả sai chức năng `trim()`/khác biệt thực sự.", "bs": false}, {"id": "P-167", "n": 167, "stem": "In Module 7's list of input widgets, when should you use `Checkbox`/`Switch`/`Radio` instead of `TextFormField`?", "opts": {"A": "When the data is a boolean or discrete choice, not free-form text", "B": "When you need to enter an email address", "C": "When you need to enter a long password", "D": "There's no suitable case for using these widgets"}, "ans": "A", "why": "Dùng `Checkbox`/`Switch`/`Radio` **khi lựa chọn là boolean hoặc tập giá trị rời rạc** (đồng ý điều khoản, bật/tắt thông báo, chọn 1 trong N) — không phải nhập văn bản tự do. B, C, D là những ca cần `TextFormField`.", "bs": false}, {"id": "P-168", "n": 168, "stem": "A student writes an email validator that only checks `text.contains(\"@\")`, skipping the dot (`.`) check. Per the logic taught (`!text.contains(\"@\") || !text.contains(\".\")`), what is the risk of omitting this check?", "opts": {"A": "No risk, checking `@` alone is enough to determine an absolutely valid email", "B": "A string like `\"abc@com\"` (missing the domain's dot) would still be considered valid despite not matching the basic email format the lecture requires checking", "C": "Dart will automatically add a dot if missing", "D": "The app will show a compile error if the dot check is missing"}, "ans": "B", "why": "Chỉ kiểm tra `contains(\"@\")` mà bỏ dấu chấm khiến chuỗi sai định dạng như **`\"abc@com\"` vẫn được coi là hợp lệ**, dù không đúng dạng email cơ bản đã dạy. A sai vì rủi ro là có thật; C, D không đúng hành vi của Dart.", "bs": false}, {"id": "P-169", "n": 169, "stem": "What does `formKey.currentState!.reset()` do?", "opts": {"A": "Removes the entire Form from the widget tree", "B": "Resets all fields in the form to their initial values and clears any existing error messages", "C": "Sends the data to the server", "D": "Only applies to the password field"}, "ans": "B", "why": "**`reset()` đưa mọi field về giá trị ban đầu và xóa hết thông báo lỗi** đang hiển thị. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-170", "n": 170, "stem": "What is the \"Multi-step wizard\" mentioned in \"Form Layout Patterns\"?", "opts": {"A": "A type of screen-transition animation", "B": "A layout pattern that splits a long form into multiple smaller steps/screens, reducing the feeling of being overwhelmed by too many fields on one screen", "C": "Only applicable to e-commerce apps", "D": "Another name for GlobalKey"}, "ans": "B", "why": "**'Multi-step wizard' chia một form dài thành nhiều bước/màn hình nhỏ**, giảm cảm giác choáng ngợp và tăng tỉ lệ hoàn thành. A, C, D mô tả sai khái niệm này.", "bs": false}, {"id": "P-171", "n": 171, "stem": "Consider this code illustrating a common bug:\nTextFormField(\nvalidator: (value) {\nif (value.isEmpty) return \"Required\"; // potential bug\nreturn null;\n},\n),\nWhat is the potential (null-safety) issue in this code?", "opts": {"A": "No issue at all, the code is entirely correct", "B": "The `value` parameter in the validator has type `String?` (nullable); calling `value.isEmpty` directly without a null check first can cause a runtime error if `value` is null", "C": "The validator's return type must be bool, not String", "D": "`isEmpty` doesn't exist in Dart, you must use `length == 0`"}, "ans": "B", "why": "**`value` có kiểu nullable (`String?`)** nên gọi thẳng `.isEmpty` mà không kiểm tra null có thể **ném lỗi lúc chạy** khi giá trị là null. Phải viết `value == null || value.isEmpty`. A sai vì đây là vấn đề thật; C, D nói sai về API/kiểu trả về của Dart.", "bs": false}, {"id": "P-172", "n": 172, "stem": "Per Demo 1 (Basic Signup Form), which fields are required and what are each field's specific validity conditions?", "opts": {"A": "Only a valid Email is needed, other fields aren't required", "B": "Name (not empty), Email (contains @ and .), Password (at least 6 characters) — all required", "C": "Only Password with a minimum of 6 characters is needed", "D": "There are no specific constraints, just not being empty"}, "ans": "B", "why": "Demo 1 yêu cầu: **Name (không được rỗng), Email (chứa `@` và `.`), Password (tối thiểu 6 ký tự)** — cả ba đều bắt buộc. A, C, D thiếu hoặc sai so với yêu cầu được nêu.", "bs": false}, {"id": "P-173", "n": 173, "stem": "What is `obscureText: true` in `TextFormField` used for?", "opts": {"A": "Completely hides the entire field from the UI", "B": "Masks the entered characters (e.g. showing dots) — typically used for password fields", "C": "Disables the ability to type into the field", "D": "Automatically encrypts the data before sending to the server"}, "ans": "B", "why": "**`obscureText: true` che ký tự vừa nhập** (hiện thành dấu chấm) — dùng cho ô mật khẩu. A, C, D mô tả sai chức năng này.", "bs": false}, {"id": "P-175", "n": 175, "stem": "In the combined demo example (Full Signup Demo), which feature is NOT mentioned as part of the combined demo?", "opts": {"A": "Show/hide password", "B": "Async email check with a loading button", "C": "Two-way sync with an SQLite database directly in the form", "D": "Focus management (Next/Done)"}, "ans": "C", "why": "Thứ **KHÔNG** có trong Full Signup Demo là **đồng bộ hai chiều với SQLite ngay trong form** — đó là nội dung Module 9, không phải Module 7. A, B, D đều là tính năng có trong demo này.", "bs": false}, {"id": "P-176", "n": 176, "stem": "Suppose a validator uses regex to check a stricter email format (instead of just checking `@` and `.`), e.g. `RegExp(r'^[\\w.-]+@[\\w.-]+\\.\\w+$')`. What benefit and trade-off does upgrading from a simple `contains` check to regex bring?", "opts": {"A": "No trade-off at all, regex is always perfect with no downsides", "B": "Regex checks the format much more precisely and strictly than `contains`, but increases code complexity, and a poorly written regex could unintentionally reject valid emails (false negative) or wrongly accept an incorrect format", "C": "Regex only works on Web, not on Android/iOS", "D": "Dart doesn't support RegExp in a validator"}, "ans": "B", "why": "Regex cho phép **kiểm tra định dạng chặt và chính xác hơn**, nhưng **đánh đổi là phức tạp và dễ sai** — viết ẩu sẽ chặn nhầm email hợp lệ (false negative) hoặc cho lọt email sai (false positive). A, C, D không đúng đánh đổi thực tế khi dùng `RegExp` trong Dart.", "bs": false}, {"id": "P-177", "n": 177, "stem": "In REST API programming, which HTTP status code range indicates SUCCESS?", "opts": {"A": "200-299", "B": "400-499", "C": "500-599", "D": "100-199"}, "ans": "A", "why": "**Dải 200–299 là THÀNH CÔNG** (200 OK, 201 Created, 204 No Content). B, C, D là dải lỗi client (4xx), lỗi server (5xx) hoặc thông tin (1xx).", "bs": false}, {"id": "P-178", "n": 178, "stem": "When JSON is received from an API in Flutter, what corresponding Dart data type does it have AFTER `json.decode()`?", "opts": {"A": "Always type `String`", "B": "A JSON object corresponds to `Map<String, dynamic>`, a JSON array corresponds to `List<dynamic>`", "C": "Always type `int`", "D": "Dart cannot represent JSON in any form"}, "ans": "B", "why": "Sau `json.decode()`: **JSON object → `Map<String, dynamic>`; JSON array → `List<dynamic>`**. Vì vậy phải ép kiểu/chuyển sang model trước khi dùng cho an toàn. A, C, D mô tả sai kiểu dữ liệu kết quả.", "bs": false}, {"id": "P-179", "n": 179, "stem": "Given:\nFuture<void> fetchPosts() async {\nfinal url = Uri.parse('https://jsonplaceholder.typicode.com/posts');\nfinal response = await http.get(url);\nif (response.statusCode == 200) {\nprint('Response body: ${response.body}');\n} else {\nprint('Request failed: ${response.statusCode}');\n}\n}\nWhy does this function need to be declared `async` and use `await` before `http.get(url)`?", "opts": {"A": "Because `http.get()` always runs synchronously so async is mandatory", "B": "Because `http.get()` returns a `Future<Response>` — the network operation doesn't complete immediately, `await` pauses function execution until a response arrives, avoiding blocking the UI thread while waiting", "C": "`async`/`await` is purely decorative syntax with no effect on behavior", "D": "Because Dart doesn't support calling an asynchronous function without async"}, "ans": "B", "why": "**`http.get()` trả về `Future<Response>`; `await` tạm dừng hàm cho tới khi có kết quả** mà **không chặn UI thread** (quyền điều khiển được trả về event loop). A, C, D mô tả sai lý do kỹ thuật thật.", "bs": false}, {"id": "P-180", "n": 180, "stem": "What is `FutureBuilder` in Flutter used for?", "opts": {"A": "Building static UI that never changes", "B": "Integrating a `Future` (async operation) into the widget tree, automatically rebuilding the UI based on states: waiting, error, or data", "C": "Only used to display images from the network", "D": "Fully replaces ListView"}, "ans": "B", "why": "**`FutureBuilder` đưa một `Future` vào cây widget** và tự rebuild theo trạng thái: đang chờ (`waiting`) → loading, có lỗi (`hasError`) → báo lỗi, có dữ liệu (`hasData`) → hiển thị. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-181", "n": 181, "stem": "Given this FutureBuilder code:\nFutureBuilder<List<Post>>(\nfuture: _futurePosts,\nbuilder: (context, snapshot) {\nif (snapshot.connectionState == ConnectionState.waiting) {\nreturn const Center(child: CircularProgressIndicator());\n} else if (snapshot.hasError) {\nreturn Center(child: Text('Error: ${snapshot.error}'));\n} else if (!snapshot.hasData || snapshot.data!.isEmpty) {\nreturn const Center(child: Text('No posts'));\n}\nfinal posts = snapshot.data!;\nreturn ListView.builder(...);\n},\n)\nIf the API returns an empty JSON array `[]` (no network error), which branch in this code executes?", "opts": {"A": "The `ConnectionState.waiting` branch", "B": "The `snapshot.hasError` branch", "C": "The `!snapshot.hasData || snapshot.data!.isEmpty` branch — showing \"No posts\"", "D": "The final branch shows a ListView with an empty list but no message"}, "ans": "C", "why": "Mảng rỗng **không phải lỗi và cũng không còn đang chờ**, nhưng `data!.isEmpty` là true → chạy nhánh **\"No posts\"**. A, B sai vì hai trường hợp đó không xảy ra; D sai vì nhánh cuối chỉ chạy khi dữ liệu thực sự có phần tử.", "bs": false}, {"id": "P-182", "n": 182, "stem": "Why should you create a model class (e.g. `Post` with `fromJson`) instead of directly manipulating `Map<String, dynamic>` throughout the app?", "opts": {"A": "Because Dart doesn't allow using Map directly in the UI", "B": "Model classes provide type safety, clear structure, and are easier to maintain and reuse than accessing directly via string keys, which is error-prone at runtime", "C": "Model classes make the app run twice as fast", "D": "No clear benefit, it just increases the number of files"}, "ans": "B", "why": "**Model class cho an toàn kiểu, cấu trúc rõ ràng, dễ bảo trì và tái sử dụng** hơn hẳn việc truy cập `Map` thô bằng chuỗi key (dễ sai chính tả, không được IDE gợi ý, lỗi chỉ lộ lúc chạy). A, C, D không đúng lợi ích được nêu.", "bs": false}, {"id": "P-183", "n": 183, "stem": "Given this code converting a JSON List to List<Model>:\nfinal List<dynamic> jsonList = json.decode(response.body);\nreturn jsonList.map((e) => Post.fromJson(e)).toList();\nIf `.toList()` is removed at the end, what type would the returned variable have, and would that cause an issue when used with `FutureBuilder<List<Post>>`?", "opts": {"A": "The return type is still `List<Post>`, no issue", "B": "The return type becomes `Iterable<Post>` (since `.map()` returns a \"lazy\" Iterable), not matching the declared `List<Post>` return type, causing a type mismatch error", "C": "The program automatically converts Iterable to List silently, no warning", "D": "`.map()` cannot be applied to List<dynamic>"}, "ans": "B", "why": "Thiếu **`.toList()`** thì kết quả là **`Iterable<Post>` (lazy)**, không khớp kiểu trả về đã khai báo `List<Post>` → **lỗi biên dịch**. A, C, D không đúng hành vi của `.map()` trong Dart.", "bs": false}, {"id": "P-184", "n": 184, "stem": "In the Demo 8.3 (POST Request) example, what does this code do?\nbody: json.encode({\n'title': titleController.text,\n'body': bodyController.text,\n'userId': 1,\n}),", "opts": {"A": "Decodes JSON data received from the server", "B": "Encodes a Dart Map into a JSON string to send in the body of a POST request", "C": "Only used to format UI display", "D": "Encrypts the user's password before saving locally"}, "ans": "B", "why": "**`json.encode()` chuyển một `Map` của Dart thành chuỗi JSON** để đặt vào `body` của request POST. A, C, D mô tả sai chức năng này.", "bs": false}, {"id": "P-185", "n": 185, "stem": "In Demo 8.3, the `try/catch/finally` block is used as follows:\ntry {\nfinal response = await http.post(...);\nif (response.statusCode == 201) { setState(() => result = response.body); }\nelse { throw Exception('Failed with status: ${response.statusCode}'); }\n} catch (e) {\nsetState(() => errorMessage = e.toString());\n} finally {\nsetState(() => isLoading = false);\n}\nWhy is `setState(() => isLoading = false);` placed in the `finally` block instead of just in the `try` block?", "opts": {"A": "No difference between placing it in try or finally", "B": "To ensure the loading state is always turned off whether the request succeeds or fails (throws an exception), avoiding the button getting \"stuck\" in loading state permanently on error", "C": "`finally` runs before `try`, so it must be placed there to run earlier", "D": "Placing it in finally causes isLoading to never become false"}, "ans": "B", "why": "**`finally` đảm bảo `isLoading` LUÔN được tắt** dù thành công hay lỗi → tránh tình trạng vòng xoay loading quay mãi không dừng. A, C, D không đúng vai trò/thứ tự thực thi của `finally`.", "bs": false}, {"id": "P-186", "n": 186, "stem": "Which HTTP method is most suitable for sending new data to the server in order to create a new resource?", "opts": {"A": "GET", "B": "POST", "C": "DELETE", "D": "HEAD"}, "ans": "B", "why": "**`POST` dùng để gửi dữ liệu mới nhằm TẠO tài nguyên mới** trên server. A (`GET`) để lấy, C (`PUT`) để thay thế toàn bộ tài nguyên đã có, D (`DELETE`) để xóa.", "bs": false}, {"id": "P-187", "n": 187, "stem": "In Module 8's \"Common Pitfalls & Best Practices,\" how is calling an API directly inside `build()` regarded?", "opts": {"A": "A best practice that should be applied", "B": "A common pitfall to avoid — since `build()` can be called repeatedly, leading to uncontrolled repeated API calls; you should call the API in `initState()` instead", "C": "The only way to call an API in Flutter", "D": "Only causes problems with POST, doesn't affect GET"}, "ans": "B", "why": "Gọi API ngay trong `build()` là **cái bẫy phải tránh**, vì `build()` có thể chạy lại rất nhiều lần → gọi API lặp vô tội vạ. Đúng chỗ là **`initState()`** (hoặc qua state management). A, C, D không khớp nội dung pitfall trong bài.", "bs": false}, {"id": "P-188", "n": 188, "stem": "What is the main benefit of the \"Service Layer Pattern\" design (like `ApiService` in Demo 8.4)?", "opts": {"A": "Helps Flutter automatically generate the user interface", "B": "Encapsulates all API-calling logic in a separate class, keeping UI (widget) code focused on display, while allowing the same service to be reused across multiple screens", "C": "Fully replaces FutureBuilder", "D": "Only has the effect of reducing app size"}, "ans": "B", "why": "**Service Layer Pattern gói toàn bộ logic gọi API vào một lớp riêng**, giúp UI chỉ lo hiển thị và service được dùng lại ở nhiều màn hình — đồng thời dễ mock khi test. A, C, D không đúng lợi ích thực tế.", "bs": false}, {"id": "P-189", "n": 189, "stem": "In `ApiService`, what technique does the constructor parameter `ApiService({http.Client? client}) : client = client ?? http.Client();` illustrate?", "opts": {"A": "Forces always using the same single global HTTP Client instance", "B": "Allows \"injecting\" a custom `http.Client` from outside (useful for testing with a mock client); if none is passed, a default client is used", "C": "This is invalid Dart syntax", "D": "No clear purpose, just to shorten the code"}, "ans": "B", "why": "`ApiService({http.Client? client}) : client = client ?? http.Client()` minh họa **dependency injection** — cho phép **tiêm một `http.Client` giả (mock) khi test**, còn bình thường thì dùng client mặc định. A, C, D không đúng mục đích thực sự.", "bs": false}, {"id": "P-190", "n": 190, "stem": "In the \"From API to UI: Putting It All Together\" flow, after the user successfully submits a form to create a new post (createPost), what does the lecture suggest for updating the displayed list?", "opts": {"A": "The whole app must be restarted", "B": "Re-fetch (call the list API again) or optimistically update directly on the existing list", "C": "Nothing needs to be done, the list will automatically update with no intervention", "D": "Clear the entire device cache"}, "ans": "B", "why": "Sau khi tạo post thành công, hai cách được gợi ý là: **gọi lại API để tải danh sách mới (re-fetch)** hoặc **cập nhật lạc quan (optimistic update) thẳng vào danh sách đang có**. A, C, D không khớp gợi ý trong bài.", "bs": false}, {"id": "P-191", "n": 191, "stem": "What is the main reason \"hardcoding URLs everywhere in the code\" is listed as a pitfall?", "opts": {"A": "Hardcoded URLs make the app run significantly slower", "B": "It makes it difficult to change the base URL (e.g. switching dev/production environments), easily leading to mistakes and duplicated code when it must be edited in multiple places", "C": "Dart doesn't allow declaring URL strings directly in code", "D": "Only affects security, unrelated to code maintenance"}, "ans": "B", "why": "Hardcode URL khắp nơi khiến **muốn đổi base URL phải sửa hàng chục chỗ**, dễ sót và dễ sai (dev/staging/prod lẫn lộn). Nên gom vào một hằng số/`ApiConfig` duy nhất. A, C, D không đúng lý do được nêu.", "bs": false}, {"id": "P-192", "n": 192, "stem": "Comparing parsing `response.body` (JSON) directly in a widget's `build()` function versus parsing in a separate function (like `fetchPosts()` called from `initState()`). Which statement is most accurate regarding performance?", "opts": {"A": "No performance difference between the two approaches", "B": "Parsing JSON in `build()` causes the heavy work (parsing) to be redone every time the widget rebuilds — which can happen very often — while parsing in a function called from `initState()` (with the result stored in a Future variable) only happens once per data load", "C": "build() always runs faster than initState() regardless of content", "D": "Where code is placed doesn't affect performance, only code organization"}, "ans": "B", "why": "Parse JSON trong `build()` khiến **việc nặng bị lặp lại mỗi lần rebuild**; parse một lần từ `initState()` (kết quả nằm trong một `Future` được lưu lại) thì **chỉ chạy một lần cho mỗi lần tải**. A, C, D không đúng phân tích hiệu năng thực tế.", "bs": false}, {"id": "P-193", "n": 193, "stem": "According to the lecture, what are the three typical API data groups students can choose from for their project?", "opts": {"A": "realtime, media, mock APIs", "B": "authentication, storage, testing APIs", "C": "Only JSONPlaceholder alone", "D": "Firebase, SQLite, GraphQL"}, "ans": "A", "why": "Ba nhóm API tiêu biểu cho đồ án: **realtime, media, và mock API** — đúng theo slide 'What is an API? What is HTTP?'. B, C, D không khớp nội dung được nêu.", "bs": false}, {"id": "P-194", "n": 194, "stem": "Given this model:\nfactory Post.fromJson(Map<String, dynamic> json) {\nreturn Post(\nid: json['id'] as int,\ntitle: json['title'] as String,\nbody: json['body'] as String,\n);\n}\nIf the server returns the `\"id\"` field as a string (`\"id\": \"5\"`) instead of a number (`\"id\": 5`), what happens when calling `Post.fromJson`?", "opts": {"A": "Dart automatically converts the String \"5\" to int 5 without error", "B": "Throws a runtime error (type cast error) because `json['id'] as int` cannot directly cast a String to int", "C": "The `id` field will have a default value of 0", "D": "No effect at all because Dart doesn't check types at runtime"}, "ans": "B", "why": "`json['id'] as int` **ném lỗi ép kiểu lúc chạy** nếu server trả về `id` dạng chuỗi — `String` không thể cast thẳng sang `int`. An toàn hơn: `int.parse(json['id'].toString())`. A, C, D không đúng hành vi ép kiểu bằng `as` của Dart.", "bs": false}, {"id": "P-195", "n": 195, "stem": "In the lecture's \"Steps to call an API in Flutter\" process, which step happens RIGHT AFTER receiving the JSON response?", "opts": {"A": "Immediately update the UI with no further processing", "B": "Decode JSON → convert into a Dart model", "C": "Re-send the request once more to confirm", "D": "Delete all old data on the device"}, "ans": "B", "why": "Ngay sau khi nhận được JSON response, bước kế tiếp là **decode JSON → chuyển thành model Dart**, rồi mới đưa lên UI. A, C, D không đúng trình tự.", "bs": false}, {"id": "P-197", "n": 197, "stem": "In the HTTP status code table, which range indicates a SERVER-SIDE error?", "opts": {"A": "200-299", "B": "300-399", "C": "400-499", "D": "500-599"}, "ans": "D", "why": "**Dải 500–599 là lỗi phía SERVER** (500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable). A là thành công (2xx); B là chuyển hướng (3xx); C là lỗi phía client (4xx).", "bs": false}, {"id": "P-198", "n": 198, "stem": "What happens if `response.statusCode` is not 200 but the code does NOT check this condition before calling `json.decode(response.body)`?", "opts": {"A": "No issue at all, json.decode always succeeds with every response", "B": "A parsing error may occur (if the server returns an error HTML page or error text instead of valid JSON), or the program continues processing invalid data as if the request succeeded", "C": "The app will automatically retry the request", "D": "json.decode will safely return an empty list in every error case"}, "ans": "B", "why": "Không kiểm tra `statusCode` trước khi `json.decode()` có nguy cơ **parse nhầm nội dung lỗi không phải JSON (gây exception)**, hoặc **xử lý dữ liệu không hợp lệ như thể là kết quả thành công**. A, C, D không đúng hệ quả thực tế.", "bs": false}, {"id": "P-199", "n": 199, "stem": "Comparing using the plain `http` package versus a more advanced HTTP management package (e.g. Dio, not in the slides but askable at an analytical level): in the spirit of Module 8's \"Service Layer Pattern,\" why does wrapping HTTP logic in `ApiService` make switching HTTP libraries later (if needed) easier?", "opts": {"A": "Because every HTTP package has an entirely identical API", "B": "Because all networking logic is isolated in a single class; if the library needs to change, you only edit inside `ApiService` without touching every widget that consumes the data, minimizing risk and effort", "C": "No benefit at all, switching libraries always requires rewriting the entire app", "D": "The Service Layer Pattern only applies to the `http` package, not to other packages"}, "ans": "B", "why": "**Gom logic networking vào MỘT class (`ApiService`)** nghĩa là khi muốn đổi thư viện (http → Dio) chỉ phải sửa trong `ApiService`, **không phải sửa mọi widget đang dùng** → giảm rủi ro và công sức. A, C, D không đúng nguyên tắc kiến trúc phần mềm này.", "bs": false}, {"id": "P-200", "n": 200, "stem": "In Demo 8.2, when the user taps an item in the post list to open the detail screen, how is the post data (`Post`) passed to `PostDetailScreen`?", "opts": {"A": "Calling the API again to separately load the detail data", "B": "Directly passing the already-available `Post` object through `PostDetailScreen`'s constructor when navigating via `MaterialPageRoute`", "C": "Saving it to SharedPreferences then reading it back on the detail screen", "D": "Using a global variable to share the data"}, "ans": "B", "why": "Đối tượng `Post` được **truyền thẳng qua constructor của `PostDetailScreen`** khi điều hướng bằng `MaterialPageRoute` — đúng như code Demo 8.2. A, C, D không khớp cách triển khai thực tế của demo.", "bs": false}, {"id": "P-201", "n": 201, "stem": "Suppose a student writes:\nFuture<List<Post>> fetchPosts() async {\nfinal response = await http.get(url);\nfinal List<dynamic> jsonList = json.decode(response.body);\nreturn jsonList.map((e) => Post.fromJson(e)).toList();\n}\nbut does NOT check `response.statusCode` before decoding. If the server returns a 500 error with non-valid-JSON content (e.g. an HTML error page), what is most likely to happen?", "opts": {"A": "The app still displays the post list normally", "B": "`json.decode()` will throw a `FormatException` because the returned content isn't valid JSON, causing the `Future` to error out, which needs handling via `catch` or `snapshot.hasError` in FutureBuilder", "C": "The server will automatically resend a correctly formatted response", "D": "Dart will automatically ignore the error and return an empty list"}, "ans": "B", "why": "`json.decode()` **ném `FormatException` khi nội dung không phải JSON** (ví dụ server trả về trang HTML lỗi) → Future kết thúc bằng lỗi, phải xử lý bằng `catch` hoặc `snapshot.hasError`. A, C, D không đúng hành vi thực tế của `json.decode()` với input không hợp lệ.", "bs": false}, {"id": "P-202", "n": 202, "stem": "What kind of data does `SharedPreferences` best suit?", "opts": {"A": "Complex relational data with many linked tables", "B": "Simple key-value data like flags or settings", "C": "Large image files", "D": "Long-duration video"}, "ans": "B", "why": "**`SharedPreferences` hợp nhất với dữ liệu key-value đơn giản**: cờ đã onboarding, chế độ sáng/tối, token, tên người dùng. A, C, D không phải trường hợp phù hợp cho SharedPreferences.", "bs": false}, {"id": "P-203", "n": 203, "stem": "According to the \"Types of Local Storage in Flutter\" table, which case best fits using SQLite (sqflite)?", "opts": {"A": "Storing a boolean flag \"has onboarding been completed\"", "B": "Storing structured relational data, e.g. a Todo app with many records needing querying, filtering, sorting", "C": "Storing only the light/dark theme", "D": "Storing a simple text string that needs no querying"}, "ans": "B", "why": "**SQLite (sqflite) hợp với dữ liệu có cấu trúc quan hệ cần truy vấn/lọc/sắp xếp** — như app Todo có nhiều bản ghi, cần `WHERE`, `ORDER BY`. A, C, D hợp hơn với SharedPreferences hoặc file đơn giản.", "bs": false}, {"id": "P-204", "n": 204, "stem": "In the \"SharedPreferences Support Across Environments\" table, why doesn't DartPad (Flutter Mode) actually support SharedPreferences?", "opts": {"A": "Because DartPad only supports the JavaScript language", "B": "Because DartPad has no access to real device storage (no native storage), so a mock class (like FakePrefs) is needed to simulate storage behavior in memory", "C": "Because SharedPreferences only works on iOS", "D": "Because DartPad doesn't support any Flutter widgets at all"}, "ans": "B", "why": "DartPad **không truy cập được bộ nhớ thật của thiết bị** (chạy trong sandbox trình duyệt), nên phải viết class mock để giả lập lưu trữ trong RAM. A, C, D không đúng lý do kỹ thuật.", "bs": false}, {"id": "P-205", "n": 205, "stem": "On Flutter Web, `SharedPreferences` operates based on which browser storage mechanism?", "opts": {"A": "IndexedDB", "B": "Cookie", "C": "localStorage", "D": "SessionStorage"}, "ans": "C", "why": "Trên Flutter Web, `SharedPreferences` ánh xạ sang **`localStorage` của trình duyệt**. A, B, D không khớp cơ chế được nêu trong bảng so sánh.", "bs": false}]}, {"id": "P5", "kind": "exam", "chip": "Đề 5", "title": "Đề 5 — 50 câu (câu 206–255)", "questions": [{"id": "P-206", "n": 206, "stem": "Given this FakePrefs code simulating SharedPreferences in DartPad:\nclass FakePrefs {\nstatic final Map<String, Object> _store = {};\nFuture<void> setBool(String key, bool value) async { _store[key] = value; }\nbool getBool(String key) {\nfinal value = _store[key];\nif (value is bool) return value;\nreturn false;\n}\n}\nWhy is `_store` declared `static`?", "opts": {"A": "To limit the app to only one FakePrefs object existing", "B": "So the stored data is shared across all instances of FakePrefs (mimicking the singleton-ish behavior of real SharedPreferences), instead of each instance having its own separate data copy", "C": "`static` has no effect in this context", "D": "To automatically save data permanently even after the app is closed"}, "ans": "B", "why": "Từ khóa **`static` khiến dữ liệu được chia sẻ chung cho MỌI instance của `FakePrefs`**, mô phỏng đúng hành vi kiểu singleton của SharedPreferences thật. A, C, D không đúng vai trò của `static` ở đây.", "bs": false}, {"id": "P-207", "n": 207, "stem": "The slide note \"Note: data resets on reload (not persistent)\" when using FakePrefs on DartPad hints at what limitation?", "opts": {"A": "Data stored in FakePrefs persists forever even after reloading the page", "B": "Since FakePrefs only stores data in the RAM of the current session, the data is lost on hot-restart or page reload — unlike real SharedPreferences, which persists durably on the device", "C": "FakePrefs only works with the String data type", "D": "This is a Flutter bug that needs to be patched"}, "ans": "B", "why": "Ghi chú 'data resets on reload' cho thấy **`FakePrefs` chỉ lưu trong bộ nhớ của phiên hiện tại** → mất sạch khi hot-restart/reload, khác hẳn SharedPreferences thật vốn ghi xuống đĩa và tồn tại lâu dài. A, C, D không đúng hạn chế được nêu.", "bs": false}, {"id": "P-208", "n": 208, "stem": "Which package is mentioned for determining the app's storage directory when working with local JSON files?", "opts": {"A": "shared_preferences", "B": "path_provider", "C": "sqflite", "D": "http"}, "ans": "B", "why": "**`path_provider`** dùng để lấy đường dẫn thư mục lưu trữ của app (documents/temporary directory) khi làm việc với file JSON cục bộ. A, C, D không phải package cho mục đích này.", "bs": false}, {"id": "P-209", "n": 209, "stem": "Given this file read/write code:\nfinal file = File(path);\nawait file.writeAsString(jsonString);\nfinal content = await file.readAsString();\nIf `file.readAsString()` is called IMMEDIATELY after `writeAsString()` WITHOUT awaiting `writeAsString()`, what is the potential risk?", "opts": {"A": "No risk at all because both operations are completely synchronous", "B": "Since `writeAsString()` is asynchronous (returns a Future), if not awaited, the subsequent read operation could run before the write finishes, leading to reading stale data or an incomplete file (a race condition)", "C": "Dart automatically synchronizes the two calls in order regardless of whether await is used", "D": "The app will show an immediate compile error"}, "ans": "B", "why": "Không `await` thao tác ghi bất đồng bộ khiến **lệnh đọc có thể chạy trước khi ghi xong** → **race condition**, đọc phải dữ liệu cũ hoặc file dở dang. A, C, D không đúng bản chất bất đồng bộ của các thao tác I/O này.", "bs": false}, {"id": "P-210", "n": 210, "stem": "How does SQFlite differ from SQLite, per the \"Why not name it SQLite?\" explanation?", "opts": {"A": "SQFlite and SQLite are two different names for the exact same concept, no technical difference", "B": "SQLite is the actual storage engine, while SQFlite is a Flutter plugin/wrapper (written in Dart + native code) that lets Flutter communicate with SQLite — SQFlite is not a standalone database", "C": "SQFlite runs 10 times faster than SQLite", "D": "SQFlite only works on Web, SQLite only works on mobile"}, "ans": "B", "why": "**SQLite là engine lưu trữ thật sự (viết bằng C, nằm sẵn trong hệ điều hành); SQFlite là plugin/wrapper của Flutter bắc cầu tới nó** — bản thân SQFlite không phải một database độc lập. A, C, D không khớp giải thích được đưa ra.", "bs": false}, {"id": "P-211", "n": 211, "stem": "Why does the lecture emphasize \"SQFlite doesn't work on Web\"?", "opts": {"A": "Because SQL syntax isn't supported in web browsers in general", "B": "Because SQFlite is a plugin that depends on native code (Android/iOS) to communicate with the OS's SQLite engine, while web browsers have no corresponding native SQLite engine for this plugin to bridge to", "C": "Because web browsers don't support any form of local storage", "D": "Because SQFlite requires an Internet connection to work"}, "ans": "B", "why": "**SQFlite phụ thuộc vào code native để bắc cầu tới engine SQLite của hệ điều hành**, mà trình duyệt thì không có thứ đó → **không chạy được trên Web**. Trên Web phải dùng giải pháp khác (Hive, IndexedDB). A, C, D không đúng lý do kỹ thuật.", "bs": false}, {"id": "P-212", "n": 212, "stem": "In SQFlite, which function is called to open or create a database, and how often should it be called?", "opts": {"A": "`openDatabase()` — should only be called once (singleton/service) to avoid opening multiple duplicate connections", "B": "`createDatabase()` — should be called every time before querying", "C": "`initDatabase()` — call frequency doesn't matter", "D": "`connectDatabase()` — only usable with Web"}, "ans": "A", "why": "Gọi **`openDatabase()`** để mở/tạo database, và **chỉ nên gọi MỘT LẦN** (qua singleton/service) để tránh mở nhiều kết nối trùng lặp gây tốn tài nguyên và lỗi khóa file. B, C, D không đúng tên hàm/cách dùng được khuyến nghị.", "bs": false}, {"id": "P-213", "n": 213, "stem": "In SQFlite, what data type does the `query()` function return, and what's the necessary next step in a real app?", "opts": {"A": "Directly returns `List<Model>`, no further processing needed", "B": "Returns `List<Map<String, dynamic>>` — each Map represents one data row; you need to map each Map into corresponding Model objects (e.g. using `fromJson`/`fromMap`) for use in the app", "C": "Returns a raw JSON string that needs manual parsing with RegExp", "D": "Returns `Future<void>`, with no data returned"}, "ans": "B", "why": "**`query()` trả về `List<Map<String, dynamic>>`** — dữ liệu thô dạng bảng; bước cần thiết tiếp theo là **map sang đối tượng Model** để code có kiểu rõ ràng và dễ dùng. A, C, D không đúng kiểu trả về thực tế.", "bs": false}, {"id": "P-214", "n": 214, "stem": "In the SQL SELECT syntax reviewed in the lecture, which clause is used to FILTER data rows before returning the result?", "opts": {"A": "ORDER BY", "B": "WHERE", "C": "LIMIT", "D": "SELECT"}, "ans": "B", "why": "**`WHERE` lọc các dòng dữ liệu trước khi trả kết quả**. A, C, D phục vụ mục đích khác: sắp xếp (`ORDER BY`), giới hạn số dòng (`LIMIT`), chọn cột (`SELECT`).", "bs": false}, {"id": "P-215", "n": 215, "stem": "When is the `GROUP BY` clause combined with `HAVING` typically used?", "opts": {"A": "When you need to sort results alphabetically", "B": "When you need to group rows by a criterion and apply a filter condition on aggregate functions like SUM, COUNT", "C": "When you need to limit the number of returned records (pagination)", "D": "When you need to rename a column in the query result"}, "ans": "B", "why": "**`GROUP BY` + `HAVING` dùng khi cần gom nhóm các dòng và lọc theo hàm tổng hợp** như `SUM`, `COUNT`, `AVG`. Lưu ý: `WHERE` lọc TRƯỚC khi gom nhóm, `HAVING` lọc SAU khi đã gom. A, C, D không đúng mục đích các mệnh đề này.", "bs": false}, {"id": "P-216", "n": 216, "stem": "Given: a Todo app needs to display the task list paginated to avoid loading all data at once on mobile. Which SQL clause is most suitable for implementing pagination?", "opts": {"A": "GROUP BY and HAVING", "B": "LIMIT and OFFSET", "C": "WHERE alone is sufficient", "D": "SQLite doesn't support pagination"}, "ans": "B", "why": "**`LIMIT` và `OFFSET`** là cú pháp SQL chuẩn để phân trang — `LIMIT 20 OFFSET 40` lấy 20 bản ghi bắt đầu từ bản ghi thứ 41. A, C, D không phù hợp/không đúng cho mục đích này.", "bs": false}, {"id": "P-217", "n": 217, "stem": "\"Offline-First\" is an app design strategy based on what principle?", "opts": {"A": "The app only works with a stable Internet connection", "B": "Prioritize loading and displaying local data first, then sync with the server when a network connection is available, keeping the app usable offline", "C": "Never store data locally, always call the API every time data is needed", "D": "Only applicable to game apps"}, "ans": "B", "why": "**Offline-First ưu tiên tải dữ liệu cục bộ trước, rồi mới đồng bộ với server khi có mạng** — nhờ vậy app vẫn dùng được khi mất kết nối và mở lên là có dữ liệu ngay. A, C, D mô tả sai nguyên tắc thiết kế này.", "bs": false}, {"id": "P-218", "n": 218, "stem": "Per the \"When to Use Which Storage?\" table, if an app needs offline storage AND backend sync (offline-first + sync), what combined storage solution is recommended?", "opts": {"A": "Only use SharedPreferences", "B": "SQLite (sqflite) combined with a Firebase/REST backend", "C": "Only use a local JSON file, no backend combination needed", "D": "There's no suitable solution in Flutter"}, "ans": "B", "why": "Với offline-first kèm đồng bộ, tổ hợp được khuyến nghị là **SQLite (sqflite) cho lưu trữ cục bộ + backend Firebase/REST để đồng bộ**. A, C, D không khớp khuyến nghị trong bảng.", "bs": false}, {"id": "P-219", "n": 219, "stem": "In Demo 9.3 (Offline Todo App), what role does the `key: ValueKey(todo.id)` attached to each list item play (directly related to performance and correctness when the list changes)?", "opts": {"A": "Purely decorative for the interface", "B": "Helps Flutter accurately identify each item widget when the list changes order/adds/removes items, avoiding state confusion between items during rebuild (especially important for lists that can be reordered or have elements deleted)", "C": "Used to encrypt the todo data before saving to SQLite", "D": "Mandatory for SQLite to work, unrelated to Flutter's Key concept"}, "ans": "B", "why": "**`ValueKey(todo.id)` giúp Flutter nhận diện chính xác từng widget item khi danh sách thay đổi** (thêm/xóa/sắp xếp lại), tránh nhầm lẫn state giữa các dòng. A, C, D mô tả sai vai trò của Key.", "bs": false}, {"id": "P-220", "n": 220, "stem": "An app needs to store \"a list of short notes, exportable/importable as a file\" but doesn't need complex queries (no WHERE, JOIN...). Per the storage recommendation table, what is the most reasonable option?", "opts": {"A": "SharedPreferences, because it's the simplest in every case", "B": "Local JSON File (dart:io), because it fits simple list-structured data, needs no SQL, and directly supports export/import", "C": "SQLite, because it's always the best choice regardless of data complexity", "D": "Don't store locally at all, always call the API every time the app opens"}, "ans": "B", "why": "**File JSON cục bộ** phù hợp cho dữ liệu dạng danh sách đơn giản, không cần SQL, và **hỗ trợ xuất/nhập file trực tiếp**. A, C, D không phải lựa chọn tốt nhất cho yêu cầu cụ thể này.", "bs": false}, {"id": "P-221", "n": 221, "stem": "Why is SharedPreferences described as \"NOT for complex objects or large data\"?", "opts": {"A": "Because SharedPreferences only supports storing integers", "B": "Because SharedPreferences is designed for storing simple key-value values (String, bool, int, double, List<String>), which is unsuitable and inefficient for complex-structured or large-volume data", "C": "Because SharedPreferences only works with a network connection", "D": "Because SharedPreferences automatically deletes data after 24 hours"}, "ans": "B", "why": "`SharedPreferences` được **thiết kế cho dữ liệu key-value đơn giản**; nhét object phức tạp hoặc dữ liệu lớn vào sẽ **không phù hợp và kém hiệu quả** (phải serialize thủ công, đọc/ghi toàn bộ, không truy vấn được). A, C, D không đúng lý do thực sự.", "bs": false}, {"id": "P-222", "n": 222, "stem": "In SharedPreferences' standard High-Level Flow: \"Load storage instance → Read existing value → Update value based on user action → Save back to storage → Refresh the UI.\" If the \"Refresh the UI\" step (e.g. calling `setState()`) is skipped after saving the new value, what happens?", "opts": {"A": "The value is still correctly saved to device storage (correct on the next app launch), but the current UI won't reflect the change immediately until another rebuild occurs", "B": "The value won't be saved to storage if this step is missing", "C": "The app will automatically crash", "D": "SharedPreferences will automatically call setState implicitly"}, "ans": "A", "why": "Nếu bỏ bước cuối, **giá trị VẪN được lưu đúng xuống storage, nhưng UI hiện tại không phản ánh thay đổi** cho tới khi có một lần rebuild khác. Tức là dữ liệu đúng nhưng màn hình 'trơ'. B, C, D không đúng hành vi thực tế của SharedPreferences/Flutter.", "bs": false}, {"id": "P-223", "n": 223, "stem": "Which data type is NOT listed as a typical example suitable for Local Storage in \"Why Local Storage?\"", "opts": {"A": "Dark mode settings", "B": "Recently viewed items", "C": "Real-time video call session token (real-time streaming data)", "D": "Onboarding flag (\"first-time user?\")"}, "ans": "C", "why": "**Token phiên gọi video real-time KHÔNG nằm** trong danh sách ví dụ điển hình của Local Storage (nó ngắn hạn và nhạy cảm). A, B, D đều là ví dụ được nhắc rõ trong bài.", "bs": false}, {"id": "P-224", "n": 224, "stem": "Suppose a student uses SQLite to store a favorites list BUT chooses to store the entire list as ONE single JSON string in a TEXT column, instead of splitting it into proper relational rows. In the spirit of \"Why SQLite?\" (structured data, sorting & filtering, relationships), what is the drawback of this approach?", "opts": {"A": "No drawback, this is the most optimal approach", "B": "It loses SQLite's core advantage: you can't efficiently use WHERE/ORDER BY/GROUP BY on individual elements inside that JSON string, forcing you to parse the entire string into memory and filter with Dart code — reducing query performance and losing the ability to leverage data relationships", "C": "SQLite will refuse to store JSON-string-format data", "D": "This approach makes the app unable to work offline"}, "ans": "B", "why": "Nhét cả danh sách thành **MỘT chuỗi JSON trong một cột** làm **mất hết lợi thế truy vấn/quan hệ của SQLite** — không `WHERE`, không `ORDER BY`, không index được; phải đọc hết ra rồi lọc trong RAM, rất kém hiệu quả khi dữ liệu lớn. A, C, D không đúng nhược điểm kỹ thuật thực sự.", "bs": false}, {"id": "P-225", "n": 225, "stem": "In Lab 9 (Offline-First Mini App), what part of the app is SharedPreferences suggested to be used for?", "opts": {"A": "Storing the entire relationally-structured Todo list", "B": "Storing the app's theme state (Dark/Light mode)", "C": "Storing the data export/import JSON file", "D": "Storing multi-table relational data"}, "ans": "B", "why": "Trong Lab 9, **`SharedPreferences` được gợi ý để lưu trạng thái theme (Dark/Light mode)** — dữ liệu nhỏ, đơn giản, đúng sở trường của nó. A, C, D hợp hơn với SQLite/file JSON.", "bs": false}, {"id": "P-226", "n": 226, "stem": "Comparing the three storage types learned (SharedPreferences, JSON File, SQLite) against the offline-first principle \"Store offline → Use offline → Sync online.\" When designing a notes app that will later sync to a server, which initial local storage choice makes future \"Sync online\" and \"Resolve conflicts\" easiest to implement, and why?", "opts": {"A": "SharedPreferences, because it's the simplest to start coding with", "B": "SQLite, because its clear row/column data structure makes it easy to track changes (e.g. by id, timestamp) for syncing and resolving conflicts with the server, compared to managing a single JSON string blob in SharedPreferences or a JSON file with no mechanism to query/track changes per element", "C": "No local storage needed, always call the API every time the app opens to avoid conflicts", "D": "JSON File, because files automatically sync in real-time with the server"}, "ans": "B", "why": "**Cấu trúc dòng–cột rõ ràng của SQLite giúp theo dõi thay đổi (id, timestamp, cờ đã đồng bộ) dễ hơn hẳn** so với một khối JSON hay file — điều tối quan trọng khi cần đồng bộ và xử lý xung đột về sau. A, C, D không đúng lập luận kỹ thuật cho việc đồng bộ/xử lý xung đột.", "bs": false}, {"id": "P-227", "n": 227, "stem": "What is the difference between Authentication and Authorization?", "opts": {"A": "The two concepts are entirely identical", "B": "Authentication answers \"Who are you?\" (identity verification), Authorization answers \"What are you allowed to do?\" (access control)", "C": "Authorization always happens before Authentication", "D": "Authentication only applies to web, not mobile"}, "ans": "B", "why": "**Authentication = xác thực danh tính ('Bạn là ai?')**; **Authorization = phân quyền ('Bạn được làm gì?')**. Đăng nhập là authentication; kiểm tra xem user có phải admin để vào trang quản trị là authorization. A, C, D mô tả sai/đảo ngược hai khái niệm.", "bs": false}, {"id": "P-228", "n": 228, "stem": "In the high-level Authentication Flow, after the backend verifies valid login credentials, what does the system usually return to the app?", "opts": {"A": "The user's password in encrypted form", "B": "A token (usually a JWT) for the app to store and use for subsequent requests", "C": "The entire user database", "D": "A list of other apps the user has installed"}, "ans": "B", "why": "Sau khi backend xác minh thông tin đăng nhập hợp lệ, hệ thống **trả về một token (thường là JWT)** để app lưu lại và đính kèm vào các request sau. A, C, D không đúng luồng xác thực chuẩn.", "bs": false}, {"id": "P-229", "n": 229, "stem": "What three main parts does a JWT (JSON Web Token) consist of?", "opts": {"A": "Username, Password, Email", "B": "Header, Payload, Signature", "C": "Request, Response, Body", "D": "Client, Server, Database"}, "ans": "B", "why": "JWT gồm **3 phần: Header . Payload . Signature** — nối với nhau bằng dấu chấm. Header khai báo thuật toán, Payload chứa claims, Signature để xác minh tính toàn vẹn. A, C, D không đúng cấu trúc JWT.", "bs": false}, {"id": "P-230", "n": 230, "stem": "Per the instructor's note \"JWTs must not store passwords. Only identity claims,\" what is WRONG if a system stores a user's password directly in the JWT payload?", "opts": {"A": "No problem at all since JWT is signed, making it always absolutely secure", "B": "A JWT is only signed, not encrypted by default — meaning the payload can be decoded and read by anyone holding the token (e.g. via base64 decode), so storing sensitive info like a password is a serious security vulnerability", "C": "A JWT cannot contain an object-type payload, only plain strings", "D": "This is a standard, industry-recommended practice"}, "ans": "B", "why": "**JWT chỉ được KÝ chứ không được MÃ HÓA** — phần payload chỉ là Base64, ai cầm token cũng đọc được nội dung. Vì vậy lưu mật khẩu trong JWT là **lỗ hổng bảo mật nghiêm trọng**. A, C, D không đúng đặc tính bảo mật thực sự của JWT.", "bs": false}, {"id": "P-231", "n": 231, "stem": "What is the difference between an Access Token and a Refresh Token, per the lecture?", "opts": {"A": "The Access Token has a longer lifetime than the Refresh Token", "B": "The Access Token is usually short-lived (reducing risk if exposed) and sent with every request; the Refresh Token has stronger privileges, used to get a new Access Token when it expires, so it needs more secure storage (Secure Storage)", "C": "The two token types have completely identical functions, just different names", "D": "The Refresh Token is sent with every API request, while the Access Token is only used once"}, "ans": "B", "why": "**Access Token: hạn ngắn, gửi kèm mỗi request**; **Refresh Token: quyền mạnh hơn, dùng để xin Access Token mới, phải lưu an toàn hơn** (secure storage, không để trong JS/localStorage thường). A, C, D mô tả sai đặc điểm hai loại token.", "bs": false}, {"id": "P-232", "n": 232, "stem": "In Demo 10.1, why does the lecture choose \"Mock Authentication\" (simulated auth inside AuthService) instead of calling a real API from the start?", "opts": {"A": "Because Mock Authentication is theoretically faster in computation", "B": "To ensure the demo works reliably in every learning environment (not dependent on network connectivity, since a real server could fail/timeout), suitable for the stage of learning basic concepts before moving to real API integration", "C": "Because Real APIs always require payment", "D": "Because Flutter doesn't support making real HTTP requests in mobile apps"}, "ans": "B", "why": "Chọn **Mock Authentication để demo luôn chạy ổn định ở mọi môi trường**, không phụ thuộc mạng/server — hợp cho việc dạy khái niệm cơ bản trước khi tích hợp API thật. A, C, D không đúng lý do thực sự.", "bs": false}, {"id": "P-233", "n": 233, "stem": "Per the Mock API vs Real API comparison table, what is a disadvantage of Real API compared to Mock API in the teaching context?", "opts": {"A": "Real API is always faster and more stable than Mock API", "B": "Real API can encounter errors from network, server, TLS, or CORS — less stable than Mock API, which always works without needing the Internet", "C": "Real API cannot be used to teach students about networking", "D": "Mock API is never used in real-world projects or in teaching at all"}, "ans": "B", "why": "Nhược điểm của Real API trong bối cảnh dạy học: **có thể hỏng do mạng/server/TLS/CORS**, kém ổn định hơn Mock API vốn chẳng cần Internet. A, C, D không khớp nội dung bảng so sánh.", "bs": false}, {"id": "P-234", "n": 234, "stem": "In the Signup Flow process, which statement is correct about the relationship between AuthService used for Login (Demo 10.1) and Signup (Demo 10.2)?", "opts": {"A": "Signup must create an entirely new service, completely separate from Login's AuthService", "B": "Signup reuses the same `AuthService` class, only adding a new method (`signup(...)`), keeping the same architecture and error handling already established by Login", "C": "Signup needs no service at all, handling everything directly in the widget", "D": "AuthService is only used for logout"}, "ans": "B", "why": "Signup **dùng lại chính class `AuthService`**, chỉ **thêm method `signup()`** mà giữ nguyên kiến trúc và cách xử lý lỗi sẵn có. A, C, D không khớp nội dung 'Signup API Integration (Reuse AuthService)'.", "bs": false}, {"id": "P-235", "n": 235, "stem": "Consider the password validation rules in the Signup Form: minimum 6-8 characters, at least 1 uppercase letter, at least 1 digit, no leading/trailing whitespace, and must match Confirm Password. With Password = `\" Abc1234\"` (leading space) and Confirm Password = `\" Abc1234\"` (identical, matching), what is the validation result per these rules?", "opts": {"A": "Valid because Password and Confirm Password match completely", "B": "Invalid, because it violates the \"No leading / trailing whitespace\" rule even though the two values match", "C": "Valid because whitespace doesn't affect the password validation rules", "D": "Undetermined because Dart doesn't allow passwords to contain whitespace"}, "ans": "B", "why": "Dù các điều kiện khác đều thỏa, chuỗi vẫn **KHÔNG hợp lệ vì vi phạm quy tắc 'không có khoảng trắng ở đầu/cuối'**. A, C, D không áp dụng đầy đủ/đúng tất cả quy tắc validate đã nêu.", "bs": false}, {"id": "P-236", "n": 236, "stem": "What is `SharedPreferences` used for in Demo 10.3, mainly?", "opts": {"A": "Storing the user's entire web browsing history", "B": "Persisting the authentication token to implement auto-login, so the user doesn't need to log in again every time the app opens", "C": "Storing the user's avatar image as binary data", "D": "Fully replacing JWT"}, "ans": "B", "why": "Trong Demo 10.3, `SharedPreferences` dùng để **lưu token xác thực nhằm tự động đăng nhập (auto-login)** — người dùng không phải đăng nhập lại mỗi lần mở app. A, C, D không đúng mục đích trong demo này.", "bs": false}, {"id": "P-237", "n": 237, "stem": "In the Auto Login Flow: \"Splash → (has token?) → Home / Login.\" If the token has expired but still exists in SharedPreferences (the app only checks \"does a token exist\" WITHOUT checking its expiry), what could happen?", "opts": {"A": "The app will always accurately detect an expired token because SharedPreferences auto-validates it", "B": "The app might mistakenly navigate the user to Home even though the token has expired, causing subsequent API requests to be rejected (401 Unauthorized) — showing the need to also check token expiry or handle 401 errors to force logout when needed", "C": "The token will automatically refresh with no additional logic needed", "D": "The app will always stay on the Splash screen forever"}, "ans": "B", "why": "Nếu **không kiểm tra hạn token**, app có thể **điều hướng nhầm vào Home rồi dính lỗi 401** ở các request tiếp theo — cho thấy cần kiểm tra `expiry` hoặc có cơ chế xử lý 401. A, C, D không đúng hệ quả thực tế.", "bs": false}, {"id": "P-238", "n": 238, "stem": "In the \"Logout & Session Clearing\" Test Scenario of Demo 10.3, what specific action happens to the token data after the user logs out?", "opts": {"A": "The token switches to an \"expired\" state but is still kept in memory", "B": "The token is removed from SharedPreferences, causing the next app launch to show the Login screen instead of automatically going to Home", "C": "The token is sent back to the server for permanent storage", "D": "Nothing changes, logout only temporarily hides the Home UI"}, "ans": "B", "why": "Logout **xóa token khỏi SharedPreferences**, nên lần mở app kế tiếp sẽ hiện màn hình Login thay vì tự vào Home. A, C, D không khớp hành vi trong kịch bản test được mô tả.", "bs": false}, {"id": "P-239", "n": 239, "stem": "What main benefit does Firebase Authentication provide over building your own authentication system from scratch?", "opts": {"A": "It requires writing a more complex custom backend", "B": "Provides a secure, scalable login solution, supporting multiple methods (Google, Apple, Facebook, Email/Password) along with automatic session persistence and token refresh, reducing the effort of building an identity backend", "C": "Only works for apps that don't need login", "D": "Not compatible with Flutter"}, "ans": "B", "why": "Firebase Authentication cung cấp **hệ thống đăng nhập an toàn, mở rộng tốt, nhiều phương thức (email, Google, phone…), tự động lưu và làm mới phiên** — giảm hẳn công sức tự xây backend danh tính. A, C, D không đúng lợi ích thực tế của Firebase Auth.", "bs": false}, {"id": "P-240", "n": 240, "stem": "In the Google Sign-In flow: \"User taps Sign in with Google → Google account chooser → Google issues OAuth tokens → Convert to Firebase credential → Firebase signs in the user → App receives Firebase User object.\" What is the core meaning of the statement \"Firebase handles identity → our app only handles UI + navigation\"?", "opts": {"A": "The Flutter app must write all the OAuth authentication logic itself from scratch", "B": "Firebase handles all the complex parts of identity verification and OAuth token management; the Flutter developer only needs to focus on building the UI and handling navigation after a successful login", "C": "Google Sign-In is unrelated to Firebase at all", "D": "UI and navigation must be entirely handled on the server side"}, "ans": "B", "why": "Ý của câu này: **Firebase lo toàn bộ phần xác minh danh tính/OAuth phức tạp**, còn lập trình viên Flutter chỉ tập trung vào UI và điều hướng. A, C, D không đúng ý câu nói.", "bs": false}, {"id": "P-241", "n": 241, "stem": "Per the Google Sign-In \"Common Errors & Fixes\" table, the \"DEVELOPER_ERROR\" is usually caused by what?", "opts": {"A": "Missing Internet connection", "B": "Wrong package name not matching the Firebase configuration", "C": "Missing pubspec.yaml file", "D": "Too-new Flutter version"}, "ans": "B", "why": "**'DEVELOPER_ERROR' thường do sai package name / SHA-1 không khớp với cấu hình trên Firebase**. Kiểm tra lại `applicationId` và fingerprint đã đăng ký. A, C, D không khớp nguyên nhân được nêu.", "bs": false}, {"id": "P-242", "n": 242, "stem": "In the common errors table, if Google Sign-In returns null when tested on an emulator, what is the most common cause stated?", "opts": {"A": "Missing camera permission", "B": "The emulator lacks Google Play Services — use an emulator with the Play Store installed or a real device instead", "C": "Wrong SharedPreferences configuration", "D": "Expired JWT"}, "ans": "B", "why": "Google Sign-In trả về null trên emulator thường do **emulator thiếu Google Play Services** — phải dùng ảnh emulator có Play Store hoặc thiết bị thật. A, C, D không khớp nguyên nhân được nêu.", "bs": false}, {"id": "P-243", "n": 243, "stem": "What is the difference between Local Notification and Push Notification?", "opts": {"A": "Local Notification is triggered by the app itself and needs no Internet; Push Notification is sent from a server and needs Internet plus backend support", "B": "The two notification types are completely identical in mechanism", "C": "Push Notification needs no backend, only Local Notification does", "D": "Local Notification only works on iOS"}, "ans": "A", "why": "**Local Notification do chính app kích hoạt, không cần Internet**; **Push Notification do server gửi tới, cần Internet và hạ tầng backend (FCM)**. B, C, D mô tả sai hoặc đảo ngược hai loại thông báo.", "bs": false}, {"id": "P-244", "n": 244, "stem": "In Demo 10.5, at what point in the app's actual flow is the local notification triggered?", "opts": {"A": "Right when the app opens, before login", "B": "Right after a successful login", "C": "Only when the app is fully in the background", "D": "When the app is uninstalled"}, "ans": "B", "why": "Trong Demo 10.5, thông báo cục bộ được kích hoạt **ngay sau khi đăng nhập thành công** — minh họa việc gắn notification vào luồng nghiệp vụ thật. A, C, D không khớp luồng được mô tả.", "bs": false}, {"id": "P-245", "n": 245, "stem": "Per \"Best Practices & Patterns for Authentication,\" why is `pushReplacementNamed()` recommended over `pushNamed()` when moving from the Splash/Login screen to Home after successful authentication?", "opts": {"A": "Because `pushReplacementNamed()` runs faster in CPU speed", "B": "To prevent the user from pressing Back to return to the Splash or Login screen that has already served its purpose, avoiding an illogical navigation experience (login → back → login again)", "C": "Because `pushNamed()` doesn't support named routes", "D": "There's no real difference between the two methods in this context"}, "ans": "B", "why": "Dùng `pushReplacementNamed()` để **người dùng không bấm Back quay lại màn hình Splash/Login đã xong** — tránh điều hướng phi logic. A, C, D không đúng lý do thực sự.", "bs": false}, {"id": "P-246", "n": 246, "stem": "Per the \"Security\" section of Best Practices, what practice is recommended regarding token storage?", "opts": {"A": "Store the token as public plain text in a log file for easy debugging", "B": "Don't store raw tokens insecurely — use a secure storage mechanism and always use HTTPS", "C": "Send the token over an unencrypted HTTP channel to increase speed", "D": "Share the token via social media to sync across multiple devices"}, "ans": "B", "why": "Thực hành được khuyến nghị: **lưu token ở nơi an toàn (secure storage) và luôn dùng HTTPS**, tuyệt đối không lưu token thô ở nơi kém an toàn. A, C, D đều là thực hành SAI, trái với hướng dẫn bảo mật.", "bs": false}, {"id": "P-247", "n": 247, "stem": "An app does the following: (1) The user logs in and receives an Access Token that expires in 15 minutes; (2) The Access Token is stored in SharedPreferences; (3) No Refresh Token mechanism is implemented. What is the most likely real-world consequence after 15 minutes of continuous app use?", "opts": {"A": "The app will automatically extend the token forever with no action needed", "B": "API requests after the expiry point will start being rejected (401 Unauthorized), and since there's no Refresh Token, the user is forced to manually log in again to get a new Access Token — this is a limitation that should be fixed with a refresh token mechanism", "C": "The Access Token will automatically become a Refresh Token", "D": "The app will crash immediately when the Access Token expires"}, "ans": "B", "why": "Không có cơ chế refresh, **sau khi Access Token hết hạn mọi request đều nhận lỗi 401 và người dùng buộc phải đăng nhập lại thủ công** — đây chính là hạn chế mà refresh token sinh ra để giải quyết. A, C, D không đúng hệ quả thực tế.", "bs": false}, {"id": "P-248", "n": 248, "stem": "In \"Required Configurations\" for Google Sign-In on Android, which file needs to be downloaded and placed in the `android/app/` folder?", "opts": {"A": "Info.plist", "B": "google-services.json", "C": "build.gradle.template", "D": "AndroidManifest.template"}, "ans": "B", "why": "Cần tải **`google-services.json`** và đặt vào thư mục **`android/app/`** để cấu hình Firebase cho Android. (Trên iOS là `GoogleService-Info.plist`.) A, C, D không đúng tên file/mục đích.", "bs": false}, {"id": "P-249", "n": 249, "stem": "Per the \"Understanding User Session\" section, what components does a typical session usually include?", "opts": {"A": "Only the user's password", "B": "Access token, user profile info, and the token expiry timestamp", "C": "Only the app name and Flutter version", "D": "The user's entire operation history on the device"}, "ans": "B", "why": "Một session điển hình gồm: **access token, thông tin hồ sơ người dùng (user profile), và mốc thời gian hết hạn token**. A, C, D thiếu hoặc sai so với nội dung 'Understanding User Session'.", "bs": false}, {"id": "P-250", "n": 250, "stem": "Compare the AuthService (Singleton pattern) mentioned in \"Architecture Patterns\" with scattering authentication logic directly across individual screen widgets (LoginScreen, SignupScreen, HomeScreen each writing their own API-calling logic). In the spirit of the lecture, what is the main drawback of the scattered approach?", "opts": {"A": "No drawback at all, both approaches are equivalent in quality", "B": "The scattered approach leads to duplicated logic across screens, is hard to maintain consistently when the auth flow changes, and reduces reusability — while a centralized AuthService separates UI from business logic, making it easier to test and extend", "C": "The scattered approach is always faster at runtime", "D": "The Singleton AuthService is only suitable for apps that don't need login"}, "ans": "B", "why": "Rải logic xác thực khắp nơi gây **trùng lặp, khó bảo trì, khó tái sử dụng**; gom vào một **`AuthService` (singleton)** giúp tách UI khỏi logic, dễ test và dễ mở rộng. A, C, D không đúng phân tích kiến trúc phần mềm.", "bs": false}, {"id": "P-251", "n": 251, "stem": "Per \"Why Notifications After Authentication?\", what is the main purpose of sending a notification right after a successful login (e.g. \"Login successful. Welcome back!\")?", "opts": {"A": "Fully replaces showing a SnackBar", "B": "Connects notifications with the app's real business workflows (like confirming an important action that just occurred), increasing user engagement and awareness of their account status", "C": "Only meant to check the device's Internet access permission", "D": "Mandatory for the JWT to become valid"}, "ans": "B", "why": "Mục đích là **gắn thông báo vào luồng nghiệp vụ thật**, tăng mức độ tương tác và giúp người dùng nắm được trạng thái tài khoản của mình. A, C, D không đúng mục đích được nêu.", "bs": false}, {"id": "P-252", "n": 252, "stem": "What are the three main testing types in Flutter mentioned in the lecture?", "opts": {"A": "Unit Test, Widget Test, Integration Test", "B": "Alpha Test, Beta Test, Release Test", "C": "Manual Test, Auto Test, Smoke Test", "D": "Load Test, Stress Test, Security Test"}, "ans": "A", "why": "Ba loại test chính trong Flutter: **Unit Test, Widget Test, Integration Test**. B, C, D không phải cách phân loại được dạy trong Module 11.", "bs": false}, {"id": "P-253", "n": 253, "stem": "Per the \"Flutter Testing Pyramid,\" which test type should have the LARGEST quantity in a project, since it's fast, stable, and low cost?", "opts": {"A": "Integration Test", "B": "Widget Test", "C": "Unit Test", "D": "All three types should have equal quantities"}, "ans": "C", "why": "Theo **kim tự tháp kiểm thử, Unit Test phải NHIỀU NHẤT** — chạ
