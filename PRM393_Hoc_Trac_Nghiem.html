hước cụ thể (và cũng dùng để tạo khoảng trống cố định). `Center`/`Align` chỉ định vị; `Spacer` chiếm phần trống linh hoạt trong Flex."}, {"id": "M4-37", "n": 37, "bs": false, "stem": "What is the difference between `padding` and `margin` in a Container?", "opts": {"A": "Padding is outside the border, margin inside", "B": "Padding is inside the border, margin outside", "C": "They are identical", "D": "Margin only works in Rows"}, "ans": "B", "why": "**Padding nằm BÊN TRONG viền** (khoảng cách từ viền tới nội dung), **margin nằm BÊN NGOÀI viền** (khoảng cách tới widget khác). Nhớ: padding đẩy nội dung vào, margin đẩy cả hộp ra."}, {"id": "M4-38", "n": 38, "bs": false, "stem": "Which Container property applies rotation, translation or scaling via a matrix?", "opts": {"A": "`decoration`", "B": "`alignment`", "C": "`transform`", "D": "`clipBehavior`"}, "ans": "C", "why": "**`transform:`** nhận một `Matrix4` để xoay/tịnh tiến/co giãn Container. `decoration` lo nền-viền-bóng, `alignment` căn con, `clipBehavior` cắt phần tràn."}, {"id": "M4-39", "n": 39, "bs": false, "stem": "Why does specifying both `color:` and `decoration:` on a Container throw an assertion error?", "opts": {"A": "Colour must be set inside `BoxDecoration`; the two are mutually exclusive", "B": "Decoration is deprecated", "C": "Colour is only valid with a child", "D": "It does not throw an error"}, "ans": "A", "why": "Container **không cho đặt đồng thời `color` và `decoration`** vì màu nền phải nằm trong `BoxDecoration(color: ...)`; đặt cả hai gây mâu thuẫn nên Flutter ném assertion error. Fix: bỏ `color:` và đưa màu vào decoration."}, {"id": "M4-40", "n": 40, "bs": false, "stem": "Which key type should be used to preserve state of items in a reorderable list?", "opts": {"A": "`GlobalKey`", "B": "`ValueKey`", "C": "`UniqueKey`", "D": "No key is needed"}, "ans": "B", "why": "**`ValueKey`** gắn định danh theo **giá trị/ID của item** nên khi danh sách bị sắp xếp lại, Flutter vẫn nhận ra đúng item và giữ state. `UniqueKey` sinh key mới mỗi lần build → mất state; không key thì Flutter khớp theo vị trí → state nhảy lung tung."}, {"id": "M4-41", "n": 41, "bs": false, "stem": "What is a `GlobalKey`?", "opts": {"A": "A key unique within a subtree", "B": "A key unique across the entire widget tree that gives access to a widget's State or RenderObject", "C": "A key used only with Form widgets", "D": "A key based on list index"}, "ans": "B", "why": "**`GlobalKey`** là key **duy nhất trên toàn bộ widget tree**, cho phép truy cập `State`, `BuildContext` hoặc `RenderObject` của widget từ bên ngoài (ví dụ `formKey.currentState!.validate()`). Nó nặng hơn key thường nên chỉ dùng khi thật cần."}, {"id": "M4-42", "n": 42, "bs": false, "stem": "What happens if the same `GlobalKey` instance is attached to two widgets at the same time?", "opts": {"A": "The second overrides the first", "B": "Both share state", "C": "Flutter throws an assertion error because GlobalKeys must be unique", "D": "Flutter ignores the second silently"}, "ans": "C", "why": "GlobalKey phải **duy nhất tại mọi thời điểm**; gắn cùng một instance cho hai widget đang cùng tồn tại sẽ khiến Flutter ném **assertion error** ('Multiple widgets used the same GlobalKey')."}, {"id": "M4-43", "n": 43, "bs": false, "stem": "When is `UniqueKey()` useful?", "opts": {"A": "To force Flutter to treat a widget as a completely new one", "B": "To identify items by value", "C": "To access State from outside", "D": "To improve performance"}, "ans": "A", "why": "`UniqueKey()` tạo key mới mỗi lần gọi → **buộc Flutter coi đó là widget hoàn toàn mới**, hủy Element/State cũ và dựng lại từ đầu. Hữu ích khi muốn reset state hoặc chạy lại animation."}, {"id": "M4-44", "n": 44, "bs": false, "stem": "Which widget rebuilds only a portion of the tree when a value changes, avoiding full rebuilds?", "opts": {"A": "`Builder` / `ValueListenableBuilder`", "B": "`Container`", "C": "`Scaffold`", "D": "`MaterialApp`"}, "ans": "A", "why": "**`Builder` / `ValueListenableBuilder`** khoanh vùng rebuild: chỉ phần cây bên trong builder được dựng lại khi giá trị đổi, thay vì rebuild cả widget cha. Đây là kỹ thuật tối ưu hiệu năng cơ bản."}, {"id": "M4-45", "n": 45, "bs": false, "stem": "What is the purpose of the `const` keyword before a widget constructor?", "opts": {"A": "It makes the widget immutable at runtime only", "B": "It allows Flutter to reuse the same instance and skip rebuilding that subtree", "C": "It disables the widget", "D": "It has no effect in Flutter"}, "ans": "B", "why": "`const` cho phép Flutter **tái sử dụng đúng instance đã tạo lúc compile-time**; khi rebuild, widget const được nhận ra là 'giống hệt' nên **bỏ qua việc dựng lại subtree đó**. Đây là tối ưu hiệu năng rẻ nhất mà hiệu quả nhất."}, {"id": "M4-BS-1", "n": 1, "bs": true, "stem": "In a group of `RadioListTile<String>` widgets, which property determines which tile is currently selected?", "opts": {"A": "`value`", "B": "`groupValue` (the tile whose `value == groupValue` is selected)", "C": "`selected`", "D": "`checked`"}, "ans": "B", "why": "Trong nhóm Radio, mỗi tile có `value` riêng, còn **`groupValue` là giá trị đang được chọn của cả nhóm**. Tile nào có `value == groupValue` thì hiển thị là đã chọn. Không có thuộc tính `selected`/`checked` ở đây."}, {"id": "M4-BS-2", "n": 2, "bs": true, "stem": "A group of RadioListTiles does not visually update when tapped. Most likely cause?", "opts": {"A": "`onChanged` rebuilds automatically", "B": "`groupValue` was not reassigned inside `setState`", "C": "Radios cannot be tapped", "D": "`value` must be an int"}, "ans": "B", "why": "Radio chỉ vẽ theo `groupValue` bạn truyền vào. Nếu trong `onChanged` bạn **không gán lại `groupValue` bên trong `setState`** thì UI không rebuild → nhìn như bấm không ăn. Đây là lỗi kinh điển."}, {"id": "M4-BS-3", "n": 3, "bs": true, "stem": "What are the default `min` and `max` values of a `Slider`?", "opts": {"A": "0 and 100", "B": "0.0 and 1.0", "C": "-1 and 1", "D": "No default; both are required"}, "ans": "B", "why": "`Slider` mặc định **`min = 0.0`, `max = 1.0`** (kiểu double). Muốn thang 0–100 phải khai báo `min: 0, max: 100` tường minh."}, {"id": "M4-BS-4", "n": 4, "bs": true, "stem": "What does the `divisions` property of a `Slider` do?", "opts": {"A": "Splits the slider into discrete steps (and enables the value label)", "B": "Sets the number of sliders", "C": "Divides the width in pixels", "D": "Controls animation speed"}, "ans": "A", "why": "**`divisions`** chia slider thành **các bước rời rạc** (thay vì trượt liên tục) và bật luôn nhãn giá trị (`label`) khi kéo. Ví dụ `divisions: 10` trên thang 0–100 → bước nhảy 10."}, {"id": "M4-BS-5", "n": 5, "bs": true, "stem": "Which Slider callback fires once when the user releases the thumb?", "opts": {"A": "`onChanged`", "B": "`onChangeStart`", "C": "`onChangeEnd`", "D": "`onReleased`"}, "ans": "C", "why": "**`onChangeEnd`** chỉ bắn **một lần khi người dùng nhả tay** — thích hợp để gọi API/lưu dữ liệu. `onChanged` bắn liên tục khi kéo (dùng để cập nhật UI), `onChangeStart` bắn khi bắt đầu chạm."}, {"id": "M4-BS-6", "n": 6, "bs": true, "stem": "You want a poster image to fill its box without distortion, cropping any excess. Which `BoxFit`?", "opts": {"A": "`fill`", "B": "`contain`", "C": "`cover`", "D": "`fitWidth`"}, "ans": "C", "why": "**`BoxFit.cover`** phóng ảnh giữ nguyên tỉ lệ cho tới khi phủ kín khung, **cắt bớt phần thừa** — đúng yêu cầu 'lấp đầy, không méo'. `fill` thì méo; `contain` để lại khoảng trống."}, {"id": "M4-BS-7", "n": 7, "bs": true, "stem": "Which `BoxFit` value stretches the image to fill the box, possibly distorting it?", "opts": {"A": "`cover`", "B": "`fill`", "C": "`contain`", "D": "`none`"}, "ans": "B", "why": "**`BoxFit.fill`** kéo giãn ảnh cho khớp khung **bất chấp tỉ lệ** → ảnh bị méo. Nhớ bộ ba: `cover` = phủ kín + cắt, `contain` = vừa khít + chừa trống, `fill` = méo."}, {"id": "M4-BS-8", "n": 8, "bs": true, "stem": "Which pair of properties makes a `BottomNavigationBar` track the selected tab?", "opts": {"A": "`selectedIndex` + `onSelect`", "B": "`currentIndex` + `onTap`", "C": "`activeTab` + `onChanged`", "D": "`index` + `onPressed`"}, "ans": "B", "why": "`BottomNavigationBar` dùng cặp **`currentIndex` (tab đang chọn) + `onTap` (callback nhận index mới)**; bạn lưu index vào state rồi `setState` để đổi tab. Các cặp tên còn lại không tồn tại."}, {"id": "M4-BS-9", "n": 9, "bs": true, "stem": "A `BottomNavigationBar` with 4 items hides labels of unselected tabs and animates them. How to keep all labels always visible?", "opts": {"A": "Set `type: BottomNavigationBarType.fixed`", "B": "Set `showLabels: true`", "C": "Remove two items", "D": "It is impossible"}, "ans": "A", "why": "Từ 4 item trở lên, BottomNavigationBar tự chuyển sang `type: shifting` (ẩn nhãn tab chưa chọn). Đặt **`type: BottomNavigationBarType.fixed`** để mọi nhãn luôn hiển thị. Không có thuộc tính `showLabels`."}, {"id": "M4-BS-10", "n": 10, "bs": true, "stem": "Which widget gives a circular leading avatar in a `ListTile`?", "opts": {"A": "`RoundBox`", "B": "`CircleAvatar`", "C": "`AvatarImage`", "D": "`ClipCircle`"}, "ans": "B", "why": "**`CircleAvatar`** là widget chuẩn cho avatar tròn, đặt vào `leading:` của `ListTile`. Nó nhận `backgroundImage`, `child` (chữ cái đầu) và `radius`."}]}, {"id": "M5", "kind": "mod", "chip": "M5", "title": "Module 5 — Navigation", "questions": [{"id": "M5-1", "n": 1, "bs": false, "stem": "Flutter's Navigator manages routes using which data structure?", "opts": {"A": "Queue", "B": "Stack", "C": "Tree", "D": "Linked list"}, "ans": "B", "why": "Navigator dùng cấu trúc Stack (LIFO): push đẩy màn hình lên đỉnh, pop lấy khỏi đỉnh, nên màn hình mở sau cùng luôn hiển thị trước tiên. ≠ Queue vì Queue là FIFO, không đúng với hành vi back."}, {"id": "M5-2", "n": 2, "bs": false, "stem": "Which method adds a new screen on top of the current one?", "opts": {"A": "`Navigator.pop()`", "B": "`Navigator.push()`", "C": "`Navigator.add()`", "D": "`Navigator.open()`"}, "ans": "B", "why": "`Navigator.push()` đẩy một route/màn hình mới lên đỉnh stack. ≠ `add`/`open` vì đó không phải API của Navigator."}, {"id": "M5-3", "n": 3, "bs": false, "stem": "What does `MaterialPageRoute` provide?", "opts": {"A": "Route naming", "B": "A platform-appropriate transition animation to the new screen", "C": "State management", "D": "Deep link handling"}, "ans": "B", "why": "`MaterialPageRoute` bọc màn hình và cung cấp hiệu ứng chuyển cảnh phù hợp nền tảng (slide trên Android, kiểu Cupertino trên iOS). Nó không lo việc đặt tên route hay quản lý state."}, {"id": "M5-4", "n": 4, "bs": false, "stem": "When using `await Navigator.push(...)`, what does the awaited value represent?", "opts": {"A": "The BuildContext", "B": "The value passed to `Navigator.pop(context, value)`", "C": "The route name", "D": "The widget that was returned"}, "ans": "B", "why": "`push` trả về một `Future`; giá trị await được chính là giá trị truyền vào `Navigator.pop(context, value)` khi màn hình đích đóng lại."}, {"id": "M5-5", "n": 5, "bs": false, "stem": "How do you return data to the previous screen?", "opts": {"A": "`Navigator.pop(context, result)`", "B": "`Navigator.return(result)`", "C": "`Navigator.send(result)`", "D": "Using a global variable only"}, "ans": "A", "why": "Trả dữ liệu về màn hình trước bằng tham số thứ hai của pop: `Navigator.pop(context, result)`; giá trị này khớp với Future mà `push` trả về."}, {"id": "M5-6", "n": 6, "bs": false, "stem": "Which method replaces the current route so the user cannot go back to it?", "opts": {"A": "`push`", "B": "`pushReplacement`", "C": "`popAndPush`", "D": "`pushNamed`"}, "ans": "B", "why": "`pushReplacement` thay route hiện tại bằng route mới và gỡ route cũ khỏi stack nên không back lại được. ≠ `push` vì push vẫn giữ màn hình cũ để quay lại."}, {"id": "M5-7", "n": 7, "bs": false, "stem": "After a successful login, which navigation method is most appropriate?", "opts": {"A": "`push`", "B": "`pushReplacement` or `pushAndRemoveUntil`", "C": "`pop`", "D": "`popUntil`"}, "ans": "B", "why": "Sau đăng nhập cần loại màn hình login khỏi stack: `pushReplacement` (thay một route) hoặc `pushAndRemoveUntil` (xóa nhiều route) để user không back về trang login."}, {"id": "M5-8", "n": 8, "bs": false, "stem": "Which removes all previous routes from the stack?", "opts": {"A": "`Navigator.pushAndRemoveUntil(context, route, (r) => false)`", "B": "`Navigator.clear()`", "C": "`Navigator.popAll()`", "D": "`Navigator.reset()`"}, "ans": "A", "why": "`pushAndRemoveUntil(context, route, (r) => false)`: predicate luôn trả false nên mọi route cũ bị gỡ, chỉ còn lại route mới. Các hàm clear/popAll/reset không tồn tại trong Navigator."}, {"id": "M5-9", "n": 9, "bs": false, "stem": "What does `Navigator.popUntil(context, ModalRoute.withName('/home'))` do?", "opts": {"A": "Pops routes until reaching the route named '/home'", "B": "Pops all routes", "C": "Pushes '/home'", "D": "Removes '/home'"}, "ans": "A", "why": "`popUntil` với `ModalRoute.withName('/home')` liên tục pop cho tới khi gặp route tên `/home` rồi dừng, giữ `/home` lại trên stack."}, {"id": "M5-10", "n": 10, "bs": false, "stem": "How do you check whether it is safe to pop?", "opts": {"A": "`Navigator.hasRoute()`", "B": "`Navigator.canPop(context)`", "C": "`context.mounted`", "D": "`route.isFirst`"}, "ans": "B", "why": "`Navigator.canPop(context)` trả về bool cho biết còn route để pop hay không, giúp tránh pop màn hình gốc gây lỗi."}, {"id": "M5-11", "n": 11, "bs": false, "stem": "What is the purpose of named routes?", "opts": {"A": "To manage themes", "B": "To allow navigation using string route names, declared centrally", "C": "To eliminate the need for BuildContext", "D": "To improve rendering speed"}, "ans": "B", "why": "Named routes cho phép điều hướng bằng chuỗi tên được khai báo tập trung (trong `routes`), giúp quản lý và tái sử dụng route dễ hơn."}, {"id": "M5-12", "n": 12, "bs": false, "stem": "Which property of MaterialApp maps route names to builders?", "opts": {"A": "`home`", "B": "`routes`", "C": "`navigatorObservers`", "D": "`pages`"}, "ans": "B", "why": "Thuộc tính `routes` của `MaterialApp` là map từ tên route sang builder widget. `home` chỉ đặt màn hình đầu tiên, không map tên route."}, {"id": "M5-13", "n": 13, "bs": false, "stem": "Declaring both `home:` and a `'/'` entry in `routes:` causes:", "opts": {"A": "The home widget to win", "B": "An assertion error", "C": "Two screens to render", "D": "Nothing unusual"}, "ans": "B", "why": "Cả `home:` và entry `'/'` trong `routes:` đều định nghĩa route gốc nên xung đột, Flutter ném assertion error. Chỉ được dùng một trong hai."}, {"id": "M5-14", "n": 14, "bs": false, "stem": "How do you pass arguments with a named route?", "opts": {"A": "`pushNamed(context, '/detail', arguments: obj)`", "B": "`pushNamed(context, '/detail', params: obj)`", "C": "Through the constructor only", "D": "Using global state only"}, "ans": "A", "why": "Truyền dữ liệu qua named route bằng tham số `arguments`: `pushNamed(context, '/detail', arguments: obj)`. `params` không phải API đúng."}, {"id": "M5-15", "n": 15, "bs": false, "stem": "How do you retrieve those arguments in the destination screen?", "opts": {"A": "`ModalRoute.of(context)!.settings.arguments`", "B": "`Navigator.of(context).arguments`", "C": "`context.arguments`", "D": "`RouteSettings.get()`"}, "ans": "A", "why": "Ở màn hình đích lấy dữ liệu qua `ModalRoute.of(context)!.settings.arguments` rồi ép kiểu về loại mong muốn."}, {"id": "M5-16", "n": 16, "bs": false, "stem": "Which callback handles routes not defined in the `routes` map?", "opts": {"A": "`onUnknownRoute`", "B": "`onGenerateRoute`", "C": "Both, with `onGenerateRoute` tried first", "D": "`onError`"}, "ans": "C", "why": "`onGenerateRoute` được gọi trước cho route không có trong `routes`; nếu nó trả null thì `onUnknownRoute` xử lý như phương án dự phòng, nên cả hai đều tham gia."}, {"id": "M5-17", "n": 17, "bs": false, "stem": "Which is the correct use of `onGenerateRoute`?", "opts": {"A": "Building routes dynamically, including parsing arguments and applying guards", "B": "Generating widget keys", "C": "Creating the theme", "D": "Handling HTTP routes"}, "ans": "A", "why": "`onGenerateRoute` dùng để dựng route động: phân tích tên/arguments, áp guard (kiểm tra quyền) rồi trả về route tương ứng."}, {"id": "M5-18", "n": 18, "bs": false, "stem": "Which problem was Navigator 2.0 (Router API) designed to solve?", "opts": {"A": "Slow animations", "B": "Declarative route state, deep links and browser URL synchronisation", "C": "Memory leaks", "D": "Widget rebuilds"}, "ans": "B", "why": "Navigator 2.0 (Router API) sinh ra để quản lý route theo kiểu khai báo (declarative), xử lý deep link và đồng bộ URL trình duyệt trên web."}, {"id": "M5-19", "n": 19, "bs": false, "stem": "Which component of Navigator 2.0 converts a URL into app state?", "opts": {"A": "RouterDelegate", "B": "RouteInformationParser", "C": "BackButtonDispatcher", "D": "NavigatorObserver"}, "ans": "B", "why": "`RouteInformationParser` chuyển URL/route information thành object trạng thái ứng dụng (parse URL thành state)."}, {"id": "M5-20", "n": 20, "bs": false, "stem": "Which component builds the list of `Page` objects from app state?", "opts": {"A": "RouterDelegate", "B": "RouteInformationParser", "C": "RouteSettings", "D": "PageRoute"}, "ans": "A", "why": "`RouterDelegate` lắng nghe app state và dựng danh sách các `Page` cho Navigator hiển thị (state thành pages). ≠ RouteInformationParser vì parser chỉ đọc URL, không dựng page."}, {"id": "M5-21", "n": 21, "bs": false, "stem": "Which popular package wraps Navigator 2.0 with a simpler API?", "opts": {"A": "provider", "B": "go_router", "C": "dio", "D": "hive"}, "ans": "B", "why": "`go_router` là package phổ biến bọc Navigator 2.0 với API đơn giản hơn. provider là state management, dio là HTTP client, hive là DB cục bộ."}, {"id": "M5-22", "n": 22, "bs": false, "stem": "On Android, deep links are configured in:", "opts": {"A": "`Info.plist`", "B": "`AndroidManifest.xml` using intent-filters", "C": "`build.gradle`", "D": "`pubspec.yaml`"}, "ans": "B", "why": "Trên Android, deep link được khai báo trong `AndroidManifest.xml` bằng `intent-filter`. `Info.plist` là của iOS."}, {"id": "M5-23", "n": 23, "bs": false, "stem": "Which categories are required in an intent-filter for a browsable deep link?", "opts": {"A": "`DEFAULT` and `BROWSABLE`", "B": "`LAUNCHER` and `MAIN`", "C": "`VIEW` only", "D": "`HOME`"}, "ans": "A", "why": "Intent-filter cho deep link mở từ trình duyệt cần category `DEFAULT` và `BROWSABLE`. `LAUNCHER`/`MAIN` chỉ để hiện icon app ở màn hình chính."}, {"id": "M5-24", "n": 24, "bs": false, "stem": "On iOS, a custom URL scheme is declared using:", "opts": {"A": "`CFBundleURLTypes` in Info.plist", "B": "`AndroidManifest.xml`", "C": "`Podfile`", "D": "`main.dart`"}, "ans": "A", "why": "Trên iOS khai báo custom URL scheme bằng khóa `CFBundleURLTypes` trong `Info.plist`."}, {"id": "M5-25", "n": 25, "bs": false, "stem": "What is the security advantage of App Links / Universal Links over custom URL schemes?", "opts": {"A": "They are faster", "B": "Domain ownership is verified, so other apps cannot hijack the link", "C": "They work offline", "D": "They do not require a browser"}, "ans": "B", "why": "App Links/Universal Links xác minh quyền sở hữu domain (qua file assetlinks.json/AASA) nên app khác không thể chiếm link, đó là ưu điểm bảo mật so với custom scheme dễ bị giả mạo."}, {"id": "M5-26", "n": 26, "bs": false, "stem": "Which property of MaterialApp sets the first route shown?", "opts": {"A": "`initialRoute`", "B": "`startRoute`", "C": "`firstScreen`", "D": "`defaultRoute`"}, "ans": "A", "why": "`initialRoute` của `MaterialApp` xác định route đầu tiên hiển thị khi mở app."}, {"id": "M5-27", "n": 27, "bs": false, "stem": "Which widget shows a modal dialog?", "opts": {"A": "`Navigator.push`", "B": "`showDialog()`", "C": "`showModal()`", "D": "`Dialog.open()`"}, "ans": "B", "why": "`showDialog()` hiển thị hộp thoại modal đè lên màn hình. ≠ `Navigator.push` vì push mở màn hình đầy đủ, không phải dialog."}, {"id": "M5-28", "n": 28, "bs": false, "stem": "How do you close a dialog and return a value?", "opts": {"A": "`Navigator.pop(context, value)`", "B": "`dialog.close(value)`", "C": "`return value;`", "D": "`Navigator.dismiss()`"}, "ans": "A", "why": "Dialog cũng nằm trên Navigator stack; đóng và trả giá trị bằng `Navigator.pop(context, value)`, giá trị này về Future của `showDialog`."}, {"id": "M5-29", "n": 29, "bs": false, "stem": "Which widget intercepts the Android back button?", "opts": {"A": "`WillPopScope` / `PopScope`", "B": "`BackButton`", "C": "`Navigator.observer`", "D": "`SystemNavigator`"}, "ans": "A", "why": "`WillPopScope` (hoặc `PopScope` ở bản mới) chặn/điều khiển nút back của Android để xác nhận hoặc ngăn thoát màn hình."}, {"id": "M5-30", "n": 30, "bs": false, "stem": "Which is the correct way to implement a guarded (auth-protected) route?", "opts": {"A": "Check auth state in `onGenerateRoute`, or use a wrapper widget / router redirect", "B": "Hide the button that navigates there", "C": "Use `pushReplacement` only", "D": "It is not possible in Flutter"}, "ans": "A", "why": "Route được bảo vệ: kiểm tra trạng thái đăng nhập trong `onGenerateRoute`, hoặc dùng widget bọc / redirect của router để chuyển hướng nếu chưa xác thực. Ẩn nút không đủ vì vẫn có thể vào bằng deep link."}, {"id": "M5-BS-1", "n": 1, "bs": true, "stem": "How does `Navigator.maybePop(context)` differ from `Navigator.pop(context)`?", "opts": {"A": "`maybePop` pops all routes", "B": "They are identical", "C": "`maybePop` pops only if allowed (consults `WillPopScope`/`PopScope`); `pop` pops unconditionally", "D": "`maybePop` cannot return a value"}, "ans": "C", "why": "`maybePop` chỉ pop nếu được phép (hỏi ý kiến `WillPopScope`/`PopScope`, ví dụ hộp thoại xác nhận thoát), còn `pop` pop vô điều kiện."}, {"id": "M5-BS-2", "n": 2, "bs": true, "stem": "In Navigator 2.0's declarative API, how do you go back to the previous screen?", "opts": {"A": "Change the app state so the corresponding `Page` is removed from the `pages` list", "B": "Call `Navigator.pop()`", "C": "Call `pushReplacement`", "D": "Reset the RouterDelegate"}, "ans": "A", "why": "Trong API khai báo của Navigator 2.0, muốn quay lại ta thay đổi app state để `Page` tương ứng bị bỏ khỏi danh sách `pages`, Navigator tự dựng lại; không gọi `pop` thủ công."}, {"id": "M5-BS-3", "n": 3, "bs": true, "stem": "In a `RouterDelegate`, which callback runs when the system back button is pressed and must sync the app state?", "opts": {"A": "`onGenerateRoute`", "B": "`didPop` only", "C": "`onBack`", "D": "`onPopPage`"}, "ans": "D", "why": "Trong `RouterDelegate`, callback `onPopPage` của Navigator chạy khi nhấn back hệ thống; tại đây phải đồng bộ app state (gỡ page tương ứng) rồi trả về true/false."}, {"id": "M5-BS-4", "n": 4, "bs": true, "stem": "A `RouterDelegate` mixes in `ChangeNotifier`. What must you call after mutating its state so the Navigator rebuilds?", "opts": {"A": "`setState()`", "B": "`notifyListeners()`", "C": "`rebuild()`", "D": "`markNeedsBuild()`"}, "ans": "B", "why": "`RouterDelegate` trộn `ChangeNotifier` nên sau khi thay đổi state phải gọi `notifyListeners()` để Router/Navigator dựng lại giao diện."}, {"id": "M5-BS-5", "n": 5, "bs": true, "stem": "Which class wraps a widget as a page in the Navigator 2.0 `pages` list?", "opts": {"A": "`MaterialPageRoute`", "B": "`RouteSettings`", "C": "`MaterialPage`", "D": "`PageBuilder`"}, "ans": "C", "why": "`MaterialPage` bọc một widget thành page trong danh sách `pages` của Navigator 2.0. ≠ `MaterialPageRoute` vì cái đó dùng cho API mệnh lệnh (push/pop)."}, {"id": "M5-BS-6", "n": 6, "bs": true, "stem": "For iOS Universal Links, where must the `apple-app-site-association` (AASA) file be hosted?", "opts": {"A": "At `https://<domain>/.well-known/apple-app-site-association`", "B": "In `Info.plist`", "C": "Inside the app bundle", "D": "In `AndroidManifest.xml`"}, "ans": "A", "why": "File AASA của Universal Links phải được host tại `https://<domain>/.well-known/apple-app-site-association` để iOS xác minh quyền sở hữu domain."}, {"id": "M5-BS-7", "n": 7, "bs": true, "stem": "Which command tests an Android custom-scheme deep link from a terminal?", "opts": {"A": "`flutter run --deep-link`", "B": "`adb deeplink myapp://`", "C": "`gradle openLink`", "D": "`adb shell am start -a android.intent.action.VIEW -d \"myapp://movies?id=12\"`"}, "ans": "D", "why": "Test deep link custom scheme trên Android từ terminal bằng `adb shell am start -a android.intent.action.VIEW -d 'myapp://movies?id=12'`."}, {"id": "M5-BS-8", "n": 8, "bs": true, "stem": "What is \"lifting state up\" in Flutter?", "opts": {"A": "Moving state to a global variable", "B": "Moving shared state to the nearest common ancestor, passing data down and callbacks up", "C": "Persisting state to disk", "D": "Simply calling setState more often"}, "ans": "B", "why": "'Lifting state up' là dời state dùng chung lên widget cha chung gần nhất, rồi truyền dữ liệu xuống và callback lên, để nhiều con cùng chia sẻ và cập nhật một state."}, {"id": "M5-BS-9", "n": 9, "bs": true, "stem": "Which method of an `InheritedWidget` decides whether its dependents should rebuild?", "opts": {"A": "`of(context)`", "B": "`build()`", "C": "`updateShouldNotify(oldWidget)`", "D": "`notifyListeners()`"}, "ans": "C", "why": "`updateShouldNotify(oldWidget)` của `InheritedWidget` quyết định các widget phụ thuộc có cần rebuild hay không khi widget này được dựng lại."}, {"id": "M5-BS-10", "n": 10, "bs": true, "stem": "If `updateShouldNotify` returns `false`, what happens when a new instance of the InheritedWidget is built with a different value?", "opts": {"A": "Dependents do NOT rebuild", "B": "Dependents rebuild anyway", "C": "A compile error occurs", "D": "The app crashes"}, "ans": "A", "why": "Nếu `updateShouldNotify` trả `false` thì dù giá trị mới khác giá trị cũ, các dependent vẫn KHÔNG rebuild (đây là chỗ tối ưu hiệu năng của InheritedWidget)."}, {"id": "M5-BS-11", "n": 11, "bs": true, "stem": "Which context method reads an InheritedWidget WITHOUT registering a dependency (so it won't rebuild)?", "opts": {"A": "`dependOnInheritedWidgetOfExactType<T>()`", "B": "`context.watch<T>()`", "C": "`of(context)`", "D": "`getInheritedWidgetOfExactType<T>()`"}, "ans": "D", "why": "`getInheritedWidgetOfExactType<T>()` đọc InheritedWidget mà KHÔNG đăng ký phụ thuộc nên không rebuild khi nó đổi; còn `dependOnInheritedWidgetOfExactType` thì có đăng ký nên sẽ rebuild."}]}, {"id": "M6", "kind": "mod", "chip": "M6", "title": "Module 6 — Layout & Responsive Design", "questions": [{"id": "M6-1", "n": 1, "bs": false, "stem": "Which sentence describes Flutter's layout algorithm?", "opts": {"A": "Sizes go down, constraints go up", "B": "Constraints go down, sizes go up, parent sets position", "C": "Every widget decides its own absolute position", "D": "Layout is computed by the operating system"}, "ans": "B", "why": "Thuật toán layout Flutter: cha truyền constraints xuống con, con chọn size trong phạm vi constraints rồi báo lên, cha đặt vị trí cho con. Đúng câu 'Constraints go down, sizes go up, parent sets position'."}, {"id": "M6-2", "n": 2, "bs": false, "stem": "In a `Row`, which is the main axis?", "opts": {"A": "Vertical", "B": "Horizontal", "C": "Depends on textDirection only", "D": "Both"}, "ans": "B", "why": "Trong `Row`, trục chính (main axis) nằm ngang; các con xếp theo chiều ngang."}, {"id": "M6-3", "n": 3, "bs": false, "stem": "In a `Column`, `crossAxisAlignment` controls alignment along which axis?", "opts": {"A": "Vertical", "B": "Horizontal", "C": "Diagonal", "D": "Z-axis"}, "ans": "B", "why": "Trong `Column`, main axis là trục dọc nên `crossAxisAlignment` (trục phụ) canh theo chiều ngang."}, {"id": "M6-4", "n": 4, "bs": false, "stem": "Which `MainAxisAlignment` places no space before the first or after the last child?", "opts": {"A": "`spaceAround`", "B": "`spaceEvenly`", "C": "`spaceBetween`", "D": "`center`"}, "ans": "C", "why": "`spaceBetween` chia đều khoảng trống giữa các con nhưng không chừa khoảng trước con đầu và sau con cuối."}, {"id": "M6-5", "n": 5, "bs": false, "stem": "With `spaceAround`, the space at the two ends is:", "opts": {"A": "Equal to the space between children", "B": "Half the space between children", "C": "Zero", "D": "Double the space between children"}, "ans": "B", "why": "`spaceAround` cho mỗi con một khoảng trống hai bên bằng nhau; hai con cạnh nhau cộng lại thành khoảng đôi, nên khoảng ở hai đầu bằng nửa khoảng giữa hai con."}, {"id": "M6-6", "n": 6, "bs": false, "stem": "Which makes all gaps (including edges) equal?", "opts": {"A": "`spaceBetween`", "B": "`spaceAround`", "C": "`spaceEvenly`", "D": "`start`"}, "ans": "C", "why": "`spaceEvenly` chia đều tất cả khoảng trống kể cả hai đầu, nên mọi khoảng đều bằng nhau."}, {"id": "M6-7", "n": 7, "bs": false, "stem": "What does `mainAxisSize: MainAxisSize.min` do?", "opts": {"A": "Makes the Row/Column as small as its children", "B": "Makes it fill the parent", "C": "Hides overflow", "D": "Sets minimum width to zero"}, "ans": "A", "why": "`mainAxisSize: MainAxisSize.min` khiến Row/Column co lại vừa đúng tổng kích thước các con thay vì chiếm hết không gian cha (mặc định là max)."}, {"id": "M6-8", "n": 8, "bs": false, "stem": "What is the key difference between `Flexible` and `Expanded`?", "opts": {"A": "Flexible works only in Column, Expanded only in Row", "B": "`Expanded` is shorthand for `Flexible(fit: FlexFit.tight)`; Flexible can be loose or tight", "C": "Flexible always forces tight constraints", "D": "There is no difference"}, "ans": "B", "why": "`Expanded` chính là `Flexible(fit: FlexFit.tight)`, bắt con lấp đầy phần được chia; còn `Flexible` mặc định `loose` nên con chỉ lấy không gian cần, và cho phép chọn tight hoặc loose."}, {"id": "M6-9", "n": 9, "bs": false, "stem": "What does `flex: 2` on an Expanded mean?", "opts": {"A": "Two children", "B": "It receives twice the share of free space compared to `flex: 1`", "C": "Two pixels", "D": "Second priority"}, "ans": "B", "why": "`flex: 2` nghĩa là con nhận gấp đôi phần không gian trống so với con `flex: 1` (chia theo tỉ lệ hệ số flex)."}, {"id": "M6-10", "n": 10, "bs": false, "stem": "Where can `Expanded` be used?", "opts": {"A": "Inside any widget", "B": "Only as a direct child of Row, Column or Flex", "C": "Only inside Stack", "D": "Only inside ListView"}, "ans": "B", "why": "`Expanded` chỉ dùng làm con trực tiếp của `Row`, `Column` hoặc `Flex`; đặt trong widget khác sẽ báo lỗi."}, {"id": "M6-11", "n": 11, "bs": false, "stem": "What is `Spacer()` equivalent to?", "opts": {"A": "`SizedBox()`", "B": "`Expanded(child: SizedBox())`", "C": "`Padding`", "D": "`Divider`"}, "ans": "B", "why": "`Spacer()` tương đương `Expanded(child: SizedBox())`, tạo khoảng trống co giãn để đẩy các con ra xa nhau."}, {"id": "M6-12", "n": 12, "bs": false, "stem": "\"RenderFlex overflowed by 32 pixels\" means:", "opts": {"A": "The device is out of memory", "B": "Children require more space than the Row/Column has available", "C": "Too many widgets in the tree", "D": "An image failed to load"}, "ans": "B", "why": "'RenderFlex overflowed' nghĩa là tổng kích thước các con vượt quá không gian mà Row/Column có, không liên quan bộ nhớ hay số lượng widget."}, {"id": "M6-13", "n": 13, "bs": false, "stem": "Which is NOT a valid fix for a horizontal overflow in a Row?", "opts": {"A": "Wrap a child in `Expanded`", "B": "Wrap the Row in `SingleChildScrollView(scrollDirection: Axis.horizontal)`", "C": "Use `Wrap` instead of `Row`", "D": "Set `overflow: hidden` on the Row"}, "ans": "D", "why": "`Row` không có thuộc tính `overflow: hidden` nên đó KHÔNG phải cách sửa hợp lệ. Các cách đúng là bọc con bằng `Expanded`, cuộn ngang bằng SingleChildScrollView, hoặc thay bằng `Wrap`."}, {"id": "M6-14", "n": 14, "bs": false, "stem": "Placing a `ListView` directly inside a `Column` throws an unbounded height error. Which fixes it?", "opts": {"A": "Wrap the ListView in `Expanded`", "B": "Set `shrinkWrap: true` on the ListView", "C": "Give the ListView a fixed height with SizedBox", "D": "All of the above"}, "ans": "D", "why": "`ListView` đặt trực tiếp trong `Column` không có chiều cao xác định gây lỗi unbounded height; cả ba cách đều hợp lệ (bọc `Expanded`, đặt `shrinkWrap: true`, hoặc cho chiều cao cố định), nên chọn 'All of the above'."}, {"id": "M6-15", "n": 15, "bs": false, "stem": "In a `Stack`, which child appears on top?", "opts": {"A": "The first", "B": "The last", "C": "The largest", "D": "The one with highest elevation"}, "ans": "B", "why": "Trong `Stack`, con được vẽ sau (con cuối trong danh sách children) nằm trên cùng, chồng lên các con trước."}, {"id": "M6-16", "n": 16, "bs": false, "stem": "Which widget positions a child at exact offsets inside a Stack?", "opts": {"A": "`Align`", "B": "`Positioned`", "C": "`Offset`", "D": "`Placed`"}, "ans": "B", "why": "`Positioned` đặt con tại tọa độ chính xác (top/left/right/bottom) bên trong `Stack`."}, {"id": "M6-17", "n": 17, "bs": false, "stem": "`Positioned` can only be used as a child of:", "opts": {"A": "Row", "B": "Column", "C": "Stack", "D": "Container"}, "ans": "C", "why": "`Positioned` chỉ hợp lệ khi là con trực tiếp của `Stack`; đặt nơi khác sẽ báo lỗi."}, {"id": "M6-18", "n": 18, "bs": false, "stem": "Which GridView constructor is simplest when the number of columns is fixed?", "opts": {"A": "`GridView.count`", "B": "`GridView.extent`", "C": "`GridView.builder`", "D": "`GridView.custom`"}, "ans": "A", "why": "`GridView.count` đơn giản nhất khi biết trước số cột cố định, chỉ cần đặt `crossAxisCount`."}, {"id": "M6-19", "n": 19, "bs": false, "stem": "Which GridView constructor adapts the number of columns to the available width?", "opts": {"A": "`GridView.count`", "B": "`GridView.extent` (or `SliverGridDelegateWithMaxCrossAxisExtent`)", "C": "`GridView.builder` only", "D": "`GridView()`"}, "ans": "B", "why": "`GridView.extent` (dùng delegate `SliverGridDelegateWithMaxCrossAxisExtent`) tự tính số cột theo chiều rộng khả dụng, phù hợp responsive."}, {"id": "M6-20", "n": 20, "bs": false, "stem": "Which property of the grid delegate controls the width-to-height ratio of each cell?", "opts": {"A": "`crossAxisCount`", "B": "`childAspectRatio`", "C": "`mainAxisSpacing`", "D": "`cellRatio`"}, "ans": "B", "why": "`childAspectRatio` của grid delegate quyết định tỉ lệ rộng:cao của mỗi ô lưới."}, {"id": "M6-21", "n": 21, "bs": false, "stem": "Which widget should you use for a 2D scrollable grid with a fixed number of columns?", "opts": {"A": "`Table`", "B": "`Wrap`", "C": "`GridView.count`", "D": "`ListView.builder`"}, "ans": "C", "why": "Lưới cuộn 2D với số cột cố định dùng `GridView.count`. `Table`/`Wrap`/`ListView` không phù hợp cho lưới cuộn nhiều cột."}, {"id": "M6-22", "n": 22, "bs": false, "stem": "What is the difference between `Wrap` and `Row`?", "opts": {"A": "`Wrap` moves children to the next line when space runs out; Row overflows", "B": "`Wrap` is scrollable", "C": "`Row` supports spacing, Wrap does not", "D": "They are the same"}, "ans": "A", "why": "`Wrap` tự xuống dòng khi hết chỗ, còn `Row` không xuống dòng mà bị tràn (overflow)."}, {"id": "M6-23", "n": 23, "bs": false, "stem": "`MediaQuery.of(context).size` returns:", "opts": {"A": "The size of the parent widget", "B": "The size of the screen/window", "C": "The size of the child", "D": "The size in physical pixels only"}, "ans": "B", "why": "`MediaQuery.of(context).size` trả kích thước màn hình/cửa sổ (theo logical pixels), không phải kích thước cha hay con."}, {"id": "M6-24", "n": 24, "bs": false, "stem": "`LayoutBuilder` gives you:", "opts": {"A": "The screen size", "B": "The constraints passed down by the parent widget", "C": "The device orientation only", "D": "The pixel ratio"}, "ans": "B", "why": "`LayoutBuilder` cung cấp constraints mà cha truyền xuống, giúp bố cục theo không gian thực tế của vùng chứa widget."}, {"id": "M6-25", "n": 25, "bs": false, "stem": "For component-level responsiveness, which is preferred?", "opts": {"A": "`MediaQuery`", "B": "`LayoutBuilder`", "C": "`Builder`", "D": "`OrientationBuilder`"}, "ans": "B", "why": "Ở mức component nên dùng `LayoutBuilder` vì nó phản ánh không gian mà cha cấp cho widget đó, không phụ thuộc toàn màn hình như `MediaQuery`."}, {"id": "M6-26", "n": 26, "bs": false, "stem": "Which widget keeps content clear of notches and system bars?", "opts": {"A": "`Padding`", "B": "`SafeArea`", "C": "`Scaffold`", "D": "`Container`"}, "ans": "B", "why": "`SafeArea` chèn padding để tránh tai thỏ (notch), status bar và các thanh hệ thống che nội dung."}, {"id": "M6-27", "n": 27, "bs": false, "stem": "How do you obtain the current orientation?", "opts": {"A": "`MediaQuery.of(context).orientation` or `OrientationBuilder`", "B": "`Device.orientation`", "C": "`Scaffold.orientation`", "D": "`Theme.of(context).orientation`"}, "ans": "A", "why": "Lấy hướng màn hình qua `MediaQuery.of(context).orientation` hoặc widget `OrientationBuilder`."}, {"id": "M6-28", "n": 28, "bs": false, "stem": "Which widget scales its child to fit the available space?", "opts": {"A": "`FittedBox`", "B": "`AspectRatio`", "C": "`Expanded`", "D": "`Transform`"}, "ans": "A", "why": "`FittedBox` co giãn (scale) con vừa với không gian sẵn có."}, {"id": "M6-29", "n": 29, "bs": false, "stem": "Which widget forces a child to a specific width:height ratio?", "opts": {"A": "`FittedBox`", "B": "`AspectRatio`", "C": "`SizedBox`", "D": "`FractionallySizedBox`"}, "ans": "B", "why": "`AspectRatio` ép con giữ đúng tỉ lệ rộng:cao được chỉ định. ≠ FittedBox vì FittedBox scale nội dung chứ không ép tỉ lệ."}, {"id": "M6-30", "n": 30, "bs": false, "stem": "A common breakpoint set for responsive design is:", "opts": {"A": "<600 mobile, 600–1024 tablet, >1024 desktop", "B": "<200, 200–400, >400", "C": "<1000, 1000–2000, >2000", "D": "There are no conventions"}, "ans": "A", "why": "Bộ breakpoint phổ biến: dưới 600 là mobile, 600 đến 1024 là tablet, trên 1024 là desktop."}, {"id": "M6-31", "n": 31, "bs": false, "stem": "Which widget gives a child a size relative to its parent (e.g. 50% width)?", "opts": {"A": "`FractionallySizedBox`", "B": "`Expanded`", "C": "`SizedBox`", "D": "`Flexible`"}, "ans": "A", "why": "`FractionallySizedBox` cho con kích thước theo phần trăm của cha (ví dụ widthFactor 0.5 là 50% chiều rộng)."}, {"id": "M6-32", "n": 32, "bs": false, "stem": "What does `IntrinsicHeight` do, and why should it be used sparingly?", "opts": {"A": "It forces children to the same height but is computationally expensive", "B": "It caches heights", "C": "It is deprecated", "D": "It only works in Stack"}, "ans": "A", "why": "`IntrinsicHeight` ép các con cùng chiều cao nhưng phải đo trước kích thước nội dung nên tốn tính toán, do đó dùng hạn chế."}, {"id": "M6-33", "n": 33, "bs": false, "stem": "Which scroll widget makes a non-scrollable layout scrollable when the keyboard appears?", "opts": {"A": "`ListView`", "B": "`SingleChildScrollView`", "C": "`PageView`", "D": "`NestedScrollView`"}, "ans": "B", "why": "`SingleChildScrollView` biến một layout tĩnh thành cuộn được khi bàn phím hiện lên, tránh overflow."}, {"id": "M6-34", "n": 34, "bs": false, "stem": "What is `shrinkWrap: true` used for on a ListView?", "opts": {"A": "Makes the ListView size itself to its content instead of expanding", "B": "Compresses items", "C": "Enables lazy loading", "D": "Hides the scrollbar"}, "ans": "A", "why": "`shrinkWrap: true` khiến `ListView` tự co kích thước vừa nội dung thay vì chiếm hết không gian cha."}, {"id": "M6-35", "n": 35, "bs": false, "stem": "Why is `shrinkWrap: true` discouraged for very long lists?", "opts": {"A": "It disables scrolling", "B": "It forces the list to measure all children, losing the lazy-building performance benefit", "C": "It causes overflow", "D": "It breaks the scroll physics"}, "ans": "B", "why": "`shrinkWrap: true` bắt list đo toàn bộ con ngay lập tức, mất lợi ích lazy-build nên không nên dùng cho list rất dài (kém hiệu năng)."}, {"id": "M6-BS-1", "n": 1, "bs": true, "stem": "What is the difference between Responsive and Adaptive UI?", "opts": {"A": "Responsive changes with available space; Adaptive changes with device type/platform", "B": "They are the same", "C": "Responsive is only for web", "D": "Adaptive only changes colours"}, "ans": "A", "why": "Responsive thay đổi bố cục theo không gian khả dụng (kích thước/chiều rộng); Adaptive thay đổi theo loại thiết bị/nền tảng (phone vs tablet, iOS vs Android)."}, {"id": "M6-BS-2", "n": 2, "bs": true, "stem": "Switching from `BottomNavigationBar` on phones to `NavigationRail` on tablets is an example of:", "opts": {"A": "Responsive UI", "B": "Adaptive UI", "C": "Orientation handling", "D": "Theming"}, "ans": "B", "why": "Đổi `BottomNavigationBar` (phone) sang `NavigationRail` (tablet) là thay đổi theo loại thiết bị, nên là Adaptive UI."}, {"id": "M6-BS-3", "n": 3, "bs": true, "stem": "Changing a `GridView` from 2 columns to 4 columns as width grows is an example of:", "opts": {"A": "Adaptive UI", "B": "Responsive UI", "C": "Deep linking", "D": "State lifting"}, "ans": "B", "why": "Đổi `GridView` từ 2 cột sang 4 cột khi chiều rộng tăng là thay đổi theo không gian, nên là Responsive UI."}, {"id": "M6-BS-4", "n": 4, "bs": true, "stem": "Which widget provides a vertical navigation bar suited to tablet/desktop widths?", "opts": {"A": "`Drawer`", "B": "`NavigationRail`", "C": "`TabBar`", "D": "`BottomNavigationBar`"}, "ans": "B", "why": "`NavigationRail` là thanh điều hướng dọc phù hợp với bề rộng của tablet/desktop."}, {"id": "M6-BS-5", "n": 5, "bs": true, "stem": "Which widget is best for a horizontal list of genre chips that should wrap to the next line when space runs out?", "opts": {"A": "`Row`", "B": "`Wrap`", "C": "`ListView`", "D": "`Column`"}, "ans": "B", "why": "`Wrap` phù hợp cho danh sách chip thể loại vì nó tự xuống dòng khi hết chỗ. ≠ Row vì Row sẽ tràn (overflow)."}, {"id": "M6-BS-6", "n": 6, "bs": true, "stem": "Which Flutter DevTools feature helps inspect constraints and flex when debugging layout?", "opts": {"A": "Layout Explorer (Flutter Inspector)", "B": "Timeline", "C": "Memory view", "D": "Network view"}, "ans": "A", "why": "Layout Explorer trong Flutter Inspector (DevTools) giúp xem constraints và flex khi debug bố cục."}]}, {"id": "M7", "kind": "mod", "chip": "M7", "title": "Module 7 — Forms & Validation", "questions": [{"id": "M7-1", "n": 1, "bs": false, "stem": "What is the main difference between `TextField` and `TextFormField`?", "opts": {"A": "TextFormField does not support decoration", "B": "TextFormField supports validation and integrates with `Form`", "C": "TextField has a controller while TextFormField does not", "D": "TextField cannot accept input"}, "ans": "B", "why": "`TextFormField` hỗ trợ `validator` và tích hợp với widget `Form` (validate/save chung), còn `TextField` là ô nhập cơ bản không có validation tích hợp."}, {"id": "M7-2", "n": 2, "bs": false, "stem": "What must a `validator` return when the input is valid?", "opts": {"A": "`true`", "B": "`null`", "C": "An empty string", "D": "`false`"}, "ans": "B", "why": "Khi input hợp lệ, `validator` trả về `null` để báo không có lỗi."}, {"id": "M7-3", "n": 3, "bs": false, "stem": "What does a validator return when input is invalid?", "opts": {"A": "`false`", "B": "The error message as a String", "C": "`null`", "D": "An Exception"}, "ans": "B", "why": "Khi input không hợp lệ, `validator` trả về chuỗi (String) thông báo lỗi để hiển thị dưới ô nhập."}, {"id": "M7-4", "n": 4, "bs": false, "stem": "Which key type is required to access a Form's state?", "opts": {"A": "`ValueKey`", "B": "`GlobalKey<FormState>`", "C": "`UniqueKey`", "D": "`ObjectKey`"}, "ans": "B", "why": "Muốn truy cập trạng thái của Form cần `GlobalKey<FormState>` gán vào `Form(key: ...)`."}, {"id": "M7-5", "n": 5, "bs": false, "stem": "Which call runs every field's validator?", "opts": {"A": "`_formKey.currentState!.validate()`", "B": "`_formKey.validate()`", "C": "`Form.validate(context)`", "D": "`_formKey.currentState!.save()`"}, "ans": "A", "why": "`_formKey.currentState!.validate()` chạy validator của mọi field và trả true nếu tất cả hợp lệ."}, {"id": "M7-6", "n": 6, "bs": false, "stem": "What does `_formKey.currentState!.save()` do?", "opts": {"A": "Writes the form to disk", "B": "Invokes every field's `onSaved` callback", "C": "Validates the form", "D": "Submits it to the server"}, "ans": "B", "why": "`save()` gọi callback `onSaved` của từng field để lưu giá trị vào biến của bạn; nó không ghi ra đĩa hay gửi server."}, {"id": "M7-7", "n": 7, "bs": false, "stem": "Which method clears all fields and validation errors?", "opts": {"A": "`reset()`", "B": "`clear()`", "C": "`dispose()`", "D": "`refresh()`"}, "ans": "A", "why": "`reset()` xóa nội dung mọi field và xóa lỗi validation, đưa Form về trạng thái ban đầu."}, {"id": "M7-8", "n": 8, "bs": false, "stem": "Which `AutovalidateMode` validates only after the user has interacted with a field?", "opts": {"A": "`always`", "B": "`disabled`", "C": "`onUserInteraction`", "D": "`onSubmit`"}, "ans": "C", "why": "`AutovalidateMode.onUserInteraction` chỉ validate sau khi người dùng đã tương tác với field, tránh báo lỗi ngay khi form vừa mở."}, {"id": "M7-9", "n": 9, "bs": false, "stem": "What is the default `AutovalidateMode`?", "opts": {"A": "`always`", "B": "`disabled`", "C": "`onUserInteraction`", "D": "There is no default"}, "ans": "B", "why": "Mặc định `AutovalidateMode` là `disabled`, tức chỉ validate khi bạn gọi `validate()` thủ công."}, {"id": "M7-10", "n": 10, "bs": false, "stem": "Why must a `TextEditingController` be disposed?", "opts": {"A": "To free the memory and listeners it holds, preventing a leak", "B": "To clear the text", "C": "It is optional", "D": "To reset validation"}, "ans": "A", "why": "Phải `dispose` `TextEditingController` để giải phóng bộ nhớ và các listener nó giữ, tránh rò rỉ (memory leak)."}, {"id": "M7-11", "n": 11, "bs": false, "stem": "Where should `controller.dispose()` be called?", "opts": {"A": "In `initState()`", "B": "In `dispose()` of the State", "C": "In `build()`", "D": "In `didUpdateWidget()`"}, "ans": "B", "why": "Gọi `controller.dispose()` trong `dispose()` của State (giai đoạn widget bị gỡ khỏi cây), không phải trong initState hay build."}, {"id": "M7-12", "n": 12, "bs": false, "stem": "How do you read the current text of a controlled field?", "opts": {"A": "`controller.text`", "B": "`controller.value`", "C": "`field.text`", "D": "`controller.getText()`"}, "ans": "A", "why": "Đọc nội dung hiện tại của field điều khiển qua `controller.text`."}, {"id": "M7-13", "n": 13, "bs": false, "stem": "Which property hides the typed characters for a password field?", "opts": {"A": "`hideText: true`", "B": "`obscureText: true`", "C": "`password: true`", "D": "`secure: true`"}, "ans": "B", "why": "`obscureText: true` ẩn ký tự nhập (hiển thị dạng chấm) cho ô mật khẩu."}, {"id": "M7-14", "n": 14, "bs": false, "stem": "Which property shows an email-optimised keyboard?", "opts": {"A": "`keyboardType: TextInputType.emailAddress`", "B": "`inputType: email`", "C": "`keyboard: 'email'`", "D": "`emailMode: true`"}, "ans": "A", "why": "`keyboardType: TextInputType.emailAddress` hiển thị bàn phím tối ưu cho email (có sẵn @ và dấu chấm)."}, {"id": "M7-15", "n": 15, "bs": false, "stem": "Which property changes the action button in the bottom-right of the keyboard?", "opts": {"A": "`textInputAction`", "B": "`keyboardAction`", "C": "`submitButton`", "D": "`actionKey`"}, "ans": "A", "why": "`textInputAction` đổi nút hành động ở góc phải dưới bàn phím (ví dụ next, done, search)."}, {"id": "M7-16", "n": 16, "bs": false, "stem": "Which decoration property displays a persistent error message?", "opts": {"A": "`helperText`", "B": "`errorText`", "C": "`hintText`", "D": "`labelText`"}, "ans": "B", "why": "`errorText` trong `InputDecoration` hiển thị thông báo lỗi cố định dưới ô nhập. ≠ helperText/hintText vì chúng chỉ là gợi ý, không phải lỗi."}, {"id": "M7-17", "n": 17, "bs": false, "stem": "What is the difference between `labelText` and `hintText`?", "opts": {"A": "`labelText` floats above when focused/filled; `hintText` shows only while empty", "B": "They are identical", "C": "`hintText` is always visible", "D": "`labelText` is for errors"}, "ans": "A", "why": "`labelText` nổi lên phía trên khi ô được focus hoặc có nội dung, còn `hintText` chỉ hiện gợi ý khi ô đang trống."}, {"id": "M7-18", "n": 18, "bs": false, "stem": "Which restricts input to digits only while typing?", "opts": {"A": "`inputFormatters: [FilteringTextInputFormatter.digitsOnly]`", "B": "`keyboardType: TextInputType.number` alone", "C": "`validator`", "D": "`obscureText`"}, "ans": "A", "why": "`inputFormatters: [FilteringTextInputFormatter.digitsOnly]` chặn ký tự không phải số ngay khi gõ. `keyboardType` chỉ gợi ý bàn phím chứ không ép buộc."}, {"id": "M7-19", "n": 19, "bs": false, "stem": "Why is `keyboardType: TextInputType.number` alone insufficient to guarantee numeric input?", "opts": {"A": "It only suggests a keyboard; users can still paste other characters", "B": "It is deprecated", "C": "It disables validation", "D": "It only works on iOS"}, "ans": "A", "why": "`keyboardType: TextInputType.number` chỉ gợi ý loại bàn phím; người dùng vẫn có thể dán ký tự khác vào, nên chưa đảm bảo chỉ có số."}, {"id": "M7-20", "n": 20, "bs": false, "stem": "Which validator correctly checks for exactly 10 digits?", "opts": {"A": "`value!.length == 10 ? null : 'error'`", "B": "`value!.contains(RegExp(r'[0-9]')) ? null : 'error'`", "C": "`int.tryParse(value!) != null ? null : 'error'`", "D": "`RegExp(r'^\\d{10}$').hasMatch(value!) ? null : 'error'`"}, "ans": "D", "why": "`RegExp(r'^\\d{10}$').hasMatch(value!)` với anchor `^` và `$` đảm bảo chuỗi đúng đúng 10 chữ số. ≠ `length == 10` vì nó không loại được chữ cái."}, {"id": "M7-21", "n": 21, "bs": false, "stem": "Why does `RegExp(r'\\d{10}')` without anchors give wrong results?", "opts": {"A": "It matches any string containing 10 consecutive digits anywhere", "B": "It throws an error", "C": "It only matches the first digit", "D": "It is not valid Dart"}, "ans": "A", "why": "`RegExp(r'\\d{10}')` không có anchor sẽ khớp bất kỳ chuỗi nào chứa 10 chữ số liên tiếp ở bất kỳ đâu (ví dụ 'abc0123456789xyz' vẫn khớp), nên cho kết quả sai."}, {"id": "M7-22", "n": 22, "bs": false, "stem": "What is the role of `FocusNode`?", "opts": {"A": "Controlling and observing the focus state of a field", "B": "Validating input", "C": "Formatting text", "D": "Storing the text value"}, "ans": "A", "why": "`FocusNode` điều khiển và theo dõi trạng thái focus của một field (đang focus hay không, yêu cầu/bỏ focus)."}, {"id": "M7-23", "n": 23, "bs": false, "stem": "How do you move focus to the next field programmatically?", "opts": {"A": "`FocusScope.of(context).nextFocus()`", "B": "`focusNode.next()`", "C": "`Form.next()`", "D": "`Navigator.next()`"}, "ans": "A", "why": "Chuyển focus sang field kế tiếp bằng `FocusScope.of(context).nextFocus()`."}, {"id": "M7-24", "n": 24, "bs": false, "stem": "How do you dismiss the keyboard?", "opts": {"A": "`FocusScope.of(context).unfocus()`", "B": "`Navigator.pop()`", "C": "`setState(() {})`", "D": "`keyboard.hide()`"}, "ans": "A", "why": "Ẩn bàn phím bằng `FocusScope.of(context).unfocus()` (bỏ focus khỏi mọi field)."}, {"id": "M7-25", "n": 25, "bs": false, "stem": "Which callback fires when the user presses the keyboard's action button on a TextFormField?", "opts": {"A": "`onChanged`", "B": "`onFieldSubmitted`", "C": "`onSaved`", "D": "`onEditingComplete` only"}, "ans": "B", "why": "`onFieldSubmitted` kích hoạt khi người dùng nhấn nút hành động của bàn phím trên một `TextFormField`."}, {"id": "M7-26", "n": 26, "bs": false, "stem": "Which callback fires on every keystroke?", "opts": {"A": "`onChanged`", "B": "`onSaved`", "C": "`validator`", "D": "`onFieldSubmitted`"}, "ans": "A", "why": "`onChanged` chạy sau mỗi lần gõ phím (mỗi lần nội dung thay đổi)."}, {"id": "M7-27", "n": 27, "bs": false, "stem": "Which is the correct pattern for a submit button? ```dart if (_formKey.currentState!.___) { _formKey.currentState!.___; submit(); } ```", "opts": {"A": "`validate()` … `save()`", "B": "`save()` … `validate()`", "C": "`reset()` … `validate()`", "D": "`check()` … `store()`"}, "ans": "A", "why": "Mẫu nút submit đúng: kiểm tra `validate()` trả true rồi mới `save()` để thu thập dữ liệu, sau đó gửi đi."}, {"id": "M7-28", "n": 28, "bs": false, "stem": "How can a draft of a form be saved so it survives app restarts?", "opts": {"A": "Store field values in SharedPreferences (or a local DB) on change, restore in `initState`", "B": "Use `const` fields", "C": "Flutter does it automatically", "D": "Use a GlobalKey"}, "ans": "A", "why": "Lưu bản nháp bền qua lần khởi động lại bằng cách ghi giá trị field vào `SharedPreferences` (hoặc DB cục bộ) khi thay đổi, và phục hồi trong `initState`."}, {"id": "M7-29", "n": 29, "bs": false, "stem": "Which Scaffold property prevents the keyboard from covering the focused field?", "opts": {"A": "`resizeToAvoidBottomInset: true`", "B": "`extendBody: true`", "C": "`primary: true`", "D": "`keyboardAware: true`"}, "ans": "A", "why": "`resizeToAvoidBottomInset: true` (mặc định) khiến Scaffold thu nhỏ body khi bàn phím hiện, tránh che field đang focus."}, {"id": "M7-30", "n": 30, "bs": false, "stem": "Which widget wraps a form so it can scroll when the keyboard appears?", "opts": {"A": "`SingleChildScrollView`", "B": "`Stack`", "C": "`Wrap`", "D": "`Expanded`"}, "ans": "A", "why": "`SingleChildScrollView` bọc form giúp cuộn khi bàn phím xuất hiện, tránh overflow và che mất field."}, {"id": "M7-31", "n": 31, "bs": false, "stem": "For accessibility, which is important when building forms?", "opts": {"A": "Meaningful labels, correct focus traversal order, and sufficient contrast", "B": "Using only icons", "C": "Disabling the keyboard", "D": "Avoiding validation"}, "ans": "A", "why": "Form dễ tiếp cận (accessibility) cần nhãn có ý nghĩa, thứ tự duyệt focus đúng và độ tương phản đủ."}, {"id": "M7-32", "n": 32, "bs": false, "stem": "Which is TRUE about `FocusNode`?", "opts": {"A": "It must be disposed like a controller", "B": "It is automatically disposed", "C": "It cannot be created manually", "D": "It replaces TextEditingController"}, "ans": "A", "why": "`FocusNode` phải được `dispose` giống như controller (nó không tự giải phóng) để tránh rò rỉ tài nguyên."}, {"id": "M7-BS-1", "n": 1, "bs": true, "stem": "Which widget lets a dropdown selection participate in `Form` validation?", "opts": {"A": "`DropdownButton`", "B": "`DropdownButtonFormField`", "C": "`PopupMenuButton`", "D": "`DropdownMenu`"}, "ans": "B", "why": "`DropdownButtonFormField` cho phép lựa chọn dropdown tham gia validate cùng `Form` (có validator), khác `DropdownButton` thường không tích hợp Form."}, {"id": "M7-BS-2", "n": 2, "bs": true, "stem": "For a group of radio buttons where only one may be selected, all radios must share the same:", "opts": {"A": "`value`", "B": "`groupValue`", "C": "`key`", "D": "`controller`"}, "ans": "B", "why": "Nhóm radio chỉ chọn một thì mọi `Radio` phải chung một `groupValue`; radio nào có `value` bằng `groupValue` sẽ được chọn."}, {"id": "M7-BS-3", "n": 3, "bs": true, "stem": "What does `showDatePicker` return?", "opts": {"A": "A `DateTime` directly (synchronous)", "B": "A `Future<DateTime?>` that must be awaited", "C": "A widget to insert into the tree", "D": "`void`"}, "ans": "B", "why": "`showDatePicker` trả về `Future<DateTime?>` (bất đồng bộ) nên phải `await`; trả về null nếu người dùng hủy chọn."}, {"id": "M7-BS-4", "n": 4, "bs": true, "stem": "Which is the correct way to implement a show/hide password toggle?", "opts": {"A": "Set a property `showPassword: true`", "B": "Flip a bool bound to `obscureText` inside `setState`, via a `suffixIcon` `IconButton`", "C": "Use a separate `TextField`", "D": "`keyboardType: TextInputType.visiblePassword`"}, "ans": "B", "why": "Toggle hiện/ẩn mật khẩu: lật một biến bool gắn với `obscureText` bên trong `setState`, thường đặt trong `suffixIcon` là một `IconButton`."}, {"id": "M7-BS-5", "n": 5, "bs": true, "stem": "Why can't you check \"is this email already taken on the server\" inside a `TextFormField` validator?", "opts": {"A": "Validators are synchronous and must return `String?` immediately — they cannot `await`", "B": "Validators run on a background isolate", "C": "Validators only run once", "D": "It is allowed and recommended"}, "ans": "A", "why": "Không thể kiểm tra email đã tồn tại trên server bên trong `validator` vì validator là đồng bộ, phải trả `String?` ngay lập tức, không thể `await` lệnh mạng."}, {"id": "M7-BS-6", "n": 6, "bs": true, "stem": "During an async availability check triggered on submit, the submit button should be:", "opts": {"A": "Left enabled so the user can retry", "B": "Disabled and show a spinner to prevent double submits", "C": "Removed from the widget tree", "D": "Replaced by plain `Text`"}, "ans": "B", "why": "Khi đang chạy kiểm tra bất đồng bộ lúc submit, nút submit nên bị vô hiệu hóa và hiện spinner để tránh người dùng gửi trùng (double submit)."}, {"id": "M7-BS-7", "n": 7, "bs": true, "stem": "In a confirm-password validator, the recommended comparison target is:", "opts": {"A": "The password **state variable** held by the widget", "B": "The other `TextEditingController` read directly inside the validator", "C": "A value from `SharedPreferences`", "D": "The server"}, "ans": "A", "why": "Nên so sánh xác nhận mật khẩu với biến state giữ giá trị mật khẩu của widget vì nó ổn định và dễ kiểm thử; đọc trực tiếp controller kia cũng chạy được nhưng biến state là mục tiêu được khuyến nghị, tránh phụ thuộc nguồn ngoài như server/SharedPreferences."}, {"id": "M7-BS-8", "n": 8, "bs": true, "stem": "Which pattern hides the keyboard when the user taps outside any field?", "opts": {"A": "Wrap the body in `GestureDetector(onTap: () => FocusScope.of(context).unfocus())`", "B": "Call `Navigator.pop()`", "C": "Set `obscureText: true`", "D": "Insert a `Spacer`"}, "ans": "A", "why": "Bọc thân màn hình bằng `GestureDetector(onTap: () => FocusScope.of(context).unfocus())` để khi chạm ra ngoài field thì ẩn bàn phím."}, {"id": "M7-BS-9", "n": 9, "bs": true, "stem": "Which widget pair is intended for boolean on/off choices?", "opts": {"A": "`Checkbox` / `Switch`", "B": "`DropdownButton` / `Radio`", "C": "`Slider` / `Stepper`", "D": "`TextField` / `TextFormField`"}, "ans": "A", "why": "`Checkbox`/`Switch` là cặp widget dành cho lựa chọn bật/tắt (boolean true/false)."}]}, {"id": "M8", "kind": "mod", "chip": "M8", "title": "Module 8 — Networking & JSON", "questions": [{"id": "M8-1", "n": 1, "bs": false, "stem": "Which package is the standard for HTTP requests in Flutter?", "opts": {"A": "`dio` only", "B": "`http`", "C": "`retrofit`", "D": "`socket_io`"}, "ans": "B", "why": "Package `http` là thư viện chuẩn, chính thức của nhóm Dart/Flutter để gửi request HTTP (GET/POST...). `dio` mạnh nhưng là bên thứ ba (≠ 'chuẩn'), `retrofit` chỉ là lớp generator chạy trên http/dio, còn `socket_io` dành cho realtime websocket chứ không phải REST."}, {"id": "M8-2", "n": 2, "bs": false, "stem": "Which library provides `jsonEncode` and `jsonDecode`?", "opts": {"A": "`dart:io`", "B": "`dart:convert`", "C": "`dart:async`", "D": "`package:json`"}, "ans": "B", "why": "`jsonEncode` và `jsonDecode` nằm trong thư viện lõi `dart:convert`. `dart:io` lo file/socket, `dart:async` lo Future/Stream, còn `package:json` không tồn tại như thư viện chuẩn."}, {"id": "M8-3", "n": 3, "bs": false, "stem": "What does `jsonDecode` return for a JSON array of objects?", "opts": {"A": "`List<Map<String, dynamic>>` (as `dynamic`)", "B": "`Map<String, dynamic>`", "C": "A Dart class instance", "D": "A String"}, "ans": "A", "why": "Một mảng JSON các object sau khi `jsonDecode` trả về `List<dynamic>` mà mỗi phần tử là `Map<String, dynamic>` (kiểu tĩnh là `dynamic`). Nó KHÔNG tự thành instance lớp Dart (phải tự map qua `fromJson`) và cũng không phải một `Map` đơn hay `String`."}, {"id": "M8-4", "n": 4, "bs": false, "stem": "Which permission is required on Android for network access?", "opts": {"A": "`INTERNET`", "B": "`NETWORK_STATE`", "C": "`ACCESS_NETWORK`", "D": "None"}, "ans": "A", "why": "Truy cập mạng trên Android cần khai báo quyền `INTERNET`. `NETWORK_STATE`/`ACCESS_NETWORK_STATE` chỉ để kiểm tra trạng thái kết nối, không đủ để gọi API."}, {"id": "M8-5", "n": 5, "bs": false, "stem": "In which file is that permission declared?", "opts": {"A": "`pubspec.yaml`", "B": "`AndroidManifest.xml`", "C": "`build.gradle`", "D": "`main.dart`"}, "ans": "B", "why": "Quyền Android được khai báo trong `AndroidManifest.xml` bằng thẻ `<uses-permission>`. `pubspec.yaml` khai báo dependency Flutter, `build.gradle` cấu hình build chứ không khai quyền runtime này."}, {"id": "M8-6", "n": 6, "bs": false, "stem": "How is a URL passed to `http.get`?", "opts": {"A": "As a String", "B": "As `Uri.parse('...')`", "C": "As a `URL` object", "D": "As a Map"}, "ans": "B", "why": "`http.get` nhận đối tượng `Uri`, nên phải bọc URL bằng `Uri.parse('...')`. Truyền String thẳng sẽ không biên dịch được vì sai kiểu tham số."}, {"id": "M8-7", "n": 7, "bs": false, "stem": "Which status code indicates a successful resource creation?", "opts": {"A": "200", "B": "201", "C": "204", "D": "301"}, "ans": "B", "why": "201 Created báo tài nguyên đã được tạo thành công (thường trả về sau POST). ≠ 200 (OK chung), ≠ 204 (thành công nhưng không có nội dung), ≠ 301 (chuyển hướng)."}, {"id": "M8-8", "n": 8, "bs": false, "stem": "Which status code means the client is not authenticated?", "opts": {"A": "400", "B": "401", "C": "403", "D": "404"}, "ans": "B", "why": "401 Unauthorized = client CHƯA xác thực (thiếu/sai token hoặc credential). ≠ 400 (request sai định dạng), ≠ 403 (đã xác thực nhưng không đủ quyền), ≠ 404 (không tìm thấy)."}, {"id": "M8-9", "n": 9, "bs": false, "stem": "What is the difference between 401 and 403?", "opts": {"A": "401 = not authenticated; 403 = authenticated but not permitted", "B": "They are identical", "C": "403 means the page does not exist", "D": "401 is a server error"}, "ans": "A", "why": "401 = chưa đăng nhập/xác thực (server chưa biết bạn là ai); 403 = đã xác thực nhưng KHÔNG được phép truy cập tài nguyên đó. Đây là điểm phân biệt cốt lõi giữa authentication và authorization."}, {"id": "M8-10", "n": 10, "bs": false, "stem": "If the server returns 500, what happens to `http.get()`?", "opts": {"A": "It throws a SocketException", "B": "It completes normally; you must check `statusCode` yourself", "C": "It returns null", "D": "It retries automatically"}, "ans": "B", "why": "Với mã 500, `http.get()` vẫn hoàn tất bình thường và trả về `Response` — vì server ĐÃ trả lời (chỉ là lỗi phía server). Bạn phải tự kiểm tra `response.statusCode`. Nó không ném SocketException (lỗi đó xảy ra khi socket hỏng trước khi có phản hồi HTTP) và không tự retry."}, {"id": "M8-11", "n": 11, "bs": false, "stem": "What does a `SocketException` indicate?", "opts": {"A": "The server returned 500", "B": "The device has no connection or the server is unreachable — the socket failed before an HTTP response", "C": "Malformed JSON", "D": "An invalid SSL certificate"}, "ans": "B", "why": "`SocketException` nghĩa là socket thất bại TRƯỚC khi nhận được phản hồi HTTP: máy không có mạng, DNS lỗi, hoặc server không tiếp cận được. Khác lỗi 500 (server đã phản hồi), lỗi JSON (FormatException) hay lỗi chứng chỉ SSL (HandshakeException)."}, {"id": "M8-12", "n": 12, "bs": false, "stem": "Which exception is thrown when `jsonDecode` receives invalid JSON?", "opts": {"A": "`FormatException`", "B": "`SocketException`", "C": "`TypeError`", "D": "`HttpException`"}, "ans": "A", "why": "`jsonDecode` gặp chuỗi JSON không hợp lệ sẽ ném `FormatException` (lỗi định dạng khi phân tích). SocketException là lỗi mạng, TypeError là ép kiểu sai, HttpException là lỗi tầng HTTP khác."}, {"id": "M8-13", "n": 13, "bs": false, "stem": "Which exception relates to an invalid SSL certificate?", "opts": {"A": "`HandshakeException`", "B": "`SocketException`", "C": "`TimeoutException`", "D": "`TlsError`"}, "ans": "A", "why": "Chứng chỉ SSL/TLS không hợp lệ khi bắt tay bảo mật sẽ ném `HandshakeException`. SocketException là lỗi kết nối chung, TimeoutException là hết giờ, còn `TlsError` không phải kiểu ngoại lệ chuẩn."}, {"id": "M8-14", "n": 14, "bs": false, "stem": "How do you enforce a 10-second limit on a request?", "opts": {"A": "`http.get(uri).timeout(Duration(seconds: 10))`", "B": "`http.get(uri, timeout: 10)`", "C": "Set it in pubspec.yaml", "D": "It is not possible"}, "ans": "A", "why": "Giới hạn thời gian bằng cách nối `.timeout(Duration(seconds: 10))` vào Future trả về từ `http.get(uri)`. `http.get` không có tham số `timeout:`, và không cấu hình trong pubspec được."}, {"id": "M8-15", "n": 15, "bs": false, "stem": "Which exception does `.timeout()` throw?", "opts": {"A": "`TimeoutException`", "B": "`SocketException`", "C": "`DeadlineException`", "D": "`StateError`"}, "ans": "A", "why": "Khi vượt quá thời gian, `.timeout()` ném `TimeoutException`. Các lựa chọn còn lại (SocketException, DeadlineException, StateError) không phải ngoại lệ mà `.timeout()` phát ra."}, {"id": "M8-16", "n": 16, "bs": false, "stem": "Which is the idiomatic factory constructor pattern for building a model from JSON?", "opts": {"A": "`User.fromMap(Map map)` as a static method", "B": "`factory User.fromJson(Map<String, dynamic> json) => User(...)`", "C": "`User.deserialize(String jsonString)`", "D": "`User(json: Map)` as a named constructor"}, "ans": "B", "why": "Mẫu chuẩn (idiomatic) là dùng `factory` constructor: `factory User.fromJson(Map<String, dynamic> json) => User(...)`, cho phép trả về object đã dựng từ Map. Các phương án còn lại không đúng quy ước đặt tên/chữ ký thường dùng trong Flutter."}, {"id": "M8-17", "n": 17, "bs": false, "stem": "What is the purpose of `toJson()` on a model?", "opts": {"A": "Converting the object into a Map for encoding and sending", "B": "Parsing JSON", "C": "Validating data", "D": "Formatting for display"}, "ans": "A", "why": "`toJson()` làm chiều ngược lại `fromJson`: biến object Dart thành `Map<String, dynamic>` để `jsonEncode` mã hóa rồi gửi lên server (ví dụ trong body POST). Nó không dùng để parse, validate hay format hiển thị."}, {"id": "M8-18", "n": 18, "bs": false, "stem": "Which packages generate serialisation code automatically?", "opts": {"A": "`json_serializable` + `build_runner`", "B": "`provider` + `hive`", "C": "`http` + `dio`", "D": "`mockito` + `test`"}, "ans": "A", "why": "Bộ đôi `json_serializable` (sinh code) + `build_runner` (chạy generator) tự tạo hàm `fromJson`/`toJson`, giúp khỏi viết tay. Các cặp còn lại là state management/storage, networking, hoặc testing."}, {"id": "M8-19", "n": 19, "bs": false, "stem": "Which command runs the code generator?", "opts": {"A": "`dart run build_runner build`", "B": "`flutter generate`", "C": "`dart compile`", "D": "`flutter pub codegen`"}, "ans": "A", "why": "Lệnh chạy bộ sinh code là `dart run build_runner build`. `flutter generate`, `dart compile`, `flutter pub codegen` không phải lệnh chạy code generator này."}, {"id": "M8-20", "n": 20, "bs": false, "stem": "How should the structure of an API response be validated against a JSON Schema?", "opts": {"A": "Dart's type system does it automatically", "B": "`json_serializable`'s `@JsonSchema` annotation", "C": "Use the `json_schema` package to validate the decoded Map before calling `fromJson`", "D": "It is impossible in Flutter"}, "ans": "C", "why": "Dùng package `json_schema` để kiểm tra cấu trúc của `Map` đã decode theo một schema định nghĩa sẵn TRƯỚC khi gọi `fromJson`. Hệ kiểu Dart không tự kiểm tra JSON động, và `@JsonSchema` không phải annotation có thật."}, {"id": "M8-21", "n": 21, "bs": false, "stem": "Which widget renders UI based on the state of a Future?", "opts": {"A": "`StreamBuilder`", "B": "`FutureBuilder`", "C": "`AsyncBuilder`", "D": "`LayoutBuilder`"}, "ans": "B", "why": "`FutureBuilder` dựng UI theo trạng thái của một `Future` (loading/success/error) trong một chỗ. `StreamBuilder` dành cho Stream, còn `AsyncBuilder`/`LayoutBuilder` không phục vụ mục đích này (LayoutBuilder lo kích thước layout)."}, {"id": "M8-22", "n": 22, "bs": false, "stem": "Which `ConnectionState` indicates the Future is still running?", "opts": {"A": "`none`", "B": "`waiting`", "C": "`active`", "D": "`done`"}, "ans": "B", "why": "`ConnectionState.waiting` nghĩa là Future đang chạy, chưa xong — đây là lúc hiển thị spinner. `none` = chưa gắn future, `active` chủ yếu cho Stream, `done` = đã hoàn tất."}, {"id": "M8-23", "n": 23, "bs": false, "stem": "How do you detect an error inside a FutureBuilder?", "opts": {"A": "`snapshot.hasError` / `snapshot.error`", "B": "`try/catch` around the builder", "C": "`snapshot.failed`", "D": "`snapshot.state == error`"}, "ans": "A", "why": "Kiểm tra lỗi trong FutureBuilder bằng `snapshot.hasError` và đọc chi tiết ở `snapshot.error`. Không dùng try/catch quanh builder được (lỗi nằm trong Future, đã được snapshot bắt lại), và `snapshot.failed`/`snapshot.state` không tồn tại."}, {"id": "M8-24", "n": 24, "bs": false, "stem": "Why is `future: fetchData()` written directly inside `build()` a bug?", "opts": {"A": "It causes a compile error", "B": "Every rebuild triggers a new API call, potentially in an endless loop", "C": "It disables caching", "D": "It is actually recommended"}, "ans": "B", "why": "Viết `future: fetchData()` trực tiếp trong `build()` khiến MỖI lần rebuild lại tạo một Future mới → gọi API lại liên tục, có thể thành vòng lặp vô tận. Đây là lỗi kinh điển được cảnh báo trong slide Common Pitfalls."}, {"id": "M8-25", "n": 25, "bs": false, "stem": "What is the correct fix?", "opts": {"A": "Initialise the future once in `initState()` and store it in a field", "B": "Use `const` on the FutureBuilder", "C": "Call `setState` in the builder", "D": "Use `StreamBuilder` instead"}, "ans": "A", "why": "Cách sửa đúng: khởi tạo Future MỘT LẦN trong `initState()` và lưu vào một field (vd `_futurePosts`), rồi truyền field đó cho FutureBuilder. Nhờ vậy rebuild không tạo lại request."}, {"id": "M8-26", "n": 26, "bs": false, "stem": "Which property provides data to a StreamBuilder before the first event arrives?", "opts": {"A": "`initialData`", "B": "`defaultValue`", "C": "`placeholder`", "D": "`seed`"}, "ans": "A", "why": "`initialData` cung cấp dữ liệu ban đầu cho StreamBuilder (hoặc FutureBuilder) trước khi sự kiện đầu tiên tới, giúp UI có nội dung ngay. `defaultValue`/`placeholder`/`seed` không phải property này."}, {"id": "M8-27", "n": 27, "bs": false, "stem": "Which is the recommended way to show a loading spinner?", "opts": {"A": "`CircularProgressIndicator` while `connectionState == waiting`", "B": "A blank screen", "C": "`Text('Loading')` always", "D": "Blocking the UI thread"}, "ans": "A", "why": "Trong lúc chờ dữ liệu (`connectionState == waiting`), hiển thị `CircularProgressIndicator` để báo đang tải. Màn hình trống, Text('Loading') cố định, hay chặn UI thread đều là UX kém."}, {"id": "M8-28", "n": 28, "bs": false, "stem": "Which is a proper \"empty state\" check?", "opts": {"A": "`!snapshot.hasData || snapshot.data!.isEmpty`", "B": "`snapshot.data == 0`", "C": "`snapshot.hasError`", "D": "`snapshot.connectionState == none`"}, "ans": "A", "why": "Trạng thái 'rỗng' đúng là kiểm tra `!snapshot.hasData || snapshot.data!.isEmpty` (không có dữ liệu HOẶC danh sách rỗng). `data == 0` sai kiểu, `hasError` là nhánh lỗi, `connectionState == none` không phải empty state."}, {"id": "M8-29", "n": 29, "bs": false, "stem": "What is exponential backoff?", "opts": {"A": "Retrying with progressively longer waits (1s, 2s, 4s…)", "B": "Retrying immediately in a loop", "C": "Reducing payload size", "D": "Compressing responses"}, "ans": "A", "why": "Exponential backoff = thử lại với thời gian chờ tăng dần theo cấp số nhân (1s, 2s, 4s...) để giảm tải cho server đang lỗi. Khác với retry ngay lập tức trong vòng lặp, giảm payload hay nén dữ liệu."}, {"id": "M8-30", "n": 30, "bs": false, "stem": "Which caching pattern describes: show cached data immediately, then refresh from the API in the background?", "opts": {"A": "Read-through", "B": "Write-through", "C": "Stale-while-revalidate", "D": "Cache-aside"}, "ans": "C", "why": "Mẫu 'hiện dữ liệu cache ngay lập tức rồi âm thầm gọi API làm mới nền' chính là stale-while-revalidate — nền tảng của offline-first. ≠ cache-aside (chỉ gọi API khi cache rỗng)."}, {"id": "M8-31", "n": 31, "bs": false, "stem": "Which pattern only calls the API when the cache is empty?", "opts": {"A": "Cache-aside", "B": "Stale-while-revalidate", "C": "Write-behind", "D": "Read-through"}, "ans": "A", "why": "Cache-aside (lazy loading): UI hỏi cache trước, chỉ khi cache RỖNG mới gọi API rồi đổ vào cache. Khác stale-while-revalidate luôn gọi API nền dù cache có sẵn dữ liệu."}, {"id": "M8-32", "n": 32, "bs": false, "stem": "Which package detects network connectivity changes?", "opts": {"A": "`connectivity_plus`", "B": "`http`", "C": "`path_provider`", "D": "`shared_preferences`"}, "ans": "A", "why": "`connectivity_plus` phát hiện thay đổi trạng thái kết nối mạng (wifi/mobile/none). `http` để gọi mạng, `path_provider` lấy đường dẫn, `shared_preferences` lưu key-value."}, {"id": "M8-33", "n": 33, "bs": false, "stem": "Why should a single `http.Client` be reused for multiple requests?", "opts": {"A": "It reuses the underlying connection, improving performance", "B": "It is required by Flutter", "C": "It enables caching automatically", "D": "It prevents SocketException"}, "ans": "A", "why": "Dùng lại một `http.Client` cho nhiều request giúp tái sử dụng kết nối TCP/HTTP bên dưới (keep-alive) → tăng hiệu năng. Nó không phải bắt buộc, không tự bật cache, cũng không ngăn được SocketException."}, {"id": "M8-34", "n": 34, "bs": false, "stem": "Which HTTP method is used to fully replace a resource?", "opts": {"A": "`GET`", "B": "`POST`", "C": "`PUT`", "D": "`PATCH`"}, "ans": "C", "why": "`PUT` dùng để thay thế TOÀN BỘ tài nguyên. `PATCH` chỉ cập nhật một phần, `POST` tạo mới, `GET` chỉ đọc."}, {"id": "M8-35", "n": 35, "bs": false, "stem": "Which is used for a partial update?", "opts": {"A": "`PUT`", "B": "`PATCH`", "C": "`POST`", "D": "`DELETE`"}, "ans": "B", "why": "`PATCH` dùng cho cập nhật MỘT PHẦN tài nguyên (chỉ gửi các trường thay đổi). PUT thay toàn bộ, POST tạo mới, DELETE xóa."}, {"id": "M8-36", "n": 36, "bs": false, "stem": "How do you send a JSON body in a POST request?", "opts": {"A": "`body: jsonEncode(map)` with header `Content-Type: application/json`", "B": "`body: map` directly", "C": "`params: map`", "D": "`json: map`"}, "ans": "A", "why": "Gửi JSON body: đặt `body: jsonEncode(map)` và thêm header `Content-Type: application/json`. Truyền `map` thẳng sẽ bị mã hóa dạng form-urlencoded, còn `params:`/`json:` không phải tham số của http.post."}, {"id": "M8-37", "n": 37, "bs": false, "stem": "Where is the bearer token normally placed?", "opts": {"A": "In the URL query", "B": "In the `Authorization` header", "C": "In the body", "D": "In a cookie only"}, "ans": "B", "why": "Bearer token đặt trong header `Authorization` (dạng `Authorization: Bearer <token>`). Để trong query URL dễ bị lộ/log lại, để trong body không đúng chuẩn, cookie-only không phải cách thông thường cho API token."}, {"id": "M8-38", "n": 38, "bs": false, "stem": "What is the danger of storing an API key in a `.env` asset file?", "opts": {"A": "It is bundled into the APK and can be extracted by decompiling", "B": "It cannot be read at runtime", "C": "It slows down the app", "D": "There is no risk"}, "ans": "A", "why": "File `.env` được đóng gói (bundle) như một asset vào trong APK; kẻ tấn công có thể decompile APK để trích xuất API key. Vì vậy asset `.env` KHÔNG bảo mật thật sự cho khóa nhạy cảm."}, {"id": "M8-39", "n": 39, "bs": false, "stem": "After editing a `.env` file, why must the app be rebuilt?", "opts": {"A": "The file is bundled as a Flutter asset at build time", "B": "dotenv caches to SharedPreferences", "C": "It is fetched from the network", "D": "It uses compile-time constants"}, "ans": "A", "why": "`.env` được nhúng như một Flutter asset TẠI THỜI ĐIỂM BUILD, nên sửa file xong phải build lại app để asset mới được đóng gói. Nó không cache vào SharedPreferences, không tải qua mạng, cũng không phải hằng số biên dịch."}, {"id": "M8-40", "n": 40, "bs": false, "stem": "Which is the correct layering to keep networking testable?", "opts": {"A": "Widget → Repository → DataSource (http)", "B": "Widget → http directly", "C": "http → Widget", "D": "Repository → Widget → http"}, "ans": "A", "why": "Phân lớp giúp test được: Widget → Repository → DataSource (http). Repository/DataSource tách networking ra khỏi UI nên có thể mock để unit test. Gọi `http` thẳng trong Widget khiến khó test và khó tái sử dụng."}, {"id": "M8-BS-1", "n": 1, "bs": true, "stem": "Parsing a very large JSON list on the main isolate can freeze the UI. The idiomatic fix is:", "opts": {"A": "Wrap the parse in `setState`", "B": "Use `compute()` to parse on a background isolate", "C": "Convert the widget to `StatelessWidget`", "D": "Increase the request timeout"}, "ans": "B", "why": "Parse JSON rất lớn trên main isolate làm nghẽn UI; cách chuẩn là dùng `compute()` để chạy hàm parse trên một isolate nền, giữ UI mượt. Bọc trong setState hay đổi sang StatelessWidget không giải quyết việc parse nặng."}, {"id": "M8-BS-2", "n": 2, "bs": true, "stem": "A function passed to `compute()` must be:", "opts": {"A": "An anonymous closure that captures state", "B": "An instance method", "C": "A top-level or static function", "D": "A `build()` method"}, "ans": "C", "why": "Hàm truyền cho `compute()` phải là hàm top-level hoặc static — vì nó chạy trên isolate khác và không thể mang theo state/closure. Closure bắt biến hay instance method sẽ không hợp lệ."}, {"id": "M8-BS-3", "n": 3, "bs": true, "stem": "Why inject an `http.Client` into an `ApiService` through its constructor?", "opts": {"A": "It is required for the code to compile", "B": "It enables HTTP caching automatically", "C": "To avoid importing the `http` package", "D": "So a mock client can be supplied in unit tests"}, "ans": "D", "why": "Tiêm `http.Client` qua constructor để trong unit test có thể truyền vào một mock client (không gọi mạng thật). Đây là mục đích dependency injection, không phải để compile, không tự bật cache."}, {"id": "M8-BS-4", "n": 4, "bs": true, "stem": "What does `ApiService({http.Client? client}) : client = client ?? http.Client();` do?", "opts": {"A": "Always creates a brand-new client", "B": "Uses the injected client if provided, otherwise creates a default one", "C": "Leaves the client null", "D": "Throws if no client is given"}, "ans": "B", "why": "`client = client ?? http.Client()` nghĩa là: nếu có client được tiêm vào thì dùng nó, ngược lại tạo một client mặc định. Nhờ vậy vừa test được (mock) vừa dùng bình thường mà không cần truyền gì."}, {"id": "M8-BS-5", "n": 5, "bs": true, "stem": "Adding a newly-created item to the list immediately after POST, before the server confirms, is called:", "opts": {"A": "Exponential backoff", "B": "Stale-while-revalidate", "C": "Optimistic update", "D": "Lazy loading"}, "ans": "C", "why": "Thêm item vào danh sách NGAY sau khi POST, trước khi server xác nhận, gọi là optimistic update (cập nhật lạc quan) để UI phản hồi tức thì. Khác backoff, stale-while-revalidate hay lazy loading."}, {"id": "M8-BS-6", "n": 6, "bs": true, "stem": "A common way to make a \"Retry\" button re-run a `FutureBuilder`'s request is:", "opts": {"A": "Call `dispose()`", "B": "Restart the whole app", "C": "Mark the `FutureBuilder` as `const`", "D": "Call `setState(() {})` (re-assigning the future)
