 so the widget rebuilds and the future runs again"}, "ans": "D", "why": "Nút 'Retry' chạy lại request bằng cách gọi `setState(() {})` (gán lại future) để widget rebuild và FutureBuilder chạy lại future. Gọi `dispose()`, restart app hay đánh dấu `const` đều không đúng."}]}, {"id": "M9", "kind": "mod", "chip": "M9", "title": "Module 9 — Local Storage & Persistence", "questions": [{"id": "M9-1", "n": 1, "bs": false, "stem": "What is the correct way to obtain a SharedPreferences instance?", "opts": {"A": "`SharedPreferences()`", "B": "`await SharedPreferences.getInstance()`", "C": "`SharedPreferences.open()`", "D": "`SharedPreferences.getDefault()`"}, "ans": "B", "why": "Lấy instance bằng `await SharedPreferences.getInstance()` — đây là hàm bất đồng bộ trả về Future. Không có constructor `SharedPreferences()`, `open()` hay `getDefault()`."}, {"id": "M9-2", "n": 2, "bs": false, "stem": "Which method saves an integer?", "opts": {"A": "`putInt('key', v)`", "B": "`saveInt('key', v)`", "C": "`writeInt('key', v)`", "D": "`setInt('key', v)`"}, "ans": "D", "why": "Lưu số nguyên bằng `setInt('key', v)`. SharedPreferences dùng tiền tố `set...` (setInt/setBool/setString...), không phải `put/save/write`."}, {"id": "M9-3", "n": 3, "bs": false, "stem": "Which types can SharedPreferences store?", "opts": {"A": "Any object", "B": "`int`, `double`, `bool`, `String`, `List<String>`", "C": "Only String", "D": "Only primitives except double"}, "ans": "B", "why": "SharedPreferences chỉ lưu 5 kiểu nguyên thủy: `int`, `double`, `bool`, `String`, và `List<String>`. Không lưu object tùy ý (phải mã hóa JSON), và có hỗ trợ cả double."}, {"id": "M9-4", "n": 4, "bs": false, "stem": "How do you persist a custom object in SharedPreferences?", "opts": {"A": "Encode it to a JSON String with `jsonEncode` and store the String", "B": "Pass the object directly to `setObject`", "C": "It is not possible in any way", "D": "Use `setMap`"}, "ans": "A", "why": "Muốn lưu object tùy chỉnh: `jsonEncode` nó thành chuỗi JSON rồi `setString` chuỗi đó (đọc lại thì decode). Không có `setObject`/`setMap`, nên phương án này là cách khả thi duy nhất."}, {"id": "M9-5", "n": 5, "bs": false, "stem": "What does `prefs.getString('missing')` return if the key does not exist?", "opts": {"A": "An empty string", "B": "`null`", "C": "Throws", "D": "`'null'`"}, "ans": "B", "why": "`getString('missing')` trả về `null` khi key không tồn tại (các getter khác cũng trả null). Nó không trả chuỗi rỗng, không ném lỗi, cũng không trả chuỗi `'null'`."}, {"id": "M9-6", "n": 6, "bs": false, "stem": "Which method removes ALL key-value pairs?", "opts": {"A": "`clear()`", "B": "`removeAll()`", "C": "`reset()`", "D": "`deleteAll()`"}, "ans": "A", "why": "`clear()` xóa TẤT CẢ cặp key-value. `removeAll`/`reset`/`deleteAll` không phải phương thức của SharedPreferences."}, {"id": "M9-7", "n": 7, "bs": false, "stem": "Which method removes a single key?", "opts": {"A": "`remove(key)`", "B": "`delete(key)`", "C": "`erase(key)`", "D": "`unset(key)`"}, "ans": "A", "why": "`remove(key)` xóa một key cụ thể. `delete`/`erase`/`unset` không tồn tại trong API SharedPreferences."}, {"id": "M9-8", "n": 8, "bs": false, "stem": "Are the `set...` methods synchronous?", "opts": {"A": "Yes", "B": "No, they return `Future<bool>`", "C": "Only on Android", "D": "Only for String"}, "ans": "B", "why": "Các phương thức `set...` là bất đồng bộ, trả về `Future<bool>` (true nếu ghi thành công). Chúng không đồng bộ và không phụ thuộc nền tảng."}, {"id": "M9-9", "n": 9, "bs": false, "stem": "Are the `get...` methods asynchronous?", "opts": {"A": "Yes", "B": "No, they are synchronous once the instance is obtained", "C": "Only for List", "D": "Only on iOS"}, "ans": "B", "why": "Sau khi đã có instance, các getter `get...` là ĐỒNG BỘ (đọc từ bộ nhớ đã nạp sẵn), trả giá trị ngay không cần await. Chỉ việc lấy instance (getInstance) mới là async."}, {"id": "M9-10", "n": 10, "bs": false, "stem": "Two isolates write to SharedPreferences at the same time. What is the risk?", "opts": {"A": "A DeadlockException is thrown", "B": "Race conditions — one write may overwrite the other, as the plugin is not isolate-safe", "C": "Writes are automatically synchronised", "D": "File-level locking makes it completely safe"}, "ans": "B", "why": "Hai isolate ghi cùng lúc gây race condition — một lần ghi có thể đè lên lần kia vì plugin KHÔNG an toàn giữa các isolate (không khóa file). Không có DeadlockException tự động và không tự đồng bộ hóa."}, {"id": "M9-11", "n": 11, "bs": false, "stem": "Why should authentication tokens NOT be stored in SharedPreferences in production?", "opts": {"A": "The data is not encrypted and can be read on a rooted/jailbroken device", "B": "It is too slow", "C": "It has a 1KB limit", "D": "It does not persist"}, "ans": "A", "why": "Không lưu token xác thực trong SharedPreferences vì dữ liệu KHÔNG được mã hóa, có thể bị đọc trên thiết bị đã root/jailbreak. Nên dùng `flutter_secure_storage`. Vấn đề không phải tốc độ, giới hạn 1KB hay tính bền vững."}, {"id": "M9-12", "n": 12, "bs": false, "stem": "Which package stores sensitive values securely?", "opts": {"A": "`flutter_secure_storage`", "B": "`shared_preferences`", "C": "`path_provider`", "D": "`hive`"}, "ans": "A", "why": "`flutter_secure_storage` lưu giá trị nhạy cảm an toàn (Keystore trên Android, Keychain trên iOS, có mã hóa). `shared_preferences` lưu thô, `path_provider` chỉ lấy đường dẫn, `hive` là NoSQL nhưng không tự mã hóa mặc định."}, {"id": "M9-13", "n": 13, "bs": false, "stem": "Which package provides SQLite access in Flutter?", "opts": {"A": "`sqflite`", "B": "`sqlite3_flutter`", "C": "`room`", "D": "`moor_db`"}, "ans": "A", "why": "`sqflite` là plugin cung cấp SQLite cho Flutter. `sqlite3_flutter`/`room`/`moor_db` không phải tên gói chuẩn dùng trong module này (Room là Android/Kotlin, Moor đã đổi tên thành Drift)."}, {"id": "M9-14", "n": 14, "bs": false, "stem": "Which callback creates the initial database schema?", "opts": {"A": "`onCreate`", "B": "`onOpen`", "C": "`onUpgrade`", "D": "`onConfigure`"}, "ans": "A", "why": "Callback `onCreate` chạy khi DB được tạo lần đầu — nơi chạy `CREATE TABLE` để dựng schema ban đầu. `onOpen` chạy mỗi lần mở, `onUpgrade` khi nâng version, `onConfigure` để cấu hình trước khi tạo."}, {"id": "M9-15", "n": 15, "bs": false, "stem": "When is `onUpgrade` called?", "opts": {"A": "When the `version` number passed to `openDatabase` is higher than the stored version", "B": "Every launch", "C": "When the app is updated on the store", "D": "Never automatically"}, "ans": "A", "why": "`onUpgrade` được gọi khi `version` truyền vào `openDatabase` LỚN HƠN version đang lưu của DB — dùng để migrate schema. Không gọi mỗi lần khởi động, không gắn với việc cập nhật app trên store."}, {"id": "M9-16", "n": 16, "bs": false, "stem": "SQLite has no BOOLEAN type. How is a boolean usually stored?", "opts": {"A": "As `TEXT` 'true'/'false'", "B": "As `INTEGER` 0/1", "C": "As `BLOB`", "D": "As `REAL`"}, "ans": "B", "why": "SQLite không có kiểu BOOLEAN nên boolean thường lưu dưới dạng `INTEGER` 0/1 (0 = false, 1 = true). Đây cũng là cách demo Todo dùng (`isDone`: 0/1)."}, {"id": "M9-17", "n": 17, "bs": false, "stem": "How is a DateTime typically stored?", "opts": {"A": "As `TEXT` in ISO8601 or `INTEGER` milliseconds since epoch", "B": "As a native DATE type", "C": "As `BLOB`", "D": "It cannot be stored"}, "ans": "A", "why": "`DateTime` thường lưu dạng `TEXT` chuẩn ISO8601, hoặc `INTEGER` số mili-giây kể từ epoch. SQLite không có kiểu DATE gốc nên phải quy ước một trong hai cách trên."}, {"id": "M9-18", "n": 18, "bs": false, "stem": "What does `db.insert()` return?", "opts": {"A": "`Future<int>` — the row id of the inserted row", "B": "`Future<bool>`", "C": "`Future<void>`", "D": "The inserted Map"}, "ans": "A", "why": "`db.insert()` trả về `Future<int>` là id của hàng vừa chèn (rowid). Không trả bool, void hay Map."}, {"id": "M9-19", "n": 19, "bs": false, "stem": "What does `db.delete()` return?", "opts": {"A": "`Future<int>` — the number of rows deleted", "B": "`Future<bool>` indicating success", "C": "The deleted row", "D": "`Future<void>`"}, "ans": "A", "why": "`db.delete()` trả về `Future<int>` là SỐ HÀNG bị xóa. Không trả bool thành/bại, hàng đã xóa hay void."}, {"id": "M9-20", "n": 20, "bs": false, "stem": "What does `db.update()` return?", "opts": {"A": "The number of rows affected", "B": "`true`", "C": "The updated row", "D": "Nothing"}, "ans": "A", "why": "`db.update()` trả về số hàng bị ẢNH HƯỞNG (đã cập nhật). Không trả true, hàng đã cập nhật hay không trả gì."}, {"id": "M9-21", "n": 21, "bs": false, "stem": "What does `db.query()` return?", "opts": {"A": "`Future<List<Map<String, dynamic>>>`", "B": "`Future<List<Object>>`", "C": "A ResultSet", "D": "A Stream"}, "ans": "A", "why": "`db.query()` trả về `Future<List<Map<String, dynamic>>>` — mỗi hàng là một Map, cần tự map sang model. Không phải ResultSet hay Stream."}, {"id": "M9-22", "n": 22, "bs": false, "stem": "Why should you use `where: 'id = ?'` with `whereArgs` instead of string interpolation?", "opts": {"A": "It prevents SQL injection and handles escaping", "B": "It is faster to type", "C": "It is required by Dart", "D": "It enables indexing"}, "ans": "A", "why": "Dùng `where: 'id = ?'` kèm `whereArgs` để tham số được bind an toàn, ngăn SQL injection và tự xử lý escape ký tự. Nội suy chuỗi (string interpolation) dễ bị tấn công injection."}, {"id": "M9-23", "n": 23, "bs": false, "stem": "Which `ConflictAlgorithm` overwrites an existing row with the same primary key?", "opts": {"A": "`replace`", "B": "`ignore`", "C": "`abort`", "D": "`fail`"}, "ans": "A", "why": "`ConflictAlgorithm.replace` xóa hàng cũ cùng khóa chính rồi chèn hàng mới (ghi đè). `ignore` bỏ qua, `abort`/`fail` báo lỗi và hủy thao tác."}, {"id": "M9-24", "n": 24, "bs": false, "stem": "Which is the default `ConflictAlgorithm`?", "opts": {"A": "`replace`", "B": "`abort`", "C": "`ignore`", "D": "`rollback`"}, "ans": "B", "why": "Mặc định là `abort` — khi có xung đột, thao tác bị hủy và ném lỗi (không tự ghi đè). Muốn ghi đè phải chỉ định `replace`."}, {"id": "M9-25", "n": 25, "bs": false, "stem": "Which method executes DDL such as CREATE TABLE?", "opts": {"A": "`execute()`", "B": "`query()`", "C": "`insert()`", "D": "`rawUpdate()`"}, "ans": "A", "why": "`execute()` chạy các câu DDL/SQL thô như `CREATE TABLE` (không trả về hàng dữ liệu). `query` để đọc, `insert` để chèn hàng, `rawUpdate` cho UPDATE thô."}, {"id": "M9-26", "n": 26, "bs": false, "stem": "Which package provides a path to the app's documents directory?", "opts": {"A": "`path_provider`", "B": "`path`", "C": "`file_picker`", "D": "`dart:io`"}, "ans": "A", "why": "`path_provider` cung cấp đường dẫn tới thư mục tài liệu của app (`getApplicationDocumentsDirectory()`). `path` chỉ nối/xử lý chuỗi đường dẫn, `file_picker` chọn file, `dart:io` đọc/ghi."}, {"id": "M9-27", "n": 27, "bs": false, "stem": "Which function joins path segments safely?", "opts": {"A": "`join()` from the `path` package", "B": "String `+`", "C": "`Path.combine`", "D": "`Uri.resolve`"}, "ans": "A", "why": "Hàm `join()` của package `path` nối các đoạn đường dẫn đúng theo separator từng nền tảng (`/` hay `\\`). Nối bằng `+` dễ sai separator; `Path.combine`/`Uri.resolve` không phải cách chuẩn ở đây."}, {"id": "M9-28", "n": 28, "bs": false, "stem": "Which storage option is a NoSQL, key-value store written in pure Dart?", "opts": {"A": "Hive", "B": "sqflite", "C": "SharedPreferences", "D": "Firestore"}, "ans": "A", "why": "Hive là kho NoSQL key-value viết thuần Dart, truy cập object rất nhanh, không cần SQL. sqflite là SQL quan hệ, SharedPreferences chỉ key-value đơn giản, Firestore là dịch vụ đám mây."}, {"id": "M9-29", "n": 29, "bs": false, "stem": "When is SQLite preferable to SharedPreferences?", "opts": {"A": "When data is large, structured, related, or needs querying", "B": "When storing a single boolean flag", "C": "When speed is the only concern", "D": "Never"}, "ans": "A", "why": "Chọn SQLite khi dữ liệu LỚN, có cấu trúc, có quan hệ, hoặc cần truy vấn/lọc/sắp xếp. Với một cờ boolean đơn thì SharedPreferences hợp hơn; tốc độ không phải tiêu chí duy nhất."}, {"id": "M9-30", "n": 30, "bs": false, "stem": "Which describes a \"last-write-wins\" conflict resolution strategy?", "opts": {"A": "The most recently updated record overwrites the other", "B": "Both records are merged", "C": "The conflict blocks the sync", "D": "The user always chooses"}, "ans": "A", "why": "'Last-write-wins' = bản ghi được cập nhật GẦN NHẤT sẽ ghi đè bản kia khi xung đột. Không phải trộn (merge), không chặn sync, cũng không luôn hỏi người dùng."}, {"id": "M9-31", "n": 31, "bs": false, "stem": "A common approach to offline sync marks records with:", "opts": {"A": "`isSynced` and `updatedAt` fields", "B": "A random UUID only", "C": "A colour code", "D": "Nothing; sync is automatic"}, "ans": "A", "why": "Sync offline thường đánh dấu bản ghi bằng cờ `isSynced` (đã đồng bộ chưa) và `updatedAt` (thời điểm sửa) để biết bản ghi nào cần đẩy lên và giải quyết xung đột. UUID hay mã màu không đủ, và sync không tự động."}, {"id": "M9-32", "n": 32, "bs": false, "stem": "How would you export local data to a JSON file?", "opts": {"A": "Map records to Maps, `jsonEncode` the list, write with `dart:io` `File` to a path from `path_provider`", "B": "Use `prefs.setStringList`", "C": "Use `db.export()`", "D": "It requires a server"}, "ans": "A", "why": "Xuất dữ liệu: map các bản ghi thành `Map`, `jsonEncode` cả danh sách thành chuỗi, rồi ghi bằng `File` của `dart:io` vào đường dẫn lấy từ `path_provider`. `setStringList`/`db.export()` không phù hợp và không cần server."}, {"id": "M9-33", "n": 33, "bs": false, "stem": "Which is TRUE about database migrations?", "opts": {"A": "Increasing `version` and handling `onUpgrade` is required when the schema changes", "B": "Flutter migrates schemas automatically", "C": "Migrations only work on Android", "D": "You must delete the app to change the schema"}, "ans": "A", "why": "Khi schema thay đổi, PHẢI tăng `version` và xử lý `onUpgrade` để migrate. Flutter không tự migrate schema; migration chạy trên mọi nền tảng hỗ trợ sqflite; không cần xóa app."}, {"id": "M9-34", "n": 34, "bs": false, "stem": "Where is SharedPreferences data physically stored on Android?", "opts": {"A": "In an XML file in the app's private directory", "B": "In SQLite", "C": "In the keychain", "D": "On the SD card"}, "ans": "A", "why": "Trên Android, SharedPreferences lưu vật lý trong một file XML tại thư mục riêng (private) của app. Không dùng SQLite, keychain hay thẻ SD."}, {"id": "M9-35", "n": 35, "bs": false, "stem": "Which is a valid reason to choose Hive over sqflite?", "opts": {"A": "Very fast key-value access to Dart objects without SQL, and it works on all platforms including web", "B": "It supports complex SQL joins", "C": "It is built into Flutter", "D": "It provides encryption only"}, "ans": "A", "why": "Chọn Hive vì truy cập key-value tới object Dart rất nhanh mà không cần SQL, và chạy trên MỌI nền tảng kể cả web (sqflite không chạy web). Hive không hỗ trợ JOIN SQL và không phải thứ built-in của Flutter."}, {"id": "M9-BS-1", "n": 1, "bs": true, "stem": "Which package only provides a file-system path (it does NOT read/write)?", "opts": {"A": "`dart:io`", "B": "`dart:convert`", "C": "`path_provider`", "D": "`sqflite`"}, "ans": "C", "why": "`path_provider` CHỈ cung cấp đường dẫn thư mục, KHÔNG tự đọc/ghi file (việc đọc/ghi là của `dart:io`). `dart:convert` mã hóa JSON, `sqflite` là database."}, {"id": "M9-BS-2", "n": 2, "bs": true, "stem": "Which directory may be cleared by the OS at any time?", "opts": {"A": "`getApplicationDocumentsDirectory()`", "B": "`getTemporaryDirectory()`", "C": "`getApplicationSupportDirectory()`", "D": "`getExternalStorageDirectory()`"}, "ans": "B", "why": "`getTemporaryDirectory()` trả thư mục tạm mà HĐH có thể xóa bất cứ lúc nào để giải phóng dung lượng — không nên lưu dữ liệu quan trọng ở đây. Documents/Support directory bền hơn."}, {"id": "M9-BS-3", "n": 3, "bs": true, "stem": "Which call writes a JSON string to a local file?", "opts": {"A": "`prefs.setString(key, jsonString)`", "B": "`db.insert('t', map)`", "C": "`jsonEncode(list)`", "D": "`File(path).writeAsString(jsonString)`"}, "ans": "D", "why": "Ghi chuỗi JSON ra file cục bộ bằng `File(path).writeAsString(jsonString)` (dart:io). `prefs.setString` lưu vào SharedPreferences chứ không phải file, `db.insert` ghi vào SQLite, còn `jsonEncode` chỉ tạo chuỗi chứ chưa ghi."}, {"id": "M9-BS-4", "n": 4, "bs": true, "stem": "What is the relationship between SQLite and sqflite?", "opts": {"A": "They are the same thing", "B": "SQLite is the C database engine; sqflite is a Flutter plugin wrapping it", "C": "sqflite is the engine and SQLite is the plugin", "D": "sqflite replaces SQLite with a NoSQL store"}, "ans": "B", "why": "SQLite là ENGINE database viết bằng C; sqflite là PLUGIN Flutter (Dart + native) bọc quanh engine đó để Dart gọi được. Chúng không phải một, và sqflite không thay SQLite bằng NoSQL."}, {"id": "M9-BS-5", "n": 5, "bs": true, "stem": "Why doesn't sqflite work on Flutter Web?", "opts": {"A": "The browser has no JavaScript", "B": "sqflite is deprecated", "C": "There is no native SQLite engine in the browser", "D": "The web cannot store any data"}, "ans": "C", "why": "sqflite không chạy trên Flutter Web vì trình duyệt KHÔNG có engine SQLite gốc để plugin cầu nối tới. Không liên quan việc thiếu JavaScript, sqflite không bị deprecated, và web vẫn lưu được dữ liệu bằng cách khác (localStorage)."}, {"id": "M9-BS-6", "n": 6, "bs": true, "stem": "On Flutter Web, `SharedPreferences` stores data in:", "opts": {"A": "An XML file", "B": "An SQLite database", "C": "HTTP cookies", "D": "The browser's `localStorage`"}, "ans": "D", "why": "Trên Flutter Web, SharedPreferences ánh xạ sang `localStorage` của trình duyệt. Không dùng file XML (đó là Android), không dùng SQLite hay cookie."}, {"id": "M9-BS-7", "n": 7, "bs": true, "stem": "In DartPad (Flutter mode), why must `SharedPreferences` be replaced by a `FakePrefs` mock?", "opts": {"A": "Because it is faster", "B": "Plugins with native code are not supported, so the real plugin is unavailable", "C": "Because DartPad has no Dart runtime", "D": "Because `FakePrefs` persists data permanently"}, "ans": "B", "why": "Trong DartPad (chế độ Flutter), plugin có code native không được hỗ trợ nên plugin SharedPreferences thật không dùng được → phải thay bằng mock `FakePrefs` (lưu trong RAM). Không phải vì nhanh hơn hay DartPad thiếu Dart runtime."}, {"id": "M9-BS-8", "n": 8, "bs": true, "stem": "Which SQL clause filters GROUPS (after `GROUP BY`), not individual rows?", "opts": {"A": "`WHERE`", "B": "`ORDER BY`", "C": "`HAVING`", "D": "`LIMIT`"}, "ans": "C", "why": "`HAVING` lọc các NHÓM sau khi `GROUP BY` (thường dùng với hàm tổng hợp như SUM/COUNT). `WHERE` lọc từng hàng trước khi gom nhóm, `ORDER BY` sắp xếp, `LIMIT` giới hạn số lượng."}, {"id": "M9-BS-9", "n": 9, "bs": true, "stem": "Which clauses implement pagination for a long list?", "opts": {"A": "`GROUP BY` and `HAVING`", "B": "`SELECT` and `FROM`", "C": "`WHERE` and `AND`", "D": "`LIMIT` and `OFFSET`"}, "ans": "D", "why": "Phân trang (pagination) dùng `LIMIT` (số bản ghi mỗi trang) và `OFFSET` (bỏ qua bao nhiêu bản ghi). Rất hữu ích cho danh sách dài trên mobile. Các cặp còn lại phục vụ mục đích khác."}, {"id": "M9-BS-10", "n": 10, "bs": true, "stem": "In `db.query()`, results are sorted using the parameter:", "opts": {"A": "`sort`", "B": "`orderBy`", "C": "`sortBy`", "D": "`arrange`"}, "ans": "B", "why": "Trong `db.query()`, kết quả được sắp xếp qua tham số `orderBy` (vd `orderBy: 'id DESC'`). Không có tham số `sort`/`sortBy`/`arrange`."}]}, {"id": "M10", "kind": "mod", "chip": "M10", "title": "Module 10 — Authentication & User Management", "questions": [{"id": "M10-1", "n": 1, "bs": false, "stem": "Which FirebaseAuth method signs a user in without any credentials?", "opts": {"A": "`signInAnonymously()`", "B": "`signInAsGuest()`", "C": "`createAnonymousUser()`", "D": "`guestLogin()`"}, "ans": "A", "why": "signInAnonymously() tạo phiên đăng nhập ẩn danh với một UID tạm, không cần email/mật khẩu — đúng nghĩa 'không cần credentials'. Các tên còn lại (signInAsGuest, createAnonymousUser, guestLogin) không tồn tại trong FirebaseAuth."}, {"id": "M10-2", "n": 2, "bs": false, "stem": "Which method registers a new email/password account?", "opts": {"A": "`createUserWithEmailAndPassword()`", "B": "`registerUser()`", "C": "`signUpWithEmail()`", "D": "`newAccount()`"}, "ans": "A", "why": "createUserWithEmailAndPassword() là API chuẩn của FirebaseAuth để đăng ký tài khoản mới bằng email + mật khẩu. registerUser/signUpWithEmail/newAccount chỉ là tên bịa, không có trong SDK."}, {"id": "M10-3", "n": 3, "bs": false, "stem": "Which method signs in an existing email/password user?", "opts": {"A": "`signInWithEmailAndPassword()`", "B": "`login()`", "C": "`authenticate()`", "D": "`signIn()`"}, "ans": "A", "why": "signInWithEmailAndPassword() dùng để đăng nhập tài khoản email/mật khẩu ĐÃ tồn tại. ≠ createUserWithEmailAndPassword (dùng để tạo mới); login()/authenticate()/signIn() không phải API Firebase."}, {"id": "M10-4", "n": 4, "bs": false, "stem": "Which error code means the email is already registered with a DIFFERENT sign-in provider?", "opts": {"A": "`account-exists-with-different-credential`", "B": "`email-already-in-use`", "C": "`credential-already-in-use`", "D": "`provider-already-linked`"}, "ans": "A", "why": "account-exists-with-different-credential báo email đã đăng ký nhưng qua provider KHÁC (ví dụ đã đăng ký bằng Google, giờ đăng nhập bằng Facebook cùng email). ≠ email-already-in-use vì lỗi đó xảy ra khi tạo tài khoản email mới trùng, không liên quan provider."}, {"id": "M10-5", "n": 5, "bs": false, "stem": "Which error code occurs when creating a new account with an email that already exists?", "opts": {"A": "`email-already-in-use`", "B": "`account-exists-with-different-credential`", "C": "`user-not-found`", "D": "`invalid-email`"}, "ans": "A", "why": "email-already-in-use là lỗi khi gọi createUserWithEmailAndPassword với email đã tồn tại. ≠ account-exists-with-different-credential (dành cho tình huống trùng email nhưng khác provider đăng nhập)."}, {"id": "M10-6", "n": 6, "bs": false, "stem": "Which error code is thrown when the password is under 6 characters?", "opts": {"A": "`weak-password`", "B": "`invalid-password`", "C": "`short-password`", "D": "`password-too-short`"}, "ans": "A", "why": "Firebase yêu cầu mật khẩu tối thiểu 6 ký tự; ngắn hơn sẽ ném weak-password. Các mã invalid-password/short-password/password-too-short không tồn tại trong Firebase Auth."}, {"id": "M10-7", "n": 7, "bs": false, "stem": "Which exception type wraps Firebase Auth errors?", "opts": {"A": "`FirebaseAuthException`", "B": "`AuthError`", "C": "`FirebaseException` only", "D": "`PlatformException` only"}, "ans": "A", "why": "Mọi lỗi từ Firebase Auth được gói trong FirebaseAuthException, có thuộc tính .code để phân loại (weak-password, email-already-in-use...). Nhờ đó bạn catch on FirebaseAuthException để xử lý theo mã lỗi."}, {"id": "M10-8", "n": 8, "bs": false, "stem": "Which property gives the currently signed-in user (or null)?", "opts": {"A": "`FirebaseAuth.instance.currentUser`", "B": "`FirebaseAuth.user`", "C": "`Auth.session`", "D": "`FirebaseAuth.instance.getUser()`"}, "ans": "A", "why": "FirebaseAuth.instance.currentUser trả về User đang đăng nhập, hoặc null nếu chưa. Đây là cách kiểm tra trạng thái đăng nhập tức thời (đồng bộ), khác với stream authStateChanges()."}, {"id": "M10-9", "n": 9, "bs": false, "stem": "Which returns a Stream of authentication state changes?", "opts": {"A": "`authStateChanges()`", "B": "`onAuthChanged()`", "C": "`userStream()`", "D": "`listenAuth()`"}, "ans": "A", "why": "authStateChanges() trả về Stream<User?> phát ra sự kiện mỗi khi trạng thái đăng nhập thay đổi (login/logout). Dùng để cập nhật UI tự động theo phiên."}, {"id": "M10-10", "n": 10, "bs": false, "stem": "Which widget pairs naturally with `authStateChanges()`?", "opts": {"A": "`StreamBuilder`", "B": "`FutureBuilder`", "C": "`LayoutBuilder`", "D": "`Builder`"}, "ans": "A", "why": "authStateChanges() là một Stream nên ghép tự nhiên với StreamBuilder để rebuild UI mỗi khi trạng thái auth đổi. ≠ FutureBuilder vì Future chỉ cho một giá trị một lần, không lắng nghe liên tục."}, {"id": "M10-11", "n": 11, "bs": false, "stem": "Which method signs the user out?", "opts": {"A": "`signOut()`", "B": "`logout()`", "C": "`disconnect()`", "D": "`endSession()`"}, "ans": "A", "why": "signOut() kết thúc phiên đăng nhập hiện tại và xóa currentUser. logout()/disconnect()/endSession() không phải tên method của FirebaseAuth."}, {"id": "M10-12", "n": 12, "bs": false, "stem": "Which method sends a password reset email?", "opts": {"A": "`sendPasswordResetEmail(email: e)`", "B": "`resetPassword()`", "C": "`forgotPassword()`", "D": "`recoverAccount()`"}, "ans": "A", "why": "sendPasswordResetEmail(email: e) gửi email chứa link đặt lại mật khẩu tới địa chỉ đó. Các tên resetPassword/forgotPassword/recoverAccount không có trong SDK."}, {"id": "M10-13", "n": 13, "bs": false, "stem": "Which is the correct navigation call after a successful login?", "opts": {"A": "`pushReplacement` or `pushAndRemoveUntil`", "B": "`push`", "C": "`pop`", "D": "`popUntil`"}, "ans": "A", "why": "Sau khi đăng nhập nên dùng pushReplacement hoặc pushAndRemoveUntil để thay/xóa màn Login khỏi stack, chặn quay lại. Slide khuyên dùng pushReplacementNamed đúng theo tinh thần này."}, {"id": "M10-14", "n": 14, "bs": false, "stem": "Why is `push` inappropriate after login?", "opts": {"A": "The login screen remains on the stack and the user can navigate back to it", "B": "It causes a memory leak", "C": "It is slower", "D": "It resets the theme"}, "ans": "A", "why": "push() chỉ chồng Home lên trên nên màn Login vẫn còn trong stack, người dùng bấm back sẽ quay lại trang đăng nhập — điều không mong muốn sau khi đã login."}, {"id": "M10-15", "n": 15, "bs": false, "stem": "What is a \"guarded route\"?", "opts": {"A": "A route that checks authentication/authorisation before allowing access", "B": "A route with an animation", "C": "A route with a password field", "D": "A route that cannot be popped"}, "ans": "A", "why": "Guarded route (route được bảo vệ) là route kiểm tra xác thực/phân quyền trước khi cho truy cập, chuyển hướng về Login nếu chưa đăng nhập. Không liên quan animation hay khóa pop."}, {"id": "M10-16", "n": 16, "bs": false, "stem": "Which is a valid way to implement route guarding?", "opts": {"A": "Check auth state in `onGenerateRoute`, use a wrapper widget, or a router redirect", "B": "Hide the navigation button only", "C": "Use `const` routes", "D": "Disable the back button"}, "ans": "A", "why": "Có thể chặn route bằng nhiều cách: kiểm tra trạng thái auth trong onGenerateRoute, dùng widget bọc (wrapper), hoặc redirect của router (go_router). Chỉ ẩn nút bấm là không an toàn vì route vẫn truy cập được."}, {"id": "M10-17", "n": 17, "bs": false, "stem": "Where should session state (logged in / logged out) live?", "opts": {"A": "In an app-level state holder (Provider/InheritedWidget), not in an individual widget", "B": "In each screen's `setState`", "C": "In a global mutable variable only", "D": "In the widget's constructor"}, "ans": "A", "why": "Trạng thái phiên (đăng nhập/đăng xuất) nên đặt ở state holder cấp app (Provider/InheritedWidget) để mọi màn hình cùng đọc và phản ứng. Nếu để trong setState của từng màn thì trạng thái bị phân mảnh, khó đồng bộ."}, {"id": "M10-18", "n": 18, "bs": false, "stem": "Which storage is appropriate for a token in a production app?", "opts": {"A": "`flutter_secure_storage`", "B": "`SharedPreferences`", "C": "A global variable", "D": "A text file in assets"}, "ans": "A", "why": "Token nhạy cảm nên lưu bằng flutter_secure_storage vì nó mã hóa (Keychain iOS / Keystore Android). ≠ SharedPreferences vì SharedPreferences lưu plaintext, dễ bị đọc trên thiết bị bị root/jailbreak."}, {"id": "M10-19", "n": 19, "bs": false, "stem": "What should happen when a token expires?", "opts": {"A": "Attempt a refresh; if it fails, clear the session and navigate to login", "B": "Crash the app", "C": "Ignore it", "D": "Retry the same token indefinitely"}, "ans": "A", "why": "Khi access token hết hạn, đúng cách là thử refresh để lấy token mới; nếu refresh thất bại thì xóa phiên và điều hướng về Login. Không được crash hay lặp lại token cũ vô hạn."}, {"id": "M10-20", "n": 20, "bs": false, "stem": "What does logging out involve?", "opts": {"A": "Clearing the token/session and clearing the navigation stack back to login", "B": "Only calling `pop()`", "C": "Restarting the device", "D": "Deleting the database always"}, "ans": "A", "why": "Đăng xuất là xóa token/phiên khỏi bộ nhớ và dọn navigation stack đưa về Login (pushAndRemoveUntil), tránh back lại vùng đã đăng nhập. Chỉ pop() là chưa xóa phiên."}, {"id": "M10-21", "n": 21, "bs": false, "stem": "Why is a \"mock auth\" acceptable for coursework but not production?", "opts": {"A": "It does not verify credentials against a real, secure backend", "B": "It is slower", "C": "It does not compile in release mode", "D": "It cannot store tokens"}, "ans": "A", "why": "Mock auth chấp nhận được trong bài tập vì minh họa đúng luồng, nhưng không dùng thật vì nó không xác thực credential với backend an toàn — ai cũng qua được. Slide 9/12 nói rõ mock chỉ so khớp tài khoản demo."}, {"id": "M10-22", "n": 22, "bs": false, "stem": "Which is a security caveat of storing a token in SharedPreferences?", "opts": {"A": "It is stored in plain text and readable on a compromised device", "B": "It expires immediately", "C": "It is shared with other apps by default", "D": "It cannot be deleted"}, "ans": "A", "why": "Lưu token trong SharedPreferences là plaintext, có thể bị đọc trên thiết bị bị xâm nhập (root/jailbreak). Vì vậy sản phẩm thật nên dùng secure storage."}, {"id": "M10-23", "n": 23, "bs": false, "stem": "Which method links an additional provider to an existing account?", "opts": {"A": "`currentUser.linkWithCredential(credential)`", "B": "`signInWithCredential()`", "C": "`mergeAccounts()`", "D": "`addProvider()`"}, "ans": "A", "why": "currentUser.linkWithCredential(credential) gắn thêm một provider (ví dụ Google) vào tài khoản hiện có để đăng nhập nhiều cách. ≠ signInWithCredential (dùng để đăng nhập, không liên kết vào tài khoản đang có)."}, {"id": "M10-24", "n": 24, "bs": false, "stem": "Which error occurs when trying to link a provider that is already linked?", "opts": {"A": "`provider-already-linked`", "B": "`credential-already-in-use`", "C": "`email-already-in-use`", "D": "`operation-not-allowed`"}, "ans": "A", "why": "provider-already-linked xảy ra khi cố liên kết một provider đã được gắn vào tài khoản. ≠ credential-already-in-use (credential đó đã thuộc về một tài khoản khác)."}, {"id": "M10-25", "n": 25, "bs": false, "stem": "Which method triggers a verification email?", "opts": {"A": "`currentUser?.sendEmailVerification()`", "B": "`verifyEmail()`", "C": "`confirmEmail()`", "D": "`sendVerification()`"}, "ans": "A", "why": "currentUser?.sendEmailVerification() gửi email xác minh cho người dùng vừa đăng ký. verifyEmail/confirmEmail/sendVerification không phải API của User."}, {"id": "M10-26", "n": 26, "bs": false, "stem": "Which error code appears after too many failed sign-in attempts?", "opts": {"A": "`too-many-requests`", "B": "`rate-limited`", "C": "`blocked`", "D": "`quota-exceeded`"}, "ans": "A", "why": "Sau quá nhiều lần đăng nhập sai, Firebase chặn tạm và ném too-many-requests (giới hạn tần suất để chống brute-force). Các mã rate-limited/blocked/quota-exceeded không phải mã của Firebase Auth."}, {"id": "M10-27", "n": 27, "bs": false, "stem": "In an app without Firebase, how would you typically authenticate?", "opts": {"A": "POST credentials to a REST endpoint, receive a JWT, store it, attach it to subsequent requests", "B": "Store passwords locally and compare them", "C": "Use SharedPreferences as the auth server", "D": "Hard-code credentials in the app"}, "ans": "A", "why": "App không dùng Firebase thường tự xác thực bằng REST: POST credential lên endpoint, nhận về JWT, lưu token rồi đính kèm token vào header cho các request sau. Không bao giờ lưu và tự so mật khẩu tại máy."}, {"id": "M10-28", "n": 28, "bs": false, "stem": "Why should passwords never be stored on the device?", "opts": {"A": "They can be extracted; only short-lived tokens should be persisted", "B": "They take too much space", "C": "Dart cannot store them", "D": "It breaks null safety"}, "ans": "A", "why": "Mật khẩu không được lưu trên thiết bị vì có thể bị trích xuất; chỉ nên lưu token ngắn hạn (thu hồi được, hết hạn được) để giảm thiệt hại nếu lộ."}, {"id": "M10-BS-1", "n": 1, "bs": true, "stem": "How many parts does a JWT have, separated by dots?", "opts": {"A": "2 — key and value", "B": "1 — a single encrypted blob", "C": "3 — header, payload, signature", "D": "4 — header, payload, signature, refresh"}, "ans": "C", "why": "JWT gồm 3 phần ngăn bởi dấu chấm: Header, Payload, Signature (header.payload.signature). Không phải 2 hay 4 phần; refresh token là một token riêng, không nằm trong cấu trúc JWT."}, {"id": "M10-BS-2", "n": 2, "bs": true, "stem": "Which is TRUE about a JWT payload?", "opts": {"A": "It is fully encrypted and unreadable by the client", "B": "It is Base64Url-encoded and signed but NOT encrypted, so it must not contain secrets", "C": "It stores the user's raw password securely", "D": "It cannot be decoded without the server key"}, "ans": "B", "why": "Payload JWT chỉ được mã hóa Base64Url và được KÝ (sign), KHÔNG mã hóa, nên ai có token đều đọc được nội dung — vì vậy không được đặt bí mật/mật khẩu trong đó. Slide nói rõ 'Signed (not encrypted)'."}, {"id": "M10-BS-3", "n": 3, "bs": true, "stem": "What is the correct HTTP header to send an access token?", "opts": {"A": "`Token: <token>`", "B": "`Cookie: jwt=<token>`", "C": "`X-Auth-Password: <token>`", "D": "`Authorization: Bearer <token>`"}, "ans": "D", "why": "Chuẩn gửi access token là header Authorization: Bearer <token>. Các dạng Token:/Cookie:/X-Auth-Password không phải quy ước chuẩn cho bearer token."}, {"id": "M10-BS-4", "n": 4, "bs": true, "stem": "What is the main purpose of a refresh token?", "opts": {"A": "Encrypt the access token", "B": "Store the user's password", "C": "Obtain a new access token when the short-lived one expires, without re-login", "D": "Replace the need for HTTPS"}, "ans": "C", "why": "Refresh token dùng để xin access token mới khi access token ngắn hạn hết hạn, mà không bắt người dùng đăng nhập lại. Nó không mã hóa access token cũng không lưu mật khẩu."}, {"id": "M10-BS-5", "n": 5, "bs": true, "stem": "Why is the access token deliberately short-lived?", "opts": {"A": "To save storage space", "B": "To reduce the risk window if it is leaked", "C": "Because JWTs technically cannot be long", "D": "To avoid using HTTPS"}, "ans": "B", "why": "Access token cố tình để sống ngắn nhằm thu hẹp cửa sổ rủi ro nếu bị lộ — kẻ tấn công chỉ dùng được trong thời gian ngắn. Không phải để tiết kiệm bộ nhớ hay né HTTPS."}, {"id": "M10-BS-6", "n": 6, "bs": true, "stem": "In Google Sign-In with Firebase, what is built from the Google tokens before signing in?", "opts": {"A": "`FirebaseUser.fromGoogle()`", "B": "`OAuthToken.build()`", "C": "`GoogleSignInResult()`", "D": "`GoogleAuthProvider.credential(idToken:, accessToken:)`"}, "ans": "D", "why": "Trong Google Sign-In với Firebase, từ idToken và accessToken của Google ta dựng GoogleAuthProvider.credential(idToken:, accessToken:) rồi truyền vào signInWithCredential. Các tên còn lại đều bịa."}, {"id": "M10-BS-7", "n": 7, "bs": true, "stem": "Which file must be placed in `android/app/` for Firebase on Android?", "opts": {"A": "`firebase.json`", "B": "`key.properties`", "C": "`google-services.json`", "D": "`GoogleService-Info.plist`"}, "ans": "C", "why": "Trên Android, tệp google-services.json phải đặt trong android/app/ để Firebase hoạt động. GoogleService-Info.plist là của iOS; firebase.json/key.properties phục vụ mục đích khác."}, {"id": "M10-BS-8", "n": 8, "bs": true, "stem": "A Google Sign-In throws `DEVELOPER_ERROR`. Most likely cause?", "opts": {"A": "No internet connection", "B": "Wrong package name / missing SHA-1 fingerprint", "C": "The access token expired", "D": "Missing INTERNET permission"}, "ans": "B", "why": "DEVELOPER_ERROR thường do sai package name hoặc thiếu vân tay SHA-1 khai trên Firebase Console, khiến Google từ chối xác thực. Không liên quan internet hay token hết hạn (slide 27 nêu rõ)."}, {"id": "M10-BS-9", "n": 9, "bs": true, "stem": "Google Sign-In returns `null` on an emulator. Most likely cause?", "opts": {"A": "The APK is unsigned", "B": "Dart null safety is disabled", "C": "The wrong Flutter version is installed", "D": "The emulator lacks Google Play Services"}, "ans": "D", "why": "Google Sign-In trả null trên emulator thường vì emulator thiếu Google Play Services; hãy dùng emulator có Play Store hoặc máy thật. Không liên quan APK ký hay null safety."}, {"id": "M10-BS-10", "n": 10, "bs": true, "stem": "Which dependencies are required for Firebase Google Sign-In?", "opts": {"A": "`firebase_core`, `firebase_auth`, `google_sign_in`", "B": "`http`, `provider`", "C": "`shared_preferences`, `sqflite`", "D": "`firebase_messaging` only"}, "ans": "A", "why": "Firebase Google Sign-In cần bộ ba: firebase_core, firebase_auth, google_sign_in (slide 25). http/provider/shared_preferences/sqflite không phục vụ luồng này."}, {"id": "M10-BS-11", "n": 11, "bs": true, "stem": "A user session typically consists of:", "opts": {"A": "Only the username", "B": "The device IMEI", "C": "Access token, user profile, and token expiry timestamp", "D": "The installed app version"}, "ans": "C", "why": "Một session điển hình gồm access token, hồ sơ người dùng (profile) và mốc thời gian hết hạn của token (slide 18). Chỉ username hay IMEI/phiên bản app đều không đủ định nghĩa phiên."}, {"id": "M10-BS-12", "n": 12, "bs": true, "stem": "In a SplashScreen auto-login flow, what decides the destination screen?", "opts": {"A": "The device orientation", "B": "Whether a valid token exists in storage → Home, otherwise Login", "C": "The current theme mode", "D": "A random choice at startup"}, "ans": "B", "why": "Ở SplashScreen, đích đến quyết định theo việc có token hợp lệ trong storage hay không: có → Home (auto-login), không → Login (slide 20). Không phụ thuộc orientation hay theme."}, {"id": "M10-BS-13", "n": 13, "bs": true, "stem": "Which is a FORM-level (cross-field) validation rule in a signup form?", "opts": {"A": "Email must contain '@'", "B": "Password must be at least 6 characters", "C": "Name must not be empty", "D": "\"Password\" and \"Confirm password\" must match"}, "ans": "D", "why": "Quy tắc cấp form (liên trường) là 'Password' và 'Confirm password' phải khớp nhau vì nó so hai trường với nhau. Các quy tắc còn lại (email chứa '@', mật khẩu ≥6 ký tự, tên không rỗng) chỉ xét từng trường (field-level)."}, {"id": "M10-BS-14", "n": 14, "bs": true, "stem": "Authentication vs Authorization — which is correct?", "opts": {"A": "They are the same thing", "B": "Authentication verifies identity (\"who are you?\"); Authorization controls access (\"what may you do?\")", "C": "Authorization happens before Authentication", "D": "Authentication decides permissions"}, "ans": "B", "why": "Authentication xác minh danh tính ('bạn là ai?'), còn Authorization kiểm soát quyền truy cập ('bạn được làm gì?'). Chúng khác nhau và authentication diễn ra trước authorization."}]}, {"id": "M11", "kind": "mod", "chip": "M11", "title": "Module 11 — Testing & Debugging", "questions": [{"id": "M11-1", "n": 1, "bs": false, "stem": "Which test type verifies a single function or class in isolation?", "opts": {"A": "Unit test", "B": "Widget test", "C": "Integration test", "D": "Golden test"}, "ans": "A", "why": "Unit test kiểm thử một hàm/lớp riêng lẻ (logic) mà không cần UI hay thiết bị. Đây là loại nằm đáy tháp kiểm thử: nhanh, ổn định, rẻ."}, {"id": "M11-2", "n": 2, "bs": false, "stem": "Which test type renders a widget in a test environment and interacts with it?", "opts": {"A": "Unit test", "B": "Widget test", "C": "Integration test", "D": "Smoke test"}, "ans": "B", "why": "Widget test dựng (render) một widget trong môi trường test và tương tác với nó (gõ chữ, nhấn nút) để kiểm tra UI. ≠ Unit test vì unit test không dựng UI; ≠ Integration test vì widget test không chạy cả app trên thiết bị."}, {"id": "M11-3", "n": 3, "bs": false, "stem": "Which test type runs the full app on a real device or emulator?", "opts": {"A": "Unit test", "B": "Widget test", "C": "Integration test", "D": "Static analysis"}, "ans": "C", "why": "Integration test chạy toàn bộ ứng dụng trên thiết bị/emulator thật để kiểm tra luồng người dùng đầu-cuối. Chậm và tốn kém nhất nên chỉ dùng cho luồng quan trọng."}, {"id": "M11-4", "n": 4, "bs": false, "stem": "Which is fastest to run?", "opts": {"A": "Unit test", "B": "Widget test", "C": "Integration test", "D": "All equal"}, "ans": "A", "why": "Unit test chạy nhanh nhất vì chỉ kiểm tra logic thuần, không dựng UI cũng không khởi động app — đúng lý do nó nằm đáy tháp kiểm thử (số lượng nhiều nhất)."}, {"id": "M11-5", "n": 5, "bs": false, "stem": "Which package provides `testWidgets` and `WidgetTester`?", "opts": {"A": "`flutter_test`", "B": "`test`", "C": "`mockito`", "D": "`integration_test`"}, "ans": "A", "why": "Gói flutter_test cung cấp testWidgets và WidgetTester để viết widget test. ≠ test (chỉ cho unit test Dart thuần), mockito (mocking), integration_test (test tích hợp)."}, {"id": "M11-6", "n": 6, "bs": false, "stem": "Which function declares a widget test?", "opts": {"A": "`test()`", "B": "`testWidgets()`", "C": "`widgetTest()`", "D": "`it()`"}, "ans": "B", "why": "testWidgets() khai báo một widget test và cấp WidgetTester để thao tác. ≠ test() dùng cho unit test logic thuần; widgetTest()/it() không tồn tại."}, {"id": "M11-7", "n": 7, "bs": false, "stem": "Which method renders a widget in a widget test?", "opts": {"A": "`tester.pumpWidget(widget)`", "B": "`tester.render(widget)`", "C": "`tester.build(widget)`", "D": "`runApp(widget)`"}, "ans": "A", "why": "tester.pumpWidget(widget) dựng widget vào cây test để bắt đầu kiểm thử. ≠ runApp (dùng trong app thật, không dùng trong test); render/build không phải method của WidgetTester."}, {"id": "M11-8", "n": 8, "bs": false, "stem": "What does `tester.pump()` do?", "opts": {"A": "Triggers a single frame rebuild", "B": "Runs all animations to completion", "C": "Restarts the test", "D": "Disposes the widget"}, "ans": "A", "why": "tester.pump() kích hoạt dựng lại đúng MỘT frame (áp dụng thay đổi state một lần). ≠ pumpAndSettle vốn bơm liên tục cho tới khi hết animation."}, {"id": "M11-9", "n": 9, "bs": false, "stem": "What does `tester.pumpAndSettle()` do?", "opts": {"A": "Repeatedly pumps frames until no more are scheduled (animations finished)", "B": "Pumps exactly two frames", "C": "Waits one second", "D": "Cancels animations"}, "ans": "A", "why": "tester.pumpAndSettle() lặp lại việc bơm frame cho tới khi không còn frame nào được lên lịch, tức chờ animation/chuyển màn hoàn tất. Hữu ích sau khi điều hướng để đích đến render xong."}, {"id": "M11-10", "n": 10, "bs": false, "stem": "Which finder locates a widget by its displayed text?", "opts": {"A": "`find.text('Hello')`", "B": "`find.byLabel('Hello')`", "C": "`find.string('Hello')`", "D": "`find.content('Hello')`"}, "ans": "A", "why": "find.text('Hello') tìm widget theo nội dung chữ hiển thị. Các tên find.byLabel/find.string/find.content không phải finder của flutter_test."}, {"id": "M11-11", "n": 11, "bs": false, "stem": "Which finder locates a widget by its runtime type?", "opts": {"A": "`find.byType(ElevatedButton)`", "B": "`find.widget(ElevatedButton)`", "C": "`find.class(ElevatedButton)`", "D": "`find.of(ElevatedButton)`"}, "ans": "A", "why": "find.byType(ElevatedButton) định vị widget theo kiểu runtime của nó. find.widget/find.class/find.of không phải finder hợp lệ."}, {"id": "M11-12", "n": 12, "bs": false, "stem": "Which matcher asserts exactly one matching widget?", "opts": {"A": "`findsOneWidget`", "B": "`findsWidgets`", "C": "`findsNothing`", "D": "`isNotNull`"}, "ans": "A", "why": "findsOneWidget khẳng định có ĐÚNG một widget khớp finder. ≠ findsWidgets (một hoặc nhiều), findsNothing (không có widget nào)."}, {"id": "M11-13", "n": 13, "bs": false, "stem": "Which matcher asserts no matching widget exists?", "opts": {"A": "`findsNothing`", "B": "`findsZeroWidgets`", "C": "`isEmpty`", "D": "`findsNone`"}, "ans": "A", "why": "findsNothing khẳng định không có widget nào khớp — dùng để kiểm tra một phần tử đã biến mất. findsZeroWidgets/findsNone không tồn tại."}, {"id": "M11-14", "n": 14, "bs": false, "stem": "Which method simulates a tap?", "opts": {"A": "`tester.tap(finder)`", "B": "`tester.click(finder)`", "C": "`tester.press(finder)`", "D": "`tester.touch(finder)`"}, "ans": "A", "why": "tester.tap(finder) mô phỏng cú chạm vào widget được tìm thấy. click/press/touch không phải method của WidgetTester."}, {"id": "M11-15", "n": 15, "bs": false, "stem": "Which method enters text into a field during a test?", "opts": {"A": "`tester.enterText(finder, 'abc')`", "B": "`tester.type(...)`", "C": "`tester.input(...)`", "D": "`tester.setText(...)`"}, "ans": "A", "why": "tester.enterText(finder, 'abc') nhập chữ vào ô nhập trong test. type/input/setText không phải API của WidgetTester."}, {"id": "M11-16", "n": 16, "bs": false, "stem": "Why are mocking libraries important in unit tests?", "opts": {"A": "To display the UI during unit tests", "B": "To completely replace writing application logic", "C": "To automatically fix logic errors", "D": "To simulate responses from APIs or databases without real connections"}, "ans": "D", "why": "Mocking quan trọng vì cho phép giả lập phản hồi từ API/database mà không cần kết nối thật, giúp test nhanh, ổn định và tách khỏi mạng. Nó không thay việc viết logic, cũng không tự sửa lỗi."}, {"id": "M11-17", "n": 17, "bs": false, "stem": "Which is NOT a benefit of mocking?", "opts": {"A": "Faster, deterministic tests", "B": "Ability to simulate errors and edge cases", "C": "Automatic bug fixing", "D": "No dependency on network availability"}, "ans": "C", "why": "Mocking KHÔNG tự sửa lỗi logic — đó không phải lợi ích của nó. Các lợi ích thật: test nhanh và tất định, mô phỏng được lỗi/biên, không phụ thuộc mạng."}, {"id": "M11-18", "n": 18, "bs": false, "stem": "Which packages are used for mocking in Dart?", "opts": {"A": "`mockito` or `mocktail`", "B": "`provider`", "C": "`dio`", "D": "`build_runner` alone"}, "ans": "A", "why": "Dart/Flutter dùng mockito hoặc mocktail để tạo mock. provider (quản lý state), dio (HTTP), build_runner (sinh code) không phải thư viện mocking."}, {"id": "M11-19", "n": 19, "bs": false, "stem": "Which mockito/mocktail call defines a stubbed return value?", "opts": {"A": "`when(() => api.fetch()).thenAnswer((_) async => data)`", "B": "`stub(api.fetch, data)`", "C": "`mock.returns(data)`", "D": "`expect(api.fetch, data)`"}, "ans": "A", "why": "when(() => api.fetch()).thenAnswer((_) async => data) định nghĩa giá trị trả về giả (stub) cho lời gọi bất đồng bộ. Cú pháp stub()/returns()/expect() ở đây đều sai."}, {"id": "M11-20", "n": 20, "bs": false, "stem": "Which call asserts a method was invoked?", "opts": {"A": "`verify(() => api.fetch()).called(1)`", "B": "`assert(api.called)`", "C": "`expectCall(api.fetch)`", "D": "`check(api.fetch)`"}, "ans": "A", "why": "verify(() => api.fetch()).called(1) kiểm chứng method đã được gọi (và gọi bao nhiêu lần). assert/expectCall/check không phải API của mockito/mocktail."}, {"id": "M11-21", "n": 21, "bs": false, "stem": "Which design pattern makes networking code mockable?", "opts": {"A": "Repository Pattern (dependency injection of the data source)", "B": "Singleton", "C": "Builder", "D": "Observer"}, "ans": "A", "why": "Repository Pattern (tiêm phụ thuộc nguồn dữ liệu) giúp thay data source thật bằng mock khi test, nên code mạng trở nên dễ kiểm thử. Singleton/Builder/Observer không nhắm mục tiêu này."}, {"id": "M11-22", "n": 22, "bs": false, "stem": "Which function runs before each test in a group?", "opts": {"A": "`setUp()`", "B": "`before()`", "C": "`init()`", "D": "`beforeEach()`"}, "ans": "A", "why": "setUp() chạy trước MỖI test trong group để chuẩn bị môi trường. before()/init()/beforeEach() không phải API của package test Dart."}, {"id": "M11-23", "n": 23, "bs": false, "stem": "Which function runs after each test?", "opts": {"A": "`tearDown()`", "B": "`after()`", "C": "`cleanup()`", "D": "`dispose()`"}, "ans": "A", "why": "tearDown() chạy sau MỖI test để dọn dẹp tài nguyên. after()/cleanup()/dispose() không phải hàm của khung test."}, {"id": "M11-24", "n": 24, "bs": false, "stem": "Which groups related tests together?", "opts": {"A": "`group()`", "B": "`describe()`", "C": "`suite()`", "D": "`context()`"}, "ans": "A", "why": "group() gom các test liên quan thành nhóm để tổ chức và chạy chung setUp/tearDown. describe()/suite()/context() là của framework khác, không phải Dart test."}, {"id": "M11-25", "n": 25, "bs": false, "stem": "Which command runs all tests?", "opts": {"A": "`flutter test`", "B": "`dart run tests`", "C": "`flutter check`", "D": "`flutter analyze`"}, "ans": "A", "why": "flutter test chạy toàn bộ test trong dự án. flutter analyze là phân tích tĩnh, không chạy test; các lệnh còn lại không tồn tại."}, {"id": "M11-26", "n": 26, "bs": false, "stem": "Which command reports static analysis issues?", "opts": {"A": "`dart analyze`", "B": "`flutter test`", "C": "`dart format`", "D": "`flutter doctor`"}, "ans": "A", "why": "dart analyze báo lỗi/cảnh báo phân tích tĩnh (kiểu, lint). ≠ flutter test (chạy test), dart format (định dạng), flutter doctor (kiểm tra môi trường)."}, {"id": "M11-27", "n": 27, "bs": false, "stem": "In which build mode do `assert()` statements run?", "opts": {"A": "Debug only", "B": "Release only", "C": "All modes", "D": "Profile only"}, "ans": "A", "why": "assert() chỉ chạy ở chế độ Debug; ở Release/Profile chúng bị loại bỏ để không ảnh hưởng hiệu năng. Vì vậy không nên đặt logic bắt buộc trong assert."}, {"id": "M11-28", "n": 28, "bs": false, "stem": "Which tool visualises the widget tree and layout constraints at runtime?", "opts": {"A": "Flutter DevTools Widget Inspector", "B": "Dart Analyzer", "C": "Gradle", "D": "Logcat"}, "ans": "A", "why": "Widget Inspector của Flutter DevTools trực quan hóa cây widget và ràng buộc layout lúc chạy để gỡ lỗi giao diện. Dart Analyzer/Gradle/Logcat không làm việc này."}, {"id": "M11-29", "n": 29, "bs": false, "stem": "Which DevTools tab identifies jank and slow frames?", "opts": {"A": "Performance / Timeline", "B": "Memory", "C": "Network", "D": "Logging"}, "ans": "A", "why": "Tab Performance/Timeline của DevTools hiển thị thời gian dựng từng frame, giúp phát hiện jank và frame chậm. Memory/Network/Logging phục vụ mục đích khác."}, {"id": "M11-30", "n": 30, "bs": false, "stem": "Which flag draws layout boundaries on screen for debugging?", "opts": {"A": "`debugPaintSizeEnabled = true`", "B": "`showLayout = true`", "C": "`debugMode = true`", "D": "`paintBounds = true`"}, "ans": "A", "why": "Đặt debugPaintSizeEnabled = true vẽ đường viền layout lên màn hình để gỡ lỗi bố cục. showLayout/debugMode/paintBounds không phải cờ hợp lệ."}, {"id": "M11-31", "n": 31, "bs": false, "stem": "Which prints to the console without being truncated on Android?", "opts": {"A": "`debugPrint()`", "B": "`print()`", "C": "`log()` only", "D": "`stdout.write()`"}, "ans": "A", "why": "debugPrint() in ra console và tự điều tiết (throttle) nên không bị Android cắt bớt như print() với chuỗi dài. Đây là lý do khuyên dùng debugPrint khi log nhiều."}, {"id": "M11-32", "n": 32, "bs": false, "stem": "What is a \"flaky\" test?", "opts": {"A": "A test that passes or fails inconsistently, often due to real network/timing dependencies", "B": "A test with no assertions", "C": "A test that is too slow", "D": "A deprecated test"}, "ans": "A", "why": "Test 'flaky' là test lúc pass lúc fail không ổn định, thường do phụ thuộc mạng/timing thật. Cách khắc phục là mock phụ thuộc và chờ đúng bằng pumpAndSettle."}, {"id": "M11-33", "n": 33, "bs": false, "stem": "Which is a good practice for test coverage?", "opts": {"A": "Prioritise business logic and edge cases over trivial getters", "B": "Aim for 100% at any cost", "C": "Test only the UI", "D": "Skip error paths"}, "ans": "A", "why": "Về coverage nên ưu tiên logic nghiệp vụ và các trường hợp biên thay vì getter tầm thường; chạy theo 100% bằng mọi giá là lãng phí. Không nên bỏ qua nhánh lỗi."}, {"id": "M11-BS-1", "n": 1, "bs": true, "stem": "Which describes the Flutter testing pyramid?", "opts": {"A": "Many integration tests at the base", "B": "Equal numbers of each type", "C": "Many unit tests at the base, fewer widget tests, fewest integration tests", "D": "Only widget tests are needed"}, "ans": "C", "why": "Tháp kiểm thử Flutter: nhiều unit test ở đáy (nhanh, rẻ), ít widget test hơn ở giữa, ít nhất integration test ở đỉnh (chậm, đắt). Đó là lý do không chia đều số lượng mỗi loại."}, {"id": "M11-BS-2", "n": 2, "bs": true, "stem": "In the Arrange-Act-Assert pattern, what happens in the \"Act\" step?", "opts": {"A": "Test data and environment are prepared", "B": "The operation under test is performed (e.g. `toggle()`, `tap`, `enterText`)", "C": "The result is verified with `expect()`", "D": "The widget is disposed"}, "ans": "B", "why": "Trong Arrange-Act-Assert, bước 'Act' là thực hiện thao tác cần kiểm thử (gọi toggle(), tap, enterText). Chuẩn bị dữ liệu là Arrange; kiểm chứng bằng expect() là Assert."}, {"id": "M11-BS-3", "n": 3, "bs": true, "stem": "Which step of AAA uses `expect(...)`?", "opts": {"A": "Arrange", "B": "Act", "C": "Setup", "D": "Assert"}, "ans": "D", "why": "Bước dùng expect(...) là 'Assert' — kiểm chứng kết quả so với kỳ vọng. Arrange chuẩn bị, Act thực thi; 'Setup' không phải một bước trong AAA."}, {"id": "M11-BS-4", "n": 4, "bs": true, "stem": "Why should integration tests be used sparingly?", "opts": {"A": "They cannot test navigation", "B": "They do not compile in release mode", "C": "They are slow and more brittle; prefer unit and widget tests", "D": "They always require a live server"}, "ans": "C", "why": "Integration test nên dùng tiết chế vì chậm và dễ vỡ (brittle); nên ưu tiên unit và widget test cho phần lớn trường hợp (slide 20). Chúng vẫn test được navigation."}, {"id": "M11-BS-5", "n": 5, "bs": true, "stem": "Why use `Key`s such as `Key('taskTextField')` in widget tests?", "opts": {"A": "To speed up the app in release mode", "B": "To locate a specific widget reliably with `find.byKey`, independent of its text", "C": "To encrypt the widget's state", "D": "Because Dart requires a key on every widget"}, "ans": "B", "why": "Dùng Key như Key('taskTextField') để find.byKey định vị chính xác một widget cụ thể, độc lập với nội dung chữ hiển thị — bền vững khi text đổi. Key không tăng tốc app hay mã hóa state."}]}, {"id": "M12", "kind": "mod", "chip": "M12", "title": "Module 12 — Build, Release & Performance", "questions": [{"id": "M12-1", "n": 1, "bs": false, "stem": "Which command builds a release APK?", "opts": {"A": "`flutter build apk --release`", "B": "`flutter release`", "C": "`flutter compile apk`", "D": "`flutter package`"}, "ans": "A", "why": "flutter build apk --release biên dịch APK bản phát hành (AOT, tối ưu). Các lệnh flutter release/compile apk/package không tồn tại."}, {"id": "M12-2", "n": 2, "bs": false, "stem": "Which format does Google Play require?", "opts": {"A": "APK", "B": "Android App Bundle (.aab)", "C": "IPA", "D": "ZIP"}, "ans": "B", "why": "Google Play yêu cầu Android App Bundle (.aab) để Play tự tạo APK tối ưu theo từng thiết bị. ≠ APK (Play không còn nhận cho ứng dụng mới); IPA là của iOS."}, {"id": "M12-3", "n": 3, "bs": false, "stem": "Which command produces it?", "opts": {"A": "`flutter build appbundle`", "B": "`flutter build aab`", "C": "`flutter bundle`", "D": "`flutter build apk --bundle`"}, "ans": "A", "why": "flutter build appbundle tạo tệp .aab để nộp lên Google Play. Các biến thể flutter build aab/bundle/apk --bundle không phải lệnh hợp lệ."}, {"id": "M12-4", "n": 4, "bs": false, "stem": "What does `--split-per-abi` achieve?", "opts": {"A": "Separate APKs per CPU architecture, reducing download size", "B": "Splitting Dart code", "C": "Enabling multidex", "D": "Splitting assets"}, "ans": "A", "why": "--split-per-abi tạo các APK riêng cho từng kiến trúc CPU (arm, arm64, x86), nhờ đó mỗi máy chỉ tải phần phù hợp, giảm dung lượng tải. Nó không tách code Dart hay assets."}, {"id": "M12-5", "n": 5, "bs": false, "stem": "Which command builds for iOS distribution?", "opts": {"A": "`flutter build ipa` (requires macOS + Xcode)", "B": "`flutter build ios --android`", "C": "`flutter build apple`", "D": "`flutter package ios`"}, "ans": "A", "why": "flutter build ipa tạo bản phân phối cho iOS, đòi hỏi macOS + Xcode. Các lệnh còn lại đều sai cú pháp/không tồn tại."}, {"id": "M12-6", "n": 6, "bs": false, "stem": "Where is the app version declared?", "opts": {"A": "`pubspec.yaml` as `version: 1.0.0+3`", "B": "`AndroidManifest.xml` only", "C": "`main.dart`", "D": "`build.gradle` only"}, "ans": "A", "why": "Phiên bản app khai báo trong pubspec.yaml dạng version: 1.0.0+3. Flutter dùng nó để sinh versionName/versionCode cho cả Android lẫn iOS."}, {"id": "M12-7", "n": 7, "bs": false, "stem": "In `version: 1.0.0+3`, what does `3` represent?", "opts": {"A": "The build number / versionCode", "B": "The patch version", "C": "The SDK version", "D": "The number of flavours"}, "ans": "A", "why": "Trong 1.0.0+3, số sau dấu + (3) là build number, ánh xạ thành versionCode (Android)/build number (iOS). Phần 1.0.0 mới là versionName hiển thị."}, {"id": "M12-8", "n": 8, "bs": false, "stem": "What happens if you upload a build with a build number that is not higher than the previous one?", "opts": {"A": "The store rejects it", "B": "It replaces the old build", "C": "It is accepted as a beta", "D": "Nothing"}, "ans": "A", "why": "Store từ chối bản nộp nếu build number không lớn hơn bản trước, vì mỗi lần nộp phải tăng số build để phân biệt. Đây là lý do phải tăng versionCode mỗi lần release."}, {"id": "M12-9", "n": 9, "bs": false, "stem": "What is `applicationId` (Android) / Bundle Identifier (iOS)?", "opts": {"A": "A unique identifier for the app that cannot be changed after publishing", "B": "The display name", "C": "The version string", "D": "The signing key"}, "ans": "A", "why": "applicationId (Android)/Bundle Identifier (iOS) là định danh duy nhất của app và KHÔNG đổi được sau khi đã phát hành. Nó không phải tên hiển thị hay chuỗi phiên bản."}, {"id": "M12-10", "n": 10, "bs": false, "stem": "What is required to publish a signed Android release?", "opts": {"A": "A keystore and signing configuration in `build.gradle`", "B": "Only a debug build", "C": "A Firebase project", "D": "An Apple developer account"}, "ans": "A", "why": "Để phát hành bản Android đã ký cần một keystore và cấu hình signing trong build.gradle. Bản debug không dùng để phát hành; Firebase/Apple account không liên quan việc ký Android."}, {"id": "M12-11", "n": 11, "bs": false, "stem": "Which file typically stores keystore credentials, kept out of version control?", "opts": {"A": "`key.properties`", "B": "`pubspec.yaml`", "C": "`AndroidManifest.xml`", "D": "`main.dart`"}, "ans": "A", "why": "key.properties chứa thông tin keystore (đường dẫn, mật khẩu, alias) và phải để ngoài version control để bảo mật. pubspec.yaml/AndroidManifest.xml/main.dart không giữ credential ký."}, {"id": "M12-12", "n": 12, "bs": false, "stem": "Which flag obfuscates Dart code in a release build?", "opts": {"A": "`--obfuscate --split-debug-info=<dir>`", "B": "`--minify`", "C": "`--strip`", "D": "`--secure`"}, "ans": "A", "why": "Cờ --obfuscate --split-debug-info=<dir> làm rối mã Dart trong bản release để chống dịch ngược. --minify/--strip/--secure không phải cờ của Flutter."}, {"id": "M12-13", "n": 13, "bs": false, "stem": "Why must `--split-debug-info` be used with `--obfuscate`?", "opts": {"A": "To keep the symbol files needed to de-obfuscate future crash reports", "B": "To reduce build time", "C": "It is optional and has no effect", "D": "To enable R8"}, "ans": "A", "why": "Phải dùng --split-debug-info kèm --obfuscate để lưu lại tệp symbol, nhờ đó về sau giải mã (de-obfuscate) được các crash report từ mã đã bị rối. Thiếu nó thì crash log thành vô nghĩa."}, {"id": "M12-14", "n": 14, "bs": false, "stem": "Where is the Android app display name configured?", "opts": {"A": "`android:label` in AndroidManifest.xml", "B": "`pubspec.yaml` name field", "C": "`main.dart` title", "D": "`MaterialApp.title` only"}, "ans": "A", "why": "Tên hiển thị của app Android đặt ở android:label trong AndroidManifest.xml. pubspec name là tên package; MaterialApp.title chỉ ảnh hưởng tiêu đề task switcher."}, {"id": "M12-15", "n": 15, "bs": false, "stem": "Which package generates launcher icons for all platforms?", "opts": {"A": "`flutter_launcher_icons`", "B": "`image`", "C": "`path_provider`", "D": "`icons_helper`"}, "ans": "A", "why": "Gói flutter_launcher_icons sinh icon khởi chạy cho mọi nền tảng từ một ảnh nguồn. image/path_provider/icons_helper không làm việc này."}, {"id": "M12-16", "n": 16, "bs": false, "stem": "Which is a legitimate way to reduce APK size?", "opts": {"A": "`--split-per-abi`, resource shrinking, and compressing assets", "B": "Removing null safety", "C": "Disabling AOT", "D": "Using debug mode"}, "ans": "A", "why": "Cách hợp lệ để giảm dung lượng APK: --split-per-abi, resource shrinking và nén assets. Bỏ null safety/tắt AOT/dùng debug mode đều sai và còn phản tác dụng."}, {"id": "M12-17", "n": 17, "bs": false, "stem": "What is `MaterialApp(debugShowCheckedModeBanner: false)` for?", "opts": {"A": "Hiding the \"DEBUG\" ribbon in debug builds", "B": "Disabling debug mode", "C": "Removing asserts", "D": "Enabling release mode"}, "ans": "A", "why": "debugShowCheckedModeBanner: false ẩn dải ruy-băng 'DEBUG' ở góc trong bản debug. Nó không tắt debug mode hay bỏ assert; ở release banner vốn đã không xuất hiện."}, {"id": "M12-18", "n": 18, "bs": false, "stem": "In which build mode does the DEBUG banner appear at all?", "opts": {"A": "Debug only", "B": "Release", "C": "Profile", "D": "All"}, "ans": "A", "why": "Dải banner DEBUG chỉ xuất hiện ở chế độ Debug; Release và Profile không hiển thị nó. Vì thế đặt cờ ẩn banner chỉ có tác dụng trong Debug."}, {"id": "M12-19", "n": 19, "bs": false, "stem": "Which permission must be present in the release manifest for a networking app?", "opts": {"A": "`INTERNET`", "B": "`WRITE_EXTERNAL_STORAGE`", "C": "`CAMERA`", "D": "None"}, "ans": "A", "why": "App có gọi mạng phải khai báo quyền INTERNET trong manifest release, nếu không request sẽ bị chặn. WRITE_EXTERNAL_STORAGE/CAMERA không cần cho việc gọi mạng."}, {"id": "M12-20", "n": 20, "bs": false, "stem": "Which is TRUE about build flavours?", "opts": {"A": "They allow separate configurations (dev/staging/prod) with different app IDs and settings", "B": "They change the theme only", "C": "They are an iOS-only concept", "D": "They replace build modes"}, "ans": "A", "why": "Build flavours cho phép cấu hình riêng cho từng môi trường (dev/staging/prod) với app ID và thiết lập khác nhau. Chúng không chỉ đổi theme, không phải khái niệm riêng iOS, và không thay thế build mode."}, {"id": "M12-BS-1", "n": 1, "bs": true, "stem": "Flutter targets 60 FPS. How much time is available to render one frame?", "opts": {"A": "60 ms", "B": "~16.6 ms", "C": "1 second", "D": "100 ms"}, "ans": "B", "why": "Mục tiêu 60 FPS nghĩa mỗi frame có khoảng 1000ms/60 ≈ 16.6ms để dựng xong. Vượt quá thời gian này sẽ rớt frame gây giật."}, {"id": "M12-BS-2", "n": 2, "bs": true, "stem": "On a 120 Hz display, the per-frame budget is about:", "opts": {"A": "16.6 ms", "B": "120 ms", "C": "~8 ms", "D": "33 ms"}, "ans": "C", "why": "Màn 120 Hz có ngân sách mỗi frame khoảng 1000ms/120 ≈ 8ms — chặt gấp đôi so với 60 Hz. Vì thế tối ưu càng quan trọng trên thiết bị tần số quét cao."}, {"id": "M12-BS-3", "n": 3, "bs": true, "stem": "What is \"jank\"?", "opts": {"A": "A memory leak", "B": "A compile-time error", "C": "A category of unit test", "D": "Visible stutter caused by frames that miss their rendering deadline"}, "ans": "D", "why": "Jank là hiện tượng giật/khựng nhìn thấy được do các frame lỡ hạn dựng (vượt 16.6ms/8ms). Nó không phải rò rỉ bộ nhớ, lỗi biên dịch hay loại test."}, {"id": "M12-BS-4", "n": 4, "bs": true, "stem": "Which build mode should be used to MEASURE performance accurately?", "opts": {"A": "Debug mode", "B": "Profile mode", "C": "Debug mode with asserts on", "D": "Any mode gives the same numbers"}, "ans": "B", "why": "Để đo hiệu năng chính xác phải dùng Profile mode vì nó chạy gần như Release nhưng vẫn cho phép profiling. ≠ Debug vì Debug thêm assert và overhead làm số liệu sai lệch."}, {"id": "M12-BS-5", "n": 5, "bs": true, "stem": "Why should you NOT measure performance in Debug mode?", "opts": {"A": "Debug mode has no UI", "B": "Debug mode cannot run the app", "C": "Debug adds asserts and overhead, making it artificially slow and unrepresentative", "D": "Debug mode disables the widget tree"}, "ans": "C", "why": "Không đo hiệu năng ở Debug vì Debug bật assert và nhiều overhead khiến app chậm giả tạo, không đại diện cho trải nghiệm thật. Do đó dùng Profile mode để đo."}, {"id": "M12-BS-6", "n": 6, "bs": true, "stem": "Which command runs the app in profile mode?", "opts": {"A": "`flutter build profile`", "B": "`flutter profile`", "C": "`flutter run --measure`", "D": "`flutter run --profile`"}, "ans": "D", "why": "flutter run --profile chạy app ở chế độ profile (hiệu năng gần release, đã bỏ overhead debug). flutter build profile/flutter profile/--measure không phải lệnh hợp lệ."}, {"id": "M12-BS-7", "n": 7, "bs": true, "stem": "What does marking a static widget `const` help with?", "opts": {"A": "It encrypts the widget", "B": "Flutter can skip rebuilding it, reducing work and memory", "C": "It converts it to a StatefulWidget", "D": "It forces a rebuild every frame"}, "ans": "B", "why": "Đánh dấu widget tĩnh là const giúp Flutter bỏ qua việc dựng lại nó, giảm công và bộ nhớ nhờ tối ưu tree-diffing. const không biến widget thành Stateful hay ép rebuild."}, {"id": "M12-BS-8", "n": 8, "bs": true, "stem": "You must sort a list before displaying it. Where should the sort run?", "opts": {"A": "Inside `build()` on every rebuild", "B": "Inside each list item's constructor", "C": "Once when the data changes — never inside `build()`", "D": "During the paint phase"}, "ans": "C", "why": "Việc sắp xếp (sort) chỉ nên chạy một lần khi dữ liệu thay đổi, KHÔNG đặt trong build() vì build() chạy lại mỗi lần rebuild sẽ sort thừa gây tốn CPU và jank (slide 10)."}, {"id": "M12-BS-9", "n": 9, "bs": true, "stem": "Which key preserves item state across list reordering?", "opts": {"A": "`UniqueKey()`", "B": "`GlobalKey()` on every item", "C": "No key at all", "D": "`ValueKey(item.id)`"}, "ans": "D", "why": "ValueKey(item.id) giữ đúng danh tính từng item khi sắp xếp lại danh sách, nhờ đó state của item được bảo toàn. ≠ UniqueKey() vì key đó đổi mỗi build, phá vỡ việc giữ state."}, {"id": "M12-BS-10", "n": 10, "bs": true, "stem": "Why is `UniqueKey()` a poor choice for list items?", "opts": {"A": "It is deprecated", "B": "It changes on every build, forcing the widget to be recreated each time", "C": "It only works on iOS", "D": "It encrypts the item's state"}, "ans": "B", "why": "UniqueKey() là lựa chọn tồi cho item danh sách vì nó đổi giá trị mỗi lần build, buộc Flutter tạo lại widget mỗi lần thay vì tái sử dụng — gây tốn và mất state."}, {"id": "M12-BS-11", "n": 11, "bs": true, "stem": "Which Provider tool rebuilds only when a specific field changes (ideal for lists)?", "opts": {"A": "`context.watch` at the top of the whole screen", "B": "`setState` at the root", "C": "`Selector`", "D": "A `GlobalKey`"}, "ans": "C", "why": "Selector chỉ rebuild khi một trường cụ thể thay đổi nên phù hợp cho danh sách, tránh rebuild thừa. ≠ context.watch ở đầu màn hình (rebuild cả màn) hay setState ở gốc."}, {"id": "M12-BS-12", "n": 12, "bs": true, "stem": "How do you reduce cost for a 48px thumbnail?", "opts": {"A": "Always load the 2000px original", "B": "Set `width`/`height` (resize) instead of loading the full-resolution image", "C": "Decode it inside `build()`", "D": "Wrap it in a `GlobalKey`"}, "ans": "B", "why": "Với thumbnail 48px hãy đặt width/height để giải mã ảnh ở kích thước nhỏ thay vì tải ảnh gốc độ phân giải cao — tiết kiệm bộ nhớ và thời gian decode (slide 16)."}, {"id": "M12-BS-13", "n": 13, "bs": true, "stem": "Which pre-loads an image so it displays instantly later?", "opts": {"A": "`Image.preload()`", "B": "`cacheImage('x.png')`", "C": "`loadImage('x.png')`", "D": "`precacheImage(AssetImage('x.png'), context)`"}, "ans": "D", "why": "precacheImage(AssetImage('x.png'), context) nạp trước ảnh vào cache để lần sau hiển thị tức thì. Image.preload/cacheImage/loadImage không tồn tại."}, {"id": "M12-BS-14", "n": 14, "bs": true, "stem": "Which widget shows a placeholder while a NETWORK image loads?", "opts": {"A": "`Image.network` on its own", "B": "`FadeInImage.assetNetwork(placeholder:, image:)`", "C": "`AssetImage`", "D": "`RawImage`"}, "ans": "B", "why": "FadeInImage.assetNetwork(placeholder:, image:) hiển thị ảnh placeholder trong khi ảnh mạng đang tải rồi mờ dần chuyển sang ảnh thật. Image.network trơn không có placeholder tích hợp."}, {"id": "M12-BS-15", "n": 15, "bs": true, "stem": "Where should image decoding NOT happen?", "opts": {"A": "In `initState`", "B": "In a repository", "C": "Inside `build()`", "D": "Before `runApp`"}, "ans": "C", "why": "Không nên giải mã (decode) ảnh trong build() vì build() chạy lại nhiều lần gây tốn CPU; nên decode một lần trong initState nếu cần (slide 16)."}, {"id": "M12-BS-16", "n": 16, "bs": true, "stem": "Which command produces an app-size breakdown report?", "opts": {"A": "`flutter size`", "B": "`flutter build apk --report`", "C": "`dart analyze --size`", "D": "`flutter build apk --analyze-size`"}, "ans": "D", "why": "flutter build apk --analyze-size tạo báo cáo phân rã kích thước app (code AOT, native libs, assets, packages) dạng JSON + treemap HTML (slide 17). flutter size/--report/dart analyze --size không có."}, {"id": "M12-BS-17", "n": 17, "bs": true, "stem": "What does \"tree-shaking icons\" do?", "opts": {"A": "Removes unused Dart classes only", "B": "Removes unused Material icon glyphs to shrink app size", "C": "Animates the app icons", "D": "Compresses PNG assets"}, "ans": "B", "why": "'Tree-shaking icons' loại bỏ các glyph icon Material không dùng khỏi font để giảm dung lượng app. Nó không xóa class Dart hay nén PNG."}, {"id": "M12-BS-18", "n": 18, "bs": true, "stem": "Which is a genuine cause of jank in student apps?", "opts": {"A": "Using `const` widgets", "B": "Extracting list items into their own widgets", "C": "Rebuilding the whole screen and rendering a long list inline without `.builder`", "D": "Using `ListView.builder`"}, "ans": "C", "why": "Nguyên nhân jank thật ở app sinh viên là rebuild cả màn hình và render một danh sách dài inline mà không dùng ListView.builder (slide 5, 18). Dùng const/tách widget/ListView.builder lại là cách tối ưu."}, {"id": "M12-BS-19", "n": 19, "bs": true, "stem": "Which DevTools feature highlights areas being repainted?", "opts": {"A": "The Memory tab", "B": "The Network tab", "C": "The Logging view", "D": "Repaint Rainbow"}, "ans": "D", "why": "Repaint Rainbow của DevTools tô màu luân phiên các vùng đang bị repaint, giúp phát hiện vẽ lại thừa. Memory/Network/Logging phục vụ mục đích khác."}, {"id": "M12-BS-20", "n": 20, "bs": true, "stem": "Extracting a list item into its own widget (e.g. `TaskTile`) helps because:", "opts": {"A": "It reduces the app's download size", "B": "Only the changed tile rebuilds; the parent list stays untouched", "C": "It disables the widget's state", "D": "It encrypts the UI"}, "ans": "B", "why": "Tách item danh sách thành widget riêng (ví dụ TaskTile) giúp chỉ tile thay đổi mới rebuild, còn danh sách cha giữ nguyên — giảm công dựng lại (slide 9). Nó không liên quan dung lượng tải hay bảo mật."}, {"id": "M12-BS-21", "n": 21, "bs": true, "stem": "Which build mode is AOT-optimized and used for the store release?", "opts": {"A": "Debug", "B": "Profile", "C": "Release", "D": "Test"}, "ans": "C", "why": "Release mode được tối ưu AOT (biên dịch trước ra mã máy), nhanh và gọn, dùng cho bản phát hành lên store. Debug/Profile không phải bản phát hành; 'Test' không phải build mode."}]}, {"id": "M13", "kind": "mod", "chip": "M13", "title": "Module 13 — Notifications", "questions": [{"id": "M13-1", "n": 1, "bs": false, "stem": "What is the difference between local and push notifications?", "opts": {"A": "Local are created by the app itself; push are sent from a server via FCM/APNs", "B": "Local require internet, push do not", "C": "They are identical", "D": "Push only work on iOS"}, "ans": "A", "why": "Notification cục bộ (local) do chính app tạo và lên lịch ngay trên thiết bị, không cần internet hay server; còn push do server gửi tới máy qua FCM (Android) hoặc APNs (iOS). Khác B vì thực tế ngược lại: local KHÔNG cần internet, push mới cần."}, {"id": "M13-2", "n": 2, "bs": false, "stem": "Which package handles local notifications?", "opts": {"A": "`flutter_local_notifications`", "B": "`firebase_messaging`", "C": "`awesome_flutter`", "D": "`notifications`"}, "ans": "A", "why": "flutter_local_notifications là plugin chuẩn để tạo và lên lịch thông báo cục bộ. Khác firebase_messaging (chỉ dùng cho push qua FCM)."}, {"id": "M13-3", "n": 3, "bs": false, "stem": "Which package handles push notifications via Firebase?", "opts": {"A": "`firebase_messaging`", "B": "`flutter_local_notifications`", "C": "`firebase_core` only", "D": "`cloud_firestore`"}, "ans": "A", "why": "firebase_messaging là plugin xử lý push notification qua Firebase Cloud Messaging. firebase_core chỉ khởi tạo Firebase nên chưa đủ để nhận message."}, {"id": "M13-4", "n": 4, "bs": false, "stem": "Since which Android version are notification channels mandatory?", "opts": {"A": "Android 8.0 (API 26)", "B": "Android 5.0", "C": "Android 10", "D": "Android 13"}, "ans": "A", "why": "Notification channel bắt buộc từ Android 8.0 (API 26, Oreo); từ phiên bản này mọi thông báo phải gắn với một channel mới hiển thị được."}, {"id": "M13-5", "n": 5, "bs": false, "stem": "What is the importance of notification channels?", "opts": {"A": "They let users manage and control notification behaviour per category", "B": "They define the layout of notification cards", "C": "They determine the priority only", "D": "They handle delivery to the device"}, "ans": "A", "why": "Channel cho phép người dùng bật/tắt và tùy chỉnh hành vi (âm thanh, rung, mức độ quan trọng) theo từng nhóm/loại thông báo ngay trong Settings hệ thống."}, {"id": "M13-6", "n": 6, "bs": false, "stem": "What happens on Android 8+ if you show a notification without creating a channel?", "opts": {"A": "The notification does not appear", "B": "It appears with default styling", "C": "The app crashes on launch", "D": "It is queued until a channel exists"}, "ans": "A", "why": "Trên Android 8+ nếu gọi show mà chưa tạo channel tương ứng, hệ thống bỏ qua và thông báo không hiển thị (không phải crash cũng không xếp hàng chờ)."}, {"id": "M13-7", "n": 7, "bs": false, "stem": "From which Android version is the runtime `POST_NOTIFICATIONS` permission required?", "opts": {"A": "Android 13 (API 33)", "B": "Android 8", "C": "Android 11", "D": "Android 6"}, "ans": "A", "why": "Quyền runtime POST_NOTIFICATIONS bắt buộc phải xin từ Android 13 (API 33); trước đó thông báo được cấp mặc định không cần hỏi."}, {"id": "M13-8", "n": 8, "bs": false, "stem": "Which method displays a notification immediately?", "opts": {"A": "`show()`", "B": "`display()`", "C": "`push()`", "D": "`notify()`"}, "ans": "A", "why": "show() hiển thị thông báo ngay lập tức. Khác zonedSchedule() vốn dùng để hẹn giờ cho tương lai."}, {"id": "M13-9", "n": 9, "bs": false, "stem": "Which method schedules a notification for a specific time?", "opts": {"A": "`zonedSchedule()`", "B": "`scheduleAt()`", "C": "`delay()`", "D": "`setAlarm()`"}, "ans": "A", "why": "zonedSchedule() lên lịch thông báo vào một thời điểm cụ thể theo múi giờ, nhận tham số là TZDateTime."}, {"id": "M13-10", "n": 10, "bs": false, "stem": "Which method cancels a specific notification by its integer id?", "opts": {"A": "`cancel(id)`", "B": "`dismiss(id)`", "C": "`delete(id)`", "D": "`remove(id)`"}, "ans": "A", "why": "cancel(id) hủy đúng một thông báo theo id nguyên (int) đã dùng khi tạo nó."}, {"id": "M13-11", "n": 11, "bs": false, "stem": "Which method cancels all notifications?", "opts": {"A": "`cancelAll()`", "B": "`clear()`", "C": "`removeAll()`", "D": "`reset()`"}, "ans": "A", "why": "cancelAll() hủy toàn bộ thông báo cùng lúc (cả đang hiển thị lẫn đã lên lịch)."}, {"id": "M13-12", "n": 12, "bs": false, "stem": "Which callback in `initialize()` fires when the user taps a notification while the app is in the foreground or background?", "opts": {"A": "`onDidReceiveNotificationResponse`", "B": "`onNotificationTap`", "C": "`onSelectNotification`", "D": "`onNotificationReceived`"}, "ans": "A", "why": "onDidReceiveNotificationResponse được truyền vào initialize() và kích hoạt khi người dùng chạm vào thông báo (lúc app ở foreground hoặc background). Lưu ý onSelectNotification là tên cũ đã bị thay thế."}, {"id": "M13-13", "n": 13, "bs": false, "stem": "What is the purpose of the `payload` parameter in `show()`?", "opts": {"A": "A String passed back to the app when the user taps the notification, enabling navigation or actions", "B": "The JSON body sent to Firebase", "C": "The visual style and colour", "D": "The Android priority level"}, "ans": "A", "why": "payload là một String đính kèm, được trả lại cho app khi người dùng chạm thông báo, dùng để điều hướng hoặc thực hiện hành động tương ứng. Nó không phải body gửi cho Firebase hay thông tin về màu sắc/độ ưu tiên."}, {"id": "M13-14", "n": 14, "bs": false, "stem": "Which class configures Android-specific appearance of a notification?", "opts": {"A": "`AndroidNotificationDetails`", "B": "`AndroidStyle`", "C": "`NotificationConfig`", "D": "`AndroidChannelStyle`"}, "ans": "A", "why": "AndroidNotificationDetails cấu hình riêng phần giao diện/hành vi phía Android (channel id-name, icon, importance, priority...)."}, {"id": "M13-15", "n": 15, "bs": false, "stem": "Which class holds both Android and iOS settings for `show()`?", "opts": {"A": "`NotificationDetails`", "B": "`PlatformSettings`", "C": "`NotificationOptions`", "D": "`InitializationSettings`"}, "ans": "A", "why": "NotificationDetails gói cả AndroidNotificationDetails và DarwinNotificationDetails (iOS) để truyền chung vào show()."}, {"id": "M13-16", "n": 16, "bs": false, "stem": "Which class configures platform initialisation?", "opts": {"A": "`InitializationSettings`", "B": "`NotificationDetails`", "C": "`AndroidNotificationChannel`", "D": "`NotificationConfig`"}, "ans": "A", "why": "InitializationSettings gộp cấu hình khởi tạo cho từng nền tảng (Android/iOS) và được truyền vào initialize(). Khác NotificationDetails (dùng cho show)."}, {"id": "M13-17", "n": 17, "bs": false, "stem": "Which package must be initialised before using `zonedSchedule` with a specific timezone?", "opts": {"A": "`timezone` — via `tz.initializeTimeZones()` and `tz.setLocalLocation()`", "B": "`intl`", "C": "`path_provider`", "D": "`connectivity_plus`"}, "ans": "A", "why": "Phải khởi tạo package timezone: gọi tz.initializeTimeZones() rồi tz.setLoca
