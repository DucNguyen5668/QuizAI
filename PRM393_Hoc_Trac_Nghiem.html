y nhanh, ổn định, chi phí thấp. Càng lên cao (Widget → Integration) càng ít dần vì chậm và đắt. A, B không đúng vị trí trong kim tự tháp; D sai vì tỉ lệ không hề chia đều.", "bs": false}, {"id": "P-254", "n": 254, "stem": "In the testing pyramid, how many Integration Tests are recommended and for what purpose?", "opts": {"A": "Use the most since it's the most comprehensive test type", "B": "Use few, since they run slowly and cost more — should only be applied to critical, business-critical user flows", "C": "Integration Tests should never be used under any circumstance", "D": "Only used to test CPU performance"}, "ans": "B", "why": "**Integration Test nên dùng ÍT thôi** vì chậm và tốn kém — chỉ dành cho **các luồng người dùng quan trọng nhất** (đăng nhập, thanh toán). A, C, D không đúng nguyên tắc kim tự tháp kiểm thử.", "bs": false}, {"id": "P-255", "n": 255, "stem": "Given this Unit Test:\ntest('toggle() should switch completed state', () {\nfinal task = Task(id: '1', title: 'Demo task');\nexpect(task.completed, false);\ntask.toggle();\nexpect(task.completed, true);\ntask.toggle();\nexpect(task.completed, false);\n});\nWhat common test structuring pattern does this test apply (even though not explicitly labeled with comments)?", "opts": {"A": "Model-View-Controller (MVC)", "B": "Arrange - Act - Assert (prepare data, perform an action, verify the result)", "C": "Singleton Pattern", "D": "Observer Pattern"}, "ans": "B", "why": "Bài test này theo mẫu **Arrange – Act – Assert**: chuẩn bị dữ liệu (tạo `Task`) → thực hiện hành động (`toggle()`) → kiểm chứng kết quả (`expect`). A, C, D là các mẫu thiết kế/kiến trúc khác, không phải cách tổ chức test.", "bs": false}]}, {"id": "P6", "kind": "exam", "chip": "Đề 6", "title": "Đề 6 — 50 câu (câu 256–308)", "questions": [{"id": "P-256", "n": 256, "stem": "How does a Widget Test in Flutter differ from a Unit Test?", "opts": {"A": "Widget Test only checks pure logic unrelated to UI, exactly like a Unit Test", "B": "Widget Test checks UI rendering and interaction (e.g. entering text, tapping buttons) on a widget or small widget tree, while Unit Test only checks logic/functions unrelated to UI", "C": "Widget Test always runs slower than Integration Test", "D": "Widget Test cannot simulate typing text or tapping"}, "ans": "B", "why": "**Widget Test kiểm tra việc render và tương tác trên một cây widget**; **Unit Test kiểm tra logic thuần, không dính tới UI**. A, C, D mô tả sai đặc điểm hai loại test.", "bs": false}, {"id": "P-258", "n": 258, "stem": "In a Navigation Test, how does `pumpAndSettle()` differ from a plain `pump()`?", "opts": {"A": "No difference at all, the two functions are entirely equivalent", "B": "`pumpAndSettle()` continuously \"pumps\" frames until no animation/transition is still running (fully settled), very useful for waiting for a screen-transition effect to finish before asserting", "C": "`pumpAndSettle()` can only be used for Unit Test", "D": "`pump()` always waits longer than `pumpAndSettle()`"}, "ans": "B", "why": "**`pumpAndSettle()` bơm frame liên tục cho tới khi mọi animation kết thúc** — rất cần khi chờ hiệu ứng chuyển màn hình xong mới kiểm tra. `pump()` chỉ dựng **một** frame. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-259", "n": 259, "stem": "In Demo 11.4 (Integration Test: Full CRUD Flow), the test sequentially: adds a task → opens detail → edits the title → saves → checks the updated list. Why is this test type classified as \"Integration Test\" rather than a plain \"Widget Test\"?", "opts": {"A": "Because it uses more lines of code than a typical Widget Test", "B": "Because it validates the entire interaction flow across multiple app layers (UI → Provider → Repository) through consecutive steps, simulating a complete real user journey, rather than checking just a single isolated UI behavior", "C": "Because it doesn't use any widgets at all", "D": "Because Integration Test and Widget Test are the same concept, just different names"}, "ans": "B", "why": "Được xếp là **Integration Test vì nó kiểm chứng cả luồng xuyên suốt UI → Provider → Repository**, mô phỏng một hành trình hoàn chỉnh của người dùng (thêm → xem → sửa → lưu). A, C, D không đúng lý do phân loại.", "bs": false}, {"id": "P-260", "n": 260, "stem": "Per the \"How Tests Map to Real Flutter Problems\" table, the \"Wrong navigation\" issue should mainly be detected by which test type?", "opts": {"A": "Unit Test", "B": "Navigation Test (part of the extended Widget Test group)", "C": "Navigation issues cannot be tested at all", "D": "Can only be detected via manual testing"}, "ans": "B", "why": "Lỗi **'điều hướng sai' nên được bắt bằng Navigation Test** (một dạng Widget Test mở rộng) — kiểm tra bấm vào đâu thì màn hình nào hiện ra. A, C, D không khớp nội dung bảng.", "bs": false}, {"id": "P-261", "n": 261, "stem": "In the Taskly App's architecture (used as the running example throughout Module 11), which component is responsible for managing app-wide state?", "opts": {"A": "TaskListScreen", "B": "TaskProvider", "C": "TaskRepository", "D": "main.dart"}, "ans": "B", "why": "Trong kiến trúc Taskly, **`TaskProvider` chịu trách nhiệm quản lý state toàn app**; `TaskRepository` lo CRUD dữ liệu, widget chỉ lo hiển thị. A, C, D không đúng trách nhiệm này.", "bs": false}, {"id": "P-262", "n": 262, "stem": "In Taskly App, `TaskRepository` handles CRUD logic for tasks, while `TaskProvider` manages state. If a Widget Test wants to check UI behavior WITHOUT depending on the Repository's real database/API connection, what reasonable approach is recommended in Module 11's \"Best Practices\"?", "opts": {"A": "Always connect directly to real data to ensure absolute test accuracy", "B": "Mock the Repository when possible, letting Widget Tests run fast, reliably, and independently of real external data state", "C": "Completely skip testing any widget related to the Repository", "D": "Move all Repository logic inside the Widget to make testing easier"}, "ans": "B", "why": "Nên **mock Repository khi có thể** để Widget Test **chạy nhanh, ổn định và không phụ thuộc vào dữ liệu bên ngoài** (mạng, DB thật). A, C, D không khớp best practice được khuyến nghị.", "bs": false}, {"id": "P-263", "n": 263, "stem": "What is `find.byKey(const Key('taskTextField'))` used for in a test?", "opts": {"A": "Searching for displayed text on screen by string content", "B": "Finding one specific widget exactly via its assigned Key, making widget identification in the test tree more reliable than searching by type or text (which can be duplicated or change)", "C": "Finding all TextFields on screen regardless of Key", "D": "Has no effect, purely illustrative"}, "ans": "B", "why": "**`find.byKey()` định vị chính xác một widget cụ thể qua `Key` đã gán** — đáng tin hơn nhiều so với tìm theo kiểu (`byType`) hay theo chữ (`byText`) khi màn hình có nhiều widget giống nhau. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-264", "n": 264, "stem": "Per Module 11's \"Best Practices,\" what does the \"Avoid testing Flutter framework functionality\" item advise?", "opts": {"A": "You should write a test to verify that `Column` actually arranges elements vertically", "B": "You should not write tests to re-verify behavior that the Flutter framework itself already guarantees works correctly (like the basic mechanism of built-in widgets); focus instead on testing your app's own business logic and custom behavior", "C": "You are not allowed to use any built-in Flutter widget in the app", "D": "The Flutter framework cannot be tested in any form"}, "ans": "B", "why": "'Avoid testing Flutter framework functionality' nghĩa là **đừng test lại những hành vi mà bản thân framework đã đảm bảo** (ví dụ AppBar có hiển thị không) — hãy tập trung vào **logic nghiệp vụ và hành vi tự viết** của app. A, C, D không đúng lời khuyên được đưa ra.", "bs": false}, {"id": "P-265", "n": 265, "stem": "What debugging aspects does DevTools in Flutter support, per Module 11?", "opts": {"A": "Only supports syntax debugging", "B": "Layout issues, failed state updates, slow performance, unnecessary rebuilds, and navigation issues", "C": "Only supports checking network connectivity", "D": "Only used to build the release app"}, "ans": "B", "why": "DevTools hỗ trợ debug: **lỗi bố cục, state không cập nhật, hiệu năng, rebuild thừa và lỗi điều hướng** — đúng theo 'Debugging Goals in Flutter'. A, C, D không bao quát đủ phạm vi.", "bs": false}, {"id": "P-266", "n": 266, "stem": "In the issue-to-test-type mapping table:\n| Flutter Issue | Recommended Test |\n|---|---|\n| Logic failure | Unit test |\n| UI not updating | Widget test |\n| Wrong navigation | Navigation test |\n| Entire feature broken | Integration test |\nIf a bug occurs because a Provider doesn't call `notifyListeners()` after updating data (causing the UI to not update even though the data changed in memory), which test type can most directly detect this issue?", "opts": {"A": "A Unit Test checking just the data-update function alone, since it's unrelated to UI", "B": "Widget Test — because it needs to verify that after the action occurs, the UI actually re-renders with the new data (something a pure-logic Unit Test cannot check)", "C": "No test type can detect this bug", "D": "Only Integration Test can detect it, Widget Test is entirely unsuitable"}, "ans": "B", "why": "**Widget Test là cách trực tiếp nhất** vì nó kiểm chứng UI **thực sự vẽ lại với dữ liệu mới**, điều mà Unit Test thuần logic không thể xác nhận. A, C, D không đúng cách phát hiện phù hợp.", "bs": false}, {"id": "P-267", "n": 267, "stem": "What is `expect()` in flutter_test used for?", "opts": {"A": "Initializing the widget tree for the test", "B": "Comparing the actual value with the expected value, and failing if they don't match — this is the \"Assert\" step in the testing process", "C": "Waiting for an animation to finish", "D": "Generating random mock data"}, "ans": "B", "why": "**`expect()` so sánh giá trị thực tế với giá trị mong đợi**, không khớp thì test fail — đây chính là bước **Assert**. A, C, D mô tả sai chức năng của `expect()`.", "bs": false}, {"id": "P-268", "n": 268, "stem": "Consider the lecture's explanation: \"Most UI issues start from logic → unit tests catch problems early.\" Applying this practically: if the function counting incomplete tasks (`getIncompleteCount()`) in TaskProvider has a logic bug (calculates wrong), but the UI still shows the correct number by coincidence with small test data, which testing approach best and most reliably catches this bug early, regardless of data size?", "opts": {"A": "Relying solely on manual UI observation with random datasets", "B": "Write a dedicated Unit Test for `getIncompleteCount()` with multiple different datasets (edge cases: empty, all completed, mixed), isolating and verifying the calculation logic correctly without depending on whether the UI \"happens\" to display correctly", "C": "Integration Test is the only way to catch this logic bug", "D": "No automated testing form can detect a logic bug"}, "ans": "B", "why": "Cách đáng tin nhất là **viết Unit Test riêng với nhiều bộ dữ liệu biên (edge case)** để cô lập và kiểm chứng logic tính toán — không phụ thuộc vào việc màn hình 'tình cờ hiện đúng'. A, C, D không đúng cách phát hiện sớm và đáng tin nhất.", "bs": false}, {"id": "P-269", "n": 269, "stem": "Why does the lecture recommend \"Use keys for widget tests\"?", "opts": {"A": "Because a Key is syntactically mandatory for every Flutter widget", "B": "Because assigning a Key helps accurately locate a specific widget in the test, avoiding confusion when multiple widgets of the same type or text content exist on screen", "C": "Because a Key doubles the test's execution speed", "D": "A Key only works with StatelessWidget, not with StatefulWidget"}, "ans": "B", "why": "Gán `Key` giúp **định vị widget chính xác trong test**, tránh nhầm lẫn giữa các widget giống nhau (ví dụ nhiều `TextField` trên cùng màn hình). A, C, D không đúng lý do của khuyến nghị này.", "bs": false}, {"id": "P-270", "n": 270, "stem": "What characteristic of the UI Overflow bug described in Module 11 makes it hard to detect if you only rely on running the app normally?", "opts": {"A": "Overflow always makes the app crash instantly, so it's very easy to spot", "B": "Overflow bugs typically don't crash the app (no exception stopping the program), so tools like tests or DevTools are needed to detect them, rather than just relying on the app \"still running\"", "C": "Overflow only occurs on iOS devices", "D": "Overflow is always automatically fixed by Dart at compile time"}, "ans": "B", "why": "Lỗi overflow **thường KHÔNG làm app crash** — app vẫn chạy, chỉ hiện vạch sọc vàng-đen hoặc bị cắt nội dung — nên chỉ 'chạy thử thấy vẫn ổn' là không đủ, cần test/DevTools mới phát hiện. A, C, D không đúng đặc điểm của lỗi overflow.", "bs": false}, {"id": "P-271", "n": 271, "stem": "In the test file `test/widget/demo_11_3_navigation_to_detail_test.dart`, suppose the final assertion is:\nexpect(find.text('Task Detail'), findsOneWidget);\nbut the detail screen actually displays the title as \"Task Details\" (with an extra \"s\"). What is the test's result?", "opts": {"A": "The test still passes because Flutter automatically does fuzzy text matching", "B": "The test fails (findsOneWidget errors since no widget with the exact text \"Task Detail\" is found), because `find.text()` requires an exact string match", "C": "The test automatically skips this assertion", "D": "The test passes but prints a warning, not treated as a failure"}, "ans": "B", "why": "**`find.text()` đòi hỏi khớp chuỗi CHÍNH XÁC**, nên `\"Task Detail\"` khác `\"Task Details\"` (thừa chữ s) sẽ làm test fail. A, C, D không đúng cơ chế so khớp của `find.text()`.", "bs": false}, {"id": "P-272", "n": 272, "stem": "Per Module 11's Summary, which skill is NOT listed as a learning objective of this module?", "opts": {"A": "Writing Unit Tests to check model logic and behavior", "B": "Writing Widget Tests to check UI rendering and interaction", "C": "Building and signing a release APK file for publishing to Google Play", "D": "Using DevTools to diagnose layout, rebuild, and navigation issues"}, "ans": "C", "why": "Kỹ năng **build và ký APK release để đưa lên Google Play là nội dung Module 12**, KHÔNG phải mục tiêu học của Module 11. A, B, D đều đúng là mục tiêu của Module 11.", "bs": false}, {"id": "P-273", "n": 273, "stem": "A student writes an Integration Test but insists on also testing whether \"the AppBar's background color is exactly Colors.blue per Material Design's default\" (a default framework behavior, not custom app logic). Per the \"Best Practices\" learned, why should this approach be avoided?", "opts": {"A": "Because Integration Test is not allowed to check colors in any form", "B": "Because this tests the Flutter framework's default behavior (not the app's custom business logic), wasting effort writing the test without adding any real value to ensuring app quality", "C": "Because AppBar cannot be tested by any tool", "D": "Because colors always change randomly between builds so they can't be tested"}, "ans": "B", "why": "Test màu nền mặc định của AppBar là **test hành vi mặc định của framework thay vì logic riêng của app** — tốn công mà không tăng chất lượng thật. A, C, D không đúng lý do nên tránh việc này.", "bs": false}, {"id": "P-274", "n": 274, "stem": "What does `tester.pumpWidget(createTaskListTestApp())` do as the first step of a Widget Test?", "opts": {"A": "Clears all previous test data", "B": "\"Pumps\" (renders) the given widget tree into the virtual test environment, equivalent to launching the app for the first time to begin testing", "C": "Builds the app into an APK file", "D": "Connects to a real server to fetch data"}, "ans": "B", "why": "**`pumpWidget()` dựng cây widget đã cho vào môi trường test** — tương đương 'khởi chạy app' để bắt đầu kiểm thử. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-275", "n": 275, "stem": "Consider: a student group writes VERY MANY Integration Tests (the vast majority of all tests) but almost no Unit Tests. Per the \"Testing Pyramid\" principle learned, what realistic consequence is likely?", "opts": {"A": "No negative consequence at all, more Integration Tests is always better in every case", "B": "The test suite will run significantly slower, cost more time/resources to maintain, and pinpointing the root cause when a bug occurs will be harder than having a solid Unit Test foundation to isolate logic bugs early", "C": "Integration Tests are always faster than Unit Tests, so this is the optimal strategy", "D": "The distribution of test types has no effect on speed or maintenance cost at all"}, "ans": "B", "why": "Quá nhiều Integration Test và quá ít Unit Test khiến **bộ test chạy chậm, tốn công bảo trì, và khi fail thì rất khó khoanh vùng nguyên nhân gốc** (vì mỗi test đi qua nhiều tầng). A, C, D trái với nguyên tắc kim tự tháp kiểm thử.", "bs": false}, {"id": "P-276", "n": 276, "stem": "In \"Debugging Goals in Flutter,\" the \"Frequent unnecessary rebuilds\" issue directly relates to which topic that will be explored deeper in Module 12?", "opts": {"A": "Building local JSON files", "B": "Performance Optimization", "C": "Deep link configuration", "D": "Setting up Firebase Authentication"}, "ans": "B", "why": "Vấn đề **'rebuild thừa liên tục' liên quan trực tiếp tới Performance Optimization**, được đào sâu ở Module 12. A, C, D không liên quan tới vấn đề rebuild này.", "bs": false}, {"id": "P-277", "n": 277, "stem": "What frame-rate target (FPS) does Flutter aim for to ensure a smooth experience on standard devices?", "opts": {"A": "24 FPS", "B": "30 FPS", "C": "60 FPS", "D": "144 FPS"}, "ans": "C", "why": "Flutter nhắm mục tiêu **60 FPS** để đảm bảo trải nghiệm mượt trên thiết bị tiêu chuẩn (máy cao cấp có thể 90/120Hz). A, B, D không khớp con số được nêu.", "bs": false}, {"id": "P-278", "n": 278, "stem": "If a device runs at 60 FPS, roughly how many milliseconds does Flutter have to complete build, layout, and paint for EACH frame before a dropped frame (jank) occurs?", "opts": {"A": "About 16.6ms", "B": "About 100ms", "C": "About 1ms", "D": "About 1000ms"}, "ans": "A", "why": "Ở 60 FPS, mỗi khung hình có khoảng **16.6ms** (1000ms ÷ 60) để hoàn tất build + layout + paint. Vượt quá ngưỡng này là rớt khung hình → giật (jank). B, C, D không khớp con số tính ra trong bài.", "bs": false}, {"id": "P-279", "n": 279, "stem": "Per \"How Flutter Builds the UI (Render Pipeline),\" what are the respective roles of the three core concepts Widget, Element, RenderObject?", "opts": {"A": "Widget is an immutable blueprint describing configuration, Element manages lifecycle & state, RenderObject performs the actual layout/painting/compositing", "B": "Widget, Element, RenderObject are three different names for the same concept", "C": "RenderObject is immutable, Widget performs painting directly to the screen", "D": "Element only exists in Widget Test, not when the app actually runs"}, "ans": "A", "why": "**Widget = bản thiết kế bất biến; Element = quản lý vòng đời và state; RenderObject = thực hiện layout, vẽ và ghép layer.** B, C, D mô tả sai vai trò của ba thành phần này.", "bs": false}, {"id": "P-281", "n": 281, "stem": "What benefit does the \"Use Selector to rebuild ONLY the list\" solution in Demo 12.1 bring over a plain `context.watch<T>()`?", "opts": {"A": "Selector allows fine-grained rebuilding — only the UI portion actually dependent on the changed data rebuilds, instead of the entire parent widget as with a broad-scope watch", "B": "Selector and watch behave entirely identically regarding rebuilds", "C": "Selector only works with the String data type", "D": "Selector causes the entire app to always rebuild regardless of whether anything changed"}, "ans": "A", "why": "**`Selector` cho phép rebuild ở mức chi tiết (fine-grained)** — chỉ dựng lại đúng phần phụ thuộc vào dữ liệu đã đổi, thay vì cả màn hình như `context.watch<T>()` ở cấp cao. B, C, D không đúng hành vi/lợi ích thật của Selector.", "bs": false}, {"id": "P-282", "n": 282, "stem": "How does the `const` keyword before a widget (e.g. `const Text(\"Task Title\")`) technically optimize performance?", "opts": {"A": "`const` only makes the code look tidier, no runtime effect", "B": "A widget marked `const` is fully immutable at compile-time; Flutter can recognize it as the same instance across rebuilds and skip rebuilding it (more efficient tree diffing), saving memory and reducing rebuild cost", "C": "`const` causes the widget to always be redrawn every frame to ensure sync", "D": "`const` can only be applied to StatefulWidgets"}, "ans": "B", "why": "Widget `const` **bất biến từ lúc biên dịch**, nên Flutter **bỏ qua việc dựng lại chúng và so sánh cây hiệu quả hơn** → tiết kiệm bộ nhớ và chi phí rebuild. A, C, D không đúng cơ chế tối ưu thật sự của `const`.", "bs": false}, {"id": "P-283", "n": 283, "stem": "Per \"Optimization Technique 3: Avoid Heavy Work in build(),\" which of the following should NOT be done directly inside the `build()` function?", "opts": {"A": "Returning a simple `Text` widget", "B": "Calling an API, parsing JSON, sorting a list, or doing complex calculations", "C": "Returning a `Column` containing a few static child widgets", "D": "Reading a value from MediaQuery"}, "ans": "B", "why": "**KHÔNG được gọi API, parse JSON, sắp xếp hay tính toán phức tạp bên trong `build()`** — vì `build()` có thể chạy hàng chục lần mỗi giây. A, C, D là các thao tác nhẹ, bình thường, không gây vấn đề hiệu năng đáng kể.", "bs": false}, {"id": "P-284", "n": 284, "stem": "Given this \"anti-pattern\" code from the lecture:\nWidget build(context) {\nfinal sorted = tasks..sort(); // NO\nreturn ListView(...);\n}\nWhat is the main problem with this code, especially when the widget rebuilds frequently (e.g. due to an animation or an unrelated state update)?", "opts": {"A": "No problem at all since sort() always runs very fast in every case", "B": "The `sort()` operation gets re-executed EVERY TIME `build()` is called (which could be dozens of times per second), wasting CPU unnecessarily — you should sort once and cache the result, only updating when the data actually changes", "C": "`sort()` is automatically cached by Flutter, so there's no repeated cost", "D": "This is the required way to write code to ensure the list is always correctly ordered"}, "ans": "B", "why": "`tasks..sort()` **chạy lại mỗi lần `build()` được gọi** (có thể vài chục lần/giây) → tốn CPU vô ích. Nên **sắp xếp một lần và lưu lại kết quả**, hoặc sắp ở tầng dữ liệu. A, C, D không đúng vấn đề hiệu năng thật.", "bs": false}, {"id": "P-285", "n": 285, "stem": "Per \"Optimization Technique 4: Using Keys Properly,\" why is using `UniqueKey()` for each list item considered \"Bad\"?", "opts": {"A": "`UniqueKey()` is syntactically invalid in Dart", "B": "`UniqueKey()` generates an entirely NEW Key on every build, making Flutter always treat the widget as a \"new widget\" and forcing a full rebuild instead of reusing/updating the old widget — the exact opposite of Key's performance-optimization purpose", "C": "`UniqueKey()` only works with the int data type", "D": "`UniqueKey()` causes the app to crash immediately"}, "ans": "B", "why": "**`UniqueKey()` sinh Key MỚI mỗi lần build**, buộc Flutter hủy và dựng lại toàn bộ widget thay vì tái sử dụng — **ngược hoàn toàn với mục đích tối ưu của Key**. A, C, D không đúng lý do nó bị coi là 'Bad'.", "bs": false}, {"id": "P-286", "n": 286, "stem": "Compare `ValueKey(task.id)` with `UniqueKey()` in the context of a task list that can be deleted/added/reordered. Why is `ValueKey(task.id)` recommended (\"Good\")?", "opts": {"A": "Because `ValueKey` is always random just like `UniqueKey`, no real difference", "B": "Because `ValueKey(task.id)` ties the Key to a stable identifier value (id) of each task — Flutter can use it to accurately identify exactly which widget corresponds to which data across rebuilds, even when the list order changes, helping preserve state and optimize diffing", "C": "`ValueKey` only works with lists of fewer than 10 elements", "D": "`ValueKey` and using no Key at all (default null Key) always give identical performance results"}, "ans": "B", "why": "**`ValueKey(task.id)` gắn với một id ỔN ĐỊNH**, nhờ đó Flutter khớp đúng widget với dữ liệu qua các lần rebuild/sắp xếp lại — **giữ được state và tối ưu việc so sánh cây**. `UniqueKey()` thì đổi mỗi lần build nên mất hết lợi ích đó. A, C, D không đúng đặc điểm/lợi ích thật của ValueKey.", "bs": false}, {"id": "P-287", "n": 287, "stem": "Why does the lecture recommend running Flutter DevTools in \"Profile Mode\" instead of \"Debug Mode\" when measuring performance?", "opts": {"A": "Because DevTools cannot be opened in Debug Mode", "B": "Because Debug Mode has a lot of debugging overhead (assertions, extra checks) that make measured performance numbers not accurately reflect real release-mode performance; Profile Mode is closer to real-world performance", "C": "Because Profile Mode runs slower than Debug Mode, making it suitable for finding bugs more thoroughly", "D": "There's no difference between the two modes when measuring performance"}, "ans": "B", "why": "**Debug Mode có nhiều overhead khiến số đo hiệu năng sai lệch** so với bản release thật; **Profile Mode gần với thực tế hơn** (đã tối ưu nhưng vẫn còn công cụ đo). A, C, D không đúng lý do của khuyến nghị này.", "bs": false}, {"id": "P-288", "n": 288, "stem": "In \"Identifying Rebuild Issues,\" how should the statement \"If state lives too high → entire UI rebuilds\" be understood in the context of widget architecture design?", "opts": {"A": "Placing state as high as possible in the widget tree is always the best way to optimize performance", "B": "If state is placed on an ancestor widget too high in the tree (covering many unrelated UI parts), any change to that state triggers a rebuild of the entire subtree below it, including UI parts that don't actually depend on the changed data", "C": "Where state is placed in the widget tree has no effect on rebuild scope", "D": "State should only ever be placed at the app's root widget in every case"}, "ans": "B", "why": "'State nằm quá cao → cả UI rebuild' nghĩa là **đặt state ở tổ tiên quá xa khiến phạm vi rebuild quá rộng**, ảnh hưởng cả những phần UI hoàn toàn không liên quan bên dưới. Nguyên tắc: đặt state gần nơi dùng nhất có thể. A, C, D không đúng nguyên tắc kiến trúc này.", "bs": false}, {"id": "P-289", "n": 289, "stem": "Per \"Optimization Technique 2: Extract Widgets\" (e.g. extracting `TaskTile` as its own widget), what is the main benefit of breaking a large widget into smaller pieces?", "opts": {"A": "Significantly shrinks the APK file size", "B": "When one item's data changes, only the corresponding child widget (like a specific `TaskTile`) needs to rebuild, instead of the entire list/parent screen rebuilding along with it, reducing rebuild scope and cost", "C": "An extracted widget automatically gets its own key without needing to declare one", "D": "No real benefit, just makes the code look tidier formally"}, "ans": "B", "why": "**Tách widget con (ví dụ `TaskTile`) thu hẹp phạm vi rebuild về đúng item bị thay đổi**, thay vì dựng lại cả danh sách → giảm tổng chi phí rebuild. A, C, D không đúng lợi ích kỹ thuật thật.", "bs": false}, {"id": "P-290", "n": 290, "stem": "In \"Demo 12.2 - Image Optimization,\" what does the `precacheImage()` technique do?", "opts": {"A": "Removes an image from memory as soon as it's no longer used", "B": "Pre-loads an image into the cache before it's actually needed for display, reducing lag when the image first appears on the UI", "C": "Automatically compresses the image to a smaller format", "D": "Only works with images fetched from the network, not with asset images"}, "ans": "B", "why": "**`precacheImage()` tải ảnh vào cache TRƯỚC khi hiển thị**, nhờ đó lúc ảnh xuất hiện lần đầu không bị khựng/nháy. A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-291", "n": 291, "stem": "Why does the lecture recommend resizing images before use, e.g. avoiding loading a 2000px image for a thumbnail that only displays at 50px?", "opts": {"A": "Because Flutter doesn't support displaying images larger than 100px resolution", "B": "Because decoding and storing in memory an image with a resolution far larger than the actual display size wastes significant memory and processing time, even though the final displayed result is just a small image", "C": "Large images are always automatically rendered at low quality by Flutter regardless of original size", "D": "No effect on performance at all, only affects server-side storage size"}, "ans": "B", "why": "Giải mã và giữ trong bộ nhớ một ảnh **quá khổ (2000px) cho một thumbnail nhỏ gây lãng phí RAM và thời gian xử lý rất lớn** so với kết quả hiển thị. Nên resize/dùng `cacheWidth` phù hợp. A, C, D không đúng ảnh hưởng hiệu năng thực tế.", "bs": false}, {"id": "P-292", "n": 292, "stem": "Which command is used to analyze a detailed app-size breakdown by source code, assets, and packages?", "opts": {"A": "flutter doctor", "B": "flutter build apk --analyze-size", "C": "flutter test", "D": "flutter clean"}, "ans": "B", "why": "Dùng **`flutter build apk --analyze-size`** để xem báo cáo chi tiết dung lượng app theo mã nguồn, assets và packages. A, C, D không phải lệnh đúng cho mục đích này.", "bs": false}, {"id": "P-293", "n": 293, "stem": "Per \"Common Size Optimization Tips,\" what benefit does \"Enable tree-shaking icons\" (removing unused Material icons) bring to the released app?", "opts": {"A": "Makes icons look visually nicer", "B": "Removes Material Design icons not actually used in the app from the final build package, reducing the app's size", "C": "Tree-shaking only affects app runtime speed, not size", "D": "This technique only applies to images, not icons"}, "ans": "B", "why": "**Tree-shaking icons loại bỏ các icon Material không dùng tới khỏi bản build** → giảm dung lượng app. (Vì vậy dùng icon động từ chuỗi tên sẽ vô hiệu hóa tối ưu này.) A, C, D không đúng lợi ích thực tế.", "bs": false}, {"id": "P-294", "n": 294, "stem": "What is the difference between `flutter build apk --debug` and `flutter build apk --release`?", "opts": {"A": "No difference at all in performance or size", "B": "The debug build contains extensive debugging support info, not optimized for performance/size; the release build is optimized, removes debug overhead, giving performance and size closer to the real end-user experience", "C": "`--release` only works on iOS, `--debug` only works on Android", "D": "`--debug` always produces a smaller file size than `--release`"}, "ans": "B", "why": "**Bản debug mang theo overhead phục vụ gỡ lỗi và chưa tối ưu**; **bản release được tối ưu cho hiệu năng và dung lượng thật** (AOT, minify, tree-shaking). A, C, D không đúng khác biệt thật giữa hai chế độ build.", "bs": false}, {"id": "P-295", "n": 295, "stem": "What file format does Google Play require (instead of a traditional APK) when publishing an app to the store, and what is the corresponding build command?", "opts": {"A": "A .aab file (Android App Bundle), built with the command `flutter build appbundle --release`", "B": "A .ipa file, built with the command `flutter build ios --release`", "C": "A .exe file, built with the command `flutter build windows --release`", "D": "Google Play only accepts .apk files, no other format"}, "ans": "A", "why": "Google Play yêu cầu định dạng **`.aab` (Android App Bundle)**, build bằng **`flutter build appbundle --release`**. B, C, D không đúng định dạng/lệnh cho Android trên Google Play.", "bs": false}, {"id": "P-296", "n": 296, "stem": "What important rule governs `versionCode` in `android/app/build.gradle` when publishing consecutive updates?", "opts": {"A": "It must always keep the same value across every release", "B": "It must be an integer and must increase with every new release (every update pushed to the store)", "C": "It doesn't matter, it can be any value including decreasing", "D": "Only applies to apps running on iOS"}, "ans": "B", "why": "**`versionCode` phải là số nguyên và PHẢI TĂNG sau mỗi lần phát hành** — Google Play từ chối bản có versionCode nhỏ hơn hoặc bằng bản đã lên. A, C, D không đúng quy tắc đánh phiên bản bắt buộc này.", "bs": false}, {"id": "P-297", "n": 297, "stem": "Before running `flutter build apk --release` for the official release, the lecture recommends first trying the app in \"Profile Mode\" (`flutter run --profile`). What is the most reasonable reason for this intermediate step?", "opts": {"A": "Because Profile Mode is the only mandatory step to successfully build the release file", "B": "Profile Mode removes most of Debug Mode's overhead while still allowing observation of near-real-world performance (smoothness/jank, build/render speed) before creating the official release build, helping catch performance issues early without waiting until the final packaging step", "C": "Profile Mode and Release Mode are entirely identical so this step is unnecessary", "D": "Profile Mode is only used to check syntax errors, unrelated to performance"}, "ans": "B", "why": "**Profile Mode bỏ hầu hết overhead của Debug nhưng vẫn cho số liệu gần với thực tế** → phát hiện sớm vấn đề trước khi build bản release cuối. A, C, D không đúng lý do của bước này.", "bs": false}, {"id": "P-298", "n": 298, "stem": "In the \"Deployment Checklist\" after completing Demo 12.4, which of the following items is mentioned?", "opts": {"A": "Remove debug statements, clean up unused assets, ensure versionCode has been updated", "B": "Double the number of animations in the app", "C": "Delete the entire pubspec.yaml configuration file", "D": "Convert the entire app to use Widget Test instead of Unit Test"}, "ans": "A", "why": "Checklist nhắc: **gỡ bỏ các lệnh debug/print, dọn assets không dùng, và đảm bảo `versionCode` đã được cập nhật**. B, C, D không phải mục hợp lý/được nêu trong checklist thật.", "bs": false}, {"id": "P-300", "n": 300, "stem": "Per Module 12's summary, what is the ultimate goal of the entire process of optimizing and packaging the Taskly app?", "opts": {"A": "Simply to reduce the project's number of lines of code", "B": "To produce a performance-optimized Release build, verify the app's size, and be ready for real-world deployment (production-ready)", "C": "To completely eliminate the need for writing Unit Tests in future projects", "D": "To convert the entire app from Flutter to a native platform"}, "ans": "B", "why": "Mục tiêu cuối cùng: **một bản Release đã tối ưu hiệu năng, đã kiểm tra dung lượng, sẵn sàng đưa lên production** — đúng theo phần Summary của Module 12. A, C, D không đúng mục tiêu cuối được nêu.", "bs": false}, {"id": "P-301", "n": 301, "stem": "What is the basic difference between Implicit Animation and Explicit Animation in Flutter?", "opts": {"A": "Implicit Animation needs a manual AnimationController, Explicit Animation doesn't", "B": "Implicit Animation automatically interpolates between old and new values when a property changes, without needing to manage an AnimationController manually; Explicit Animation requires explicitly declaring and controlling an AnimationController", "C": "The two animation types are entirely identical, just different names", "D": "Implicit Animation only works on iOS, Explicit Animation only works on Android"}, "ans": "B", "why": "**Implicit Animation tự nội suy, không cần controller** (`AnimatedContainer`, `AnimatedOpacity`); **Explicit Animation phải khai báo và điều khiển `AnimationController` tường minh**. A, C, D không đúng đặc điểm kỹ thuật thật.", "bs": false}, {"id": "P-302", "n": 302, "stem": "Which of the following widgets is a textbook example of Implicit Animation?", "opts": {"A": "AnimationController", "B": "AnimatedContainer", "C": "Tween", "D": "CurvedAnimation"}, "ans": "B", "why": "**`AnimatedContainer` là ví dụ kinh điển của Implicit Animation** — chỉ cần đổi thuộc tính (màu, kích thước) kèm `duration` là nó tự chạy hiệu ứng. A, C, D là thành phần thuộc Explicit Animation hoặc công cụ hỗ trợ, không phải widget implicit.", "bs": false}, {"id": "P-303", "n": 303, "stem": "What required parameter does `AnimationController` need to work, illustrating the connection between animation and widget lifecycle?", "opts": {"A": "`context` — because animation must be tied to BuildContext", "B": "`vsync` — usually provided by `TickerProviderStateMixin`, to sync the animation with displayed frames and avoid wasting resources when the widget isn't visible", "C": "`theme` — so the animation applies the correct color", "D": "`key` — so the animation can be tested"}, "ans": "B", "why": "`AnimationController` bắt buộc có tham số **`vsync`** (thường lấy từ `SingleTickerProviderStateMixin`/`TickerProviderStateMixin`) để **đồng bộ animation với nhịp vẽ khung hình** và không tốn tài nguyên khi widget không hiển thị. A, C, D không phải tham số bắt buộc của AnimationController.", "bs": false}, {"id": "P-304", "n": 304, "stem": "Given:\nclass _MyWidgetState extends State<MyWidget> with SingleTickerProviderStateMixin {\nlate AnimationController _controller;\n@override\nvoid initState() {\nsuper.initState();\n_controller = AnimationController(\nduration: const Duration(seconds: 2),\nvsync: this,\n)..repeat();\n}\n@override\nvoid dispose() {\n_controller.dispose();\nsuper.dispose();\n}\n}\nIf a developer forgets to call `_controller.dispose()` in `dispose()`, what is the most likely consequence?", "opts": {"A": "No consequence at all because Dart automatically garbage-collects every object", "B": "The `AnimationController` (especially while `repeat()`-ing) keeps running even after the widget is removed from the tree, causing a memory leak and wasting CPU resources", "C": "The app crashes immediately when the widget is disposed", "D": "The animation automatically stops because Flutter always tracks widget lifecycle"}, "ans": "B", "why": "Quên `dispose()` khiến **`AnimationController` đang lặp vẫn chạy sau khi widget bị gỡ** → **rò rỉ bộ nhớ và tốn CPU vô ích**. A sai vì GC của Dart không thể thu hồi object vẫn đang bị Ticker tham chiếu; C, D không đúng hành vi thật của Flutter.", "bs": false}, {"id": "P-305", "n": 305, "stem": "What is `CurvedAnimation` in Flutter used for?", "opts": {"A": "Drawing a geometric curve shape on screen", "B": "Applying an easing curve (e.g. `Curves.easeIn`) onto an existing linear Animation, changing how the animation's value varies over time (uneven fast/slow) instead of linearly", "C": "Fully replacing AnimationController", "D": "Only usable with SliverAppBar"}, "ans": "B", "why": "**`CurvedAnimation` áp một đường cong (easing) lên Animation tuyến tính**, khiến giá trị thay đổi phi tuyến theo thời gian (chậm-nhanh-chậm, nảy, đàn hồi). A, C, D mô tả sai chức năng.", "bs": false}, {"id": "P-306", "n": 306, "stem": "Compare using `AnimatedContainer` (implicit) versus manually writing `AnimationController` + `Tween` + `AnimatedBuilder` (explicit) for a simple background color-change effect on button tap. When should the explicit approach be preferred despite being more complex?", "opts": {"A": "Never use explicit, implicit is always better in every case", "B": "When you need detailed control over the animation (pausing, reversing, conditional repeating, synchronizing multiple animations at once, or reacting to complex events) — capabilities that a simple implicit widget doesn't provide", "C": "Explicit is always faster than implicit in render performance so it should always be used", "D": "Both approaches have an entirely identical API so there's no difference to consider"}, "ans": "B", "why": "Nên chọn **Explicit khi cần điều khiển chi tiết**: tạm dừng, chạy ngược, lặp có điều kiện, đồng bộ nhiều animation, phản ứng theo sự kiện phức tạp — vượt quá khả năng của widget implicit đơn giản. A, C, D không đúng nguyên tắc lựa chọn.", "bs": false}, {"id": "P-307", "n": 307, "stem": "BLoC (Business Logic Component) is a state-management architecture pattern in Flutter, based on which core concept?", "opts": {"A": "A parent widget passes data directly to a child widget via the constructor", "B": "The input stream is Events, the output stream is States — BLoC receives an Event, processes business logic, then emits a new State for the UI to listen to and update", "C": "Only using SharedPreferences to store state", "D": "There's no core concept, BLoC is just another name for setState"}, "ans": "B", "why": "Khái niệm cốt lõi của BLoC: **luồng vào là Events, luồng ra là States**, ở giữa là nơi xử lý logic nghiệp vụ. A, C, D mô tả sai bản chất nền tảng của BLoC.", "bs": false}, {"id": "P-308", "n": 308, "stem": "In the `flutter_bloc` package, what is the correct data-flow relationship between Event, Bloc, and State?", "opts": {"A": "State → Bloc → Event", "B": "UI sends an Event into the Bloc → Bloc processes and maps the Event into a new State → Bloc emits the State → UI listens to the State to rebuild", "C": "Event and State are the same concept, interchangeable", "D": "Bloc only receives State, not Event"}, "ans": "B", "why": "Luồng đúng: **UI gửi Event → Bloc xử lý và ánh xạ thành State mới → `emit` State → UI lắng nghe và rebuild**. A đảo ngược; C, D mô tả sai quan hệ giữa Event/State/Bloc.", "bs": false}]}, {"id": "P7", "kind": "exam", "chip": "Đề 7", "title": "Đề 7 — 16 câu (câu 309–326)", "questions": [{"id": "P-309", "n": 309, "stem": "How does `Cubit` in the `flutter_bloc` package differ from a traditional `Bloc`?", "opts": {"A": "Cubit cannot manage state, only Bloc can", "B": "Cubit is a simplified version of Bloc — it doesn't need a separate Event class defined, instead directly calling methods to emit new States, reducing boilerplate compared to a full Bloc", "C": "Cubit only works with int data", "D": "Cubit and Bloc are entirely identical in API, no difference"}, "ans": "B", "why": "**`Cubit` là bản rút gọn của `Bloc`** — **không cần lớp Event riêng**, gọi thẳng method rồi `emit` State mới, giảm nhiều boilerplate. A, C, D mô tả sai đặc điểm của Cubit.", "bs": false}, {"id": "P-310", "n": 310, "stem": "Given this simple Cubit code:\nclass CounterCubit extends Cubit<int> {\nCounterCubit() : super(0);\nvoid increment() => emit(state + 1);\n}\nWhich widget in `flutter_bloc` best listens to `CounterCubit` and automatically rebuilds the UI whenever the `state` value changes?", "opts": {"A": "`FutureBuilder`", "B": "`BlocBuilder<CounterCubit, int>`", "C": "`StreamController`", "D": "`InheritedWidget` (used directly, without the library)"}, "ans": "B", "why": "**`BlocBuilder<CounterCubit, int>`** là API đúng của `flutter_bloc` để lắng nghe Cubit và tự rebuild khi state đổi. A, C, D không phải widget/API phù hợp cho mục đích này.", "bs": false}, {"id": "P-311", "n": 311, "stem": "Per BLoC pattern's design philosophy, why should business logic be entirely separated from the UI widget?", "opts": {"A": "Because Flutter doesn't allow writing logic inside a widget", "B": "To increase testability (testing logic independently without building the UI), reuse logic across different platforms/screens, and keep the widget focused on display", "C": "Because BLoC runs faster if the logic is inside the widget", "D": "No clear reason, it's just a naming convention"}, "ans": "B", "why": "Tách logic khỏi widget giúp **dễ test độc lập, tái sử dụng logic cho nhiều màn hình/nền tảng, và widget chỉ lo hiển thị**. A, C, D mô tả sai mục đích của triết lý thiết kế này.", "bs": false}, {"id": "P-312", "n": 312, "stem": "What is the basic difference between `SliverAppBar` and a regular `AppBar`?", "opts": {"A": "SliverAppBar can only display icons, not text", "B": "SliverAppBar is designed to work inside a `CustomScrollView`, able to expand, shrink, or show/hide flexibly based on scroll behavior, while a regular AppBar has a fixed position", "C": "SliverAppBar cannot contain action buttons", "D": "The two widgets are entirely identical, just different names"}, "ans": "B", "why": "**`SliverAppBar` hoạt động bên trong `CustomScrollView` và co giãn/ẩn hiện linh hoạt theo thao tác cuộn**, khác với `AppBar` thường cố định vị trí. A, C, D mô tả sai đặc điểm.", "bs": false}, {"id": "P-313", "n": 313, "stem": "Which parent widget is `SliverAppBar` usually used with to function correctly?", "opts": {"A": "`Scaffold` directly, with no other wrapping widget needed", "B": "`CustomScrollView`, placed inside the `slivers: [...]` property", "C": "A regular `ListView` (non-sliver form)", "D": "`Column`"}, "ans": "B", "why": "`SliverAppBar` thường dùng cùng **`CustomScrollView`**, đặt trong danh sách `slivers: [...]`. Đặt vào `ListView` hay `Column` thông thường sẽ lỗi. A, C, D không đúng cách dùng chuẩn.", "bs": false}, {"id": "P-314", "n": 314, "stem": "What are the `flexibleSpace` and `expandedHeight` properties of `SliverAppBar` used for?", "opts": {"A": "`flexibleSpace` defines the content shown when the AppBar is in its expanded state (e.g. a large background image); `expandedHeight` sets the maximum height when the AppBar is fully expanded — as you scroll down, the AppBar gradually shrinks to its standard height", "B": "These two properties only affect color, not size", "C": "`expandedHeight` determines the maximum number of action buttons", "D": "`flexibleSpace` only works when there's no `CustomScrollView`"}, "ans": "A", "why": "**`flexibleSpace` định nghĩa nội dung ở trạng thái mở rộng** (thường là `FlexibleSpaceBar` với ảnh nền + tiêu đề); **`expandedHeight` đặt chiều cao tối đa khi mở rộng**, sẽ co lại khi cuộn. B, C, D mô tả sai chức năng hai thuộc tính này.", "bs": false}, {"id": "P-315", "n": 315, "stem": "In the Sliver ecosystem, how do `SliverList` and `SliverGrid` differ from a regular `ListView`/`GridView`?", "opts": {"A": "No difference at all, the two types are entirely equivalent in every context", "B": "`SliverList`/`SliverGrid` are designed to combine multiple different scrollable content types (like SliverAppBar, SliverList, SliverGrid) within a SINGLE `CustomScrollView` with a seamless scroll effect, while `ListView`/`GridView` are independent scrollable widgets, hard to coordinate scroll effects with other scrollable widgets", "C": "SliverList only displays up to 10 elements", "D": "SliverGrid doesn't support displaying images"}, "ans": "B", "why": "**`SliverList`/`SliverGrid` được thiết kế để ghép nhiều vùng nội dung cuộn liền mạch trong MỘT `CustomScrollView`**, khác với `ListView`/`GridView` vốn là các vùng cuộn độc lập (lồng nhau sẽ gây xung đột cuộn). A, C, D không đúng đặc điểm kỹ thuật thật.", "bs": false}, {"id": "P-316", "n": 316, "stem": "What does Golden Testing in Flutter check?", "opts": {"A": "Asynchronous data-processing logic (Future/Stream)", "B": "Comparing a widget's rendered UI against a saved reference (\"golden\") image, to detect unintended visual regressions", "C": "Checking API response speed", "D": "Checking the app's security"}, "ans": "B", "why": "**Golden Testing so sánh UI đã render với một ảnh chuẩn (golden file) đã lưu** để phát hiện thay đổi giao diện ngoài ý muốn (visual regression). A, C, D mô tả sai mục đích loại test này.", "bs": false}, {"id": "P-317", "n": 317, "stem": "In `flutter_test`, which function is used to compare the current widget against a saved golden image?", "opts": {"A": "`expect(find.text(...), findsOneWidget)`", "B": "`matchesGoldenFile('image_label.png')` combined with `expectLater()`", "C": "`tester.pumpAndSettle()`", "D": "`verify()`"}, "ans": "B", "why": "Dùng **`matchesGoldenFile()` kết hợp `expectLater()`** — đây là API chuẩn của `flutter_test` để so với ảnh golden. A, C, D không phải hàm đúng cho mục đích này.", "bs": false}, {"id": "P-318", "n": 318, "stem": "A student group runs a Golden Test on Windows, but the original golden image was created on macOS, causing the test to fail repeatedly even though the UI looks \"identical\" to the naked eye. What is the most common cause of this issue?", "opts": {"A": "Golden Tests never work reliably on any operating system", "B": "Font rendering and anti-aliasing can differ slightly between operating systems/Flutter versions, causing pixel-by-pixel images to not match exactly even if hard to notice by eye — so Golden Tests are usually recommended to run consistently on the same environment (e.g. a fixed CI) to avoid false failures", "C": "Because SliverAppBar is incompatible with Golden Test", "D": "Because Windows doesn't support running `flutter test`"}, "ans": "B", "why": "**Khác biệt nhỏ về cách render font và khử răng cưa (anti-aliasing) giữa các hệ điều hành** làm pixel không khớp → test fail. Vì vậy khuyến nghị chạy Golden Test trên **môi trường thống nhất (CI cố định)**. A, C, D không đúng nguyên nhân kỹ thuật thật.", "bs": false}, {"id": "P-319", "n": 319, "stem": "In the general Software Development Life Cycle (SDLC), what is the main role of the \"Analysis\" phase?", "opts": {"A": "Writing detailed source code for each feature", "B": "Gathering and clarifying requirements from users/clients before starting design and coding", "C": "Packaging and publishing the product to a store", "D": "Running the final automated test before release"}, "ans": "B", "why": "Giai đoạn **Analysis tập trung thu thập và làm rõ yêu cầu** trước khi bước sang thiết kế và viết code. A, C, D là các giai đoạn khác của SDLC.", "bs": false}, {"id": "P-320", "n": 320, "stem": "What does \"Technical Debt\" refer to in software development?", "opts": {"A": "A direct financial cost paid to a cloud service provider", "B": "The future cost (time to fix bugs, difficulty maintaining, difficulty scaling) arising from rushed or unoptimized design/coding decisions made now, similar to a \"debt\" that must be paid off gradually over time", "C": "The maximum number of lines of code allowed in a project", "D": "A mandatory fee paid when publishing an app to Google Play/App Store"}, "ans": "B", "why": "**Technical Debt là cái giá phải trả trong tương lai** cho những quyết định thiết kế/code vội vàng ở hiện tại — giống một khoản nợ phải trả dần bằng công sức bảo trì. A, C, D không đúng khái niệm.", "bs": false}, {"id": "P-322", "n": 322, "stem": "In the software development lifecycle, where is the \"Testing\" phase usually placed relative to \"Implementation\" (coding)?", "opts": {"A": "Testing always happens before Implementation in every development model", "B": "Testing usually happens after (or continuously in parallel with, depending on Agile/TDD models) the Implementation phase, to verify the written code works as required per the analysis", "C": "Testing has no relationship with Implementation at all", "D": "Testing is only ever done once, after the app has been released"}, "ans": "B", "why": "**Testing thường diễn ra SAU Implementation** — hoặc song song liên tục theo Agile/TDD — nhằm kiểm chứng code có đáp ứng yêu cầu hay không. A, C, D không đúng vị trí thông thường của Testing trong SDLC.", "bs": false}, {"id": "P-324", "n": 324, "stem": "Why do many real-world Flutter projects choose BLoC instead of just `setState` for large-scale apps with many screens sharing complex state?", "opts": {"A": "Because `setState` isn't supported by Flutter in large apps", "B": "BLoC clearly separates the Event/State flow, making logic easier to test independently (without building UI), easier to trace data flow explicitly, and scales better when many screens need to share and react to the same complex state source — something local `setState` struggles with as an app grows", "C": "`setState` only works with exactly 1 screen in the entire app", "D": "BLoC is always faster than setState in absolute render performance in every case"}, "ans": "B", "why": "BLoC được chọn vì **tách bạch Event/State rõ ràng** → dễ test độc lập, dễ truy vết luồng dữ liệu, và **mở rộng tốt hơn khi nhiều màn hình dùng chung state phức tạp**. A, C, D không đúng lý do thực sự.", "bs": false}, {"id": "P-325", "n": 325, "stem": "In `flutter_bloc`, how does the `BlocListener` widget differ from `BlocBuilder`?", "opts": {"A": "The two widgets are entirely identical, interchangeable in every case", "B": "`BlocBuilder` is used to rebuild the UI based on the new state (returns a widget); `BlocListener` is used to perform one-time side-effects (e.g. navigation, showing a SnackBar/Dialog) when the state changes, WITHOUT rebuilding the UI", "C": "`BlocListener` can only be used with Cubit, not with Bloc", "D": "`BlocBuilder` is only used for Golden Testing"}, "ans": "B", "why": "**`BlocBuilder` dựng lại UI theo state mới**; **`BlocListener` thực hiện side-effect một lần khi state đổi mà KHÔNG rebuild** (hiện SnackBar, điều hướng, mở dialog). Cần cả hai thì dùng `BlocConsumer`. A, C, D mô tả sai khác biệt giữa hai widget.", "bs": false}, {"id": "P-326", "n": 326, "stem": "If a Golden Test is set up to run automatically in a CI/CD pipeline before merging code, what is the main purpose of doing this?", "opts": {"A": "Increases the speed of building the release app", "B": "Automatically catches unintended visual regressions caused by code changes early, before those changes get merged into the main branch, helping ensure UI consistency over time", "C": "Fully replaces Unit Test and Widget Test", "D": "Only has the effect of checking the app's network speed"}, "ans": "B", "why": "Chạy Golden Test trong CI/CD giúp **phát hiện sớm thay đổi giao diện ngoài ý muốn TRƯỚC khi merge code**, đảm bảo UI nhất quán theo thời gian. A, C, D không đúng mục đích của việc tích hợp này.", "bs": false}]}]};
const STORE = 'prm393_progress_v1';   // stable key: regenerating the page keeps saved answers

// ---- persistence -------------------------------------------------------
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return {ans:{}, revealed:{}, sec:0};
    const o = JSON.parse(raw);
    return {ans:o.ans||{}, revealed:o.revealed||{}, sec:o.sec||0};
  }catch(e){ return {ans:{}, revealed:{}, sec:0}; }
}
const saved = load();
const S = {i: Math.min(saved.sec, DATA.sections.length-1), ans: saved.ans, revealed: saved.revealed};
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(STORE, JSON.stringify({ans:S.ans, revealed:S.revealed, sec:S.i})); }catch(e){}
  }, 120);
}

// ---- helpers -----------------------------------------------------------
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(s){
  s = esc(s||'');
  s = s.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (m,c)=>'<pre>'+c.replace(/^\n+|\n+$/g,'')+'</pre>');
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\n/g,'<br>');
  return s;
}
const $=id=>document.getElementById(id);
function statsOf(sec){
  let a=0,c=0;
  sec.questions.forEach(q=>{const v=S.ans[q.id]; if(v){a++; if(v===q.ans)c++;}});
  return {answered:a, correct:c, total:sec.questions.length};
}

// ---- render ------------------------------------------------------------
function renderNav(){
  const nav=$('mods'); nav.innerHTML='';
  let insertedSep=false;
  DATA.sections.forEach((sec,i)=>{
    if(sec.kind==='exam' && !insertedSep){
      const sp=document.createElement('span'); sp.className='sep'; nav.appendChild(sp); insertedSep=true;
    }
    const b=document.createElement('button');
    b.className='mod'+(sec.kind==='exam'?' exam':'')+(i===S.i?' active':'');
    const st=statsOf(sec);
    b.innerHTML=esc(sec.chip)+(st.answered===st.total&&st.total?'<span class="dot"></span>':'');
    b.title=sec.title+' — đã làm '+st.answered+'/'+st.total;
    b.onclick=()=>{S.i=i; save(); render(); window.scrollTo(0,0);};
    nav.appendChild(b);
  });
  const act=nav.querySelector('.mod.active');
  if(act) act.scrollIntoView({block:'nearest', inline:'center'});
}
function render(){
  renderNav();
  const sec=DATA.sections[S.i];
  $('mtitle').textContent=sec.title;
  const nbs=sec.questions.filter(q=>q.bs).length;
  $('mmeta').innerHTML='<span>📋 '+sec.questions.length+' câu</span>'
    +(nbs?'<span>✨ '+nbs+' câu bổ sung từ slide</span>':'')
    +'<span>Bấm vào đáp án để kiểm tra · tiến độ được lưu tự động</span>';
  const list=$('list'); list.innerHTML='';
  sec.questions.forEach((q,qi)=>{
    const card=document.createElement('div'); card.className='q';
    const warn=(q.why||'').startsWith('⚠️');
    card.innerHTML='<div class="qh"><span class="qn'+(q.bs?' bs':'')+'">'+(q.bs?'BS ':'')+'Câu '+(qi+1)+'</span><div class="stem">'+fmt(q.stem)+'</div></div>';
    const opts=document.createElement('div'); opts.className='opts';
    ['A','B','C','D'].forEach(L=>{
      if(!q.opts[L])return;
      const o=document.createElement('button'); o.className='opt';
      o.innerHTML='<span class="lt">'+L+'</span><span>'+fmt(q.opts[L])+'</span>';
      o.onclick=()=>choose(q,L,card);
      o.dataset.l=L; opts.appendChild(o);
    });
    card.appendChild(opts);
    const ex=document.createElement('div'); ex.className='exp'+(warn?' warn':'');
    ex.innerHTML='<b>Đáp án '+q.ans+'.</b> '+fmt(q.why||'(chưa có giải thích)');
    card.appendChild(ex);
    const f=document.createElement('div'); f.className='qf';
    const rv=document.createElement('button'); rv.className='reveal'; rv.textContent='Hiện đáp án';
    rv.onclick=()=>{revealQ(q,card,true);};
    f.appendChild(rv); card.appendChild(f);
    list.appendChild(card);
    const st=S.ans[q.id];
    if(st){applyChoice(q,st,card);} else if(S.revealed[q.id]){revealQ(q,card,false);}
  });
  updateProgress();
}
function choose(q,L,card){
  if(S.ans[q.id])return;
  S.ans[q.id]=L; save();
  applyChoice(q,L,card);
  updateProgress(); renderNav();
}
function applyChoice(q,L,card){
  card.querySelectorAll('.opt').forEach(b=>{
    b.classList.add('locked');
    if(b.dataset.l===q.ans)b.classList.add('correct');
    if(b.dataset.l===L&&L!==q.ans)b.classList.add('wrong');
  });
  card.querySelector('.exp').classList.add('show');
  card.querySelector('.qf').style.display='none';
}
function revealQ(q,card,mark){
  S.revealed[q.id]=true; save();
  card.querySelectorAll('.opt').forEach(b=>{b.classList.add('locked'); if(b.dataset.l===q.ans)b.classList.add('correct');});
  card.querySelector('.exp').classList.add('show');
  card.querySelector('.qf').style.display='none';
  if(mark)updateProgress();
}
function updateProgress(){
  const sec=DATA.sections[S.i], st=statsOf(sec);
  $('pbar').style.width=(st.total?st.answered/st.total*100:0)+'%';
  $('fprog').textContent='Đã làm '+st.answered+'/'+st.total;
  $('fscore').innerHTML=st.answered?('Đúng '+st.correct+'/'+st.answered+'  ('+Math.round(st.correct/st.answered*100)+'%)'):'';
}
$('revealAll').onclick=()=>{
  const sec=DATA.sections[S.i];
  document.querySelectorAll('#list .q').forEach((card,i)=>{const q=sec.questions[i]; if(!S.ans[q.id])revealQ(q,card,false);});
};
$('resetMod').onclick=()=>{
  const sec=DATA.sections[S.i];
  if(!confirm('Xoá kết quả của "'+sec.title+'"? (các phần khác vẫn giữ nguyên)'))return;
  sec.questions.forEach(q=>{delete S.ans[q.id]; delete S.revealed[q.id];});
  save(); render(); window.scrollTo(0,0);
};
$('theme').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  try{localStorage.setItem('prm393_theme',dark?'light':'dark');}catch(e){}
};
try{const t=localStorage.getItem('prm393_theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
render();
</script>
