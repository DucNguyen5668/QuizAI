lLocation(...) trước khi tạo TZDateTime cho zonedSchedule, nếu không dữ liệu múi giờ sẽ không có."}, {"id": "M13-18", "n": 18, "bs": false, "stem": "A notification scheduled with a `TZDateTime` in 'America/New_York' fires at the wrong time on a device set to 'Asia/Bangkok'. What is the most likely cause?", "opts": {"A": "The timezone package was not initialised before creating the TZDateTime", "B": "`zonedSchedule` always converts to UTC internally", "C": "The OS overrides the TZDateTime timezone", "D": "Cross-timezone scheduling is unsupported"}, "ans": "A", "why": "Nguyên nhân phổ biến là chưa gọi tz.initializeTimeZones() trước khi tạo TZDateTime nên cơ sở dữ liệu múi giờ chưa sẵn sàng. Khác B vì zonedSchedule tôn trọng đúng timezone của TZDateTime chứ không tự ép về UTC."}, {"id": "M13-19", "n": 19, "bs": false, "stem": "Which `AndroidScheduleMode` fires exactly even in Doze mode?", "opts": {"A": "`exactAllowWhileIdle`", "B": "`inexact`", "C": "`normal`", "D": "`deferred`"}, "ans": "A", "why": "exactAllowWhileIdle cho phép báo đúng giờ ngay cả khi thiết bị đang ở chế độ Doze tiết kiệm pin; còn inexact thì OS có thể gộp lại và làm trễ."}, {"id": "M13-20", "n": 20, "bs": false, "stem": "Which permission does Android 12+ require for exact alarms?", "opts": {"A": "`SCHEDULE_EXACT_ALARM` / `USE_EXACT_ALARM`", "B": "`WAKE_LOCK` only", "C": "`FOREGROUND_SERVICE`", "D": "None"}, "ans": "A", "why": "Từ Android 12 (API 31+) cần quyền SCHEDULE_EXACT_ALARM / USE_EXACT_ALARM để đặt báo/thông báo chính xác thời điểm."}, {"id": "M13-21", "n": 21, "bs": false, "stem": "Which method returns notifications that are scheduled but not yet delivered?", "opts": {"A": "`pendingNotificationRequests()`", "B": "`getScheduled()`", "C": "`listPending()`", "D": "`activeNotifications()`"}, "ans": "A", "why": "pendingNotificationRequests() trả về danh sách các thông báo đã được lên lịch nhưng chưa tới giờ hiển thị."}, {"id": "M13-22", "n": 22, "bs": false, "stem": "Which method returns notifications currently visible in the tray?", "opts": {"A": "`getActiveNotifications()`", "B": "`pendingNotificationRequests()`", "C": "`getVisible()`", "D": "`currentNotifications()`"}, "ans": "A", "why": "getActiveNotifications() trả về các thông báo hiện đang hiển thị trong khay (tray). Khác pendingNotificationRequests() vốn liệt kê những cái còn chờ, chưa hiện."}, {"id": "M13-23", "n": 23, "bs": false, "stem": "Which method shows a repeating notification at a fixed interval?", "opts": {"A": "`periodicallyShow()`", "B": "`repeat()`", "C": "`scheduleRepeating()`", "D": "`showEvery()`"}, "ans": "A", "why": "periodicallyShow() lặp lại thông báo theo chu kỳ cố định (ví dụ mỗi phút/giờ/ngày)."}, {"id": "M13-24", "n": 24, "bs": false, "stem": "In FCM, which handler processes a message while the app is in the foreground?", "opts": {"A": "`FirebaseMessaging.onMessage`", "B": "`onBackgroundMessage`", "C": "`getInitialMessage()`", "D": "`onMessageOpenedApp`"}, "ans": "A", "why": "FirebaseMessaging.onMessage xử lý message khi app đang mở ở foreground. Khác onMessageOpenedApp (khi người dùng chạm thông báo để mở app từ background)."}, {"id": "M13-25", "n": 25, "bs": false, "stem": "Which handles a message when the app was terminated and is opened via the notification?", "opts": {"A": "`getInitialMessage()`", "B": "`onMessage`", "C": "`onBackgroundMessage`", "D": "`onTokenRefresh`"}, "ans": "A", "why": "getInitialMessage() lấy message đã dùng để mở app trong khi app trước đó bị tắt hẳn (terminated)."}, {"id": "M13-26", "n": 26, "bs": false, "stem": "What is a requirement of the FCM background message handler?", "opts": {"A": "It must be a top-level (or static) function annotated with `@pragma('vm:entry-point')`", "B": "It must be inside a StatefulWidget", "C": "It must be async only", "D": "It must not use await"}, "ans": "A", "why": "Handler nền phải là hàm top-level hoặc static và gắn @pragma('vm:entry-point') để không bị tree-shaking loại bỏ, vì nó chạy trong một isolate riêng tách khỏi UI."}, {"id": "M13-27", "n": 27, "bs": false, "stem": "Which method retrieves the device's FCM registration token?", "opts": {"A": "`FirebaseMessaging.instance.getToken()`", "B": "`FirebaseAuth.instance.getToken()`", "C": "`getDeviceId()`", "D": "`FirebaseMessaging.token()`"}, "ans": "A", "why": "FirebaseMessaging.instance.getToken() trả về registration token của thiết bị, để server biết địa chỉ mà gửi push tới đúng máy đó."}, {"id": "M13-28", "n": 28, "bs": false, "stem": "On iOS, what must be done before notifications can be shown?", "opts": {"A": "Request permission from the user", "B": "Nothing; iOS shows them by default", "C": "Create a notification channel", "D": "Enable background fetch only"}, "ans": "A", "why": "Trên iOS phải xin quyền người dùng (requestPermission) trước khi hiển thị thông báo; iOS không tự cho phép mặc định và cũng không dùng channel như Android."}, {"id": "M13-29", "n": 29, "bs": false, "stem": "Which of these best explains why the plugin's cancel method is named `cancel`?", "opts": {"A": "It maps to Android's `NotificationManager.cancel()`", "B": "It is a Dart convention", "C": "It was renamed from `dismiss` recently", "D": "It cancels the scheduling only"}, "ans": "A", "why": "Tên cancel phản ánh việc plugin ánh xạ trực tiếp tới NotificationManager.cancel() của Android native, chứ không phải quy ước Dart hay đổi tên."}, {"id": "M13-30", "n": 30, "bs": false, "stem": "Which is TRUE about notification importance/priority?", "opts": {"A": "It is a property of the channel on Android 8+, set when the channel is created", "B": "It is set per notification and always overrides the channel", "C": "It does not exist on Android", "D": "It is controlled only by the server"}, "ans": "A", "why": "Trên Android 8+, importance/priority là thuộc tính của channel, được đặt lúc tạo channel và không thể đổi bằng code sau đó (chỉ người dùng chỉnh được trong Settings), nên đặt per-notification không thể override."}]}, {"id": "M14", "kind": "mod", "chip": "M14", "title": "Module 14 — State Management", "questions": [{"id": "M14-1", "n": 1, "bs": false, "stem": "What problem does `InheritedWidget` solve?", "opts": {"A": "Managing HTTP requests", "B": "Animation performance", "C": "Passing data down the widget tree efficiently", "D": "Navigation between routes"}, "ans": "C", "why": "InheritedWidget giải quyết việc truyền dữ liệu xuống sâu trong widget tree một cách hiệu quả, tránh phải truyền tay qua từng constructor. Khác Navigation vì đó là việc của Navigator, không liên quan."}, {"id": "M14-2", "n": 2, "bs": false, "stem": "What is \"prop drilling\"?", "opts": {"A": "Passing data through many intermediate constructors just to reach a deep descendant", "B": "Rebuilding widgets too often", "C": "Nesting too many Containers", "D": "Using too many keys"}, "ans": "A", "why": "Prop drilling là phải truyền dữ liệu qua nhiều constructor trung gian không hề dùng tới, chỉ để đưa được nó xuống một widget con nằm sâu."}, {"id": "M14-3", "n": 3, "bs": false, "stem": "Which method registers a widget as a dependent of an InheritedWidget?", "opts": {"A": "`context.dependOnInheritedWidgetOfExactType<T>()`", "B": "`context.find<T>()`", "C": "`InheritedWidget.of(context)` only", "D": "`context.read<T>()`"}, "ans": "A", "why": "context.dependOnInheritedWidgetOfExactType<T>() đăng ký widget hiện tại làm dependent, để nó tự rebuild khi InheritedWidget đổi dữ liệu; hàm này thường được gọi bên trong of(context)."}, {"id": "M14-4", "n": 4, "bs": false, "stem": "Which of these is an InheritedWidget under the hood?", "opts": {"A": "`Theme`", "B": "`MediaQuery`", "C": "`Navigator`", "D": "All of them"}, "ans": "D", "why": "Theme, MediaQuery và Navigator đều cung cấp dữ liệu cho cây con qua cơ chế InheritedWidget và truy cập bằng .of(context), nên đáp án đúng là 'tất cả'."}, {"id": "M14-5", "n": 5, "bs": false, "stem": "When an InheritedWidget's data changes, which widgets rebuild?", "opts": {"A": "Only those that registered a dependency on it", "B": "The entire app", "C": "Only direct children", "D": "None; you must call setState manually"}, "ans": "A", "why": "Chỉ những widget đã đăng ký phụ thuộc (qua dependOnInheritedWidgetOfExactType) mới rebuild khi dữ liệu đổi, chứ không phải cả app hay chỉ con trực tiếp."}, {"id": "M14-6", "n": 6, "bs": false, "stem": "What is \"ephemeral state\"?", "opts": {"A": "Local state owned by a single widget, managed with `setState`", "B": "State shared across screens", "C": "State stored on a server", "D": "State persisted to disk"}, "ans": "A", "why": "Ephemeral (local) state là state cục bộ chỉ thuộc về một widget duy nhất, quản lý đơn giản bằng setState."}, {"id": "M14-7", "n": 7, "bs": false, "stem": "What is \"app state\"?", "opts": {"A": "State shared across multiple widgets/screens, needing a state-management solution", "B": "State inside one widget only", "C": "The build mode", "D": "The navigation stack"}, "ans": "A", "why": "App state là state dùng chung giữa nhiều widget/màn hình, cần một giải pháp quản lý state (Provider/BLoC...) chứ không chỉ setState."}, {"id": "M14-8", "n": 8, "bs": false, "stem": "Which is appropriate for a checkbox's checked value inside one form?", "opts": {"A": "`setState` (ephemeral state)", "B": "Provider", "C": "BLoC", "D": "SharedPreferences"}, "ans": "A", "why": "Giá trị được tick của một checkbox trong một form là state cục bộ, dùng setState là đủ (ephemeral); không cần tới Provider/BLoC/SharedPreferences cho phạm vi nhỏ này."}, {"id": "M14-9", "n": 9, "bs": false, "stem": "Which class notifies listeners when its data changes?", "opts": {"A": "`ChangeNotifier`", "B": "`StatefulWidget`", "C": "`InheritedWidget`", "D": "`StreamController` only"}, "ans": "A", "why": "ChangeNotifier giữ dữ liệu và phát tín hiệu cho các listener biết khi dữ liệu thay đổi."}, {"id": "M14-10", "n": 10, "bs": false, "stem": "Which method must be called to notify listeners?", "opts": {"A": "`notifyListeners()`", "B": "`setState()`", "C": "`update()`", "D": "`refresh()`"}, "ans": "A", "why": "Phải gọi notifyListeners() để báo cho các listener rebuild sau khi thay đổi dữ liệu trong ChangeNotifier; setState chỉ dùng trong State của widget, không dùng ở đây."}, {"id": "M14-11", "n": 11, "bs": false, "stem": "Which Provider method listens and rebuilds on change?", "opts": {"A": "`context.watch<T>()`", "B": "`context.read<T>()`", "C": "`context.select` only", "D": "`Provider.get<T>()`"}, "ans": "A", "why": "context.watch<T>() lắng nghe và rebuild widget mỗi khi model thay đổi. Khác read() vốn chỉ lấy giá trị mà không lắng nghe."}, {"id": "M14-12", "n": 12, "bs": false, "stem": "Which reads a value once without subscribing to rebuilds?", "opts": {"A": "`context.read<T>()`", "B": "`context.watch<T>()`", "C": "`Consumer`", "D": "`Selector`"}, "ans": "A", "why": "context.read<T>() lấy giá trị một lần và không đăng ký lắng nghe, nên không gây rebuild khi model thay đổi."}, {"id": "M14-13", "n": 13, "bs": false, "stem": "Inside an `onPressed` callback, which should you use to call a method on the model?", "opts": {"A": "`context.read<T>()`", "B": "`context.watch<T>()`", "C": "Either works identically", "D": "`Provider.of<T>(context)` with listen: true"}, "ans": "A", "why": "Trong callback như onPressed, dùng context.read<T>() để gọi phương thức của model; ở đây không cần lắng nghe nên watch() là thừa và không nên dùng."}, {"id": "M14-14", "n": 14, "bs": false, "stem": "Which widget rebuilds only a subtree when a provided value changes?", "opts": {"A": "`Consumer<T>`", "B": "`Builder`", "C": "`StatefulBuilder`", "D": "`LayoutBuilder`"}, "ans": "A", "why": "Consumer<T> chỉ rebuild phần cây con nằm trong builder của nó khi giá trị đổi, giúp thu hẹp phạm vi rebuild."}, {"id": "M14-15", "n": 15, "bs": false, "stem": "Which rebuilds only when a specific field of the model changes?", "opts": {"A": "`Selector<T, R>`", "B": "`Consumer`", "C": "`watch`", "D": "`ChangeNotifierProvider`"}, "ans": "A", "why": "Selector<T, R> chỉ rebuild khi một trường cụ thể (R) mà nó chọn của model thay đổi, tối ưu rebuild hơn cả Consumer."}, {"id": "M14-16", "n": 16, "bs": false, "stem": "Which architecture uses Events, a Bloc, and States, built on Streams?", "opts": {"A": "BLoC", "B": "MVC", "C": "MVP", "D": "Redux only"}, "ans": "A", "why": "BLoC là kiến trúc dùng Events (đầu vào) đưa vào Bloc, Bloc phát ra States (đầu ra), toàn bộ xây trên Streams."}, {"id": "M14-17", "n": 17, "bs": false, "stem": "Which is Provider built on top of?", "opts": {"A": "`InheritedWidget`", "B": "`StreamBuilder`", "C": "`GlobalKey`", "D": "`Isolate`"}, "ans": "A", "why": "Provider được xây dựng dựa trên InheritedWidget nhưng giảm nhiều boilerplate (theo slide Module 5)."}, {"id": "M14-18", "n": 18, "bs": false, "stem": "Which widget consumes a `ValueNotifier` and rebuilds on change?", "opts": {"A": "`ValueListenableBuilder`", "B": "`FutureBuilder`", "C": "`AnimatedBuilder` only", "D": "`Consumer`"}, "ans": "A", "why": "ValueListenableBuilder lắng nghe một ValueNotifier và rebuild mỗi khi value thay đổi."}, {"id": "M14-19", "n": 19, "bs": false, "stem": "Where should a `ChangeNotifierProvider` normally be placed?", "opts": {"A": "Above the widgets that need it — often near the root", "B": "Inside `build()` of every screen", "C": "In `main()` outside `runApp`", "D": "Inside a ListView"}, "ans": "A", "why": "ChangeNotifierProvider nên đặt phía trên các widget cần dùng, thường gần root, để cả subtree bên dưới đều truy cập được model."}, {"id": "M14-20", "n": 20, "bs": false, "stem": "Why should the provider not be created inside `build()`?", "opts": {"A": "It would be recreated on every rebuild, losing state", "B": "It causes a compile error", "C": "Providers only work in initState", "D": "It is actually recommended"}, "ans": "A", "why": "Không tạo provider bên trong build() vì mỗi lần rebuild sẽ tạo lại một instance mới, làm mất toàn bộ state đã có."}, {"id": "M14-21", "n": 21, "bs": false, "stem": "Which is a valid reason to choose a state-management package over plain `setState`?", "opts": {"A": "State must be shared across many screens and survive navigation", "B": "The app has one screen", "C": "To reduce app size", "D": "`setState` is deprecated"}, "ans": "A", "why": "Nên chọn package quản lý state khi state phải chia sẻ qua nhiều màn hình và tồn tại qua điều hướng - điều setState làm không tốt. setState hoàn toàn không bị deprecated."}, {"id": "M14-22", "n": 22, "bs": false, "stem": "Which describes the relationship between MVVM (Android) and Provider + Repository (Flutter)?", "opts": {"A": "Both separate UI from business logic and data sources", "B": "They are unrelated", "C": "MVVM is only for Java", "D": "Provider replaces the repository"}, "ans": "A", "why": "MVVM (Android) và Provider + Repository (Flutter) tương đồng ở chỗ đều tách UI ra khỏi business logic và nguồn dữ liệu; Provider không thay thế repository."}, {"id": "M14-23", "n": 23, "bs": false, "stem": "Which is TRUE about rebuilding performance?", "opts": {"A": "Marking widgets `const` and scoping listeners narrowly reduces unnecessary rebuilds", "B": "Rebuilding always repaints the whole screen", "C": "`setState` at the root is the most efficient approach", "D": "Rebuilds cannot be optimised"}, "ans": "A", "why": "Đánh dấu widget là const và giới hạn hẹp phạm vi listener (Consumer/Selector) giúp giảm rebuild thừa, tăng hiệu năng; rebuild không đồng nghĩa vẽ lại cả màn hình."}, {"id": "M14-24", "n": 24, "bs": false, "stem": "In BLoC, what does the UI send to the Bloc?", "opts": {"A": "Events", "B": "States", "C": "Widgets", "D": "Streams of widgets"}, "ans": "A", "why": "Trong BLoC, UI gửi Events tới Bloc để yêu cầu xử lý một hành động."}, {"id": "M14-25", "n": 25, "bs": false, "stem": "In BLoC, what does the Bloc emit back to the UI?", "opts": {"A": "States", "B": "Events", "C": "Futures", "D": "Contexts"}, "ans": "A", "why": "Bloc phát ngược lại States cho UI để dựng lại giao diện tương ứng với trạng thái mới."}]}, {"id": "DE1", "kind": "exam", "chip": "Đề thử 1", "title": "Đề thử 1 — 50 câu", "questions": [{"id": "DE1-1", "n": 1, "stem": "Which widget reacts to async data from local storage?", "opts": {"A": "FutureBuilder", "B": "StreamBuilder", "C": "ListView", "D": "Provider"}, "ans": "A", "why": "Đọc dữ liệu từ local storage (SharedPreferences, sqflite) là thao tác trả về **một `Future` duy nhất** → dùng `FutureBuilder`. `StreamBuilder` dành cho luồng phát nhiều giá trị theo thời gian (Firebase auth state, socket). `ListView` chỉ hiển thị danh sách, `Provider` là state management.", "bs": false}, {"id": "DE1-2", "n": 2, "stem": "What is the role of events in BLoC?", "opts": {"A": "Store UI", "B": "Trigger state changes", "C": "Render widgets", "D": "Handle layout"}, "ans": "B", "why": "Luồng BLoC là **Event → BLoC → State**. Event là tín hiệu đầu vào (người dùng bấm nút, app khởi động) **kích hoạt BLoC xử lý và phát ra State mới**. State mới là thứ UI lắng nghe để vẽ lại. Event không chứa UI và không vẽ gì cả.", "bs": false}, {"id": "DE1-3", "n": 3, "stem": "Which method retrieves data from SharedPreferences?", "opts": {"A": "get()", "B": "read()", "C": "fetch()", "D": "load()"}, "ans": "A", "why": "SharedPreferences dùng họ hàm **`get...`**: `getString()`, `getInt()`, `getBool()`, `getDouble()`, `getStringList()`. Ghi thì dùng `set...` (`setString`). Các tên `read/fetch/load` không tồn tại trong API này.", "bs": false}, {"id": "DE1-4", "n": 4, "stem": "Which command builds a release APK?", "opts": {"A": "flutter run", "B": "flutter build apk", "C": "flutter doctor", "D": "flutter clean"}, "ans": "B", "why": "**`flutter build apk`** (mặc định là chế độ release) tạo file APK để phát hành. `flutter run` chạy debug trên máy, `flutter doctor` kiểm tra môi trường, `flutter clean` xóa thư mục build. Muốn nộp Google Play thì dùng `flutter build appbundle` (AAB).", "bs": false}, {"id": "DE1-5", "n": 5, "stem": "What is implicit animation?", "opts": {"A": "Manual animation control", "B": "Animation without controller", "C": "API animation", "D": "Navigation animation"}, "ans": "B", "why": "Implicit animation = các widget `AnimatedXxx` (`AnimatedContainer`, `AnimatedOpacity`...) — bạn chỉ đổi giá trị và đặt `duration`, **Flutter tự nội suy, không cần `AnimationController`**. Ngược lại explicit animation mới cần controller + `Tween` và bạn tự điều khiển tiến trình.", "bs": false}, {"id": "DE1-6", "n": 6, "stem": "Which type of test checks individual functions or classes?", "opts": {"A": "Widget test", "B": "Integration test", "C": "Unit test", "D": "System test"}, "ans": "C", "why": "**Unit test** kiểm tra một đơn vị nhỏ nhất (hàm, method, class) một cách độc lập, chạy nhanh, không cần UI. Widget test kiểm tra 1 widget có render/tương tác đúng; integration test chạy cả app thật. Đây là đáy của kim tự tháp kiểm thử (nhiều nhất, rẻ nhất).", "bs": false}, {"id": "DE1-7", "n": 7, "stem": "Which approach helps reduce unnecessary widget rebuilds?", "opts": {"A": "Using global variables", "B": "Fine-grained state updates", "C": "Hot restart", "D": "Large widgets"}, "ans": "B", "why": "**Cập nhật state ở phạm vi hẹp** (tách widget nhỏ, dùng `Consumer`/`Selector`, `ValueListenableBuilder`, `const`) khiến chỉ phần UI thực sự đổi mới rebuild. Global variable không giúp gì; hot restart là công cụ dev; widget lớn thì rebuild càng tốn.", "bs": false}, {"id": "DE1-8", "n": 8, "stem": "How can data be passed to a new screen?", "opts": {"A": "Using global variables", "B": "Via constructor arguments", "C": "Using ThemeData", "D": "Using Scaffold"}, "ans": "B", "why": "Cách chuẩn và an toàn kiểu nhất là **truyền qua constructor** của màn hình đích: `MaterialPageRoute(builder: (_) => DetailScreen(item: item))`. Ngoài ra có thể dùng `arguments` của named route. Global variable phá vỡ đóng gói và khó test.", "bs": false}, {"id": "DE1-9", "n": 9, "stem": "Which Flutter test focuses on UI components?", "opts": {"A": "Unit test", "B": "Widget test", "C": "Integration test", "D": "Load test"}, "ans": "B", "why": "**Widget test** (dùng `WidgetTester`, `pumpWidget`, `find.text`) kiểm tra một widget render đúng và phản hồi đúng khi tương tác — chạy nhanh vì không cần thiết bị thật. Unit test không có UI, integration test mới chạy toàn app trên máy/emulator.", "bs": false}, {"id": "DE1-10", "n": 10, "stem": "Why should state be kept as local as possible?", "opts": {"A": "Better animations", "B": "Reduce unnecessary rebuilds", "C": "Simplify UI", "D": "Improve navigation"}, "ans": "B", "why": "State đặt càng gần nơi dùng thì **vùng rebuild càng nhỏ** → hiệu năng tốt hơn, đồng thời code dễ hiểu và dễ test. Đẩy state lên tận gốc cây khiến mỗi lần đổi là rebuild gần như toàn bộ app.", "bs": false}, {"id": "DE1-11", "n": 11, "stem": "What is the purpose of SliverAppBar?", "opts": {"A": "Static app bar", "B": "Scrollable flexible app bar", "C": "Bottom navigation", "D": "Drawer control"}, "ans": "B", "why": "`SliverAppBar` là app bar **co giãn theo cuộn** bên trong `CustomScrollView` — có thể thu nhỏ, ghim lại (`pinned`), nổi lại khi cuộn ngược (`floating`), kèm `FlexibleSpaceBar` cho ảnh nền. AppBar thường thì cố định.", "bs": false}, {"id": "DE1-12", "n": 12, "stem": "Which status code indicates server error?", "opts": {"A": "200", "B": "301", "C": "404", "D": "500"}, "ans": "D", "why": "Nhóm **5xx = lỗi phía server**, `500 Internal Server Error` là điển hình. 2xx = thành công, 3xx = chuyển hướng, **4xx = lỗi phía client** (404 = không tìm thấy tài nguyên, 401 = chưa xác thực).", "bs": false}, {"id": "DE1-13", "n": 13, "stem": "Why should animations be disposed properly?", "opts": {"A": "Improve UI", "B": "Prevent memory leaks", "C": "Speed up builds", "D": "Fix layout"}, "ans": "B", "why": "`AnimationController` gắn với `Ticker` chạy theo từng frame; không gọi `controller.dispose()` trong `dispose()` thì ticker tiếp tục sống và giữ tham chiếu tới State → **rò rỉ bộ nhớ** và cảnh báo 'A TickerProvider was leaked'.", "bs": false}, {"id": "DE1-14", "n": 14, "stem": "Which widget can hide user input text when configured for password entry?", "opts": {"A": "TextField", "B": "ObscureText", "C": "SecureInput", "D": "PasswordField"}, "ans": "A", "why": "Vẫn là **`TextField`** (hoặc `TextFormField`), chỉ cần đặt thuộc tính **`obscureText: true`**. `ObscureText` là tên thuộc tính chứ không phải widget; `SecureInput`/`PasswordField` không tồn tại trong Flutter.", "bs": false}, {"id": "DE1-15", "n": 15, "stem": "What does CurvedAnimation provide?", "opts": {"A": "Layout control", "B": "Animation curve behavior", "C": "State updates", "D": "Navigation"}, "ans": "B", "why": "`CurvedAnimation(parent: controller, curve: Curves.easeInOut)` **bọc một animation tuyến tính và áp đường cong tốc độ** (ease in/out, bounce, elastic) → chuyển động tự nhiên hơn thay vì chạy đều tăm tắp.", "bs": false}, {"id": "DE1-16", "n": 16, "stem": "What does golden testing verify?", "opts": {"A": "API responses", "B": "UI appearance consistency", "C": "Database state", "D": "Authentication"}, "ans": "B", "why": "Golden test (screenshot test) **chụp ảnh widget và so khớp pixel với ảnh chuẩn (`.png` golden file)** → phát hiện thay đổi ngoài ý muốn về giao diện. Nó kiểm tra hình thức, không kiểm tra logic API hay DB.", "bs": false}, {"id": "DE1-17", "n": 17, "stem": "Which widget allows overlapping of its child widgets?", "opts": {"A": "Column", "B": "Row", "C": "Stack", "D": "Expanded"}, "ans": "C", "why": "**`Stack`** xếp các con **chồng lên nhau theo trục Z**, kết hợp `Positioned`/`Align` để đặt vị trí — dùng cho badge trên icon, chữ trên ảnh. `Column`/`Row` xếp tuyến tính không chồng; `Expanded` chỉ chia không gian trong Flex.", "bs": false}, {"id": "DE1-18", "n": 18, "stem": "Which Dart data structure is best suited for storing an ordered collection of items?", "opts": {"A": "Set", "B": "Map", "C": "List", "D": "Queue"}, "ans": "C", "why": "**`List`** giữ **thứ tự chèn**, cho phép phần tử trùng lặp và truy cập bằng chỉ số `list[0]`. `Set` không đảm bảo thứ tự và loại bỏ trùng; `Map` lưu cặp key-value; `Queue` tối ưu cho thêm/xóa ở hai đầu, không truy cập theo index.", "bs": false}, {"id": "DE1-19", "n": 19, "stem": "What is the main risk of improper state management?", "opts": {"A": "UI inconsistency", "B": "Longer compile time", "C": "Package conflicts", "D": "Build errors"}, "ans": "A", "why": "Quản lý state sai khiến **UI hiển thị không khớp với dữ liệu thật** (dữ liệu đã đổi mà màn hình chưa cập nhật, hoặc hai chỗ hiện hai giá trị khác nhau). Nó là lỗi lúc chạy, không phải lỗi biên dịch hay xung đột package.", "bs": false}, {"id": "DE1-20", "n": 20, "stem": "What is the main purpose of hot reload in Flutter?", "opts": {"A": "Improve runtime performance", "B": "Instantly reflect code changes in UI", "C": "Publish apps faster", "D": "Reduce memory usage"}, "ans": "B", "why": "Hot reload **nạp code mới vào máy ảo Dart đang chạy và rebuild widget tree ngay lập tức, GIỮ NGUYÊN state hiện tại** → vòng lặp phát triển rất nhanh. (Hot restart thì khởi động lại app và mất state.) Nó chỉ là công cụ dev, không tăng hiệu năng app thật.", "bs": false}, {"id": "DE1-21", "n": 21, "stem": "Which widget applies a theme to an entire Flutter application?", "opts": {"A": "Scaffold", "B": "Theme", "C": "MaterialApp", "D": "Container"}, "ans": "C", "why": "**`MaterialApp(theme: ThemeData(...))`** đặt theme cho **toàn bộ ứng dụng**. Widget `Theme` cũng áp theme nhưng chỉ cho **một nhánh con** của cây. `Scaffold` là khung một màn hình, `Container` chỉ là hộp bố cục.", "bs": false}, {"id": "DE1-22", "n": 22, "stem": "Which package supports BLoC architecture?", "opts": {"A": "provider", "B": "flutter_bloc", "C": "sqflite", "D": "http"}, "ans": "B", "why": "**`flutter_bloc`** (kèm `bloc`) cung cấp `Bloc`, `Cubit`, `BlocProvider`, `BlocBuilder`. `provider` là giải pháp state management khác (dựa trên InheritedWidget); `sqflite` là database; `http` là networking.", "bs": false}, {"id": "DE1-23", "n": 23, "stem": "Which action best demonstrates Flutter's reactive UI model?", "opts": {"A": "Manually updating UI elements", "B": "Rebuilding UI in response to state changes", "C": "Editing layout XML", "D": "Calling native APIs"}, "ans": "B", "why": "Mô hình reactive: **UI = f(state)** — bạn đổi state, framework tự dựng lại UI tương ứng. Đối lập với mô hình imperative (Android View cũ) là tự tay gọi `setText()`, `setVisibility()` trên từng thành phần.", "bs": false}, {"id": "DE1-24", "n": 24, "stem": "What is technical debt?", "opts": {"A": "UI lag", "B": "Future cost of poor design decisions", "C": "Memory usage", "D": "API limit"}, "ans": "B", "why": "Nợ kỹ thuật = **cái giá phải trả về sau** cho những quyết định đi tắt hôm nay (code cẩu thả, thiếu test, kiến trúc sai) — biểu hiện là sửa đổi ngày càng chậm và dễ sinh bug. Nó là khái niệm quản trị dự án, không phải chỉ số hiệu năng.", "bs": false}, {"id": "DE1-25", "n": 25, "stem": "Which Flutter concept supports reactive UI updates?", "opts": {"A": "Manual refresh", "B": "Widget rebuilding", "C": "Hot restart", "D": "Native callbacks"}, "ans": "B", "why": "Cơ chế nền tảng là **dựng lại widget (rebuild)**: khi state đổi, Flutter build lại subtree rồi so sánh (diff) với Element tree để chỉ cập nhật phần thực sự thay đổi. Không cần refresh thủ công.", "bs": false}, {"id": "DE1-26", "n": 26, "stem": "Which Flutter widget reacts to authentication state changes?", "opts": {"A": "FutureBuilder", "B": "StreamBuilder", "C": "ListView", "D": "Form"}, "ans": "B", "why": "Trạng thái đăng nhập là **luồng liên tục** (`FirebaseAuth.instance.authStateChanges()` trả về `Stream<User?>`), có thể đổi nhiều lần (login/logout/token refresh) → dùng **`StreamBuilder`**. `FutureBuilder` chỉ hợp cho giá trị một lần.", "bs": false}, {"id": "DE1-27", "n": 27, "stem": "Why should database operations be asynchronous?", "opts": {"A": "Simplify syntax", "B": "Avoid blocking UI thread", "C": "Reduce code", "D": "Improve theme"}, "ans": "B", "why": "Truy vấn DB là **I/O tốn thời gian**; chạy đồng bộ sẽ chiếm isolate chính khiến khung hình bị treo (jank, ANR). Vì vậy toàn bộ API `sqflite` đều trả `Future` và phải `await`.", "bs": false}, {"id": "DE1-28", "n": 28, "stem": "Why is Chapter 13 considered optional (Plus)?", "opts": {"A": "It replaces core concepts", "B": "Apps can work without deep optimization", "C": "It manages navigation", "D": "It handles authentication"}, "ans": "B", "why": "Chương 13 (tối ưu hiệu năng nâng cao) là phần **'Plus'** vì ứng dụng vẫn chạy đúng chức năng nếu chưa tối ưu sâu — nó cải thiện chất lượng chứ không phải điều kiện bắt buộc để app hoạt động.", "bs": false}, {"id": "DE1-29", "n": 29, "stem": "What happens after successful login?", "opts": {"A": "App closes", "B": "User session starts", "C": "Theme changes", "D": "Navigation resets"}, "ans": "B", "why": "Đăng nhập thành công → server trả token, app **bắt đầu một phiên (session)**: lưu token, cập nhật auth state, điều hướng vào vùng cần xác thực. Token này sẽ được đính kèm ở header `Authorization` cho các request sau.", "bs": false}, {"id": "DE1-30", "n": 30, "stem": "Why is secure authentication critical in mobile apps?", "opts": {"A": "UI quality", "B": "Protect user data", "C": "Reduce code", "D": "Improve speed"}, "ans": "B", "why": "Xác thực là **cổng bảo vệ dữ liệu cá nhân và tài nguyên** của người dùng. Làm ẩu (lưu mật khẩu thô, token trong SharedPreferences không mã hóa, không dùng HTTPS) dẫn tới lộ tài khoản. Nó không liên quan tới tốc độ hay lượng code.", "bs": false}, {"id": "DE1-31", "n": 31, "stem": "What is the main benefit of Flutter's widget-based architecture?", "opts": {"A": "Widgets are only used for layout design", "B": "Widgets allow code reuse across platforms", "C": "Widgets automatically manage databases", "D": "Widgets replace backend services"}, "ans": "B", "why": "Mọi thứ trong Flutter đều là widget và **Flutter tự vẽ bằng engine riêng (Skia/Impeller)**, nên cùng một cây widget **chạy được trên Android, iOS, web, desktop** — tái sử dụng code và giao diện nhất quán. Widget không quản lý DB hay thay thế backend.", "bs": false}, {"id": "DE1-32", "n": 32, "stem": "Which Dart keyword is used to define a constant value at compile time?", "opts": {"A": "final", "B": "static", "C": "const", "D": "var"}, "ans": "C", "why": "**`const` = hằng tại thời điểm biên dịch** (giá trị phải biết trước khi chạy, object được canonicalize/tái sử dụng). `final` = gán **một lần lúc chạy** (ví dụ `final now = DateTime.now();` hợp lệ, còn `const now = DateTime.now();` thì lỗi). `static` là thuộc tính của class.", "bs": false}, {"id": "DE1-33", "n": 33, "stem": "What is Dart primarily designed for in the Flutter ecosystem?", "opts": {"A": "Database management", "B": "User interface development", "C": "General-purpose programming with UI focus", "D": "Network security"}, "ans": "C", "why": "Dart là **ngôn ngữ đa dụng nhưng được tối ưu cho việc dựng giao diện**: JIT cho hot reload lúc dev, AOT biên dịch ra mã máy lúc release, hỗ trợ async/isolate. Đáp án B quá hẹp — Dart không chỉ dùng để viết UI mà còn viết toàn bộ logic ứng dụng.", "bs": false}, {"id": "DE1-34", "n": 34, "stem": "What is the benefit of composing widgets in Flutter?", "opts": {"A": "Faster compilation", "B": "Better code reuse and UI consistency", "C": "Reduced memory usage", "D": "Automatic navigation"}, "ans": "B", "why": "Flutter theo triết lý **composition over inheritance**: ghép các widget nhỏ thành widget lớn → **tái sử dụng được và giao diện nhất quán**, đồng thời rebuild gọn hơn. Nó không làm compile nhanh hơn.", "bs": false}, {"id": "DE1-35", "n": 35, "stem": "Which widget is best used to add fixed empty space?", "opts": {"A": "Padding", "B": "Expanded", "C": "SizedBox", "D": "Container"}, "ans": "C", "why": "**`SizedBox(height: 16)`** là cách nhẹ và rõ nghĩa nhất để chèn khoảng trống cố định. `Padding` tạo khoảng cách **quanh một child**; `Expanded` chiếm không gian **co giãn** (không cố định); `Container` rỗng thì nặng và mơ hồ hơn SizedBox.", "bs": false}, {"id": "DE1-36", "n": 36, "stem": "What happens if a non-nullable variable is not initialized in Dart?", "opts": {"A": "The app runs normally", "B": "A runtime exception occurs", "C": "A compile-time error occurs", "D": "The value becomes null automatically"}, "ans": "C", "why": "Với null-safety, biến non-nullable **bắt buộc phải có giá trị trước khi dùng** — trình biên dịch chặn ngay, báo **lỗi compile-time**, không đợi tới lúc chạy. Muốn hoãn khởi tạo thì dùng `late`, muốn cho phép null thì khai báo `Type?`.", "bs": false}, {"id": "DE1-37", "n": 37, "stem": "What is the purpose of parsing JSON?", "opts": {"A": "Encrypt data", "B": "Convert JSON into Dart objects", "C": "Send requests", "D": "Cache responses"}, "ans": "B", "why": "Parse JSON = **biến chuỗi/Map JSON từ API thành object Dart có kiểu** (`User.fromJson(map)`), để code được kiểm tra kiểu và tự động hoàn thành thay vì truy cập `map['name']` dễ sai chính tả. Việc gửi request là của `http`.", "bs": false}, {"id": "DE1-38", "n": 38, "stem": "Which platforms can Flutter applications target using a single codebase?", "opts": {"A": "Android only", "B": "iOS only", "C": "Android, iOS, web, and desktop", "D": "Web servers only"}, "ans": "C", "why": "Flutter hỗ trợ **Android, iOS, Web, Windows, macOS, Linux** (và embedded) từ **một codebase duy nhất**, vì nó tự render UI bằng engine riêng thay vì phụ thuộc widget gốc của từng nền tảng.", "bs": false}, {"id": "DE1-39", "n": 39, "stem": "Which HTTP method is typically used to retrieve data?", "opts": {"A": "POST", "B": "PUT", "C": "GET", "D": "DELETE"}, "ans": "C", "why": "**`GET` = lấy dữ liệu**, an toàn và idempotent, không có body. `POST` tạo mới, `PUT` cập nhật/thay thế toàn bộ, `PATCH` cập nhật một phần, `DELETE` xóa.", "bs": false}, {"id": "DE1-40", "n": 40, "stem": "Why should authentication state be centralized?", "opts": {"A": "Reduce UI code", "B": "Ensure consistent access control", "C": "Improve animations", "D": "Simplify layout"}, "ans": "B", "why": "Gom auth state về **một nguồn sự thật duy nhất** (AuthProvider/AuthBloc) đảm bảo **mọi màn hình đều thấy cùng một trạng thái đăng nhập** → route guard, logout, refresh token hoạt động nhất quán. Rải rác mỗi nơi một biến sẽ dẫn tới màn hình này đã logout mà màn hình kia vẫn tưởng còn đăng nhập.", "bs": false}, {"id": "DE1-41", "n": 41, "stem": "Which phase involves gathering requirements?", "opts": {"A": "Implementation", "B": "Design", "C": "Analysis", "D": "Testing"}, "ans": "C", "why": "Trong vòng đời phát triển phần mềm, **Analysis (phân tích)** là giai đoạn thu thập và làm rõ yêu cầu. Sau đó mới tới Design (thiết kế giải pháp), Implementation (code), Testing (kiểm thử).", "bs": false}, {"id": "DE1-42", "n": 42, "stem": "Which step is required before running a Flutter app for the first time?", "opts": {"A": "Publishing the app", "B": "Setting up the Flutter SDK", "C": "Configuring a database", "D": "Writing backend APIs"}, "ans": "B", "why": "Phải **cài đặt Flutter SDK** (và kiểm tra bằng `flutter doctor`) trước khi tạo/chạy project. Database và backend chỉ cần khi app thực sự dùng; publishing là bước cuối cùng.", "bs": false}, {"id": "DE1-43", "n": 43, "stem": "Which Flutter tool helps debug network requests?", "opts": {"A": "DevTools", "B": "Inspector", "C": "Emulator", "D": "Hot reload"}, "ans": "A", "why": "**Flutter DevTools** có tab **Network** để xem từng request/response, thời gian, status code — ngoài ra còn Performance, Memory, CPU Profiler. **Widget Inspector chỉ là một tab bên trong DevTools** và dùng để soi cây widget/layout, không xem network.", "bs": false}, {"id": "DE1-44", "n": 44, "stem": "Why are widgets lightweight in Flutter?", "opts": {"A": "They manage system resources", "B": "They are immutable descriptions", "C": "They store UI state", "D": "They handle rendering directly"}, "ans": "B", "why": "Widget chỉ là **object mô tả cấu hình, bất biến (immutable)** — tạo mới rất rẻ. Việc giữ state là của **Element/State**, việc layout và vẽ là của **RenderObject**. Đó là lý do rebuild widget liên tục vẫn không tốn kém.", "bs": false}, {"id": "DE1-45", "n": 45, "stem": "Which Dart feature supports object-oriented programming?", "opts": {"A": "Widgets", "B": "Classes and objects", "C": "Hot reload", "D": "Layout builders"}, "ans": "B", "why": "OOP trong Dart dựa trên **class và object** (kèm kế thừa, interface ngầm, mixin, abstract class). Widget là khái niệm của Flutter chứ không phải tính năng ngôn ngữ; hot reload là công cụ.", "bs": false}, {"id": "DE1-46", "n": 46, "stem": "What is Flutter primarily used for?", "opts": {"A": "Designing databases for mobile apps", "B": "Creating native applications from a single codebase", "C": "Developing server-side applications only", "D": "Building operating systems for mobile devices"}, "ans": "B", "why": "Flutter là **UI toolkit của Google** để build ứng dụng **biên dịch ra mã máy (natively compiled)** cho nhiều nền tảng **từ một codebase**. Nó không phải công cụ thiết kế DB, không giới hạn ở server, và không dùng để viết hệ điều hành.", "bs": false}, {"id": "DE1-47", "n": 47, "stem": "Which method resets all form fields?", "opts": {"A": "clear()", "B": "reset()", "C": "dispose()", "D": "remove()"}, "ans": "B", "why": "**`_formKey.currentState!.reset()`** đưa mọi field trong `Form` về giá trị khởi tạo và xóa thông báo lỗi validate. `clear()` là của `TextEditingController` (chỉ xóa 1 ô); `dispose()` để giải phóng tài nguyên.", "bs": false}, {"id": "DE1-48", "n": 48, "stem": "Why are const widgets recommended?", "opts": {"A": "They improve readability", "B": "They reduce rebuild cost", "C": "They add state", "D": "They handle navigation"}, "ans": "B", "why": "Widget `const` được **tạo một lần lúc biên dịch và tái sử dụng cùng một instance**; khi cha rebuild, Flutter nhận ra widget không đổi và **bỏ qua việc dựng lại subtree đó** → giảm chi phí rebuild. Đây là tối ưu hiệu năng dễ áp dụng nhất.", "bs": false}, {"id": "DE1-49", "n": 49, "stem": "Why is clean architecture beneficial?", "opts": {"A": "Fewer files", "B": "Easier maintenance and testing", "C": "Better UI", "D": "Faster builds"}, "ans": "B", "why": "Clean architecture **tách tầng** (presentation / domain / data) và đảo chiều phụ thuộc → mỗi tầng test độc lập được, đổi nguồn dữ liệu hay đổi UI không ảnh hưởng logic nghiệp vụ. Đánh đổi là **nhiều file hơn**, nên A sai.", "bs": false}, {"id": "DE1-50", "n": 50, "stem": "Why are forms important in mobile applications?", "opts": {"A": "UI decoration", "B": "User data collection", "C": "State management", "D": "Navigation"}, "ans": "B", "why": "Form là kênh chính để **thu thập dữ liệu người dùng** (đăng ký, đăng nhập, thanh toán) kèm **validate** trước khi gửi lên server. Nó không phải để trang trí, cũng không phải cơ chế quản lý state hay điều hướng.", "bs": false}]}, {"id": "DE2", "kind": "exam", "chip": "Đề thử 2", "title": "Đề thử 2 — 48 câu (thiếu câu 10, 11 trong ảnh gốc)", "questions": [{"id": "DE2-1", "n": 1, "stem": "Which widget pattern protects authenticated routes?", "opts": {"A": "Navigator", "B": "Guard", "C": "Route protection", "D": "Middleware"}, "ans": "B", "why": "⚠️ Mẫu thiết kế này tên là **Route Guard** — một widget/hàm kiểm tra auth state trước khi cho vào màn hình, chưa đăng nhập thì đá về Login. `Navigator` chỉ là bộ điều hướng, `Middleware` là thuật ngữ backend. (Lưu ý: đáp án C 'Route protection' chỉ là cách mô tả, không phải tên mẫu — đề chấm theo tên mẫu là 'Guard'.)", "bs": false}, {"id": "DE2-2", "n": 2, "stem": "Why are tests important for refactoring?", "opts": {"A": "Reduce UI work", "B": "Ensure changes don't break functionality", "C": "Improve animations", "D": "Change layout"}, "ans": "B", "why": "Refactor = **đổi cấu trúc code mà giữ nguyên hành vi**. Bộ test là lưới an toàn: chạy lại sau khi sửa, nếu vẫn xanh thì hành vi được giữ nguyên. Không có test thì mọi lần refactor đều là canh bạc.", "bs": false}, {"id": "DE2-3", "n": 3, "stem": "What is the role of BuildContext in Flutter?", "opts": {"A": "Store application data", "B": "Locate widgets in the widget tree", "C": "Manage navigation history", "D": "Render UI pixels"}, "ans": "B", "why": "`BuildContext` là **tay cầm trỏ tới vị trí của widget trong cây (chính là Element)** — nhờ nó mà `Theme.of(context)`, `Navigator.of(context)`, `MediaQuery.of(context)` biết đi ngược lên tìm widget tổ tiên. Nó không lưu dữ liệu và không vẽ pixel.", "bs": false}, {"id": "DE2-4", "n": 4, "stem": "What role does the Flutter framework play in application development?", "opts": {"A": "It manages database servers", "B": "It provides UI components and rendering logic", "C": "It replaces the operating system", "D": "It runs backend business logic"}, "ans": "B", "why": "Flutter cung cấp **bộ widget dựng sẵn + engine render** (layout, paint, compositing, animation, gesture). Database và backend vẫn là phần bạn tự tích hợp; Flutter chạy TRÊN hệ điều hành chứ không thay thế nó.", "bs": false}, {"id": "DE2-5", "n": 5, "stem": "How is the Flutter UI constructed internally?", "opts": {"A": "Using XML layout files", "B": "Using HTML and CSS", "C": "Using a hierarchical widget tree", "D": "Using native UI components only"}, "ans": "C", "why": "Flutter dựng UI bằng **cây widget phân cấp viết hoàn toàn bằng Dart** — không XML (Android), không HTML/CSS (web), và **không dùng widget gốc của nền tảng** (khác React Native). Cây widget này sau đó ánh xạ sang Element tree và RenderObject tree.", "bs": false}, {"id": "DE2-6", "n": 6, "stem": "Which widget enables custom scroll effects in Flutter?", "opts": {"A": "ListView", "B": "SingleChildScrollView", "C": "CustomScrollView", "D": "Column"}, "ans": "C", "why": "**`CustomScrollView`** cho phép ghép nhiều **sliver** (`SliverAppBar`, `SliverList`, `SliverGrid`, `SliverToBoxAdapter`) trong **một vùng cuộn duy nhất** → tạo hiệu ứng cuộn tùy biến như app bar co giãn. `ListView`/`SingleChildScrollView` chỉ cuộn đơn giản.", "bs": false}, {"id": "DE2-7", "n": 7, "stem": "Which practice improves rendering performance?", "opts": {"A": "Large widget trees", "B": "Splitting widgets", "C": "Global state", "D": "Frequent rebuilds"}, "ans": "B", "why": "**Tách widget thành các phần nhỏ** (đặc biệt tách phần thay đổi ra khỏi phần tĩnh, kết hợp `const`) giúp mỗi lần setState chỉ rebuild đúng phần cần thiết. Cây widget khổng lồ và rebuild liên tục chính là nguyên nhân gây giật.", "bs": false}, {"id": "DE2-8", "n": 8, "stem": "What does an integration test verify?", "opts": {"A": "Single function", "B": "Widget rendering", "C": "End-to-end app behavior", "D": "Theme consistency"}, "ans": "C", "why": "**Integration test chạy toàn bộ app trên thiết bị/emulator thật** và kiểm tra luồng người dùng từ đầu đến cuối (mở app → đăng nhập → thêm dữ liệu → kiểm tra kết quả). Đây là đỉnh kim tự tháp: ít nhất, chậm nhất, nhưng sát thực tế nhất.", "bs": false}, {"id": "DE2-9", "n": 9, "stem": "Why is separating UI and state logic recommended?", "opts": {"A": "Reduce code size", "B": "Improve maintainability", "C": "Faster execution", "D": "Better animations"}, "ans": "B", "why": "Tách logic khỏi UI giúp **dễ bảo trì và dễ test**: logic có thể unit test không cần dựng widget, UI đổi mà logic không phải sửa. Nó thường làm **tăng** số dòng code chứ không giảm, và không làm chương trình chạy nhanh hơn.", "bs": false}, {"id": "DE2-12", "n": 12, "stem": "When does Flutter rebuild the widget tree?", "opts": {"A": "On every frame", "B": "When state changes", "C": "Only when app restarts", "D": "Only during hot restart"}, "ans": "B", "why": "Flutter rebuild khi **state thay đổi** — `setState()`, InheritedWidget cập nhật, hoặc widget cha truyền cấu hình mới xuống. Nó **không** rebuild mọi frame (chỉ phần animation mới chạy theo frame), đó là lý do Flutter vẫn hiệu quả.", "bs": false}, {"id": "DE2-13", "n": 13, "stem": "Which concept does BLoC heavily rely on?", "opts": {"A": "Future", "B": "Stream", "C": "Animation", "D": "Theme"}, "ans": "B", "why": "BLoC = **Business Logic Component**, hoạt động dựa trên **Stream**: nhận `Stream` sự kiện vào, phát ra `Stream` trạng thái ra; UI lắng nghe bằng `BlocBuilder`/`StreamBuilder`. `Future` chỉ cho một giá trị nên không mô tả được luồng trạng thái liên tục.", "bs": false}, {"id": "DE2-14", "n": 14, "stem": "Why is version control critical?", "opts": {"A": "UI changes", "B": "Track and manage code changes", "C": "Improve animations", "D": "Store data"}, "ans": "B", "why": "Version control (Git) **ghi lại lịch sử thay đổi**, cho phép quay lui, làm việc song song trên nhánh, review và merge. Nó là hạ tầng cộng tác, không liên quan tới UI hay lưu dữ liệu ứng dụng.", "bs": false}, {"id": "DE2-15", "n": 15, "stem": "Why is immutability important in BLoC states?", "opts": {"A": "UI speed", "B": "Predictable state changes", "C": "Memory usage", "D": "Theme control"}, "ans": "B", "why": "State bất biến nghĩa là **mỗi thay đổi tạo ra một object state MỚI** → dễ so sánh (`==`) để biết có cần rebuild không, dễ truy vết lịch sử, tránh việc sửa ngầm gây bug khó tìm. Nếu sửa tại chỗ, BLoC sẽ không phát hiện được state đã đổi.", "bs": false}, {"id": "DE2-16", "n": 16, "stem": "Which Flutter plugin provides SQLite support?", "opts": {"A": "hive", "B": "moor", "C": "sqflite", "D": "shared_preferences"}, "ans": "C", "why": "**`sqflite`** là plugin SQLite chính thức phổ biến nhất (truy vấn SQL trực tiếp). `hive` là NoSQL key-value; `moor`/`drift` là ORM **xây trên** SQLite chứ không phải plugin nền; `shared_preferences` chỉ lưu key-value đơn giản.", "bs": false}, {"id": "DE2-17", "n": 17, "stem": "What is the main benefit of using Maps in Dart?", "opts": {"A": "Storing values without keys", "B": "Storing key-value pairs", "C": "Rendering UI components", "D": "Managing asynchronous tasks"}, "ans": "B", "why": "`Map<K,V>` lưu **cặp khóa–giá trị** và tra cứu theo key gần như tức thời (`map['name']`). Lưu giá trị không có khóa là `List`/`Set`. JSON decode trong Dart trả về đúng `Map<String, dynamic>`.", "bs": false}, {"id": "DE2-18", "n": 18, "stem": "Which tool helps analyze UI performance in Flutter?", "opts": {"A": "Inspector", "B": "DevTools", "C": "Emulator", "D": "Hot reload"}, "ans": "B", "why": "**Flutter DevTools** có tab **Performance** (timeline frame, phát hiện jank), Memory, CPU Profiler, và cả Widget Inspector. Inspector chỉ là **một phần trong DevTools** dùng để soi cây widget/layout chứ không đo hiệu năng tổng thể.", "bs": false}, {"id": "DE2-19", "n": 19, "stem": "What does a Dart class primarily represent?", "opts": {"A": "A UI widget only", "B": "A blueprint for creating objects", "C": "A database table", "D": "A network request"}, "ans": "B", "why": "Class là **bản thiết kế (blueprint)** định nghĩa thuộc tính và hành vi; từ đó `new`/gọi constructor để tạo ra các object cụ thể. Nó có thể dùng làm model, service, widget — không giới hạn ở UI hay bảng DB.", "bs": false}, {"id": "DE2-20", "n": 20, "stem": "What is the purpose of SliverAppBar?", "opts": {"A": "Static app bar", "B": "Scrollable flexible app bar", "C": "Bottom navigation", "D": "Drawer control"}, "ans": "B", "why": "`SliverAppBar` là app bar **co giãn/ẩn hiện theo thao tác cuộn** trong `CustomScrollView`, hỗ trợ `pinned`, `floating`, `snap` và `FlexibleSpaceBar` (ảnh nền mờ dần). AppBar thường đứng yên.", "bs": false}, {"id": "DE2-21", "n": 21, "stem": "What is Hive mainly used for?", "opts": {"A": "Remote database", "B": "Lightweight local NoSQL storage", "C": "State management", "D": "Routing"}, "ans": "B", "why": "**Hive** là database **NoSQL key-value chạy cục bộ trên thiết bị**, viết thuần Dart nên rất nhanh và không cần native. Nó lưu offline, không phải DB từ xa; cũng không phải giải pháp state management hay điều hướng.", "bs": false}, {"id": "DE2-22", "n": 22, "stem": "Which HTTP header is commonly used for authorization?", "opts": {"A": "Content-Type", "B": "Accept", "C": "Authorization", "D": "Cache-Control"}, "ans": "C", "why": "Header **`Authorization: Bearer <token>`** mang thông tin xác thực. `Content-Type` khai báo định dạng body gửi đi (`application/json`), `Accept` khai báo định dạng muốn nhận về, `Cache-Control` điều khiển cache.", "bs": false}, {"id": "DE2-23", "n": 23, "stem": "What does TextEditingController manage?", "opts": {"A": "Theme", "B": "Text input value", "C": "Validation rules", "D": "Layout constraints"}, "ans": "B", "why": "`TextEditingController` giữ **nội dung văn bản và vị trí con trỏ** của `TextField`; đọc bằng `controller.text`, đặt lại bằng `controller.clear()`. Luật kiểm tra là `validator:` của `TextFormField`. **Nhớ `dispose()` controller** để tránh rò rỉ.", "bs": false}, {"id": "DE2-24", "n": 24, "stem": "Why is Dart considered suitable for Flutter development?", "opts": {"A": "It is only used for backend systems", "B": "It supports both UI and application logic efficiently", "C": "It replaces native languages", "D": "It does not support asynchronous programming"}, "ans": "B", "why": "Dart viết được **cả giao diện lẫn logic** trong cùng một ngôn ngữ, có **JIT** cho hot reload lúc phát triển và **AOT** biên dịch ra mã máy lúc release, kèm async/await và isolate. Đáp án D sai hoàn toàn vì Dart hỗ trợ async rất mạnh.", "bs": false}, {"id": "DE2-25", "n": 25, "stem": "What does the build() method return in a widget?", "opts": {"A": "A screen", "B": "A widget tree describing the UI", "C": "Application state", "D": "Rendered pixels"}, "ans": "B", "why": "`build()` trả về **một cây widget mô tả giao diện** tại thời điểm đó. Việc biến mô tả đó thành pixel là của RenderObject/engine. Vì `build()` có thể bị gọi rất nhiều lần nên **không được đặt side-effect (gọi API, setState) trong đó**.", "bs": false}, {"id": "DE2-26", "n": 26, "stem": "What represents the output of a BLoC?", "opts": {"A": "Events", "B": "Widgets", "C": "States", "D": "Controllers"}, "ans": "C", "why": "Trong BLoC: **Event là đầu vào, State là đầu ra**. BLoC nhận event, xử lý logic rồi `emit` state mới; UI lắng nghe state để dựng lại. Đảo hai khái niệm này là lỗi hay gặp nhất khi học BLoC.", "bs": false}, {"id": "DE2-27", "n": 27, "stem": "What is Cubit in BLoC?", "opts": {"A": "UI widget", "B": "Simplified BLoC without events", "C": "Database layer", "D": "Animation helper"}, "ans": "B", "why": "**`Cubit` là bản rút gọn của `Bloc`: bỏ lớp Event**, thay vào đó bạn gọi thẳng method (`counterCubit.increment()`) rồi `emit(newState)`. Ít boilerplate hơn, hợp với logic đơn giản; Bloc đầy đủ hợp khi cần truy vết event rõ ràng.", "bs": false}, {"id": "DE2-28", "n": 28, "stem": "Which activity is typically performed after creating a new Flutter project?", "opts": {"A": "Deploying to app stores", "B": "Running the default app on a device", "C": "Configuring authentication", "D": "Optimizing database queries"}, "ans": "B", "why": "Sau `flutter create`, bước tự nhiên là **`flutter run`** để chạy app counter mặc định, xác nhận môi trường và thiết bị hoạt động đúng. Deploy, auth, tối ưu DB đều là việc của giai đoạn sau.", "bs": false}, {"id": "DE2-29", "n": 29, "stem": "Which practice improves deployment security?", "opts": {"A": "Debug builds", "B": "Secure signing keys", "C": "Hardcoding secrets", "D": "Skipping validation"}, "ans": "B", "why": "**Bảo vệ keystore/signing key** (không commit vào git, lưu trong `key.properties` bị gitignore) đảm bảo không ai giả mạo bản cập nhật app của bạn. Ba lựa chọn còn lại đều là thực hành **nguy hiểm**: phát hành bản debug, nhúng secret vào code, bỏ qua validate.", "bs": false}, {"id": "DE2-30", "n": 30, "stem": "Why is Chapter 14 considered optional (Plus)?", "opts": {"A": "Deployment is UI logic", "B": "Apps can be tested without publishing", "C": "It replaces authentication", "D": "It handles APIs"}, "ans": "B", "why": "Chương 14 (build & release/deployment) là **'Plus'** vì bạn hoàn toàn có thể phát triển và kiểm thử app trên emulator/thiết bị mà **chưa cần publish lên store**. Nó là bước cuối khi muốn phân phối sản phẩm.", "bs": false}, {"id": "DE2-31", "n": 31, "stem": "What is the primary purpose of ThemeData in Flutter?", "opts": {"A": "Manage navigation", "B": "Define application-wide visual styles", "C": "Handle state changes", "D": "Control animations"}, "ans": "B", "why": "`ThemeData` định nghĩa **bộ style dùng chung toàn app**: bảng màu (`colorScheme`), font (`textTheme`), style mặc định của button/appbar/input. Nhờ đó đổi một chỗ là cả app đổi theo, và hỗ trợ dark mode dễ dàng.", "bs": false}, {"id": "DE2-32", "n": 32, "stem": "Which method is used to update the UI when state changes?", "opts": {"A": "build()", "B": "setState()", "C": "initState()", "D": "dispose()"}, "ans": "B", "why": "**`setState()`** báo cho framework rằng state đã đổi → đánh dấu element 'dirty' → Flutter gọi lại `build()` ở frame kế tiếp. Bạn **không tự gọi `build()`**; `initState()` chỉ chạy một lần lúc khởi tạo, `dispose()` khi hủy.", "bs": false}, {"id": "DE2-33", "n": 33, "stem": "Which Flutter package is commonly used for simple key-value storage?", "opts": {"A": "sqflite", "B": "shared_preferences", "C": "provider", "D": "http"}, "ans": "B", "why": "**`shared_preferences`** lưu các cặp key-value nhỏ và đơn giản (token, cờ đã onboarding, cài đặt) — bản chất là SharedPreferences trên Android / NSUserDefaults trên iOS. Dữ liệu quan hệ, nhiều bản ghi thì mới dùng `sqflite`.", "bs": false}, {"id": "DE2-34", "n": 34, "stem": "Why should architecture be decided early?", "opts": {"A": "Avoid UI work", "B": "Reduce refactoring cost", "C": "Improve animations", "D": "Change theme"}, "ans": "B", "why": "Chọn kiến trúc sớm giúp **tránh phải viết lại tốn kém về sau**: càng nhiều code đã viết theo cấu trúc cũ thì chi phí đổi càng lớn (chính là technical debt). Nó không liên quan tới animation hay theme.", "bs": false}, {"id": "DE2-35", "n": 35, "stem": "What is pagination used for?", "opts": {"A": "UI animation", "B": "Handling large datasets efficiently", "C": "Theme management", "D": "Authentication"}, "ans": "B", "why": "Phân trang **tải dữ liệu theo từng lô nhỏ** (page/limit-offset hoặc cursor) thay vì lấy toàn bộ → giảm băng thông, giảm RAM, màn hình hiện nhanh hơn. Thường kết hợp `ListView.builder` + infinite scroll.", "bs": false}, {"id": "DE2-36", "n": 36, "stem": "Which widget helps avoid rebuilding unchanged UI parts?", "opts": {"A": "Container", "B": "RepaintBoundary", "C": "Column", "D": "FutureBuilder"}, "ans": "B", "why": "**`RepaintBoundary`** tách phần cây đó thành **layer vẽ riêng**, nên khi vùng khác cần vẽ lại thì phần này không bị vẽ lại theo — hữu ích cho widget nặng hoặc animation cục bộ. Kiểm tra hiệu quả bằng **Repaint Rainbow** trong DevTools.", "bs": false}, {"id": "DE2-37", "n": 37, "stem": "Which widget is used to handle asynchronous API responses in UI?", "opts": {"A": "FutureBuilder", "B": "ListView", "C": "Provider", "D": "Form"}, "ans": "A", "why": "**`FutureBuilder`** nhận một `Future` và tự dựng UI theo `snapshot`: đang chờ → loading, có lỗi → thông báo lỗi, có dữ liệu → hiển thị. Gọi API HTTP trả về một kết quả duy nhất nên hợp với Future (nhiều giá trị liên tục mới dùng `StreamBuilder`).", "bs": false}, {"id": "DE2-38", "n": 38, "stem": "Which Dart feature helps organize code into reusable libraries?", "opts": {"A": "Widgets", "B": "Packages and imports", "C": "Hot reload", "D": "Layout constraints"}, "ans": "B", "why": "Dart tổ chức code bằng **package** (khai báo trong `pubspec.yaml`) và **`import`/`export`/`library`** → chia nhỏ, tái sử dụng, chia sẻ qua pub.dev. Widget là khái niệm UI, hot reload là công cụ dev.", "bs": false}, {"id": "DE2-39", "n": 39, "stem": "What is refresh token used for?", "opts": {"A": "UI refresh", "B": "Extend session without re-login", "C": "Theme update", "D": "Navigation reset"}, "ans": "B", "why": "Access token cố tình đặt **thời hạn ngắn** cho an toàn; khi hết hạn, app dùng **refresh token (hạn dài, lưu an toàn)** để xin access token mới **mà không bắt người dùng đăng nhập lại**. Nó không liên quan gì tới việc vẽ lại UI.", "bs": false}, {"id": "DE2-40", "n": 40, "stem": "What is rebuild scope optimization in Flutter?", "opts": {"A": "Reducing widget tree depth", "B": "Limiting rebuild to affected widgets", "C": "Caching API responses", "D": "Using global state"}, "ans": "B", "why": "Tối ưu phạm vi rebuild = **khoanh vùng để chỉ widget thực sự phụ thuộc dữ liệu đổi mới được dựng lại** — bằng cách tách widget con, dùng `const`, `Consumer`/`Selector`, `ValueListenableBuilder`. Global state thì làm điều ngược lại (rebuild lan rộng).", "bs": false}, {"id": "DE2-41", "n": 41, "stem": "Why is BLoC suitable for large teams?", "opts": {"A": "Less code", "B": "Standardized architecture", "C": "Faster builds", "D": "UI reuse"}, "ans": "B", "why": "BLoC áp đặt **một quy ước rõ ràng và thống nhất** (Event → Bloc → State, tách bạch UI và logic) nên nhiều người cùng làm vẫn hiểu code của nhau, dễ review và test. Đổi lại nó **nhiều boilerplate hơn** — vì vậy A sai.", "bs": false}, {"id": "DE2-42", "n": 42, "stem": "Which widget reacts to async data from local storage?", "opts": {"A": "FutureBuilder", "B": "StreamBuilder", "C": "ListView", "D": "Provider"}, "ans": "A", "why": "Đọc local storage (`SharedPreferences.getInstance()`, truy vấn `sqflite`) trả về **`Future` — một kết quả duy nhất** → dùng `FutureBuilder` với `snapshot.connectionState` và `snapshot.data`. `StreamBuilder` dành cho dữ liệu phát liên tục.", "bs": false}, {"id": "DE2-43", "n": 43, "stem": "What is a token in authentication systems?", "opts": {"A": "UI key", "B": "Temporary access credential", "C": "Database ID", "D": "Theme value"}, "ans": "B", "why": "Token (thường là JWT) là **chứng thư truy cập tạm thời, có hạn** do server cấp sau khi đăng nhập; client đính kèm ở header `Authorization` cho các request sau. Nó thay cho việc gửi lại username/password mỗi lần.", "bs": false}, {"id": "DE2-44", "n": 44, "stem": "What does a Tween define?", "opts": {"A": "Animation speed", "B": "Value range for animation", "C": "UI layout", "D": "State logic"}, "ans": "B", "why": "`Tween` (viết tắt của *be**tween***) định nghĩa **khoảng giá trị đầu → cuối**, ví dụ `Tween<double>(begin: 0, end: 1)` hay `ColorTween`. Tốc độ do `AnimationController.duration` quyết định, còn nhịp điệu do `Curve`.", "bs": false}, {"id": "DE2-45", "n": 45, "stem": "Which Dart feature allows defining reusable, type-safe components?", "opts": {"A": "Mixins", "B": "Generics", "C": "Futures", "D": "Streams"}, "ans": "B", "why": "**Generics** (`List<T>`, `Box<T>`, `Future<T>`) cho phép viết một lần dùng cho nhiều kiểu mà **vẫn được kiểm tra kiểu lúc biên dịch** — thay vì dùng `dynamic` và chịu lỗi lúc chạy. Mixin dùng để chia sẻ hành vi, không phải để tham số hóa kiểu.", "bs": false}, {"id": "DE2-46", "n": 46, "stem": "Which widget animates between two widgets?", "opts": {"A": "AnimatedSwitcher", "B": "AnimatedOpacity", "C": "AnimatedAlign", "D": "AnimatedSize"}, "ans": "A", "why": "**`AnimatedSwitcher`** tạo hiệu ứng chuyển tiếp (mặc định là fade) **khi child bị thay bằng một widget khác** — cần `key` khác nhau để nó nhận ra đã đổi. `AnimatedOpacity` chỉ đổi độ mờ của **cùng một** widget, `AnimatedAlign` đổi vị trí, `AnimatedSize` đổi kích thước.", "bs": false}, {"id": "DE2-47", "n": 47, "stem": "Why should setState() be called sparingly?", "opts": {"A": "It increases app size", "B": "It may trigger unnecessary rebuilds", "C": "It blocks UI thread", "D": "It causes memory leaks"}, "ans": "B", "why": "`setState()` đánh dấu **toàn bộ widget đó** là dirty → cả subtree được build lại, kể cả phần không liên quan. Gọi bừa bãi (nhất là ở widget cha cấp cao) gây rebuild thừa và giật. Nó không block thread và không tự gây memory leak.", "bs": false}, {"id": "DE2-48", "n": 48, "stem": "What is test isolation?", "opts": {"A": "Running all tests together", "B": "Independence of test cases", "C": "UI separation", "D": "Mocking only"}, "ans": "B", "why": "Test isolation = **mỗi test độc lập**, không phụ thuộc thứ tự chạy hay dữ liệu do test khác để lại (dùng `setUp`/`tearDown` để reset). Nhờ vậy test chạy song song được và khi fail thì biết chính xác cái gì hỏng. Mock chỉ là một công cụ để đạt được điều đó.", "bs": false}, {"id": "DE2-49", "n": 49, "stem": "What does crossAxisAlignment control?", "opts": {"A": "Vertical alignment in Column", "B": "Horizontal alignment in Column", "C": "Child order", "D": "Widget size"}, "ans": "B", "why": "Trong `Column`, **trục chính (main axis) là dọc**, nên **trục chéo (cross axis) là ngang** → `crossAxisAlignment` căn **trái/phải/giữa**. Căn dọc trong Column là `mainAxisAlignment`. Với `Row` thì ngược lại: main = ngang, cross = dọc.", "bs": false}, {"id": "DE2-50", "n": 50, "stem": "Which tool is commonly used for version control?", "opts": {"A": "SVN", "B": "Git", "C": "FTP", "D": "ZIP"}, "ans": "B", "why": "**Git** là hệ quản lý phiên bản phân tán phổ biến nhất hiện nay (nền tảng của GitHub/GitLab). SVN là thế hệ cũ tập trung; FTP chỉ là giao thức truyền file; ZIP là định dạng nén — cả hai đều không quản lý lịch sử thay đổi.", "bs": false}]}, {"id": "P1", "kind": "exam", "chip": "Đề 1", "title": "Đề 1 — 50 câu (câu 1–50)", "questions": [{"id": "P-1", "n": 1, "stem": "What is Flutter?", "opts": {"A": "A new programming language developed by Google", "B": "A UI toolkit by Google for building natively compiled apps from a single codebase", "C": "A framework only for building web applications", "D": "A mobile operating system by Google"}, "ans": "B", "why": "Flutter là **UI toolkit của Google** để build app biên dịch ra mã máy (natively compiled) từ **một codebase duy nhất**. A sai vì Flutter không phải ngôn ngữ (ngôn ngữ là Dart); C sai vì Flutter đa nền tảng chứ không riêng web; D sai vì Flutter không phải hệ điều hành.", "bs": false}, {"id": "P-2", "n": 2, "stem": "Which programming language and rendering engine does Flutter use?", "opts": {"A": "Kotlin and Skia", "B": "Dart and Skia", "C": "Dart and V8", "D": "Swift and Metal"}, "ans": "B", "why": "Flutter dùng **ngôn ngữ Dart** + **engine render Skia** (bản mới là Impeller). A, C, D đều ghép sai cặp ngôn ngữ/engine — nhớ: Dart + Skia.", "bs": false}, {"id": "P-3", "n": 3, "stem": "Flutter's architecture has three main layers. What is the correct top-to-bottom order (closest to the developer to closest to the hardware)?", "opts": {"A": "Engine → Framework → Embedder", "B": "Framework → Engine → Embedder", "C": "Embedder → Framework → Engine", "D": "Framework → Embedder → Engine"}, "ans": "B", "why": "Thứ tự kiến trúc từ trên xuống: **Framework (Dart) → Engine (C++) → Embedder**. Framework gần lập trình viên nhất (widget, animation, gesture); Engine lo render; Embedder gắn vào từng nền tảng. Các đáp án khác đảo ngược thứ tự.", "bs": false}, {"id": "P-4", "n": 4, "stem": "Which layer of the Flutter architecture is written in C++ and uses Skia to handle rendering, accessibility, and text layout?", "opts": {"A": "Framework Layer", "B": "Engine Layer", "C": "Embedder Layer", "D": "Widget Layer"}, "ans": "B", "why": "**Engine Layer** viết bằng **C++**, dùng **Skia** để render, xử lý accessibility và text layout. Framework Layer (A) là tầng Dart nằm trên; Embedder (C) lo tích hợp nền tảng; 'Widget Layer' (D) không phải tên chính thức của tầng nào.", "bs": false}, {"id": "P-5", "n": 5, "stem": "What is the main role of the Embedder Layer in Flutter's architecture?", "opts": {"A": "Provide all Material and Cupertino widgets", "B": "Compile Dart code to ARM machine code", "C": "Platform-specific integration, handling input, lifecycle, and window management", "D": "Perform JSON parsing from APIs"}, "ans": "C", "why": "**Embedder Layer** lo phần **tích hợp riêng của từng nền tảng**: nhận input, quản lý vòng đời app, quản lý cửa sổ/surface. A và D thuộc tầng Framework/networking; B là việc của trình biên dịch Dart AOT.", "bs": false}, {"id": "P-6", "n": 6, "stem": "A startup wants to build an MVP quickly, running on both Android and iOS, with a limited development team and no need for extreme graphics performance. According to the lecture, this situation is:", "opts": {"A": "Not suitable for Flutter because Flutter only supports Android", "B": "A reasonable fit for Flutter because it matches the goal of faster time-to-market and reduced development cost", "C": "Better suited to pure native code because Flutter doesn't support MVPs", "D": "Best done in Kotlin because Flutter is not optimized for commercial apps"}, "ans": "B", "why": "Bài giảng nêu rõ Flutter phù hợp cho **MVP, startup, tiết kiệm chi phí, ra thị trường nhanh** — đúng y hệt tình huống này (đội nhỏ, cần nhanh, không đòi đồ họa cực nặng). A, C, D đều trái với nội dung bài.", "bs": false}, {"id": "P-7", "n": 7, "stem": "Which of the following is the best example of a case where you should NOT choose Flutter and should build natively instead?", "opts": {"A": "A simple movie ticket booking app", "B": "An e-commerce app with a standard UI", "C": "A real-time graphics-intensive game requiring low-level hardware access", "D": "An internal enterprise management dashboard app"}, "ans": "C", "why": "**Game real-time đồ họa nặng cần truy cập phần cứng ở mức thấp** là ví dụ kinh điển của mục 'Khi nào nên dùng Native'. A, B, D đều là những ca Flutter làm rất tốt.", "bs": false}, {"id": "P-8", "n": 8, "stem": "Flutter communicates with native features (Camera, Bluetooth, NFC...) that it does not support directly through which mechanism?", "opts": {"A": "WebSocket", "B": "Platform Channels", "C": "REST API", "D": "Automatic FFI Bridge"}, "ans": "B", "why": "Flutter gọi tính năng native mà nó không hỗ trợ sẵn (Camera, Bluetooth, NFC…) thông qua **Platform Channels** — cầu nối gửi message giữa Dart và code Kotlin/Swift. A, C, D không phải cơ chế được nêu trong bài.", "bs": false}, {"id": "P-9", "n": 9, "stem": "Which combined compilation model does Dart use to support both fast development and optimized production performance?", "opts": {"A": "JIT (Just-In-Time) only", "B": "AOT (Ahead-Of-Time) only", "C": "Both JIT (development) and AOT (production)", "D": "Purely interpreted, no compilation"}, "ans": "C", "why": "Dart kết hợp **JIT** (biên dịch lúc chạy → hot reload cực nhanh khi phát triển) và **AOT** (biên dịch trước ra mã máy → hiệu năng cao khi release). A và B chỉ đúng một nửa; D sai hoàn toàn.", "bs": false}, {"id": "P-10", "n": 10, "stem": "In the framework comparison table from Module 1, what is the core difference between Flutter and React Native?", "opts": {"A": "Flutter uses Dart and compiles to native UI with its own engine, while React Native uses JavaScript and bridges to native components", "B": "Both compile directly to native machine code without an engine", "C": "React Native is faster because it needs no bridge", "D": "Flutter cannot build for iOS, only Android"}, "ans": "A", "why": "Bảng so sánh: **Flutter (Dart, tự vẽ UI bằng Engine riêng) vs React Native (JS, phải qua Bridge sang native) vs Native (Kotlin/Swift, thuần native)**. B sai vì React Native vẫn cần bridge; C và D là khẳng định không có căn cứ.", "bs": false}, {"id": "P-11", "n": 11, "stem": "In a Flutter project, which file is the entry point of the app?", "opts": {"A": "pubspec.yaml", "B": "lib/main.dart", "C": "android/build.gradle", "D": "web/index.html"}, "ans": "B", "why": "**`lib/main.dart`** là điểm khởi đầu (entry point) của app — chứa hàm `main()` gọi `runApp()`. A là file cấu hình dependency; C, D là file cấu hình riêng của nền tảng.", "bs": false}, {"id": "P-12", "n": 12, "stem": "Which folder in the Flutter project structure holds dependency and asset configuration?", "opts": {"A": "lib/", "B": "test/", "C": "pubspec.yaml", "D": "android/"}, "ans": "C", "why": "**`pubspec.yaml`** khai báo dependency và assets (ảnh, font). A (`lib/`) chứa code Dart chính; B (`test/`) chứa unit test; D (`android/`) chứa code riêng cho Android.", "bs": false}, {"id": "P-13", "n": 13, "stem": "What is the `flutter doctor` command used for?", "opts": {"A": "Automatically fix errors in Dart source code", "B": "Check and confirm whether the Flutter SDK installation and related tools are ready", "C": "Build the app into a release APK file", "D": "Run unit tests for the whole project"}, "ans": "B", "why": "**`flutter doctor`** kiểm tra môi trường cài đặt: Flutter SDK, Android toolchain, Xcode, thiết bị kết nối, IDE plugin — và báo cái nào còn thiếu. A, C, D mô tả sai chức năng lệnh này.", "bs": false}, {"id": "P-14", "n": 14, "stem": "A student creates an emulator on a low-spec PC. According to the lecture's recommendation, which emulator configuration is more suitable to reduce the load on the machine?", "opts": {"A": "Pixel 8, API 33+", "B": "Pixel 3a, API 30", "C": "Pixel Tablet, API 34", "D": "Pixel Fold, API 35"}, "ans": "B", "why": "Bài giảng khuyến nghị cấu hình nhẹ **Pixel 3a / API 30** cho máy yếu để emulator chạy mượt. A, C, D đều là cấu hình nặng hơn, không phù hợp máy cấu hình thấp.", "bs": false}, {"id": "P-15", "n": 15, "stem": "How does DartPad differ from VS Code/Android Studio when developing Flutter?", "opts": {"A": "DartPad requires a full SDK installation just like Android Studio", "B": "DartPad is an online environment, requires no installation, and runs directly in the browser", "C": "DartPad does not support basic widgets like Text, Column", "D": "DartPad can only be used for the Kotlin language"}, "ans": "B", "why": "**DartPad chạy online, không cần cài đặt gì** — mở trình duyệt là code được ngay, hợp để thử nhanh. A sai vì DartPad không cần cài SDK đầy đủ; C sai vì DartPad vẫn hỗ trợ `Text`, `Column`; D sai vì đây là Dart/Flutter chứ không phải Kotlin.", "bs": false}, {"id": "P-16", "n": 16, "stem": "Consider the following code running in main.dart:\nimport 'package:flutter/material.dart';\nvoid main() => runApp(const MaterialApp(\nhome: Scaffold(\nbody: Center(\nchild: Text('Hello, World',\nstyle: TextStyle(fontSize: 28, fontWeight: FontWeight.bold)),\n),\n),\n));\nIf the `const` keyword before `MaterialApp` is removed, what happens to the app's behavior?", "opts": {"A": "The app will fail to compile immediately", "B": "The app still runs correctly, only losing the performance optimization benefit since Flutter can no longer reuse the same immutable widget instance", "C": "The Text will fail to display \"Hello, World\"", "D": "The Scaffold will no longer be able to have an AppBar later"}, "ans": "B", "why": "**`const` giúp Flutter tối ưu việc so sánh cây widget (tree-diffing)** — widget const được tái sử dụng nên bỏ qua rebuild subtree. Bỏ `const` đi code **vẫn chạy đúng**, chỉ mất lợi ích hiệu năng. A sai vì không gây lỗi biên dịch; C sai vì Text vẫn hiển thị bình thường; D không liên quan.", "bs": false}, {"id": "P-17", "n": 17, "stem": "According to Flutter's architecture, which statement best describes the concept of a 'Widget'?", "opts": {"A": "Widgets are only components that display images", "B": "In Flutter, everything on screen (layout, style, interaction) is built through Widgets", "C": "Widgets only exist in the Engine Layer", "D": "Widget is an Android-only concept, not used in Flutter"}, "ans": "B", "why": "Triết lý **'Everything is a Widget'** — mọi thứ hiện trên màn hình đều là widget (kể cả padding, alignment, theme). A giới hạn phạm vi sai; C, D nói sai về bản chất và vị trí của widget.", "bs": false}, {"id": "P-18", "n": 18, "stem": "According to the development history timeline mentioned in the lecture, what platform support did Flutter 2.0 (2021) add?", "opts": {"A": "Only added Android Wear support", "B": "Web and Desktop", "C": "Only added iOS support", "D": "Only added watchOS support"}, "ans": "B", "why": "Theo mốc thời gian trong bài, **Flutter 2.0 (2021) bổ sung hỗ trợ Web và Desktop** — đánh dấu bước từ mobile sang đa nền tảng thật sự. A, C, D không khớp với các mốc được nêu.", "bs": false}, {"id": "P-19", "n": 19, "stem": "What order does Flutter's rendering workflow follow?", "opts": {"A": "GPU Rendering → Widget Tree → Render Tree → Composited Scene", "B": "Widget Tree → Render Tree → Composited Scene → GPU Rendering", "C": "Render Tree → Widget Tree → GPU Rendering → Composited Scene", "D": "Composited Scene → Widget Tree → GPU Rendering → Render Tree"}, "ans": "B", "why": "Quy trình render: **Widget Tree → Render Tree → Composited Scene → GPU Rendering** đúng như slide. Widget mô tả → Render lo layout/paint → gộp thành layer → GPU vẽ ra màn hình. Các đáp án khác đảo ngược thứ tự.", "bs": false}, {"id": "P-20", "n": 20, "stem": "An instructor creates a new Flutter project with Organization ID `com.fptu.movies` and project name `movies`. What is the main purpose of the Organization ID during project creation?", "opts": {"A": "Only used to set the display name shown on the device's home screen", "B": "Determines the unique package name/bundle identifier for the app when packaged for Android/iOS", "C": "Has no real effect, purely illustrative", "D": "Used to set the app's color theme"}, "ans": "B", "why": "**Organization ID** kết hợp với tên project tạo thành **package name (Android) / bundle identifier (iOS) duy nhất** — ví dụ `com.fptu.movies.movies`. Đây là danh tính của app trên store, không đổi được sau khi phát hành. A, C, D mô tả sai vai trò kỹ thuật của nó.", "bs": false}, {"id": "P-21", "n": 21, "stem": "According to the lecture, when should a development team consider using native code (Kotlin/Swift) instead of pure Flutter?", "opts": {"A": "When the app needs very low-level hardware access or strict platform-specific UI/UX requirements", "B": "When the app only needs to run on a simple single Android platform", "C": "When the team has little experience with Kotlin/Swift", "D": "When the app only displays a static list of text"}, "ans": "A", "why": "Nên cân nhắc native khi cần **truy cập phần cứng ở mức rất thấp** hoặc **bắt buộc UI/UX đúng chuẩn riêng của từng nền tảng** — đúng mục 'When Native Development Is Preferable'. B, C, D là những ca Flutter vẫn đáp ứng tốt hoặc không liên quan.", "bs": false}, {"id": "P-22", "n": 22, "stem": "In the 'Hello World' example run across three environments (DartPad, VS Code, Android Studio), what is the most important common point emphasized?", "opts": {"A": "Each environment uses a different programming language", "B": "All tools compile down to the same Flutter runtime, producing identical results", "C": "Only Android Studio can run a real app", "D": "DartPad cannot display TextStyle"}, "ans": "B", "why": "Điểm chung quan trọng nhất: **cả ba môi trường đều biên dịch về cùng một Flutter runtime**, nên kết quả chạy giống hệt nhau — công cụ chỉ khác về trải nghiệm phát triển. A, C, D đều sai so với bài giảng.", "bs": false}, {"id": "P-23", "n": 23, "stem": "Given the comparison table: Flutter (Dart, Native UI + Engine), React Native (JS, Bridge to Native), Native (Kotlin/Swift, Pure Native). Which statement best analyzes the trade-off among these three approaches?", "opts": {"A": "Native is always slower than Flutter because it has no dedicated engine", "B": "React Native is fastest because it needs no compilation", "C": "Flutter achieves near-native performance thanks to its own renderer engine (Skia) without needing a bridge like React Native, while Native achieves maximum performance but loses the shared-codebase advantage", "D": "All three produce identical pure native code"}, "ans": "C", "why": "Flutter đạt hiệu năng **gần native nhờ tự render bằng engine Skia, không cần bridge như React Native**; còn Native cho hiệu năng cao nhất nhưng **mất lợi thế dùng chung một codebase**. Đây là đánh đổi chính xác theo bảng so sánh. A, B, D sai hoặc đơn giản hóa quá mức.", "bs": false}, {"id": "P-24", "n": 24, "stem": "According to the lecture, what tool does macOS need to build a Flutter app for iOS?", "opts": {"A": "Android Studio", "B": "Xcode", "C": "Visual Studio", "D": "IntelliJ IDEA"}, "ans": "B", "why": "macOS cần **Xcode** để build app iOS (biên dịch, ký, chạy simulator) — đúng ghi chú 'macOS users need Xcode for iOS builds'. A, C, D không phải công cụ dùng cho mục đích này.", "bs": false}, {"id": "P-25", "n": 25, "stem": "Which statement is FALSE regarding the reasons to choose Flutter ('Why Flutter')?", "opts": {"A": "Hot Reload/Hot Restart enables fast development", "B": "Provides Material & Cupertino widgets for a beautiful UI", "C": "Can only run on a single platform", "D": "Near-native performance"}, "ans": "C", "why": "Câu SAI là **'Chỉ chạy được trên một nền tảng duy nhất'** — trái ngược hoàn toàn với thế mạnh cốt lõi của Flutter (Android, iOS, Web, Desktop từ một codebase). A, B, D đều là lý do hợp lệ được nêu trong phần 'Why Flutter'.", "bs": false}, {"id": "P-26", "n": 26, "stem": "In Dart, what is the basic difference between `final` and `const`?", "opts": {"A": "No difference, the two keywords are interchangeable in every case", "B": "`final` is a compile-time constant, `const` is a runtime constant", "C": "`final` is a value assigned once at runtime (runtime-constant), `const` is a compile-time constant", "D": "`final` is only for numeric types, `const` is only for string types"}, "ans": "C", "why": "**`final` gán một lần lúc CHẠY**; **`const` là hằng biết trước lúc BIÊN DỊCH**. Ví dụ `final now = DateTime.now();` hợp lệ, còn `const now = DateTime.now();` thì lỗi. B đảo ngược định nghĩa; D sai vì cả hai không giới hạn ở kiểu dữ liệu nào.", "bs": false}, {"id": "P-27", "n": 27, "stem": "Consider:\ndynamic x = 10;\nx = \"Hello\";\nprint(x);\nWhat happens when this code runs?", "opts": {"A": "Compile error because a String cannot be assigned to a variable already typed as int", "B": "Prints \"Hello\" because `dynamic` allows the data type to change at runtime", "C": "Prints 10 because the original data type is preserved", "D": "Throws a TypeError exception at runtime"}, "ans": "B", "why": "**`dynamic` cho phép đổi kiểu lúc chạy**, nên gán chuỗi vào biến từng là int hoàn toàn hợp lệ → in ra `Hello`. A sai vì đây đúng là hành vi của `dynamic`; C, D sai vì không hề có lỗi và giá trị cuối là `Hello`.", "bs": false}, {"id": "P-28", "n": 28, "stem": "Given:\nList<int> nums = [1, 2, 3, 4, 5];\nvar result = nums.map((e) => e * 2).where((e) => e > 4).toList();\nprint(result);\nWhat is printed?", "opts": {"A": "[2, 4, 6, 8, 10]", "B": "[6, 8, 10]", "C": "[3, 4, 5]", "D": "[1, 2, 3, 4, 5]"}, "ans": "B", "why": "`[1,2,3,4,5].map((e)=>e*2)` → `[2,4,6,8,10]`, rồi `.where((e)=>e>4)` giữ lại `[6,8,10]`. A mới chỉ dừng ở bước map; C, D không khớp với phép biến đổi.", "bs": false}, {"id": "P-29", "n": 29, "stem": "In Dart, `Set<int> s = {1, 2, 2, 3};` — after initialization, what is `s.length`?", "opts": {"A": "4", "B": "3", "C": "2", "D": "Compile error because Set doesn't allow duplicate elements in a declaration"}, "ans": "B", "why": "**`Set` tự loại phần tử trùng**: `{1,2,2,3}` thành `{1,2,3}` → `length = 3`. A đếm cả phần tử trùng; C thiếu phần tử; D sai vì khai báo có thể viết trùng, Set chỉ tự khử khi lưu.", "bs": false}, {"id": "P-30", "n": 30, "stem": "Consider this named constructor code:\nclass Point {\nint x, y;\nPoint(this.x, this.y);\nPoint.origin() : x = 0, y = 0;\n}\nvoid main() {\nvar p1 = Point(3, 4);\nvar p2 = Point.origin();\nprint('${p1.x},${p1.y} - ${p2.x},${p2.y}');\n}\nWhat is printed?", "opts": {"A": "0,0 - 3,4", "B": "3,4 - 0,0", "C": "Error because Dart doesn't support multiple constructors in the same class", "D": "null,null - 0,0"}, "ans": "B", "why": "`Point(3,4)` gán x=3, y=4; **named constructor `Point.origin()` dùng initializer list `: x = 0, y = 0`** nên gán x=0, y=0 → in `3,4 - 0,0`. A đảo thứ tự; C sai vì Dart hỗ trợ named constructor; D sai vì giá trị được gán đúng chứ không null.", "bs": false}, {"id": "P-31", "n": 31, "stem": "What does the `??` operator do in Dart?", "opts": {"A": "Type equality comparison", "B": "Returns the left-hand value if it's not null, otherwise returns the right-hand value", "C": "Forces a non-null cast, throwing an error if null", "D": "Logical XOR operator"}, "ans": "B", "why": "**`??` là toán tử null-coalescing**: trả về vế trái nếu khác null
